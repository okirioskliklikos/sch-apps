        notice(change(() => writeCell(staffId, to.day, toHour, target, content)) ? 'Το κελί αντιγράφηκε με Ctrl.' : 'Το κελί-στόχος έχει ήδη το ίδιο περιεχόμενο.');
        return;
      }

    });

  }

  // ---- Checkbox lists of the dialogs ----
  function checkList(rows) {
    const list = el('div', 'subapp-check-list ip-pick-list');
    for (const row of rows) {
      const label = el('label'), box = el('input');
      box.type = 'checkbox'; box.value = row.value; box.checked = !!row.checked;
      const textBox = el('span'); textBox.append(document.createTextNode(row.text));

      label.append(box, textBox);

    }
    return list;
  }
  function checkTools(getList) {
    const box = el('div', 'ip-pick-actions');
    for (const [label, value] of [['Επιλογή όλων', true], ['Καμία', false]]) {

  // ---- «Προσθήκη μαθημάτων…» ----
  // Two groups of checkboxes, only with what the catalog does not have (by name, without tones and case; a hidden
  // subject counts as there): the subjects of the Ωρολόγιο of the period (source.subjects of the FET import,

  const COMMON_SUBJECTS = Object.freeze(['Ενισχυτική Διδασκαλία', 'Γραμματειακή Υποστήριξη', 'Διοικητικό Έργο']);
  function importSubjects() {
    if (busy || readOnly()) return;
    const school = schoolOf(periodId), all = Array.isArray(school?.source?.subjects) ? school.source.subjects : [];
    const have = new Set(catalog.subjects.map(item => nameKey(item.name))), fromSchool = [], common = [];
    const clean = value => String(value ?? '').replace(/\s+/g, ' ').trim();
    for (const item of all) {
      const name = clean(item?.name), key = nameKey(name);
      if (!name || have.has(key)) continue;

      const longName = clean(item?.longName);
      fromSchool.push({value: name, text: name, note: longName && nameKey(longName) !== key ? longName : ''});
    }
    for (const name of COMMON_SUBJECTS) {
      const key = nameKey(name);
      if (have.has(key)) continue;
      have.add(key);
      common.push({value: name, text: name});
    }
    if (!fromSchool.length && !common.length) { notice('Όλα τα μαθήματα του Ωρολογίου της περιόδου και τα συνήθη μαθήματα υπάρχουν ήδη στα Μαθήματα.'); return; }
    const lists = [], form = el('div', 'ip-form');

  // ---- «Αντιγραφή από άλλη περίοδο…» ----
  // The other periods with individual programs (also those without Ωρολόγιο, read only here).
  const copySources = () => (context?.periods || []).filter(period => period.id !== periodId && programContent(individualOf(period.id)));
  // What each teacher has in a program: {hours, pending}.
  function staffCounts(value) {
    const counts = new Map(), get = id => { if (!counts.has(id)) counts.set(id, {hours: 0, pending: 0}); return counts.get(id); };
    for (const activity of value?.activities || []) for (const id of activity.staff || []) get(id).hours += (activity.times || []).length;
    for (const item of value?.source?.pending || []) if (item?.staffId) get(item.staffId).pending++;

  }

  function problemCount(id) {
    const {slots, outside} = slotsOf(id);
    let count = outside.length;
    for (const [key, entries] of slots) { const [day, h] = key.split(':').map(Number); if (entries.length > 1 || lockedReason(id, day, hours[h])) count++; }
    return count;
  }
  async function copyFromPeriod() {
    if (busy || readOnly()) return;
    const sources = copySources();
    if (!sources.length) return;
    const order = (context.periods || []).map(period => period.id), here = order.indexOf(periodId);
    const select = el('select');
    for (const period of sources) {
      const option = el('option', '', period.name + (schoolOf(period.id) ? '' : ' (χωρίς Ωρολόγιο)') + ' — ' + periodText(period));
      option.value = period.id; select.append(option);
    }
    select.value = ([...sources].reverse().find(period => order.indexOf(period.id) < here) || sources[sources.length - 1]).id;
    const listBox = el('div');
    const draw = () => {
      const counts = staffCounts(individualOf(select.value));
      listBox.replaceChildren(checkList(sortedStaff().filter(person => counts.has(person.id)).map(person => ({
        value: person.id, text: personName(person), checked: false,
        note: countText(counts.get(person.id)) + (hasIndividual(person.id) ? ' · έχει ήδη κελιά σε αυτή την περίοδο' : ''),
        noteClass: hasIndividual(person.id) ? 'ip-pick-here' : ''
      }))));
    };
    select.onchange = draw;
    draw();
    const form = el('div', 'ip-form'), staffField = el('div', 'school-choice-field');
    staffField.append(el('span', 'ip-field-title', 'Εκπαιδευτικοί'), checkTools(() => listBox), listBox);
    form.append(field('Από την περίοδο', select), staffField,
      el('p', 'hint', 'Οι δραστηριότητες και τα ελλιπή κελιά των επιλεγμένων αντικαθιστούν όσα έχουν στην περίοδο ' + quoted(periodOf(periodId)?.name || '') + '. Τα μαθήματα και οι Συνενώσεις είναι κοινά για όλο το σχολικό έτος.'));
    let chosen = [], fromId = '';
    const accepted = await formDialog({
      title: 'Αντιγραφή από άλλη περίοδο', content: form, accept: 'Αντιγραφή',
      apply: () => {
        chosen = checkedValues(listBox); fromId = select.value;
        if (!chosen.length) throw Error('Επίλεξε τουλάχιστον έναν εκπαιδευτικό.');
      }
    });
    if (!accepted || !chosen.length) return;
    const already = sortedStaff().filter(person => chosen.includes(person.id) && hasIndividual(person.id));
    const period = periodOf(fromId), current = periodOf(periodId);
    if (already.length && !await schoolConfirm((already.length === 1 ? 'Ο εκπαιδευτικός ' + quoted(personName(already[0])) + ' έχει' : 'Οι εκπαιδευτικοί ' + already.map(person => quoted(personName(person))).join(', ') + ' έχουν') + ' ήδη κελιά στην περίοδο ' + quoted(current?.name || '') + '. Να αντικατασταθούν με αυτά της περιόδου ' + quoted(period?.name || '') + ';', {title: 'Αντιγραφή από άλλη περίοδο', accept: 'Αντικατάσταση'})) return;
    let result = null;
    const done = change(() => {
      result = T.individualCopy(program, individualOf(fromId), chosen, {periodId, staff: context.staff || [], fromPeriod: period?.name || ''});
      program = result.program;
      for (const id of chosen) copied[id] = staffSignature(program, id);
    });
    if (!done || !result) return;
    const problems = chosen.reduce((sum, id) => sum + problemCount(id), 0);
    notice('Αντιγράφηκαν από την περίοδο ' + quoted(period?.name || '') + ' τα ατομικά προγράμματα ' + (chosen.length === 1 ? '1 εκπαιδευτικού' : chosen.length + ' εκπαιδευτικών')
      + ' (' + hoursText(result.activities) + (result.pending ? ', ' + result.pending + (result.pending === 1 ? ' ελλιπές κελί' : ' ελλιπή κελιά') : '') + '). Πάτησε «Αποθήκευση».'
      + (problems ? ' Προσοχή: ' + (problems === 1 ? '1 κελί πέφτει' : problems + ' κελιά πέφτουν') + ' σε ώρες του Ωρολογίου αυτής της περιόδου ή εκτός Πρωινού και σημειώνονται με κόκκινο.' : ''));
  }

  // ---- Events ----
  $('save').onclick = save;
  $('undo').onclick = () => { closeUndoMenu(); undo(); };
  $('redo').onclick = redo;
  $('undoAll').onclick = () => { closeUndoMenu(); void undoAll(); };
  $('newSubject').onclick = () => { if (!busy) openSubject(); };
  $('newUnion').onclick = () => { if (!busy) openUnion(); };
  $('manageSubjects').onclick = manageSubjects;
  $('manageClasses').onclick = manageClasses;
  $('manageUnions').onclick = manageUnions;
  $('importSubjects').onclick = () => { void importSubjects(); };
  $('copyFrom').onclick = () => { void copyFromPeriod(); };
  $('zoomOut').onclick = () => setZoom(zoom - zoomLimits().step);
  $('zoomIn').onclick = () => setZoom(zoom + zoomLimits().step);
  $('zoomLevel').onclick = () => setZoom(100);
  $('sumPendingRow').onclick = goToPending;
  $('sumPendingRow').addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); goToPending(); } });
  if ('ResizeObserver' in window) new ResizeObserver(updateLift).observe($('workspace'));
  window.addEventListener('resize', updateLift);
  function closeUndoMenu() { $('undoMenu').hidden = true; $('undoMenuButton').setAttribute('aria-expanded', 'false'); }
  $('undoMenuButton').addEventListener('click', event => {
    event.stopPropagation();
    const open = $('undoMenu').hidden;
    $('undoMenu').hidden = !open;
    $('undoMenuButton').setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', event => { if (!event.target.closest('.undo-control')) closeUndoMenu(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeUndoMenu();
    if (!(event.ctrlKey || event.metaKey) || event.altKey || event.target.closest?.('input,select,textarea,dialog')) return;
    const keyName = String(event.key).toLowerCase();
    if (keyName === 'z' || keyName === 'ζ') { event.preventDefault(); event.shiftKey ? redo() : undo(); }
    else if (keyName === 'y' || keyName === 'υ') { event.preventDefault(); redo(); }
  });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  post({type: 'school-timetables:ready'});
})();
</script>
</body>
</html>
