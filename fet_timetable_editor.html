<!doctype html>
<html lang="el" class="subapp-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Πλήρες Σχολικό Πρόγραμμα v1.19</title>
<link rel="stylesheet" href="_ui.css">
<link rel="stylesheet" href="_subapp.css">
<style>
/* Πλήρες Σχολικό Πρόγραμμα (fet_timetable_editor.html): the composition of a period from the shared file (.data): the
   Ωρολόγιο (kind 'school', of which this is the owner), the Ατομικά Προγράμματα and the σχέδιο Ολοημέρου.
   Shared appearance: _ui.css / _subapp.css. --ft-* : colours whose meaning exists only on this board. */
:root{
  --ft-cell:130px;--ft-hour:124px;
  --ft-head-bg:#f9fafb;--ft-line:var(--school-ui-border);--ft-boundary:#98a2b3;
  --ft-card-border:#d0d5dd;
  --ft-conflict-bg:#fff1f0;--ft-conflict-border:#f04438;
  --ft-specialty-bg:#eef7ff;--ft-specialty-border:#b9d8fb;
  --ft-nonhomeroom-bg:#fff9db;--ft-nonhomeroom-border:#f2d675;
  --ft-allowed-bg:#ecfdf3;--ft-allowed-ring:#a6f4c5;--ft-allowed-over-bg:#dcfae6;--ft-allowed-outline:#32d583;
  --ft-unavailable-bg:#fff4e5;--ft-unavailable-ring:#f7b955;--ft-unavailable-over-bg:#ffead5;--ft-unavailable-outline:#f79009;
  --ft-drop-bg:#eff8ff;--ft-drop-outline:#84adff;
  --ft-avail-ok-bg:#eaf3de;--ft-avail-ok-border:#97c459;
  --ft-avail-off-bg:#fcebeb;--ft-avail-off-border:#f09595;--ft-avail-off-text:#a32d2d;
  --ft-avail-weak-bg:#fef08a;--ft-avail-weak-border:#ca8a04;--ft-avail-weak-text:#713f12;
  --ft-locked-bg:#f2f4f7;--ft-locked-card-bg:#f9fafb;--ft-locked-text:#667085;
  --ft-individual-border:#a2654a;
  --ft-token-bg:#fbf1ec;--ft-token-border:#e3bfae;--ft-token-text:#8a4b31;
  --ft-target-outline:#2e90fa
}
/* Header: the period list may be long; it gives up width before anything wraps out of the page. */
#period{flex:0 1 auto;min-width:0;max-width:min(340px,100%)}
/* Busy: the shared main.busy of _subapp.css fades the sidebar and the workspace together. */
main.ft-single{grid-template-columns:minmax(0,1fr)}

/* Sidebar */
aside{display:flex;flex-direction:column;gap:0}
#search{width:100%;margin:0 0 10px;padding:var(--school-ui-control-padding-y) 10px;border:1px solid var(--school-ui-input-border);border-radius:8px;flex:none}
.ft-entity-list{min-height:0}
.ft-entity-empty{margin:8px 2px;font-size:13px;color:var(--school-ui-muted)}
/* Cards of the «Τμήματα» tab: the homeroom teacher on the same line as the class, aligned right, in smaller letters;
   a long name wraps under itself, not under the class. */
.subapp-sidebar-item.ft-class-item{display:flex;align-items:baseline;gap:10px}
.ft-class-item .subapp-sidebar-item-name{flex:none}
.ft-class-item .subapp-sidebar-item-meta{flex:1 1 auto;font-size:11px;text-align:right}

/* Workspace */
.ft-workspace{min-width:0;min-height:0;overflow:auto;padding:12px 14px}
.ft-toolbar{margin-bottom:10px}
.ft-title{margin:0 0 2px;font-size:18px;font-weight:850;line-height:1.3}
.ft-title small{font-size:14px;font-weight:400;color:var(--school-ui-muted);margin-left:8px}
/* Under the title only the period; right under it, when there are some, the problems of the period (schoolProblems:
   conflicts, the σχέδιο Ολοημέρου differs from the Ωρολόγιο, the period has no σχέδιο…), whose list opens under the
   controls; then the note on the incomplete cells of the teacher in the Ατομικά, with a link to the application that
   changes them, and the warnings of the programs.
   Files, imports and changes are in «Ιστορικό…» of «Σχολικά Προγράμματα».
   The strip ends at the visible right edge of the timetable, never past the workspace. */
.ft-source-info{margin:0 0 4px;max-width:100%}
/* Head of the board: title, information and controls on the left; in the teacher view the availability of the
   FET file on the right, its top at the title, so «Ώρες» sits just left of it and the controls don't move down.
   The head has the width of the visible timetable, so the availability ends at its right edge. When the left
   column gets narrower than 300px, the availability goes under the controls, on the left.
   Height (alignAvailability): from the top of the capitals of the title to the bottom of «Ώρες», the cells growing in
   proportion. With a message under the period, or with the controls on two lines, it keeps its normal size and only
   its top is aligned. */
.ft-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px;max-width:100%}
.ft-head-main{flex:1 1 300px;min-width:0}
/* Availability: days in columns, the hours of «Πρωινό» in rows. Green available, red with «×» not available,
   yellow with «×» not available with weight under 100%. Normal cell 13×11px with a 7px «×» (an exception to the
   icon scale); --ft-avail-h (the cell height) scales the cell and the «×» together. The labels are cut to the
   height of the capitals, so the top of the day letters is the top of the grid. */
.ft-avail{--ft-avail-h:11px;display:grid;grid-template-columns:12px repeat(5,calc(var(--ft-avail-h) * 13 / 11));gap:2px 3px;align-items:center;flex:0 0 auto}
.ft-avail-label{font-size:11px;line-height:11px;color:var(--school-ui-muted);text-align:center;text-box:trim-both cap alphabetic}
.ft-cap-probe{display:inline-block;width:0;height:0;vertical-align:baseline}
.ft-avail-cell{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:calc(var(--ft-avail-h) * 13 / 11);height:var(--ft-avail-h);border:1px solid var(--ft-avail-ok-border);border-radius:3px;background:var(--ft-avail-ok-bg)}
.ft-avail-cell.off{border-color:var(--ft-avail-off-border);background:var(--ft-avail-off-bg);color:var(--ft-avail-off-text)}
.ft-avail-cell.weak{border-color:var(--ft-avail-weak-border);background:var(--ft-avail-weak-bg);color:var(--ft-avail-weak-text)}
.ft-avail-cell svg{display:block;width:calc(var(--ft-avail-h) * 7 / 11);height:calc(var(--ft-avail-h) * 7 / 11)}
.ft-source-note{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--school-ui-warning);--ui-icon-text-size:var(--school-ui-icon-size-list)}
.ft-source-note.info{color:var(--school-ui-muted)}
.ft-source-note .ui-icon-text{white-space:normal;overflow-wrap:anywhere}
.ft-source-note .ui-link-button{margin-left:6px;white-space:nowrap}
/* Problems of the period (schoolProblems of _ui.js): the line under the period, and the open list under the controls,
   as wide as the head. */
.ft-source-info .school-problems{margin:2px 0 0}
.ft-problems-list{margin-top:8px;max-width:100%}
.ft-controls select{min-width:0}
/* Controls of the board: groups with a small title above, filling the left column of the head (up to the visible
   right edge of the timetable, or up to the availability in the teacher view). Groups wrap as whole units. The spring before the filters takes the free
   space of the line, so the filters sit on the right while they fit on that line, and start on the left of a new line
   when they wrap. Its negative margin cancels the gap, so it never makes the line wrap earlier. */
.ft-controls{--ft-controls-gap:18px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px var(--ft-controls-gap);max-width:100%}
.ft-controls-spring{flex:1 1 0;min-width:0;margin-left:calc(-1 * var(--ft-controls-gap))}
.ft-control-group{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.ft-filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;min-width:0}
.ft-control-title{margin:0;font-size:12px;font-weight:400;line-height:1.3;color:var(--school-ui-muted)}
/* Joined buttons (one choice: Λειτουργία; one or more: Εμφάνιση). Pressed look from .ui-toggle (_ui.css). */
.ft-segmented{display:inline-flex}
.ft-segmented button{border-radius:0;margin:0}
.ft-segmented button+button{margin-left:-1px}
.ft-segmented button:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px}
.ft-segmented button:last-child{border-top-right-radius:7px;border-bottom-right-radius:7px}
.ft-segmented button[aria-pressed="true"]{position:relative;z-index:1}
.ft-segmented button:focus-visible{position:relative;z-index:2}
.ft-source{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:13px;color:var(--school-ui-muted);line-height:1.5}
.ft-source b{font-weight:650;color:var(--school-ui-label-text)}
.ft-source + .ft-source{margin-top:4px}
.ft-warnings .ui-validation-warning,.ft-warnings .ui-validation-error{font-size:13px}
.ft-workspace .subapp-notice{margin:8px 0 0}
.ft-workspace .subapp-notice:empty{display:none}
.ft-empty{min-height:320px}

/* Timetable grid */
table.ft-grid{border-collapse:separate;border-spacing:0;background:var(--school-ui-surface);border:1px solid var(--ft-line);border-radius:10px;min-width:max-content}
.ft-grid th,.ft-grid td{border-right:1px solid var(--ft-line);border-bottom:1px solid var(--ft-line);vertical-align:top}
.ft-grid tr:last-child>td,.ft-grid tr:last-child>th{border-bottom:0}
.ft-grid th:last-child,.ft-grid td:last-child{border-right:0}
.ft-grid tr.ft-boundary>th,.ft-grid tr.ft-boundary>td{border-top:2px solid var(--ft-boundary)}
.ft-grid thead th{position:sticky;top:-12px;z-index:4;background:var(--ft-head-bg);padding:8px;text-align:center;min-width:var(--ft-cell);font-size:14px}
.ft-grid .ft-hour{position:sticky;left:-14px;z-index:3;background:var(--ft-head-bg);width:var(--ft-hour);min-width:var(--ft-hour);padding:8px;text-align:left;font-size:13px;font-weight:650;white-space:nowrap}
.ft-grid thead .ft-hour{z-index:5}
.ft-grid td.ft-slot{position:relative;width:var(--ft-cell);min-width:var(--ft-cell);height:80px;padding:5px;background:var(--school-ui-surface)}
/* The zones of the Ολοήμερο belong to the Ολοήμερο Designer: locked here, with a pencil (on hover or focus) that opens
   the Designer at that hour. */
.ft-grid td.ft-slot.ft-locked{background:var(--ft-locked-bg)}
button.ui-icon-button.ft-cell-edit{position:absolute;top:3px;right:3px;z-index:2;display:none;width:22px;height:22px;border-radius:6px;background:var(--school-ui-surface)}
.ft-grid td.ft-slot.ft-locked:hover button.ft-cell-edit,.ft-grid td.ft-slot.ft-locked:focus-within button.ft-cell-edit{display:inline-grid}
button.ui-icon-button.ft-cell-edit>svg{width:var(--school-ui-icon-size-list);height:var(--school-ui-icon-size-list)}
/* The cell of the target (a warning of «Σχολικά Προγράμματα»), until the next click on the board. */
.ft-grid td.ft-slot.ft-target{outline:3px solid var(--ft-target-outline);outline-offset:-3px}
/* Support of the Ατομικά Προγράμματα in the view of a τμήμα: small tokens at the top left of the cell (ΠΛ Παράλληλη
   Στήριξη, ΤΕ Τμήμα Ένταξης, ΤΥ Τμήμα Υποδοχής, ΕΒ ΕΒΠ, ΣΤ any other), with the teacher and the subject in the tooltip.
   They are moved in the view of the teacher. */
.ft-tokens{display:flex;flex-wrap:wrap;gap:3px;margin:0 26px 4px 0}
.ft-token{display:inline-block;padding:2px 4px;border:1px solid var(--ft-token-border);border-radius:4px;background:var(--ft-token-bg);color:var(--ft-token-text);font-size:10px;font-weight:700;line-height:1;cursor:default}
.ft-grid td.ft-slot.drag-allowed{background:var(--ft-allowed-bg);box-shadow:inset 0 0 0 1px var(--ft-allowed-ring)}
.ft-grid td.ft-slot.drag-allowed.dragover{outline:3px solid var(--ft-allowed-outline);outline-offset:-3px;background:var(--ft-allowed-over-bg)}
.ft-grid td.ft-slot.drag-unavailable{background:var(--ft-unavailable-bg);box-shadow:inset 0 0 0 1px var(--ft-unavailable-ring)}
.ft-grid td.ft-slot.drag-unavailable.dragover{outline:3px solid var(--ft-unavailable-outline);outline-offset:-3px;background:var(--ft-unavailable-over-bg)}
.ft-grid td.ft-slot.dragover:not(.drag-allowed):not(.drag-unavailable){outline:3px solid var(--ft-drop-outline);outline-offset:-3px;background:var(--ft-drop-bg)}
.ft-card{
  border:1px solid var(--ft-card-border);border-left:5px solid var(--card,var(--school-ui-muted));background:var(--school-ui-surface);
  border-radius:8px;padding:6px 7px;margin-bottom:5px;box-shadow:0 1px 2px #1018280d;cursor:grab;user-select:none
}
.ft-card:last-child{margin-bottom:0}
.ft-card.specialty{background:var(--ft-specialty-bg);border-color:var(--ft-specialty-border)}
.ft-card.non-homeroom{background:var(--ft-nonhomeroom-bg);border-color:var(--ft-nonhomeroom-border)}
.ft-card.conflict{background:var(--ft-conflict-bg);border-color:var(--ft-conflict-border)}
/* An hour of the Ατομικά Προγράμματα: dashed border (the colour of the subject stays on the left). */
.ft-card.individual{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed;border-top-color:var(--ft-individual-border);border-right-color:var(--ft-individual-border);border-bottom-color:var(--ft-individual-border)}
/* Locked: an hour of the σχέδιο Ολοημέρου (or of the Ωρολόγιο in the zones of the Ολοήμερο); it does not move here. */
.ft-card.locked{cursor:default;background:var(--ft-locked-card-bg);box-shadow:none}
.ft-card.locked .ft-subject{color:var(--ft-locked-text)}
.ft-card:active{cursor:grabbing}
.ft-subject{font-size:13px;font-weight:850;line-height:1.15;text-align:center;overflow-wrap:break-word}
.ft-meta{margin-top:3px;font-size:11px;line-height:1.25;color:#475467;text-align:center;overflow-wrap:anywhere}
.ft-badge{display:block;width:max-content;max-width:100%;margin:4px auto 0;padding:1px 5px;border:1px solid var(--ft-card-border);border-radius:999px;background:var(--ft-head-bg);font-size:10px;text-align:center}
.ft-unmatched{font-style:italic}

/* Dialogs (inside schoolChoiceDialog) */
.school-confirm.ft-print-dialog{width:min(780px,calc(100vw - 32px))}
.ft-date-field{max-width:200px}
.ft-print-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.ft-print-column{min-width:0}
.ft-print-column h3{margin:0 0 6px;font-size:15px}
.ft-print-presets{display:flex;flex-wrap:wrap;gap:6px}
.ft-print-column .subapp-check-list{max-height:42vh}
.ft-print-column .subapp-check-list label{font-weight:400;margin:2px 0}
.ft-print-option{display:flex;align-items:baseline;gap:6px;margin:12px 0 0;font-weight:400;cursor:pointer}
.ft-print-note{margin:10px 0 0}
.ft-source .ui-validation-warning{margin:0}

@media(max-width:900px){:root{--ft-cell:112px;--ft-hour:108px}}
@media(max-width:800px){
  .ft-entity-list{max-height:40vh;overflow:auto}
  .ft-workspace{overflow:visible}
  .ft-grid-wrap{overflow:auto}
  .ft-grid thead th{top:0}
  .ft-grid .ft-hour{left:0}
}
@media(max-width:700px){.ft-print-columns{grid-template-columns:1fr}}
@media print{
  header,aside{display:none!important}
}
</style>
</head>
<body>
<header class="page-head">
  <div class="toolbar-brand"><h1><button class="brand-menu" type="button" title="Άνοιγμα κεντρικού μενού" aria-label="Πλήρες Σχολικό Πρόγραμμα — άνοιγμα κεντρικού μενού"><span class="app-mark is-sub" data-app-icon="full" aria-hidden="true"></span><span class="brand-text"><span>Πλήρες Σχολικό Πρόγραμμα</span><span class="small version">v1.19</span></span></button></h1></div>
  <select id="period" aria-label="Περίοδος" disabled hidden></select>
  <span id="periodStatus" class="ui-period-status" hidden></span>
  <button id="save" class="save-main" type="button" disabled>Αποθήκευση</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="undo" type="button" disabled title="Αναίρεση της τελευταίας ενέργειας" data-school-icon="undo">Αναίρεση</button>
  <button id="redo" type="button" disabled title="Επανάληψη της ενέργειας που αναιρέθηκε" data-school-icon="redo">Επανάληψη</button>
  <button id="undoAll" type="button" disabled>Αναίρεση όλων</button>
  <span class="sep" aria-hidden="true"></span>
  <span class="print-control">
    <button id="print" type="button" disabled>Εκτύπωση…</button>
    <span class="print-mode-wrap">
      <select id="printMode" aria-label="Μορφή εκτύπωσης" disabled>
        <option value="classes">Τμήματα</option>
        <option value="staff">Προσωπικό</option>
        <option value="classroom">Δάσκαλοι</option>
        <option value="specialties">Ειδικότητες</option>
        <option value="individual">Ατομικά Προγράμματα</option>
        <option value="available">Διαθέσιμοι Εκπαιδευτικοί</option>
      </select>
    </span>
  </span>
  <div class="header-right"><span id="schoolYear" class="school-year-indicator" hidden><span>Σχολικό έτος:</span> <span id="schoolYearValue"></span></span></div>
</header>
<main id="root" class="ft-single">
  <aside id="side" hidden aria-label="Τμήματα και εκπαιδευτικοί">
    <div class="subapp-sidebar-tabs" role="tablist" aria-label="Προβολή">
      <button id="tabClasses" type="button" role="tab" aria-selected="true" aria-controls="entityList">Τμήματα</button>
      <button id="tabTeachers" type="button" role="tab" aria-selected="false" aria-controls="entityList">Εκπαιδευτικοί</button>
    </div>
    <input id="search" type="search" placeholder="Αναζήτηση…" aria-label="Αναζήτηση" autocomplete="off">
    <div id="entityList" class="ft-entity-list subapp-sidebar-list" role="tabpanel"></div>
  </aside>
  <section id="workspace" class="ft-workspace subapp-workspace">
    <p class="subapp-connection">Άνοιξε το Πλήρες Σχολικό Πρόγραμμα από το Κεντρικό Μενού, αφού ανοίξεις το αρχείο πληροφοριών του σχολείου. Απαιτείται η τελευταία έκδοση του index.html.</p>
  </section>
</main>
<script src="_ui.js"></script>
<script src="_data.js"></script>
<script src="_data_timetable.js"></script>
<script src="_data_oloimero.js"></script>
<script src="_data_documents.js"></script>
<script>
(() => {
  'use strict';
  // Πλήρες Σχολικό Πρόγραμμα: the composition of a period (SchoolTimetable.composePeriod) from the shared file
  // (school-timetables:*), through schoolHost (_ui.js): the Ωρολόγιο (kind 'school', owned here), the Ατομικά
  // Προγράμματα (written here too, only their hours) and the σχέδιο Ολοημέρου of the period (read only).
  // Hours, conflicts, subjects and availability come from the composition, with the programs of the page in place of
  // the stored ones. In the zones of the Ολοήμερο only the σχέδιο counts and is shown (the Ωρολόγιο there only when
  // the period has no σχέδιο); those zones are locked and open in the Ολοήμερο Designer.
  // Moves keep the rules of the kinds (SchoolTimetable.moveProblems): an hour moves only within the zone of its kind,
  // and an hour of the Ατομικά is the teacher's alone.
  // Τμήματα: those of «Τμήματα» (classes of school-timetables:context, SchoolClasses). Activities refer to them by
  // id, and the page always shows the name from «Τμήματα».
  // Every change happens in the page; «Αποθήκευση» writes the Ωρολόγιο and the Ατομικά of the period (put), all or
  // nothing. The problems of the composition (SchoolTimetable.compositionProblems) are listed under the period, with
  // the shared schoolProblems (_ui.js): a conflict is shown here, at its cell; the other problems open the application
  // that changes them.
  const T = SchoolTimetable, C = SchoolClasses, D = SchoolDate, esc = schoolEscape, $ = id => document.getElementById(id);
  const post = schoolHost.post;
  const quoted = value => '«' + value + '»';
  const clone = value => structuredClone(value);
  const unique = list => [...new Set(list)];
  const byText = (a, b) => String(a).localeCompare(String(b), 'el', {numeric: true, sensitivity: 'base'});
  const DAYS = [1, 2, 3, 4, 5];
  const dayLabel = day => T.dayLabels[day - 1];
  const upper = value => SchoolText.withoutTones(value).toLocaleUpperCase('el-GR');
  const el = (tag, className, textValue) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textValue != null) node.textContent = textValue;
    return node;
  };
  // The sources of the composition, as the user calls them.
  const SOURCE_NAMES = Object.freeze({school: 'Ωρολόγιο', oloimero: 'σχέδιο Ολοημέρου', individual: 'Ατομικά Προγράμματα'});
  const sourceName = kind => SOURCE_NAMES[kind] || T.kinds[kind]?.label || kind;
  // Tokens of the support in the view of a τμήμα, by the Είδος υπηρεσίας of the teacher.
  const SUPPORT_TOKENS = Object.freeze({
    parallel: ['ΠΛ', 'Παράλληλη Στήριξη'], inclusion: ['ΤΕ', 'Τμήμα Ένταξης'], zep: ['ΤΥ', 'Τμήμα Υποδοχής'], ebp: ['ΕΒ', 'ΕΒΠ']
  });
  const OTHER_SUPPORT = Object.freeze(['ΣΤ', 'Στήριξη']);

  // ---- State ----
  let context = null;          // the last context of the host
  let periodId = null;         // the period shown
  // The Ωρολόγιο and the Ατομικά Προγράμματα of the period: as stored in the file (or null) and as shown in the page.
  let saved = null, savedJson = 'null', program = null;
  let savedInd = null, savedIndJson = 'null', individual = null;
  let undoStack = [], redoStack = [];     // JSON snapshots of {program, individual}, for «Αναίρεση» / «Επανάληψη»
  let busy = false, dirty = false;
  let hours = [], hoursError = '';
  let view = 'classes';
  const selected = {classes: '', teachers: ''};
  let draggedKey = null;
  let cache = null;            // indexes of the composition, rebuilt after every change
  const printDates = new Map();            // «Ισχύει από» chosen per period in this session
  let staffById = new Map(), staffRanks = new Map();
  let gridWidthObserver = null;
  // The cell of the target ({day, start}), marked until the next click on the board; scrolled into view once.
  let focusCell = null, focusScrolled = false;
  let problemsOpen = false;    // the list of the problems of the period is open (while the page is open)

  // ---- Small helpers ----
  const periodOf = id => context?.periods?.find(period => period.id === id) || null;
  const programOf = (id, kind) => (context?.programs || []).find(item => item.kind === kind && item.periodId === id) || null;
  const periodPrograms = id => (context?.programs || []).filter(item => item.periodId === id && Object.prototype.hasOwnProperty.call(T.kinds, item.kind));
  // A Προσχέδιο περιόδου may have no dates.
  const periodRange = period => D.valid(period.from) ? D.format(period.from) + ' – ' + D.format(T.periodEnd(period, context.year)) : '';
  const periodText = period => period.name + (T.isDraftPeriod(period) ? ' (προσχέδιο περιόδου' + (periodRange(period) ? ', ' + periodRange(period) : '') + ')' : ' (' + periodRange(period) + ')');
  const notice = (textValue, error = false) => { const node = $('notice'); if (!node) return; node.textContent = textValue; node.classList.toggle('error', error); };
  const message = (textValue, title) => schoolMessage(textValue, title ? {title} : {});
  const modeSafe = () => controlState.mode !== 'free';

  // Teachers: 'id:<staff id>' for people of Προσωπικό, 'name:<name>' for names without a match.
  const keyOfId = id => 'id:' + id, keyOfName = name => 'name:' + name;
  const teacherKeys = activity => [...(activity.staff || []).map(keyOfId), ...(activity.unmatched || []).map(keyOfName)];
  const personOf = key => key.startsWith('id:') ? staffById.get(key.slice(3)) || null : null;
  const shortOf = key => { const person = personOf(key); return person ? person.shortName || person.name || person.code || '?' : key.startsWith('name:') ? key.slice(5) : '?'; };
  const fullOf = key => personOf(key)?.name || '';
  const isUnmatched = key => key.startsWith('name:');
  const isSpecialty = key => personOf(key)?.serviceType === 'specialty';
  const isClassroom = key => T.isGeneralTeacher(personOf(key));   // «Δάσκαλοι»: branch ΠΕ70
  // Order of the «Σύντομο Όνομα» list of Προσωπικό (T.sortStaff); names without a match follow, alphabetically.
  const staffRank = key => { const person = personOf(key); return person ? staffRanks.get(person.id) ?? Infinity : Infinity; };
  const sortTeachers = keys => [...keys].sort((a, b) => (isUnmatched(a) - isUnmatched(b)) || (staffRank(a) - staffRank(b) || 0) || byText(shortOf(a), shortOf(b)));

  // ---- Hours (from Ώρες Διδασκαλίας) ----
  function loadHours() {
    try { hours = T.timedHours(context.teachingHours).map((hour, index) => ({...hour, index})); hoursError = ''; }
    catch (error) { hours = []; hoursError = error.message; }
  }
  const isBreak = hour => hour.category === 'break';
  const isMorning = hour => hour.category === 'morning';
  const isAfternoon = hour => ['meal', 'afternoon', 'extended'].includes(hour.category);
  // An hour of a zone of the Ολοήμερο (Πρωινή Ζώνη, Γεύμα, Ολοήμερο, Διευρυμένο): locked here.
  const isLocked = hour => !!hour && T.OLOIMERO_CATEGORIES.includes(hour.category);
  const hourGroup = hour => hour.category === 'early' ? 0 : isMorning(hour) ? 1 : isAfternoon(hour) ? 2 : 3;
  const teachingHours = () => hours.filter(hour => !isBreak(hour));
  function hourIndexOf(time) {
    let index = hours.findIndex(hour => hour.start === time.start && hour.end === time.end);
    if (index < 0) index = hours.findIndex(hour => hour.start === time.start);
    return index;
  }
  // A thicker line where the group of hours changes: Πρωινή Ζώνη → πρωινό → απόγευμα.
  const boundaryBefore = (hour, list) => { const index = list.indexOf(hour); return index > 0 && hourGroup(list[index - 1]) !== hourGroup(hour); };

  // ---- Indexes of the composition ----
  // The items of the board: one per activity of the Ωρολόγιο, of the Ατομικά Προγράμματα and of the σχέδιο Ολοημέρου.
  //   entries: the hours shown ({day, h}): the σχέδιο only in the zones of the Ολοήμερο; the Ωρολόγιο there only when
  //   the period has no σχέδιο (as the composition counts). locked: it does not move here (the σχέδιο, and an activity
  //   of the Ωρολόγιο with an hour in a zone of the Ολοήμερο). support: a support activity of the Ατομικά
  //   (SchoolTimetable.supportActivity: by the service type of the teacher or a usual subject; not a lesson of the
  //   τμήμα: a token in its view). outside: hours that are not in the Ώρες Διδασκαλίας or not Δευτέρα–Παρασκευή.
  function index() {
    if (cache) return cache;
    const composition = composeWith(), design = composition?.programs?.oloimero || null;
    const list = [];
    const add = (kind, prog) => {
      for (const activity of prog?.activities || []) {
        const times = activity.times || [];
        const all = times.map(time => ({day: time.day, h: hourIndexOf(time)}))
          .filter(entry => entry.h >= 0 && entry.day >= 1 && entry.day <= 5).sort((a, b) => a.day - b.day || a.h - b.h);
        const entries = all.filter(entry => kind === 'oloimero' ? isLocked(hours[entry.h]) : kind === 'school' && design ? !isLocked(hours[entry.h]) : true);
        const outside = kind !== 'oloimero' && all.length < times.length;
        if (!entries.length && !outside) continue;
        const locked = kind === 'oloimero' || (kind === 'school' && all.some(entry => isLocked(hours[entry.h])));
        list.push({key: kind + ':' + activity.id, kind, program: prog, activity, entries, keys: teacherKeys(activity), locked, support: T.supportActivity(kind, activity, {staff: staffById}), outside});
      }
    };
    add('school', program); add('individual', individual); add('oloimero', design);
    // Conflicts: those of the composition, on every source.
    const conflicts = new Set();
    for (const item of composition?.conflicts || []) { conflicts.add(item.a.activity); conflicts.add(item.b.activity); }
    const problems = composition ? T.compositionProblems(composition, {staff: context.staff || [], classes: yearClasses()}) : [];
    cache = {list, byKey: new Map(list.map(item => [item.key, item])), conflicts, homeroom: new Map(), composition, problems};
    return cache;
  }
  // The composition of the period (T.composePeriod) with the Ωρολόγιο and the Ατομικά of the page in place of the
  // stored ones. null without Ώρες Διδασκαλίας.
  function composeWith() {
    if (!context || hoursError || periodId == null) return null;
    const list = [program, individual].filter(Boolean);
    for (const item of context.programs || []) if (item.periodId === periodId && item.kind !== 'school' && item.kind !== 'individual') list.push(item);
    try { return T.composePeriod({periodId, programs: list, staff: context.staff, classes: yearClasses(), teachingHours: context.teachingHours}); }
    catch { return null; }
  }
  const composition = () => index().composition;
  const invalidate = () => { cache = null; };
  const hasPrograms = () => !!(program || individual || index().composition?.programs?.oloimero);
  // The homeroom teacher of a τμήμα (id) within the program («Υπεύθυνος τμήματος μέσα σε πρόγραμμα»): the
  // homeroomStaffId of «Τμήματα» if it appears in the composition; otherwise, for a τμήμα Γενικής Παιδείας, the teacher
  // whose short name starts with «[Α1]». Used by the title, the filters, the cards and the print of τμήματα.
  function homeroomKey(classId) {
    const ix = index();
    if (!ix.homeroom.has(classId)) {
      const all = {activities: ix.list.filter(item => !item.support).map(item => item.activity)};
      const found = classId ? T.homeroomTeacher(all, classId, {classes: context.classes, staff: context.staff}) : null;
      ix.homeroom.set(classId, found?.id ? keyOfId(found.id) : found?.name ? keyOfName(found.name) : '');
    }
    return ix.homeroom.get(classId);
  }
  // Τμήματα: all those of «Τμήματα», in the order of SchoolClasses.sort; the keys are their ids.
  const yearClasses = () => context?.classes || [];
  const classesList = () => C.sort(yearClasses()).map(item => item.id).filter(Boolean);
  const className = id => C.nameOf(yearClasses(), id) || '?';
  // The homeroom teacher of «Τμήματα» (homeroomStaffId), shown on the right of the list of τμήματα.
  const classHomeroomText = id => {
    const staffId = C.byId(yearClasses()).get(id)?.homeroomStaffId;
    const person = staffId ? staffById.get(staffId) : null;
    return person ? person.name || person.shortName || '' : '';
  };
  const teachersList = () => sortTeachers(unique(index().list.flatMap(item => item.keys)));
  // The students of an activity: the shared text of SchoolTimetable, with the names of «Τμήματα».
  const studentsLabel = activity => T.studentsText(activity, {classes: yearClasses()});

  // The subject of an activity, always through the shared SchoolTimetable.activitySubject, with the composition of
  // the period (the «μάθημα της τάξης» of the Ατομικά Προγράμματα).
  const subjectOf = activity => T.activitySubject(activity, {composition: composition(), classes: yearClasses()});
  // Hours of a teacher in the composition (all sources of the period).
  const hoursOf = key => { const comp = composition(); return key.startsWith('id:') ? comp?.hours.get(key.slice(3))?.total || 0 : comp?.unmatchedHours.get(key.slice(5)) || 0; };
  const targetOf = key => { const value = personOf(key)?.schoolHours; return value === '' || value == null ? '—' : String(value); };

  // Not-available times of the FET file (the Ωρολόγιο of the period), for a teacher key.
  function unavailableOf(key) {
    const source = program?.source;
    if (source?.type !== 'fet') return [];
    const names = key.startsWith('id:') ? (source.teachers || []).filter(teacher => teacher.staffId === key.slice(3)).map(teacher => teacher.name) : [key.slice(5)];
    return (source.unavailable || []).filter(item => names.includes(item.teacher));
  }

  // ---- Teacher filter of the class view ----
  function shownTeachers(keys, classId, hour) {
    const filter = controlState.teacherFilter, morning = hour && isMorning(hour), home = homeroomKey(classId);
    // «Δάσκαλοι»: in the morning only the homeroom teacher of the class. «Ειδικότητες»: in the morning also
    // a classroom teacher who is not the homeroom teacher of the class.
    if (filter === 'classroom') return keys.filter(key => isClassroom(key) && (!morning || key === home));
    if (filter === 'specialties') return keys.filter(key => isSpecialty(key) || (morning && isClassroom(key) && key !== home));
    return keys;
  }
  const passesFilter = (keys, classId, hour) => controlState.teacherFilter === 'all' || shownTeachers(keys, classId, hour).length > 0;
  // The items of the view: of the τμήμα (its lessons; the support of the Ατομικά is shown as tokens), or of the teacher.
  function relevant() {
    const current = selected[view];
    if (!current) return [];
    return index().list.filter(item => view === 'classes'
      ? !item.support && (item.activity.classes || []).includes(current) && item.entries.some(entry => passesFilter(item.keys, current, hours[entry.h]))
      : item.keys.includes(current));
  }
  // The support of the Ατομικά in a τμήμα, by cell: Map('day:h' → [item]).
  function supportOf(classId) {
    const cells = new Map();
    for (const item of index().list) {
      if (!item.support || !(item.activity.classes || []).includes(classId)) continue;
      for (const entry of item.entries) {
        const key = entry.day + ':' + entry.h;
        if (!cells.has(key)) cells.set(key, []);
        cells.get(key).push(item);
      }
    }
    return cells;
  }
  // The token of a support activity and what it means, by the Είδος υπηρεσίας of its (first) teacher.
  const supportLabel = item => SUPPORT_TOKENS[personOf(item.keys[0])?.serviceType] || OTHER_SUPPORT;
  function tokenFor(item) {
    const [label, what] = supportLabel(item);
    const token = el('span', 'ft-token', label);
    const who = item.keys.map(key => shortOf(key) + (fullOf(key) && fullOf(key) !== shortOf(key) ? ' (' + fullOf(key) + ')' : '')).join(', ');
    token.title = what + ': ' + (who || '—') + ' — ' + (subjectOf(item.activity) || (item.activity.subjectFromClasses ? 'μάθημα της τάξης' : '—')) + '\nΜετακινείται από την προβολή του εκπαιδευτικού.';
    return token;
  }

  // ---- Moving and swapping ----
  // The new times of an item that starts at hour index startH of day: its hours stay consecutive.
  function slotsFor(item, day, startH) {
    const length = item.entries.length;
    if (!length) return {ok: false, reason: 'Η δραστηριότητα δεν έχει ώρες που υπάρχουν στις Ώρες Διδασκαλίας.'};
    if (startH < 0 || startH + length > hours.length) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει μέχρι το τέλος της ημέρας.'};
    const target = hours.slice(startH, startH + length);
    const pause = target.find(isBreak);
    if (pause) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει: το ' + quoted(pause.name) + ' είναι διάλειμμα.'};
    return {ok: true, probe: target.map(hour => ({day, start: hour.start, end: hour.end, name: hour.name}))};
  }
  // Move, or swap with the items of the current view that the destination covers. The rules of the kinds and the
  // conflicts come from SchoolTimetable.moveProblems; the not-available times from the FET file.
  // → {ok, type:'move'|'swap', moves:[{item, probe}], errors, conflicts, unavailable:[{key, day, hour}]} or {ok:false, reason}.
  function plan(key, day, startH) {
    const ix = index(), dragged = ix.byKey.get(key);
    if (!dragged) return {ok: false, reason: 'Η δραστηριότητα δεν βρέθηκε.'};
    if (dragged.locked) return {ok: false, reason: lockedText(dragged)};
    const first = slotsFor(dragged, day, startH);
    if (!first.ok) return first;
    const targetHs = first.probe.map((_, i) => startH + i);
    // Only the items shown in the current view take part in a swap.
    const targets = relevant().filter(item => item.key !== key && item.entries.some(entry =>
      entry.day === day && targetHs.includes(entry.h) && (view !== 'classes' || passesFilter(item.keys, selected.classes, hours[entry.h]))));
    const moves = [{item: dragged, probe: first.probe}];
    if (targets.length) {
      if (targets.some(target => target.locked)) return {ok: false, reason: 'Η ανταλλαγή δεν γίνεται: μια δραστηριότητα του προορισμού δεν μετακινείται εδώ.'};
      for (const target of targets) {
        if (!target.entries.every(entry => entry.day === day && targetHs.includes(entry.h))) return {ok: false, reason: 'Η ανταλλαγή δεν γίνεται: μια δραστηριότητα του προορισμού συνεχίζει έξω από τις ώρες που καλύπτει η δραστηριότητα που μετακινείται.'};
      }
      for (const h of targetHs) {
        if (targets.filter(target => target.entries.some(entry => entry.h === h)).length > 1) return {ok: false, reason: 'Η ανταλλαγή δεν γίνεται: στο ίδιο κελί υπάρχουν περισσότερες από μία δραστηριότητες.'};
      }
      const from = dragged.entries[0];
      for (const target of targets) {
        const back = slotsFor(target, from.day, from.h + (target.entries[0].h - startH));
        if (!back.ok) return back;
        moves.push({item: target, probe: back.probe});
      }
    }
    const check = T.moveProblems(composition(), moves.map(move => ({kind: move.item.kind, activity: move.item.activity, times: move.probe})));
    const unavailable = [];
    for (const move of moves) for (const teacher of move.item.keys) for (const slot of move.probe) {
      if (unavailableOf(teacher).some(time => time.day === slot.day && slot.start < time.end && time.start < slot.end)) unavailable.push({key: teacher, day: slot.day, hour: slot.name});
    }
    return {ok: true, type: targets.length ? 'swap' : 'move', moves, errors: check.errors, conflicts: check.conflicts, unavailable};
  }
  function eligibility(key, day, startH) {
    const result = plan(key, day, startH);
    if (!result.ok || result.errors.length) return {allowed: false};
    if (modeSafe() && result.conflicts.length) return {allowed: false};
    return {allowed: true, warning: modeSafe() && result.unavailable.length > 0};
  }
  const lockedText = item => item.kind === 'oloimero'
    ? 'Οι ώρες των ζωνών Ολοημέρου αλλάζουν στον Ολοήμερο Designer (μολυβάκι του κελιού).'
    : 'Η δραστηριότητα του Ωρολογίου έχει ώρα σε ζώνη Ολοημέρου και δεν μετακινείται εδώ. Οι ζώνες Ολοημέρου αλλάζουν στον Ολοήμερο Designer.';
  const otherOf = problem => problem.entry || (problem.other ? {kind: problem.other.kind, activity: problem.other.activity} : null);
  const whoText = (type, who) => type === 'class' ? 'τμήμα: ' + className(who) : 'εκπαιδευτικός: ' + (type === 'staff' ? shortOf(keyOfId(who)) : who);
  function errorText(error) {
    const when = dayLabel(error.time.day) + ' ' + error.time.start;
    if (error.code === 'zone') return 'Η ώρα ' + when + ' είναι σε ζώνη Ολοημέρου, που ανήκει στον Ολοήμερο Designer. Εδώ μετακινούνται μόνο οι ώρες του Πρωινού.';
    const other = otherOf(error), keys = teacherKeys(error.move.activity).filter(key => other && teacherKeys(other.activity).includes(key));
    return (keys.length ? shortOf(keys[0]) : 'Ο εκπαιδευτικός') + ' έχει ήδη ώρα ' + when + (other ? ' (' + (subjectOf(other.activity) || '—') + ', ' + sourceName(other.kind) + ')' : '') +
      '. Μια ώρα των Ατομικών Προγραμμάτων δεν μοιράζεται με άλλη ώρα του ίδιου εκπαιδευτικού, σε καμία λειτουργία.';
  }
  const conflictText = conflict => { const other = otherOf(conflict); return whoText(conflict.type, conflict.who) + (other ? ', με ' + quoted(subjectOf(other.activity) || '—') + ' (' + sourceName(other.kind) + ')' : ''); };
  // What the user sees of an activity at some times: subject, teachers, students, room, day and hours.
  const seen = (activity, times) => JSON.stringify([
    subjectOf(activity), [...(activity.staff || [])].sort(), [...(activity.unmatched || [])].sort(),
    [...(activity.classes || [])].sort(), [...(activity.subsets || [])].sort(), [...(activity.otherStudents || [])].sort(), activity.room || '',
    times.map(({day, start, end}) => day + ' ' + start + '-' + end).sort()
  ]);
  const sameAsSeen = moves => {
    const before = moves.map(move => seen(move.item.activity, move.item.activity.times || [])).sort();
    const after = moves.map(move => seen(move.item.activity, move.probe)).sort();
    return JSON.stringify(before) === JSON.stringify(after);
  };
  async function moveOrSwap(key, day, startH) {
    const result = plan(key, day, startH);
    const label = result.type === 'swap' ? 'Η ανταλλαγή' : 'Η μετακίνηση';
    if (!result.ok) { await message(result.reason, 'Μετακίνηση'); return; }
    // Nothing changes as the user sees it (dropped where it was, or swapped with an activity of the same
    // subject, teachers, students, room and hours): the program stays as it is.
    if (sameAsSeen(result.moves)) return;
    if (result.errors.length) { await message(label + ' δεν γίνεται. ' + errorText(result.errors[0]), 'Μετακίνηση'); return; }
    if (modeSafe()) {
      const conflict = result.conflicts[0];
      if (conflict) { await message(label + ' δεν έγινε λόγω σύγκρουσης (' + conflictText(conflict) + '). Στην «Ελεύθερη» λειτουργία επιτρέπεται.', 'Μετακίνηση'); return; }
      if (result.unavailable.length) {
        const lines = unique(result.unavailable.map(item => '• ' + shortOf(item.key) + (fullOf(item.key) ? ' (' + fullOf(item.key) + ')' : '') + ': ' + dayLabel(item.day) + ', ' + item.hour));
        const textValue = label + ' βάζει εκπαιδευτικό σε ώρα που έχει δηλωθεί μη διαθέσιμη στο FET:\n\n' + lines.slice(0, 8).join('\n') + (lines.length > 8 ? '\n• και ' + (lines.length - 8) + ' ακόμη' : '') + '\n\nΝα συνεχίσω;';
        if (!await schoolConfirm(textValue, {title: 'Μη διαθεσιμότητα', accept: 'Συνέχεια', queue: true})) return;
      }
    }
    change(() => {
      for (const move of result.moves) {
        move.item.activity.times = move.probe.map(({day: d, start, end}) => ({day: d, start, end}));
        touch(move.item.kind);
      }
    });
  }

  // ---- Changes, undo, dirty state ----
  // Every action keeps a snapshot for «Αναίρεση». What changed since the import is the difference from the initial
  // state of the program, kept by the host (program.initial).
  const snapshot = () => JSON.stringify({program, individual});
  function change(apply) {
    undoStack.push(snapshot());
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
    apply();
    invalidate(); refresh();
  }
  function touch(kind) {
    const now = new Date().toISOString();
    if (kind === 'school' && program) {
      // The initial history (from the source of an older program) is fixed before the program changes.
      T.ensureHistory(program);
      program.updatedAt = now;
    } else if (kind === 'individual' && individual) individual.updatedAt = now;
  }
  function restore(value) { const state = JSON.parse(value); program = state.program; individual = state.individual; invalidate(); refresh(); }
  function undo() { if (busy || !undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
  function redo() { if (busy || !redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
  async function undoAll() {
    if (busy || !dirty) return;
    if (!await schoolConfirm('Να αναιρεθούν όλες οι αλλαγές του προγράμματος από την τελευταία αποθήκευση;', {title: 'Αναίρεση όλων', accept: 'Αναίρεση όλων'})) return;
    change(() => { program = clone(saved); individual = clone(savedInd); });
    notice('Αναιρέθηκαν όλες οι αλλαγές από την τελευταία αποθήκευση.');
  }
  function updateDirty() {
    const value = JSON.stringify(program) !== savedJson || JSON.stringify(individual) !== savedIndJson;
    if (value !== dirty) { dirty = value; post({type: 'school-fet:dirty', dirty}); }
  }
  function buttons() {
    const ready = !!context && !hoursError;
    $('save').classList.toggle('dirty', dirty);
    $('save').setAttribute('aria-label', dirty ? 'Αποθήκευση — υπάρχουν μη αποθηκευμένες αλλαγές' : 'Αποθήκευση');
    $('save').disabled = $('undoAll').disabled = busy || !dirty;
    $('undo').disabled = busy || !undoStack.length;
    $('redo').disabled = busy || !redoStack.length;
    $('period').disabled = busy || !context?.periods?.length || !!hoursError;
    $('print').disabled = $('printMode').disabled = busy || !ready || !hasPrograms();
    $('root').classList.toggle('busy', busy);
  }
  function refresh() { updateDirty(); render(); }
  function setBusy(value) { busy = value; buttons(); $('workspace').toggleAttribute('aria-busy', value); }

  // ---- Context from the host ----
  function applyContext(value) {
    context = value;
    staffById = new Map((context.staff || []).map(person => [person.id, person]));
    staffRanks = new Map(T.sortStaff(context.staff).map((person, index) => [person.id, index]));
    $('schoolYearValue').textContent = context.year || '';
    $('schoolYear').hidden = !context.year;
  }
  // The period that opens: the target of another program application (context.target), else the current period shared
  // by the program applications (context.currentPeriod), else the period of today. The target may also choose a
  // teacher or a τμήμα, and a cell (day and hour).
  function receive(value) {
    applyContext(value);
    loadHours();
    const periods = context.periods || [], target = context.target || null;
    if (target?.periodId && periodOf(target.periodId)) periodId = target.periodId;
    else if (!periodOf(periodId)) {

  function alignAvailability() {

  // ---- Save ----
  // How many activities of the Ωρολόγιο changed day or hours since the last save (moves and swaps).
  function movedCount() {
    if (!saved || !program) return 0;
    const before = new Map(saved.activities.map(activity => [activity.id, JSON.stringify(activity.times || [])]));
    return program.activities.filter(activity => before.has(activity.id) && before.get(activity.id) !== JSON.stringify(activity.times || [])).length;
  }
  // The teachers whose hours in the Ατομικά changed since the last save, by name (full name, or short name), in the
  // order of the Προσωπικό, as the Ατομικά Προγράμματα write them in the history.
  function changedStaff() {
    const times = (prog, id) => (prog?.activities || []).filter(activity => (activity.staff || []).includes(id))
      .map(activity => activity.id + ' ' + JSON.stringify(activity.times || [])).sort().join('\n');
    const ids = unique((individual?.activities || []).flatMap(activity => activity.staff || []));
    const people = T.sortStaff(ids.map(id => staffById.get(id)).filter(Boolean));
    return people.filter(person => times(savedInd, person.id) !== times(individual, person.id)).map(person => String(person.name || person.shortName || ''));
  }
  // The host keeps the initial state of a program (initial, initialSetAt): it is not part of the comparison.
  const withoutInitial = value => { if (!value) return value; const {initial, initialSetAt, ...rest} = value; return rest; };
  async function save() {
    if (busy || !dirty) return;
    const ops = [], puts = [];
    if (program && JSON.stringify(program) !== savedJson) {
      const put = clone(program), moved = movedCount();
      // One «edit» entry per save with moves or swaps.
      if (moved) T.addHistory(put, {type: 'edit', activities: moved});
      ops.push({op: 'put', program: put}); puts.push(put);
    }
    if (individual && JSON.stringify(individual) !== savedIndJson) {
      const put = clone(individual), names = changedStaff();
      if (names.length) T.addHistory(put, {type: 'edit', staff: names});
      ops.push({op: 'put', program: put}); puts.push(put);
    }
    if (!ops.length) return;
    setBusy(true);
    let result = null;
    try {
      result = await schoolHost.request('school-timetables:save', {revision: context.revision, year: context.year, ops});
      applyContext(result);
      for (const put of puts) {
        const stored = (result.programs || []).find(item => item.id === put.id);
        if (!stored || JSON.stringify(withoutInitial(stored)) !== JSON.stringify(withoutInitial(put))) throw Error('Η αποθήκευση ολοκληρώθηκε, αλλά το πρόγραμμα του αρχείου δεν είναι ίδιο με αυτό της σελίδας. Βεβαιώσου ότι το index.html είναι η τελευταία έκδοση.');
      }
      // «Αναίρεση» / «Επανάληψη» work only within the changes since the last save.
      undoStack = []; redoStack = [];

      saved = clone(programOf(periodId, 'school')); savedJson = JSON.stringify(saved); program = clone(saved);
      savedInd = clone(programOf(periodId, 'individual')); savedIndJson = JSON.stringify(savedInd); individual = clone(savedInd);
      invalidate(); refresh();
      notice('Το πρόγραμμα αποθηκεύτηκε στο κοινό αρχείο .data.');
    } catch (error) {
      if (result) refresh();
      notice(error.message, true);
    } finally { setBusy(false); }
  }

  // A column of check boxes with preset buttons: items [{value, label, checked}], presets [{label, test(value)}];

  function checkColumn(title, items, presets, onChange = null) {

      actions: [{label: 'Ακύρωση'}, {label: 'Εκτύπωση', accept: true, run: () => {
        const effective = date.value(), chosen = people.values(), selectedHours = hourColumn.values().map(Number).map(i => hours[i]);
        if (!chosen.length) throw Error('Επίλεξε τουλάχιστον έναν εκπαιδευτικό.');
        if (!selectedHours.length) throw Error('Επίλεξε τουλάχιστον μία ώρα.');
        const blocks = chosen.map(key => {
          const specialty = isSpecialty(key);
          const table = printTable(selectedHours, (day, hour) => activitiesAt(item => item.keys.includes(key), day, hour)
            .map(item => '<div class="activity">' + (!specialty && subjectOf(item.activity) ? '<div class="subject">' + esc(subjectOf(item.activity)) + '</div>' : '') +
              '<div' + (specialty ? ' class="subject"' : '') + '>' + esc(studentsLabel(item.activity)) + '</div></div>').join(''));
          return '<section class="block">' + blockHead(shortOf(key), fullOf(key), effective) + table + '<div class="load">Διδακτικό ωράριο: ' + esc(hoursOf(key) + '/' + targetOf(key)) + '</div></section>';
        });
        const css = `h1{font-size:15pt}.subtitle{font-size:8pt}.date,.load{font-size:7.5pt}.load{margin-top:2mm;text-align:right}th,td{padding:2px 3px;font-size:8pt;line-height:1.02}thead th{font-size:10pt}.hour{width:23mm;font-size:9pt}tbody th,tbody td{height:8mm}.subject{font-size:9.5pt}`;
        return openPrintWindow(printDocument('Εκτύπωση προγραμμάτων εκπαιδευτικών', css, pagesOf(blocks, selectedHours.length <= 12)));
      }}]
    });
  }
  function printAvailable() {
    const date = dateField();
    void schoolChoiceDialog({
      title: 'Εκτύπωση διαθέσιμων εκπαιδευτικών', className: 'ft-print-dialog',
      content: ['Ο πίνακας δείχνει, για κάθε ώρα του πρωινού, ποιοι εκπαιδευτικοί είναι στο σχολείο χωρίς δραστηριότητα: 6 ώρες παραμονής από την άφιξη (15 λεπτά πριν από την πρώτη ζώνη τους), με τη σύνθεση της περιόδου (Ωρολόγιο, σχέδιο Ολοημέρου και Ατομικά Προγράμματα) και τις μη διαθεσιμότητες του FET. Η διευθύντρια ή ο διευθυντής δεν περιλαμβάνεται.', date.field],
      actions: [{label: 'Ακύρωση'}, {label: 'Εκτύπωση', accept: true, run: () => {
        const effective = date.value(), comp = composition();
        if (!comp) throw Error('Η σύνθεση της περιόδου δεν γίνεται: έλεγξε τις Ώρες Διδασκαλίας.');
        const ids = unique(comp.entries.flatMap(entry => entry.activity.staff || []));
        const people = ids.map(id => staffById.get(id)).filter(Boolean).sort((a, b) => byText(a.name || a.shortName, b.name || b.shortName));
        const morning = hours.filter(isMorning), free = new Map(), notes = new Map();
        for (const person of people) for (const day of DAYS) {
          const result = T.availability({composition: comp, person, day});
          if (!result) continue;
          if (result.earlyAndAfternoon) notes.set(person.id, [...(notes.get(person.id) || []), dayLabel(day)]);
          for (const slot of result.hours) if (slot.status === 'free') {
            const key = day + ':' + slot.start;
            if (!free.has(key)) free.set(key, []);
            free.get(key).push(person.name || person.shortName);
          }
        }
        const head = '<tr><th class="hour">Ώρα</th>' + DAYS.map(day => '<th>' + esc(upper(dayLabel(day))) + '</th>').join('') + '</tr>';
        const rows = morning.map(hour => '<tr><th class="hour">' + esc(hour.name) + '</th>' + DAYS.map(day => {
          const names = free.get(day + ':' + hour.start) || [];
          return '<td class="cell"><div class="count">[' + names.length + ']</div>' + names.map(name => '<div class="name">' + esc(name) + '</div>').join('') + '</td>';
        }).join('') + '</tr>').join('');
        const footnote = notes.size ? '<p class="note">Πρωινή Ζώνη και απογευματινή ώρα την ίδια ημέρα: ' + esc([...notes].map(([id, days]) => (staffById.get(id)?.name || '') + ' (' + days.join(', ') + ')').join('· ')) + '.</p>' : '';
        const css = `@page{size:A4 landscape;margin:9mm}h1{font-size:17pt}.date{font-size:9pt}th,td{padding:4px 5px;font-size:8.5pt;line-height:1.08;vertical-align:top}thead th{font-size:10pt;vertical-align:middle}.hour{width:29mm;font-size:9pt;vertical-align:middle}.count{font-size:8pt;font-weight:700;margin-bottom:4px}.name{margin:0 0 3px}.note{margin:3mm 0 0;font-size:8.5pt}`;
        return openPrintWindow(printDocument('Διαθέσιμοι Εκπαιδευτικοί', css, '<div class="head">' + draftMark() + '<div class="title"><h1>Διαθέσιμοι Εκπαιδευτικοί</h1></div><div class="date">Ισχύει από: ' + esc(effective) + '</div></div><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' + footnote));
      }}]
    });
  }
  function print() {
    if (busy || !hasPrograms()) return;
    const mode = $('printMode').value;
    if (mode === 'classes') printClasses();
    else if (mode === 'available') printAvailable();
    else printTeachers(mode);
  }

  // ---- Events ----
  $('save').onclick = save;
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  $('undoAll').onclick = undoAll;
  $('print').onclick = print;
  $('tabClasses').onclick = () => { view = 'classes'; focusCell = null; render(); };
  $('tabTeachers').onclick = () => { view = 'teachers'; focusCell = null; render(); };
  $('search').addEventListener('input', renderSide);
  // The mark of the target cell goes away with the next click on the board.
  $('workspace').addEventListener('pointerdown', event => {
    if (!focusCell || !event.target.closest?.('#gridWrap')) return;
    focusCell = null;
    document.querySelectorAll('.ft-grid td.ft-slot.ft-target').forEach(td => td.classList.remove('ft-target'));
  });
  document.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey) || event.altKey || event.target.closest?.('input,select,textarea,dialog')) return;
    const keyName = String(event.key).toLowerCase();
    if (keyName === 'z' || keyName === 'ζ') { event.preventDefault(); event.shiftKey ? redo() : undo(); }
    else if (keyName === 'y' || keyName === 'υ') { event.preventDefault(); redo(); }
  });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  post({type: 'school-timetables:ready'});
})();
</script>
</body>
</html>
