<!doctype html>
<html lang="el" class="subapp-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FET Timetable Editor v1.08</title>
<link rel="stylesheet" href="_ui.css">
<link rel="stylesheet" href="_subapp.css">
<style>
/* FET Timetable Editor: the timetable (kind 'school') of a period, from the shared file (.data).
   Shared appearance: _ui.css / _subapp.css. --ft-* : colours whose meaning exists only on this board. */
:root{
  --app-mark-bg:var(--school-app-fet);
  --ft-cell:130px;--ft-hour:124px;
  --ft-head-bg:#f9fafb;--ft-line:var(--school-ui-border);--ft-boundary:#98a2b3;
  --ft-card-border:#d0d5dd;
  --ft-conflict-bg:#fff1f0;--ft-conflict-border:#f04438;
  --ft-specialty-bg:#eef7ff;--ft-specialty-border:#b9d8fb;
  --ft-nonhomeroom-bg:#fff9db;--ft-nonhomeroom-border:#f2d675;
  --ft-allowed-bg:#ecfdf3;--ft-allowed-ring:#a6f4c5;--ft-allowed-over-bg:#dcfae6;--ft-allowed-outline:#32d583;
  --ft-unavailable-bg:#fff4e5;--ft-unavailable-ring:#f7b955;--ft-unavailable-over-bg:#ffead5;--ft-unavailable-outline:#f79009;
  --ft-drop-bg:#eff8ff;--ft-drop-outline:#84adff;
  --ft-note-bg:#fff7ed;--ft-note-border:#fed7aa;--ft-note-text:#9a3412;
  --ft-avail-ok-bg:#eaf3de;--ft-avail-ok-border:#97c459;
  --ft-avail-off-bg:#fcebeb;--ft-avail-off-border:#f09595;--ft-avail-off-text:#a32d2d;
  --ft-avail-weak-bg:#fef08a;--ft-avail-weak-border:#ca8a04;--ft-avail-weak-text:#713f12
}
/* Header: the period list may be long; it gives up width before anything wraps out of the page. */
#period{flex:0 1 auto;min-width:0;max-width:min(340px,100%)}
/* Busy: the shared main.busy of _subapp.css fades the sidebar and the workspace together. */
main.ft-single{grid-template-columns:minmax(0,1fr)}

/* Sidebar */
aside{display:flex;flex-direction:column;gap:0}
#search{width:100%;margin:0 0 10px;padding:var(--school-ui-control-padding-y) 10px;border:1px solid var(--school-ui-input-border);border-radius:8px;flex:none}
.ft-entity-list{min-height:0}
.ft-entity-empty{margin:8px 2px;font-size:13px;color:var(--school-ui-muted)}
/* Cards of the «Τμήματα» tab: the homeroom teacher on the same line as the class, aligned right, in smaller letters;
   a long name wraps under itself, not under the class. */
.subapp-sidebar-item.ft-class-item{display:flex;align-items:baseline;gap:10px}
.ft-class-item .subapp-sidebar-item-name{flex:none}
.ft-class-item .subapp-sidebar-item-meta{flex:1 1 auto;font-size:11px;text-align:right}

/* Workspace */
.ft-workspace{min-width:0;min-height:0;overflow:auto;padding:12px 14px}
.ft-toolbar{margin-bottom:10px}
.ft-title{margin:0 0 2px;font-size:18px;font-weight:850;line-height:1.3}
/* Under the title only the period; right under it, when it applies, the warning that the Ολοήμερο design changed
   (a link-like button that opens «Εισαγωγή Ολοημέρου»), then the assignment note and the warnings of the timetable.
   Files, imports and changes are in «Ιστορικό…» of «Περίοδοι Προγραμμάτων».
   The strip ends at the visible right edge of the timetable, never past the workspace. */
.ft-source-info{margin:0;max-width:100%}
/* Title and information on the left; in the teacher view the availability of the FET file on the right, above
   «Ώρες». The head has the width of the visible timetable, like the controls. When the text gets narrower than
   260px, the availability goes under it, on the left. */
.ft-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 16px;margin:0 0 10px;max-width:100%}
.ft-head-text{flex:1 1 260px;min-width:0}
/* Availability: days in columns, the hours of «Πρωινό» in rows. Green available, red with «×» not available,
   yellow with «×» not available with weight under 100%. The 7px «×» is an exception to the icon scale. */
.ft-avail{display:grid;grid-template-columns:12px repeat(5,13px);gap:2px 3px;align-items:center;flex:0 0 auto}
.ft-avail-label{font-size:11px;line-height:11px;color:var(--school-ui-muted);text-align:center}
.ft-avail-cell{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:13px;height:11px;border:1px solid var(--ft-avail-ok-border);border-radius:3px;background:var(--ft-avail-ok-bg)}
.ft-avail-cell.off{border-color:var(--ft-avail-off-border);background:var(--ft-avail-off-bg);color:var(--ft-avail-off-text)}
.ft-avail-cell.weak{border-color:var(--ft-avail-weak-border);background:var(--ft-avail-weak-bg);color:var(--ft-avail-weak-text)}
.ft-avail-cell svg{display:block;width:7px;height:7px}
.ft-design-change{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--school-ui-warning);--ui-icon-text-size:var(--school-ui-icon-size-list)}
.ft-design-change .ui-link-button{color:var(--school-ui-warning);text-align:left;max-width:100%}
.ft-design-change .ui-icon-text{white-space:normal;overflow-wrap:anywhere}
.ft-controls select{min-width:0}
/* Controls of the board: groups with a small title above, ending at the visible right edge of the timetable
   (same width as the information strip). Groups wrap as whole units. The spring before the filters takes the free
   space of the line, so the filters sit on the right while they fit on that line, and start on the left of a new line
   when they wrap. Its negative margin cancels the gap, so it never makes the line wrap earlier. */
.ft-controls{--ft-controls-gap:18px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px var(--ft-controls-gap);max-width:100%}
.ft-controls-spring{flex:1 1 0;min-width:0;margin-left:calc(-1 * var(--ft-controls-gap))}
.ft-control-group{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.ft-filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;min-width:0}
.ft-control-title{margin:0;font-size:12px;font-weight:400;line-height:1.3;color:var(--school-ui-muted)}
/* Joined buttons (one choice: Λειτουργία; one or more: Εμφάνιση). Pressed look from .ui-toggle (_ui.css). */
.ft-segmented{display:inline-flex}
.ft-segmented button{border-radius:0;margin:0}
.ft-segmented button+button{margin-left:-1px}
.ft-segmented button:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px}
.ft-segmented button:last-child{border-top-right-radius:7px;border-bottom-right-radius:7px}
.ft-segmented button[aria-pressed="true"]{position:relative;z-index:1}
.ft-segmented button:focus-visible{position:relative;z-index:2}
.ft-source{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:13px;color:var(--school-ui-muted);line-height:1.5}
.ft-source b{font-weight:650;color:var(--school-ui-label-text)}
.ft-source + .ft-source{margin-top:4px}
.ft-note{margin:8px 0 0;padding:6px 9px;border:1px solid var(--ft-note-border);border-radius:8px;background:var(--ft-note-bg);color:var(--ft-note-text);font-size:13px;line-height:1.45}
.ft-warnings .ui-validation-warning,.ft-warnings .ui-validation-error{font-size:13px}
.ft-workspace .subapp-notice{margin:8px 0 0}
.ft-workspace .subapp-notice:empty{display:none}
.ft-empty{min-height:320px}

/* Timetable grid */
table.ft-grid{border-collapse:separate;border-spacing:0;background:var(--school-ui-surface);border:1px solid var(--ft-line);border-radius:10px;min-width:max-content}
.ft-grid th,.ft-grid td{border-right:1px solid var(--ft-line);border-bottom:1px solid var(--ft-line);vertical-align:top}
.ft-grid tr:last-child>td,.ft-grid tr:last-child>th{border-bottom:0}
.ft-grid th:last-child,.ft-grid td:last-child{border-right:0}
.ft-grid tr.ft-boundary>th,.ft-grid tr.ft-boundary>td{border-top:2px solid var(--ft-boundary)}
.ft-grid thead th{position:sticky;top:-12px;z-index:4;background:var(--ft-head-bg);padding:8px;text-align:center;min-width:var(--ft-cell);font-size:14px}
.ft-grid .ft-hour{position:sticky;left:-14px;z-index:3;background:var(--ft-head-bg);width:var(--ft-hour);min-width:var(--ft-hour);padding:8px;text-align:left;font-size:13px;font-weight:650;white-space:nowrap}
.ft-grid thead .ft-hour{z-index:5}
.ft-grid td.ft-slot{width:var(--ft-cell);min-width:var(--ft-cell);height:80px;padding:5px;background:var(--school-ui-surface)}
.ft-grid td.ft-slot.drag-allowed{background:var(--ft-allowed-bg);box-shadow:inset 0 0 0 1px var(--ft-allowed-ring)}
.ft-grid td.ft-slot.drag-allowed.dragover{outline:3px solid var(--ft-allowed-outline);outline-offset:-3px;background:var(--ft-allowed-over-bg)}
.ft-grid td.ft-slot.drag-unavailable{background:var(--ft-unavailable-bg);box-shadow:inset 0 0 0 1px var(--ft-unavailable-ring)}
.ft-grid td.ft-slot.drag-unavailable.dragover{outline:3px solid var(--ft-unavailable-outline);outline-offset:-3px;background:var(--ft-unavailable-over-bg)}
.ft-grid td.ft-slot.dragover:not(.drag-allowed):not(.drag-unavailable){outline:3px solid var(--ft-drop-outline);outline-offset:-3px;background:var(--ft-drop-bg)}
.ft-card{
  border:1px solid var(--ft-card-border);border-left:5px solid var(--card,var(--school-ui-muted));background:var(--school-ui-surface);
  border-radius:8px;padding:6px 7px;margin-bottom:5px;box-shadow:0 1px 2px #1018280d;cursor:grab;user-select:none
}
.ft-card:last-child{margin-bottom:0}
.ft-card.specialty{background:var(--ft-specialty-bg);border-color:var(--ft-specialty-border)}
.ft-card.non-homeroom{background:var(--ft-nonhomeroom-bg);border-color:var(--ft-nonhomeroom-border)}
.ft-card.conflict{background:var(--ft-conflict-bg);border-color:var(--ft-conflict-border)}
.ft-card:active{cursor:grabbing}
.ft-subject{font-size:13px;font-weight:850;line-height:1.15;text-align:center;overflow-wrap:break-word}
.ft-meta{margin-top:3px;font-size:11px;line-height:1.25;color:#475467;text-align:center;overflow-wrap:anywhere}
.ft-badge{display:block;width:max-content;max-width:100%;margin:4px auto 0;padding:1px 5px;border:1px solid var(--ft-card-border);border-radius:999px;background:var(--ft-head-bg);font-size:10px;text-align:center}
.ft-unmatched{font-style:italic}

/* Dialogs (inside schoolChoiceDialog) */
.school-confirm.ft-print-dialog{width:min(780px,calc(100vw - 32px))}
.ft-date-field{max-width:200px}
.ft-print-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.ft-print-column{min-width:0}
.ft-print-column h3{margin:0 0 6px;font-size:15px}
.ft-print-presets{display:flex;flex-wrap:wrap;gap:6px}
.ft-print-column .subapp-check-list{max-height:42vh}
.ft-print-column .subapp-check-list label{font-weight:400;margin:2px 0}
.ft-dialog-info{margin-top:12px!important;padding:10px 12px;border-radius:10px;background:var(--school-ui-label-bg);font-size:14px;line-height:1.5}
.ft-dialog-warning{margin-top:10px!important;color:var(--school-ui-warning);font-size:14px}
.ft-check{margin-top:12px}
.ft-check h3{margin:0 0 4px;font-size:15px}
.ft-check ul{margin:0;padding-left:20px;font-size:14px;line-height:1.45;max-height:22vh;overflow:auto}
.ft-check-ok{margin-top:12px!important;color:var(--school-ui-success-border);font-size:14px}
.ft-check-note{margin-top:10px!important;font-size:13px;color:var(--school-ui-muted);line-height:1.45}
.ft-source .ui-validation-warning{margin:0}

@media(max-width:900px){:root{--ft-cell:112px;--ft-hour:108px}}
@media(max-width:800px){
  .ft-entity-list{max-height:40vh;overflow:auto}
  .ft-workspace{overflow:visible}
  .ft-grid-wrap{overflow:auto}
  .ft-grid thead th{top:0}
  .ft-grid .ft-hour{left:0}
}
@media(max-width:700px){.ft-print-columns{grid-template-columns:1fr}}
@media print{
  header,aside{display:none!important}
}
</style>
</head>
<body>
<header class="page-head">
  <div class="toolbar-brand"><h1><button class="brand-menu" type="button" title="Άνοιγμα κεντρικού μενού" aria-label="FET Timetable Editor — άνοιγμα κεντρικού μενού"><span class="app-mark" aria-hidden="true"><span>FT</span></span><span class="brand-text"><span>FET Timetable Editor</span><span class="small version">v1.08</span></span></button></h1></div>
  <select id="period" aria-label="Περίοδος" disabled hidden></select>
  <button id="save" class="save-main" type="button" disabled>Αποθήκευση</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="undo" type="button" disabled title="Αναίρεση της τελευταίας ενέργειας" data-school-icon="undo">Αναίρεση</button>
  <button id="redo" type="button" disabled title="Επανάληψη της ενέργειας που αναιρέθηκε" data-school-icon="redo">Επανάληψη</button>
  <button id="undoAll" type="button" disabled>Αναίρεση όλων</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="oloimero" type="button" disabled>Εισαγωγή Ολοημέρου…</button>
  <span class="print-control">
    <button id="print" type="button" disabled>Εκτύπωση…</button>
    <span class="print-mode-wrap">
      <select id="printMode" aria-label="Μορφή εκτύπωσης" disabled>
        <option value="classes">Τμήματα</option>
        <option value="staff">Προσωπικό</option>
        <option value="classroom">Δάσκαλοι</option>
        <option value="specialties">Ειδικότητες</option>
        <option value="available">Διαθέσιμοι Εκπαιδευτικοί</option>
      </select>
    </span>
  </span>
  <div class="header-right"><span id="schoolYear" class="school-year-indicator" hidden><span>Σχολικό έτος:</span> <span id="schoolYearValue"></span></span></div>
</header>
<main id="root" class="ft-single">
  <aside id="side" hidden aria-label="Τμήματα και εκπαιδευτικοί">
    <div class="subapp-sidebar-tabs" role="tablist" aria-label="Προβολή">
      <button id="tabClasses" type="button" role="tab" aria-selected="true" aria-controls="entityList">Τμήματα</button>
      <button id="tabTeachers" type="button" role="tab" aria-selected="false" aria-controls="entityList">Εκπαιδευτικοί</button>
    </div>
    <input id="search" type="search" placeholder="Αναζήτηση…" aria-label="Αναζήτηση" autocomplete="off">
    <div id="entityList" class="ft-entity-list subapp-sidebar-list" role="tabpanel"></div>
  </aside>
  <section id="workspace" class="ft-workspace subapp-workspace">
    <p class="subapp-connection">Άνοιξε τον FET Timetable Editor από το Κεντρικό Μενού, αφού ανοίξεις το αρχείο πληροφοριών του σχολείου. Απαιτείται η τελευταία έκδοση του index.html.</p>
  </section>
</main>
<script src="_ui.js"></script>
<script src="_data.js"></script>
<script>
(() => {
  'use strict';
  // The timetable of a period comes from the shared file (school-timetables:*), through schoolHost (_ui.js).
  // Hours, classes, homeroom teachers, conflicts, availability and the Εισαγωγή Ολοημέρου: SchoolTimetable (_data.js).
  // Τμήματα: those of «Τμήματα» (classes of school-timetables:context, SchoolClasses). Activities refer to them by
  // id, and the page always shows the name from «Τμήματα».
  // Every change happens in the page; «Αποθήκευση» writes the program of the period (put), all or nothing.
  const T = SchoolTimetable, C = SchoolClasses, D = SchoolDate, esc = schoolEscape, $ = id => document.getElementById(id);
  const post = schoolHost.post;
  const quoted = value => '«' + value + '»';
  const clone = value => structuredClone(value);
  const unique = list => [...new Set(list)];
  const byText = (a, b) => String(a).localeCompare(String(b), 'el', {numeric: true, sensitivity: 'base'});
  const DAYS = [1, 2, 3, 4, 5];
  const dayLabel = day => T.dayLabels[day - 1];
  const upper = value => SchoolText.withoutTones(value).toLocaleUpperCase('el-GR');
  const el = (tag, className, textValue) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textValue != null) node.textContent = textValue;
    return node;
  };
  const localDay = value => {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  };

  // ---- State ----
  let context = null;          // the last context of the host
  let periodId = null;         // the period shown
  let saved = null, savedJson = 'null';   // the program of the period as stored in the file (or null)
  let program = null;          // the program as shown in the page (or null)
  let undoStack = [], redoStack = [];     // JSON snapshots of {program, assign}, for «Αναίρεση» / «Επανάληψη»
  // A draft of the Ολοήμερο Designer to assign to this period with the next «Αποθήκευση» (after an Εισαγωγή
  // Ολοημέρου from it): {draftId, assignedId, replace: null | {id, mode:'draft', name} | {id, mode:'delete'}}, or null.
  // The original draft keeps its id and contents; the period receives a new, independent design.
  let assign = null;
  let busy = false, dirty = false;
  let hours = [], hoursError = '';
  let view = 'classes';
  const selected = {classes: '', teachers: ''};
  let draggedId = null;
  let cache = null;            // indexes of the current program, rebuilt after every change
  const printDates = new Map();            // «Ισχύει από» chosen per period in this session
  let staffById = new Map(), staffRanks = new Map();
  let gridWidthObserver = null;
  // The activities the history entry «edit» compares with, when the program is not stored yet (a copy of another
  // period): the activities of the copy. With a stored program, those of the file.
  let copyBase = null;

  // ---- Small helpers ----
  const periodOf = id => context?.periods?.find(period => period.id === id) || null;
  const schoolProgramOf = id => (context?.programs || []).find(item => item.kind === 'school' && item.periodId === id) || null;
  // Designs of the Ολοήμερο Designer in the file: the design of every period and the drafts.
  const oloimeroDesigns = () => (context?.programs || []).filter(item => item.kind === 'oloimero');
  const oloimeroOf = id => oloimeroDesigns().find(item => item.id === id) || null;
  const oloimeroName = design => design.periodId != null ? 'Ολοήμερο ' + (periodOf(design.periodId)?.name || '') : design.name || 'Προσχέδιο';
  const periodText = period => period.name + ' (' + D.format(period.from) + ' – ' + D.format(T.periodEnd(period, context.year)) + ')';
  const notice = (textValue, error = false) => { const node = $('notice'); if (!node) return; node.textContent = textValue; node.classList.toggle('error', error); };
  const message = (textValue, title) => schoolMessage(textValue, title ? {title} : {});
  const modeSafe = () => controlState.mode !== 'free';

  // Teachers: 'id:<staff id>' for people of Προσωπικό, 'name:<name>' for names without a match.
  const keyOfId = id => 'id:' + id, keyOfName = name => 'name:' + name;
  const teacherKeys = activity => [...(activity.staff || []).map(keyOfId), ...(activity.unmatched || []).map(keyOfName)];
  const personOf = key => key.startsWith('id:') ? staffById.get(key.slice(3)) || null : null;
  const shortOf = key => { const person = personOf(key); return person ? person.shortName || person.name || person.code || '?' : key.startsWith('name:') ? key.slice(5) : '?'; };
  const fullOf = key => personOf(key)?.name || '';
  const isUnmatched = key => key.startsWith('name:');
  const isSpecialty = key => personOf(key)?.serviceType === 'specialty';
  const isClassroom = key => T.isGeneralTeacher(personOf(key));   // «Δάσκαλοι»: branch ΠΕ70
  // Order of the «Σύντομο Όνομα» list of Προσωπικό (T.sortStaff); names without a match follow, alphabetically.
  const staffRank = key => { const person = personOf(key); return person ? staffRanks.get(person.id) ?? Infinity : Infinity; };
  const sortTeachers = keys => [...keys].sort((a, b) => (isUnmatched(a) - isUnmatched(b)) || (staffRank(a) - staffRank(b) || 0) || byText(shortOf(a), shortOf(b)));

  // ---- Hours (from Ώρες Διδασκαλίας) ----
  function loadHours() {
    try { hours = T.timedHours(context.teachingHours).map((hour, index) => ({...hour, index})); hoursError = ''; }
    catch (error) { hours = []; hoursError = error.message; }
  }
  const isBreak = hour => hour.category === 'break';
  const isMorning = hour => hour.category === 'morning';
  const isAfternoon = hour => ['meal', 'afternoon', 'extended'].includes(hour.category);
  const hourGroup = hour => hour.category === 'early' ? 0 : isMorning(hour) ? 1 : isAfternoon(hour) ? 2 : 3;
  const teachingHours = () => hours.filter(hour => !isBreak(hour));
  function hourIndexOf(time) {
    let index = hours.findIndex(hour => hour.start === time.start && hour.end === time.end);
    if (index < 0) index = hours.findIndex(hour => hour.start === time.start);
    return index;
  }
  // A thicker line where the group of hours changes: Πρωινή Ζώνη → πρωινό → απόγευμα.
  const boundaryBefore = (hour, list) => { const index = list.indexOf(hour); return index > 0 && hourGroup(list[index - 1]) !== hourGroup(hour); };

  // ---- Indexes of the program ----
  function index() {
    if (cache) return cache;
    const list = (program?.activities || []).map(activity => {
      const entries = (activity.times || []).map(time => ({day: time.day, h: hourIndexOf(time)}))
        .filter(entry => entry.h >= 0 && entry.day >= 1 && entry.day <= 5).sort((a, b) => a.day - b.day || a.h - b.h);
      return {id: activity.id, activity, entries, keys: teacherKeys(activity), outside: entries.length < (activity.times || []).length};
    });
    const conflictIds = new Set();
    if (program) for (const item of T.conflicts(program)) { conflictIds.add(item.a.id); conflictIds.add(item.b.id); }
    const homeroom = new Map();
    cache = {list, byId: new Map(list.map(item => [item.id, item])), conflictIds, homeroom};
    return cache;
  }
  const invalidate = () => { cache = null; };
  // The homeroom teacher of a τμήμα (id) within the program («Υπεύθυνος τμήματος μέσα σε πρόγραμμα»): the
  // homeroomStaffId of «Τμήματα» if it appears in the program; otherwise, for a τμήμα Γενικής Παιδείας, the teacher
  // whose short name starts with «[Α1]». Used by the title, the filters, the cards and the print of τμήματα.
  function homeroomKey(classId) {
    const ix = index();
    if (!ix.homeroom.has(classId)) {
      const found = program && classId ? T.homeroomTeacher(program, classId, {classes: context.classes, staff: context.staff}) : null;
      ix.homeroom.set(classId, found?.id ? keyOfId(found.id) : found?.name ? keyOfName(found.name) : '');
    }
    return ix.homeroom.get(classId);
  }
  // Τμήματα: all those of «Τμήματα», in the order of SchoolClasses.sort; the keys are their ids.
  const yearClasses = () => context?.classes || [];
  const classesList = () => C.sort(yearClasses()).map(item => item.id).filter(Boolean);
  const className = id => C.nameOf(yearClasses(), id) || '?';
  // The homeroom teacher of «Τμήματα» (homeroomStaffId), shown on the right of the list of τμήματα.
  const classHomeroomText = id => {
    const staffId = C.byId(yearClasses()).get(id)?.homeroomStaffId;
    const person = staffId ? staffById.get(staffId) : null;
    return person ? person.name || person.shortName || '' : '';
  };
  const teachersList = () => sortTeachers(unique(index().list.flatMap(item => item.keys)));
  // The students of an activity: the shared text of SchoolTimetable, with the names of «Τμήματα».
  const studentsLabel = activity => T.studentsText(activity, {classes: yearClasses()});

  // Programs of the period that count in the hours: this timetable and the other kinds of the period.
  const countedPrograms = () => [program, ...(context?.programs || []).filter(item => item.periodId === periodId && item.kind !== 'school' && T.countsInHours(item.kind))].filter(Boolean);
  function hoursOf(key) {
    if (key.startsWith('id:')) return T.staffHours(countedPrograms()).get(key.slice(3)) || 0;
    const name = key.slice(5);
    return (program?.activities || []).filter(activity => (activity.unmatched || []).includes(name)).reduce((sum, activity) => sum + (activity.times || []).length, 0);
  }
  const targetOf = key => { const value = personOf(key)?.schoolHours; return value === '' || value == null ? '—' : String(value); };

  // Not-available times of the FET file, for a teacher key.
  function unavailableOf(key) {
    const source = program?.source;
    if (source?.type !== 'fet') return [];
    const names = key.startsWith('id:') ? (source.teachers || []).filter(teacher => teacher.staffId === key.slice(3)).map(teacher => teacher.name) : [key.slice(5)];
    return (source.unavailable || []).filter(item => names.includes(item.teacher));
  }

  // ---- Teacher filter of the class view ----
  function shownTeachers(keys, className, hour) {
    const filter = controlState.teacherFilter, morning = hour && isMorning(hour), home = homeroomKey(className);
    // «Δάσκαλοι»: in the morning only the homeroom teacher of the class. «Ειδικότητες»: in the morning also
    // a classroom teacher who is not the homeroom teacher of the class.
    if (filter === 'classroom') return keys.filter(key => isClassroom(key) && (!morning || key === home));
    if (filter === 'specialties') return keys.filter(key => isSpecialty(key) || (morning && isClassroom(key) && key !== home));
    return keys;
  }
  const passesFilter = (keys, className, hour) => controlState.teacherFilter === 'all' || shownTeachers(keys, className, hour).length > 0;
  function relevant() {
    const current = selected[view];
    if (!current) return [];
    return index().list.filter(item => view === 'classes'
      ? (item.activity.classes || []).includes(current) && item.entries.some(entry => passesFilter(item.keys, current, hours[entry.h]))
      : item.keys.includes(current));
  }

  // ---- Moving and swapping ----
  // The destination of an activity that starts at hour index startH of day: its hours stay consecutive.
  function destination(id, day, startH, ignore = []) {
    const ix = index(), item = ix.byId.get(id);
    if (!item) return {ok: false, reason: 'Η δραστηριότητα δεν βρέθηκε.'};
    const length = item.entries.length;
    if (!length) return {ok: false, reason: 'Η δραστηριότητα δεν έχει ώρες που υπάρχουν στις Ώρες Διδασκαλίας.'};
    if (startH < 0 || startH + length > hours.length) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει μέχρι το τέλος της ημέρας.'};
    const target = hours.slice(startH, startH + length);
    const pause = target.find(isBreak);
    if (pause) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει: το ' + quoted(pause.name) + ' είναι διάλειμμα.'};
    const probe = target.map(hour => ({day, start: hour.start, end: hour.end, name: hour.name}));
    const ignored = new Set([id, ...ignore]), conflicts = [];
    for (const other of ix.list) {
      if (ignored.has(other.id)) continue;
      if (!(other.activity.times || []).some(time => probe.some(slot => slot.day === time.day && slot.start < time.end && time.start < slot.end))) continue;
      const teachers = item.keys.filter(key => other.keys.includes(key));
      const classes = T.studentsClash(item.activity, other.activity);
      if (teachers.length || classes.length) conflicts.push({teachers, classes});
    }
    const unavailable = [];
    for (const key of item.keys) for (const slot of probe) {
      if (unavailableOf(key).some(time => time.day === slot.day && slot.start < time.end && time.start < slot.end)) unavailable.push({key, day: slot.day, hour: slot.name});
    }
    return {ok: true, item, probe, conflicts, unavailable};
  }
  // Move, or swap with the activities of the current view that the destination covers.
  function plan(id, day, startH) {
    const ix = index(), dragged = ix.byId.get(id);
    if (!dragged || !dragged.entries.length) return {ok: false, reason: 'Η δραστηριότητα δεν έχει ώρες που υπάρχουν στις Ώρες Διδασκαλίας.'};
    const length = dragged.entries.length;
    if (startH < 0 || startH + length > hours.length) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει μέχρι το τέλος της ημέρας.'};
    const targetHs = Array.from({length}, (_, i) => startH + i);
    const pause = targetHs.map(h => hours[h]).find(isBreak);
    if (pause) return {ok: false, reason: 'Η δραστηριότητα δεν χωράει: το ' + quoted(pause.name) + ' είναι διάλειμμα.'};
    // Only the activities shown in the current view take part in a swap.
    const targets = relevant().filter(item => item.id !== id && item.entries.some(entry =>
      entry.day === day && targetHs.includes(entry.h) && (view !== 'classes' || passesFilter(item.keys, selected.classes, hours[entry.h]))));
    if (!targets.length) {
      const result = destination(id, day, startH);
      return result.ok ? {ok: true, type: 'move', results: [result]} : result;
    }
    for (const target of targets) {
      if (!target.entries.every(entry => entry.day === day && targetHs.includes(entry.h))) return {ok: false, reason: 'Η ανταλλαγή δεν γίνεται: μια δραστηριότητα του προορισμού συνεχίζει έξω από τις ώρες που καλύπτει η δραστηριότητα που μετακινείται.'};
    }
    for (const h of targetHs) {
      if (targets.filter(target => target.entries.some(entry => entry.h === h)).length > 1) return {ok: false, reason: 'Η ανταλλαγή δεν γίνεται: στο ίδιο κελί υπάρχουν περισσότερες από μία δραστηριότητες.'};
    }
    const ignored = [id, ...targets.map(target => target.id)];
    const first = dragged.entries[0];
    const results = [destination(id, day, startH, ignored)];
    for (const target of targets) results.push(destination(target.id, first.day, first.h + (target.entries[0].h - startH), ignored));
    const failed = results.find(result => !result.ok);
    return failed || {ok: true, type: 'swap', results};
  }
  function eligibility(id, day, startH) {
    const result = plan(id, day, startH);
    if (!result.ok) return {allowed: false};
    if (modeSafe() && result.results.some(item => item.conflicts.length)) return {allowed: false};
    return {allowed: true, warning: modeSafe() && result.results.some(item => item.unavailable.length)};
  }
  const conflictText = conflict => [
    conflict.teachers.length ? 'εκπαιδευτικός: ' + conflict.teachers.map(shortOf).join(', ') : '',

  ].filter(Boolean).join(' · ');
  // What the user sees of an activity at some times: subject, teachers, students, room, day and hours.
  const seen = (activity, times) => JSON.stringify([
    activity.subject || '', [...(activity.staff || [])].sort(), [...(activity.unmatched || [])].sort(),
    [...(activity.classes || [])].sort(), [...(activity.subsets || [])].sort(), [...(activity.otherStudents || [])].sort(), activity.room || '',

  const sameAsSeen = results => {
    const before = results.map(item => seen(item.item.activity, item.item.activity.times || [])).sort();
    const after = results.map(item => seen(item.item.activity, item.probe)).sort();
    return JSON.stringify(before) === JSON.stringify(after);
  };
  async function moveOrSwap(id, day, startH) {
    const result = plan(id, day, startH);
    const label = result.type === 'swap' ? 'Η ανταλλαγή' : 'Η μετακίνηση';
    if (!result.ok) { await message(result.reason, 'Μετακίνηση'); return; }
    // Nothing changes as the user sees it (dropped where it was, or swapped with an activity of the same
    // subject, teachers, students, room and hours): the timetable stays as it is.
    if (sameAsSeen(result.results)) return;
    if (modeSafe()) {
      const conflict = result.results.flatMap(item => item.conflicts)[0];
      if (conflict) { await message(label + ' δεν έγινε λόγω σύγκρουσης (' + conflictText(conflict) + '). Στην «Ελεύθερη» λειτουργία επιτρέπεται.', 'Μετακίνηση'); return; }
      const unavailable = result.results.flatMap(item => item.unavailable);
      if (unavailable.length) {
        const lines = unique(unavailable.map(item => '• ' + shortOf(item.key) + (fullOf(item.key) ? ' (' + fullOf(item.key) + ')' : '') + ': ' + dayLabel(item.day) + ', ' + item.hour));
        const textValue = label + ' βάζει εκπαιδευτικό σε ώρα που έχει δηλωθεί μη διαθέσιμη στο FET:\n\n' + lines.slice(0, 8).join('\n') + (lines.length > 8 ? '\n• και ' + (lines.length - 8) + ' ακόμη' : '') + '\n\nΝα συνεχίσω;';
        if (!await schoolConfirm(textValue, {title: 'Μη διαθεσιμότητα', accept: 'Συνέχεια', queue: true})) return;
      }
    }
    change(() => {
      for (const item of result.results) item.item.activity.times = item.probe.map(({day, start, end}) => ({day, start, end}));
      touch();
    });
  }

  // ---- Changes, undo, dirty state ----
  // Every action keeps a snapshot for «Αναίρεση». An activity moved after the import marks the FET program
  // «τροποποιήθηκε μετά την εισαγωγή» (the FET file no longer agrees with it).
  const snapshot = () => JSON.stringify({program, assign});
  function change(apply) {
    undoStack.push(snapshot());
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
    apply();
    invalidate(); refresh();
  }
  function touch() {
    const now = new Date().toISOString();
    // The initial history (from the source) is fixed before the note changes, so the move is not counted twice.
    T.ensureHistory(program);
    program.updatedAt = now;
    if (program.source?.type === 'fet') {
      const note = program.source.modifiedAfterImport || {replacements: []};
      note.at = now; note.moved = true;
      program.source.modifiedAfterImport = note;
    }
  }
  function restore(value) { const state = JSON.parse(value); program = state.program; assign = state.assign || null; invalidate(); refresh(); }
  function undo() { if (busy || !undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
  function redo() { if (busy || !redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
  async function undoAll() {
    if (busy || !dirty) return;
    if (!await schoolConfirm('Να αναιρεθούν όλες οι αλλαγές του ωρολογίου από την τελευταία αποθήκευση;', {title: 'Αναίρεση όλων', accept: 'Αναίρεση όλων'})) return;
    change(() => { program = clone(saved); assign = null; });
    notice('Αναιρέθηκαν όλες οι αλλαγές από την τελευταία αποθήκευση.');
  }
  function updateDirty() {
    const value = JSON.stringify(program) !== savedJson || !!assign;
    if (value !== dirty) { dirty = value; post({type: 'school-fet:dirty', dirty}); }
  }
  function buttons() {
    const ready = !!context && !hoursError;
    $('save').classList.toggle('dirty', dirty);
    $('save').setAttribute('aria-label', dirty ? 'Αποθήκευση — υπάρχουν μη αποθηκευμένες αλλαγές' : 'Αποθήκευση');

    $('undo').disabled = busy || !undoStack.length;
    $('redo').disabled = busy || !redoStack.length;
    $('period').disabled = busy || !context?.periods?.length || !!hoursError;
    $('print').disabled = $('printMode').disabled = busy || !ready || !program;
    $('oloimero').disabled = busy || !ready || !program;

  }
  function refresh() { updateDirty(); render(); }
  function setBusy(value) { busy = value; buttons(); $('workspace').toggleAttribute('aria-busy', value); }

  // ---- Context from the host ----
  function applyContext(value) {
    context = value;
    staffById = new Map((context.staff || []).map(person => [person.id, person]));
    staffRanks = new Map(T.sortStaff(context.staff).map((person, index) => [person.id, index]));
    $('schoolYearValue').textContent = context.year || '';
    $('schoolYear').hidden = !context.year;
  }
  function receive(value) {
    applyContext(value);
    loadHours();
    const periods = context.periods || [];
    if (!periodOf(periodId)) {
      const current = T.periodAt(periods, D.today());
      periodId = (current && schoolProgramOf(current.id) ? current : periods.find(period => schoolProgramOf(period.id)) || current || periods[0])?.id || null;
    }
    loadPeriod(periodId);
  }
  function loadPeriod(id) {
    periodId = id;
    saved = id ? clone(schoolProgramOf(id)) : null;
    savedJson = JSON.stringify(saved);
    program = clone(saved);
    assign = null;
    copyBase = null;
    undoStack = []; redoStack = [];
    invalidate();
    refresh();
  }
  schoolHost.on('school-timetables:context', event => { if (!dirty && !busy) receive(event.context); });

  // ---- Rendering ----
  function renderPeriods() {
    const select = $('period'), periods = context?.periods || [];
    select.replaceChildren(...periods.map(period => {
      const option = el('option', '', period.name + (schoolProgramOf(period.id) ? '' : ' (χωρίς ωρολόγιο)'));
      option.value = period.id; option.title = periodText(period); return option;
    }));
    if (!periods.length) select.append(el('option', '', 'Δεν υπάρχουν περίοδοι'));

  }

    side.hidden = !showSide; root.classList.toggle('ft-single', !showSide);

    if (!context.periods?.length) {
      work.innerHTML = '<div class="subapp-empty subapp-empty-stack ft-empty"><p>Δεν υπάρχουν περίοδοι για το σχολικό έτος.<br>Δημιούργησέ τες στις «Περιόδους Προγραμμάτων» και κάνε εκεί την εισαγωγή από FET.</p></div>';
      buttons(); return;
    }
    if (!program) { renderEmptyPeriod(work); buttons(); return; }
    renderSide();
    renderWorkspace(work);
    buttons();
  }
  function renderEmptyPeriod(work) {
    const period = periodOf(periodId), others = (context.periods || []).filter(item => item.id !== periodId && schoolProgramOf(item.id));
    work.innerHTML = `<p id="notice" class="subapp-notice" role="status"></p><div class="subapp-empty subapp-empty-stack ft-empty">
      <p>Η περίοδος ${esc(quoted(period?.name || ''))} δεν έχει ωρολόγιο.</p>
      <button id="copyPeriod" type="button" class="primary"${others.length ? '' : ' disabled'}>Αντιγραφή από άλλη περίοδο…</button>
      <p class="ui-helper">${others.length ? '' : 'Καμία άλλη περίοδος δεν έχει ωρολόγιο. '}Η εισαγωγή από FET γίνεται στις «Περιόδους Προγραμμάτων».</p></div>`;
    $('copyPeriod').onclick = copyFromPeriod;
  }
  function renderSide() {
    $('tabClasses').setAttribute('aria-selected', String(view === 'classes'));
    $('tabTeachers').setAttribute('aria-selected', String(view === 'teachers'));

    const matches = textValue => !query || SchoolText.withoutTones(textValue).toLocaleLowerCase('el').includes(query);
    const list = $('entityList'), items = [];

      button.onclick = () => { selected[view] = name; render(); };

    }
    list.replaceChildren(...(items.length ? items : [el('p', 'ft-entity-empty', all.length ? 'Δεν βρέθηκε κάτι με αυτή την αναζήτηση.' : view === 'classes' ? 'Δεν υπάρχουν τμήματα στα «Τμήματα» του σχολικού έτους.' : 'Το ωρολόγιο δεν έχει εκπαιδευτικούς.')]));
  }
  // Controls of the workspace keep their values between renders.
  // Εμφάνιση in the class view: at least one of Μάθημα / Εκπαιδευτικοί is always shown (default: both).
  // In the teacher view the cards always show the students, so Μάθημα alone may be turned off.

      : 'Εκπαιδευτικός: ' + (current ? shortOf(current) + (fullOf(current) ? ' — ' + fullOf(current) : '') : '—');
    work.innerHTML = `<div class="ft-toolbar">
        <div id="head" class="ft-head">
          <div class="ft-head-text">
            <h2 class="ft-title">${esc(title)}</h2>
            <div id="sourceInfo" class="ft-source-info"></div>
          </div>
          <div id="availability" class="ft-avail" role="img" hidden></div>
        </div>
        <div id="controls" class="ft-controls">
          <div class="ft-control-group" role="group" aria-labelledby="modeTitle">
            <span id="modeTitle" class="ft-control-title">Λειτουργία</span>
            <div class="ft-segmented">
              <button id="modeSafe" class="ui-toggle" type="button" data-mode="safe" title="Η μεταφορά επιτρέπεται μόνο χωρίς συγκρούσεις και μη διαθεσιμότητες">Ασφαλής</button><button id="modeFree" class="ui-toggle" type="button" data-mode="free" title="Η μεταφορά επιτρέπεται παντού">Ελεύθερη</button>
            </div>
          </div>
          <div class="ft-control-group" role="group" aria-labelledby="showTitle">
            <span id="showTitle" class="ft-control-title">Εμφάνιση</span>
            <div class="ft-segmented">
              <button id="showSubject" class="ui-toggle" type="button">Μάθημα</button>${view === 'classes' ? '<button id="showTeachers" class="ui-toggle" type="button">Εκπαιδευτικοί</button>' : ''}
            </div>
          </div>
          <span class="ft-controls-spring" aria-hidden="true"></span>
          <div class="ft-filters">
            <div class="ft-control-group">
              <label for="hourFilter" class="ft-control-title">Ώρες</label>
              <select id="hourFilter"><option value="all">Όλες</option><option value="morning">Πρωινό</option><option value="afternoon">Ολοήμερο</option></select>
            </div>${view === 'classes' ? `
            <div class="ft-control-group">
              <label for="teacherFilter" class="ft-control-title">Εκπαιδευτικοί</label>
              <select id="teacherFilter"><option value="all">Όλοι</option><option value="classroom">Δάσκαλοι</option><option value="specialties">Ειδικότητες</option></select>
            </div>` : ''}

      </div>
      <div id="gridWrap" class="ft-grid-wrap"></div>`;
    $('hourFilter').value = controlState.hourFilter;
    if ($('teacherFilter')) $('teacherFilter').value = controlState.teacherFilter;

    const refresh = id => { renderSide(); renderWorkspace(work); $(id)?.focus(); };
    for (const id of ['hourFilter', 'teacherFilter']) if ($(id)) $(id).onchange = () => { readControls(); refresh(id); };

      button.onclick = () => { if (controlState.mode === button.dataset.mode) return; controlState.mode = button.dataset.mode; refresh(button.id); };
    }
    const shows = [[$('showSubject'), 'subject', showSubject()], [$('showTeachers'), 'teachers', showTeachers()]].filter(([button]) => button);
    for (const [button, key, pressed] of shows) {

  function assignOps() {

    if (!draft || draft.periodId != null) throw Error('Το προσχέδιο του Ολοημέρου που θα ανατεθεί δεν υπάρχει πια στο αρχείο. Πάτησε «Αναίρεση» για να αφαιρεθεί η ανάθεση.');

  // ---- Εισαγωγή Ολοημέρου ----
  // The activities of a design of the Ολοήμερο Designer from the file (a period's design or a draft) are compared
  // one by one with the activities of the timetable that are wholly in hours of Ολοήμερο (Πρωινή Ζώνη, Γεύμα,
  // Ολοήμερο, Διευρυμένο): the same ones stay as they are, the others are removed, and those of the design that
  // are missing come in, with the subject, students, teachers, days and hours of the design. The analysis and
  // the checks are the shared ones of SchoolTimetable (analyzeOloimeroReplace / applyOloimeroReplace).
  // The design of the last import changed (or was deleted) after it: a note for the timetable.
  // → {text, designId} when the design changed (designId: the design to import again), {text, designId:null} when it
  // was deleted, or null. A design that is assigned with the next «Αποθήκευση» (assign.assignedId) is compared through
  // its draft, since it is not in the file yet.
  function oloimeroChange() {
    const last = program?.source?.oloimero;
    if (!last?.design) return null;
    const pending = assign && assign.assignedId === last.design;
    const design = oloimeroOf(pending ? assign.draftId : last.design);
    if (!design) return {text: 'Το σχέδιο Ολοημέρου ' + (last.name ? quoted(last.name) + ' ' : '') + 'της τελευταίας Εισαγωγής Ολοημέρου δεν υπάρχει πια στο αρχείο.', designId: null};
    if (design.updatedAt && last.at && design.updatedAt > last.at) return {text: 'Το σχέδιο ' + quoted(oloimeroName(design)) + ' άλλαξε στον Ολοήμερο Designer μετά την τελευταία Εισαγωγή Ολοημέρου (' + D.format(localDay(last.at)) + ').', designId: design.id};

  // What the import causes in the timetable, compared with it now: new conflicts, new times where a teacher is
  // not available in FET, and teachers whose hours go above «Ωράριο στο σχολείο». What existed before is left out.
  // The activities of the import get new ids, so a conflict is compared by who, when and the two subjects.
  function updateEffects(before, after) {
    const conflictKey = item => [item.type, item.who, item.day, item.start, ...[item.a.subject || '', item.b.subject || ''].sort()].join('|');
    const had = new Set(T.conflicts(before).map(conflictKey));
    const whoText = item => item.type === 'class' ? 'τμήμα ' + className(item.who) : (item.type === 'staff' ? shortOf(keyOfId(item.who)) : item.who);
    const conflicts = unique(T.conflicts(after).filter(item => !had.has(conflictKey(item)))
      .map(item => whoText(item) + ': ' + dayLabel(item.day) + ' ' + item.start + ' — ' + (item.a.subject || '—') + ' / ' + (item.b.subject || '—')));
    const offTimes = prog => {
      const result = new Set(), source = prog.source || {};
      const namesOf = key => key.startsWith('id:') ? (source.teachers || []).filter(teacher => teacher.staffId === key.slice(3)).map(teacher => teacher.name) : [key.slice(5)];
      for (const activity of prog.activities || []) for (const key of teacherKeys(activity)) {
        const names = namesOf(key);
        for (const time of activity.times || []) for (const off of source.unavailable || []) {
          if (names.includes(off.teacher) && off.day === time.day && time.start < off.end && off.start < time.end) result.add(shortOf(key) + ': ' + dayLabel(time.day) + ' ' + time.start + ' (' + (activity.subject || '—') + ')');
        }
      }
      return result;
    };
    const offBefore = offTimes(before), unavailable = [...offTimes(after)].filter(item => !offBefore.has(item));
    const others = countedPrograms().filter(item => item !== program);
    const hoursBefore = T.staffHours([before, ...others]), hoursAfter = T.staffHours([after, ...others]);
    const overHours = [];
    for (const [id, value] of hoursAfter) {
      const target = Number(staffById.get(id)?.schoolHours);
      if (!Number.isFinite(target) || staffById.get(id)?.schoolHours === '' || value <= target || value <= (hoursBefore.get(id) || 0)) continue;
      overHours.push(shortOf(keyOfId(id)) + ': ' + value + ' ώρες στο πρόγραμμα, ωράριο στο σχολείο ' + target);
    }
    return {conflicts, unavailable, overHours};
  }

  // «Να ανατεθεί το προσχέδιο στην περίοδο;» → the assignment ({draftId, assignedId, replace}), or null.

  async function askAssign(design, title) {

    const old = oloimeroDesigns().find(item => item.periodId === periodId && item.id !== design.id);

  // preferId: the design chosen at first (from the warning that it changed); otherwise the design of the last import,

    // The designs: first those of the periods (in the order of the periods), then the drafts by name.
    const periodDesigns = (context.periods || []).map(period => designs.find(item => item.periodId === period.id)).filter(Boolean);
    const drafts = designs.filter(item => item.periodId == null).sort((a, b) => byText(a.name, b.name));

    const lastDesign = assign && assign.assignedId === program.source?.oloimero?.design ? assign.draftId : program.source?.oloimero?.design;
    const preferred = (preferId && designs.find(item => item.id === preferId)) || designs.find(item => item.id === lastDesign) || designs.find(item => item.periodId === periodId);
    if (preferred) select.value = preferred.id;
    field.append(select);
    const content = ['Οι δραστηριότητες του ωρολογίου που είναι σε ώρες Ολοημέρου (Πρωινή Ζώνη, Γεύμα, Ολοήμερο, Διευρυμένο) συγκρίνονται μία προς μία με τις δραστηριότητες του σχεδίου του Ολοήμερου Designer. Όσες είναι ίδιες (μάθημα, τμήματα, εκπαιδευτικοί, ημέρα και ώρα) μένουν όπως είναι· οι υπόλοιπες αντικαθίστανται από του σχεδίου. Οι δραστηριότητες του ωρολογίου εκτός Ολοημέρου δεν αλλάζουν.', field];
    if (program.source?.oloimero?.at) content.push(el('p', 'ft-dialog-info', 'Τελευταία εισαγωγή: ' + (program.source.oloimero.name ? quoted(program.source.oloimero.name) + ', ' : '') + D.format(localDay(program.source.oloimero.at)) + '.'));
    const note = oloimeroChange();
    if (note) content.push(el('p', 'ft-dialog-warning', note.text));
    const chosen = await schoolChoiceDialog({
      title, content,
      actions: [{label: 'Ακύρωση'}, {label: 'Συνέχεια', accept: true, run: () => {
        const design = oloimeroOf(select.value);
        if (!design) throw Error('Επίλεξε σχέδιο.');
        const analysis = T.analyzeOloimeroReplace(program, design, {staff: context.staff, classes: yearClasses(), teachingHours: context.teachingHours, designName: oloimeroName(design)});
        if (!analysis.ok) throw Error(analysis.errors[0]);
        return {design, analysis};
      }}]
    });
    if (!chosen) return;
    const {design, analysis} = chosen, isDraft = design.periodId == null;
    const activities = count => count === 1 ? '1 δραστηριότητα' : count + ' δραστηριότητες';
    const {kept, removed, added} = analysis.counts;
    // The id the timetable keeps for the design: after the assignment of a draft, the new design of the period.
    const designIdFor = next => next?.assignedId || (isDraft && assign?.draftId === design.id ? assign.assignedId : design.id);
    if (analysis.unchanged) {
      // No activity changes, but the import is recorded (source.oloimero and the history), so the warning that the
      // design changed goes away with «Αποθήκευση».
      await message('Το σχέδιο ' + quoted(analysis.designName) + ' είναι ήδη στο ωρολόγιο: ' + (kept === 1 ? 'η δραστηριότητα Ολοημέρου του ωρολογίου είναι ίδια' : 'οι ' + kept + ' δραστηριότητες Ολοημέρου του ωρολογίου είναι ίδιες') + ' με του σχεδίου. Η εισαγωγή καταγράφεται στο Ιστορικό με την «Αποθήκευση».', title);
      const next = isDraft && assign?.draftId !== design.id ? await askAssign(design, title) : null;
      const recorded = T.applyOloimeroReplace(program, analysis, {designId: designIdFor(next), assigned: !!next});
      change(() => { program = recorded; if (next) assign = next; });
      notice('Εισαγωγή Ολοημέρου από το ' + quoted(analysis.designName) + ': καμία αλλαγή στις δραστηριότητες' + (next ? '· το προσχέδιο θα ανατεθεί στην περίοδο' : '') + '. Πάτησε «Αποθήκευση».');
      return;

    const problems = effects.conflicts.length + effects.unavailable.length + effects.overHours.length;
    const confirmContent = [el('p', '', 'Σύγκριση με το σχέδιο ' + quoted(analysis.designName) + ': ' + (kept === 1 ? '1 δραστηριότητα Ολοημέρου του ωρολογίου μένει ίδια' : kept + ' δραστηριότητες Ολοημέρου του ωρολογίου μένουν ίδιες') + '· ' +

      if (effects.unavailable.length) confirmContent.push(listSection('Ώρες μη διαθεσιμότητας στο FET', effects.unavailable));
      if (effects.overHours.length) confirmContent.push(listSection('Υπέρβαση ωραρίου', effects.overHours));
      confirmContent.push(el('p', 'ft-check-note', 'Αν συνεχίσεις, οι δραστηριότητες περνούν στο ωρολόγιο όπως είναι, σε οποιαδήποτε λειτουργία, και οι συγκρούσεις φαίνονται με κόκκινο. Για ωρολόγιο χωρίς συγκρούσεις, εξήγαγε το σχέδιο για το FET από τον Ολοήμερο Designer και δημιούργησε ξανά το ωρολόγιο στο FET.'));
    }
    const ok = await schoolChoiceDialog({
      title, content: confirmContent, className: 'ft-print-dialog',
      actions: [{label: 'Ακύρωση'}, {label: (problems ? 'Συνέχεια στην εισαγωγή' : 'Εισαγωγή') + (analysis.unmatchedTeachers.length ? ' χωρίς αντιστοίχιση' : ''), accept: true, value: true}]
    });
    if (!ok) return;
    const next = isDraft && assign?.draftId !== design.id ? await askAssign(design, title) : null;
    const final = designIdFor(next) === design.id ? updated : T.applyOloimeroReplace(program, analysis, {designId: designIdFor(next), assigned: !!next});
    change(() => { program = final; if (next) assign = next; });
    notice('Εισαγωγή Ολοημέρου από το ' + quoted(analysis.designName) + ': ' + kept + ' ίδιες, ' + (removed === 1 ? 'αφαιρέθηκε' : 'αφαιρέθηκαν') + ' ' + activities(removed) + ' του ωρολογίου και ' + (added === 1 ? 'μπήκε' : 'μπήκαν') + ' ' + activities(added) + ' του σχεδίου' + (next ? '· το προσχέδιο θα ανατεθεί στην περίοδο' : '') + '. Πάτησε «Αποθήκευση».' + (problems ? ' Το ωρολόγιο έχει πλέον συγκρούσεις ή προειδοποιήσεις από την εισαγωγή.' : ''), !!problems);
  }

  // A column of check boxes with preset buttons: items [{value, label, checked}], presets [{label, test(value)}].

    const box = el('section', 'ft-print-column'), actions = el('div', 'ft-print-presets'), list = el('div', 'subapp-check-list');
    box.append(el('h3', '', title), actions, list);

      const label = el('label'), input = el('input');

        const css = `@page{size:A4 landscape;margin:9mm}h1{font-size:17pt}.date{font-size:9pt}th,td{padding:4px 5px;font-size:8.5pt;line-height:1.08;vertical-align:top}thead th{font-size:10pt;vertical-align:middle}.hour{width:29mm;font-size:9pt;vertical-align:middle}.count{font-size:8pt;font-weight:700;margin-bottom:4px}.name{margin:0 0 3px}.note{margin:3mm 0 0;font-size:8.5pt}`;
        return openPrintWindow(printDocument('Διαθέσιμοι Εκπαιδευτικοί', css, '<div class="head"><div></div><div class="title"><h1>Διαθέσιμοι Εκπαιδευτικοί</h1></div><div class="date">Ισχύει από: ' + esc(effective) + '</div></div><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' + footnote));
      }}]
    });
  }
  function print() {
    if (busy || !program) return;
    const mode = $('printMode').value;
    if (mode === 'classes') printClasses();
    else if (mode === 'available') printAvailable();
    else printTeachers(mode);
  }

  // ---- Events ----
  $('save').onclick = save;
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  $('undoAll').onclick = undoAll;
  $('print').onclick = print;
  $('oloimero').onclick = () => importOloimero();
  $('tabClasses').onclick = () => { view = 'classes'; render(); };
  $('tabTeachers').onclick = () => { view = 'teachers'; render(); };
  $('search').addEventListener('input', renderSide);
  document.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey) || event.altKey || event.target.closest?.('input,select,textarea,dialog')) return;
    const keyName = String(event.key).toLowerCase();
    if (keyName === 'z' || keyName === 'ζ') { event.preventDefault(); event.shiftKey ? redo() : undo(); }
    else if (keyName === 'y' || keyName === 'υ') { event.preventDefault(); redo(); }
  });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  post({type: 'school-timetables:ready'});
})();
</script>
</body>
</html>
