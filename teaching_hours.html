   if(constraints)for(const n of [...constraints.children])if(n.tagName==='ConstraintBreakTimes'&&value(n,'Active')!=='false')n.remove();
   const dayList=child(root,'Days_List'),oldDays=elements(dayList,'Day');
   const dayMap=new Map(),usedDays=new Set();
   oldDays.forEach((node,index)=>{const old=value(node,'Name');let mapped=weekdayIndex(old);if(mapped<0)mapped=weekdayIndex(value(node,'Long_Name'));if(mapped<0&&oldDays.length<=5)mapped=index;if(mapped>=0){const target='D'+(mapped+1);if(usedDays.has(target))throw Error('Πολλές ημέρες του FET αντιστοιχούν στην '+weekdays[mapped][1]+'. Διόρθωσε πρώτα τις ημέρες του FET.');usedDays.add(target);dayMap.set(old,target)}});

   for(const n of references){const target=rename.get(n.textContent)||n.textContent;if(!finalNames.has(target))throw Error('Η ώρα «'+n.textContent+'» χρησιμοποιείται σε άλλον περιορισμό του FET. Διατήρησέ την ή διόρθωσε πρώτα τον περιορισμό στο FET.');n.textContent=target}
   const newList=make('Hours_List');newList.append(make('Number_of_Hours',String(data.hours.length)));
   for(const h of data.hours){const old=oldNodes.find(n=>value(n,'Name')===(h.fetName||h.name.trim())),node=old?old.cloneNode(true):make('Hour');set(node,'Name',h.name.trim());set(node,'Long_Name',h.longName||value(node,'Long_Name'));newList.append(node)}list.replaceWith(newList);

 function restoreFile(){const key=JSON.stringify([context.school.name,context.school.year]);if(key!==fileKey){fileKey=key;lastFile=null}restorePromise=fet('restore').then(result=>{if(fileKey===key)lastFile=result}).catch(()=>{});return restorePromise}
 function receiveContext(c){context=c;draft=M.normalize(c.teachingHours);selected=new Set(draft.hours.length?[draft.hours[0].id]:[]);anchor=draft.hours[0]?.id||null;render();restoreFile()}
 schoolHost.on('school-hours:context',m=>{if(!dirty&&!busy)receiveContext(m.context)});
 function render(){
  $('hoursSchoolYearValue').textContent=context.school.year;$('hoursSchoolYear').hidden=!context.school.year;
  root.innerHTML=`<div class="workspace"><section class="hours-pane subapp-list-pane"><div class="hours-heading subapp-pane-heading subapp-list-heading"><div><h3 id="count">Ώρες (${draft.hours.length})</h3><p class="ui-helper">Όρισε τις ώρες και τον χαρακτηρισμό τους. Οι ετικέτες FET υπολογίζονται αυτόματα.</p></div><div class="subapp-transfer-actions"><button id="importFet" title="Εισαγωγή ωρών από FET" aria-label="Εισαγωγή ωρών από FET">${schoolIcon('import')}</button></div></div><div class="subapp-list-row"><div id="hoursList" class="table-scroll subapp-table-frame" tabindex="0" role="region" aria-label="Πίνακας ωρών, πολλαπλή επιλογή"></div><div class="subapp-order-controls" role="group" aria-label="Αλλαγή σειράς ωρών"><button id="up" title="Μετακίνηση επιλογής πάνω" aria-label="Μετακίνηση επιλογής πάνω">${schoolIcon('up')}</button><button id="down" title="Μετακίνηση επιλογής κάτω" aria-label="Μετακίνηση επιλογής κάτω">${schoolIcon('down')}</button></div></div><div class="subapp-list-actions"><button id="add" class="subapp-add-button">${schoolIconText('plus','Προσθήκη')}</button><button id="remove" class="subapp-remove-button">Αφαίρεση</button></div><p id="notice" class="subapp-notice" role="status">Ctrl/Cmd+κλικ: πολλαπλή επιλογή · Shift+κλικ: εύρος · Ctrl/Cmd+A: όλες οι ώρες. Διπλό κλικ στο όνομα: επεξεργασία. Η επιλογή λειτουργεί και με ελληνικό πληκτρολόγιο.</p></section><section class="tags-pane subapp-side-pane"><div class="tags-heading subapp-pane-heading"><div><h3>Ετικέτες FET ημερών</h3><p class="ui-helper">Σταθερή ετικέτα για κάθε ημέρα.</p></div></div><div class="tags-content"><table class="tags-table subapp-data-table subapp-label-table day-tags-table" aria-label="Ετικέτες FET ημερών"><tbody>${M.weekdays.map(([key,label])=>`<tr><th scope="row">${label}</th><td>${esc(draft.dayTags[key])}</td></tr>`).join('')}</tbody></table><div class="category-tags-heading subapp-pane-heading"><div><h3>Ετικέτες FET ανά κατηγορία</h3><p class="ui-helper">Σταθερή κοινή ετικέτα για κάθε κατηγορία.</p></div></div><table class="tags-table subapp-data-table subapp-label-table category-tags-table"><tbody>${M.categories.map(([key,label])=>`<tr><th scope="row">${label}</th><td>${esc(draft.tags[key])}</td></tr>`).join('')}</tbody></table><p class="ui-helper">Στην «Εξαγωγή σε FET...» επιλέγεις ώρες, ετικέτες ή χρονικούς περιορισμούς ετικετών, σε οποιονδήποτε συνδυασμό.</p></div></section></div>`;
  renderRows();
  $('add').onclick=()=>{const h={id:crypto.randomUUID(),name:'',category:'morning',fetTag:''};draft.hours.push(h);selected=new Set([h.id]);anchor=h.id;M.updateTags(draft);mark();renderRows();const input=$('hoursList').querySelector(`[data-id="${h.id}"] input`);if(input){input.readOnly=false;input.focus()}input?.scrollIntoView({block:'nearest'})};
  $('remove').onclick=async()=>{if(!selected.size)return;if(!await schoolConfirm('Να αφαιρεθούν οι '+selected.size+' επιλεγμένες ώρες;', {title:'Αφαίρεση ωρών',accept:'Αφαίρεση'}))return;const first=draft.hours.findIndex(h=>selected.has(h.id));draft.hours=draft.hours.filter(h=>!selected.has(h.id));const h=draft.hours[Math.min(first,draft.hours.length-1)];selected=new Set(h?[h.id]:[]);anchor=h?.id||null;M.updateTags(draft);mark();renderRows()};
  $('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);
  $('hoursList').addEventListener('keydown',event=>{const input=event.target.closest('input:not([readonly]),textarea,select,[contenteditable="true"]');if(input)return;
   if((event.key==='ArrowUp'||event.key==='ArrowDown')&&!event.ctrlKey&&!event.metaKey&&!event.altKey){
    if(!draft.hours.length)return;event.preventDefault();
    ({selected,anchor}=Selection.step(order(),selected,anchor,event.key==='ArrowDown'?1:-1));paintSelection();$('hoursList').focus({preventScroll:true});
    [...$('hoursList').querySelectorAll('tr[data-id]')].find(row=>row.dataset.id===anchor)?.scrollIntoView({block:'nearest'});return;
   }
   if(Selection.isSelectAll(event)){event.preventDefault();selected=new Set(order());anchor=draft.hours[0]?.id||null;paintSelection()}});
  $('importFet').onclick=()=>transferFet('import');$('exportFet').onclick=()=>transferFet('export');buttons();
 }
 function paintSelection(){root.querySelectorAll('tr[data-id]').forEach(row=>{const active=selected.has(row.dataset.id);row.classList.toggle('selected',active);row.classList.toggle('break-row',draft.hours.find(h=>h.id===row.dataset.id)?.category==='break');row.setAttribute('aria-selected',String(active))});buttons()}
 function renderRows(){const list=$('hoursList');$('count').textContent='Ώρες ('+draft.hours.length+')';
  if(!draft.hours.length){const years=Object.keys(context.teachingHoursByYear||{}).filter(year=>year<context.school.year&&context.teachingHoursByYear[year]?.hours?.length).sort().reverse();list.innerHTML=`<div class="subapp-empty subapp-empty-stack"><p>Δεν έχουν καταχωριστεί ώρες.<br>Πάτησε «Προσθήκη» ή κάνε εισαγωγή από FET.</p>${years.length?`<label for="sourceYear">Εισαγωγή από παλαιότερο σχολικό έτος</label><select id="sourceYear">${years.map(year=>`<option value="${esc(year)}">${esc(year)} (${context.teachingHoursByYear[year].hours.length} ώρες)</option>`).join('')}</select><button id="importYear" class="primary">Εισαγωγή ωρών</button>`:''}</div>`;if($('importYear'))$('importYear').onclick=()=>{const year=$('sourceYear').value;draft=M.normalize(context.teachingHoursByYear[year]);draft.hours=draft.hours.map(h=>({...h,id:crypto.randomUUID()}));selected=new Set(draft.hours.length?[draft.hours[0].id]:[]);anchor=draft.hours[0]?.id;mark();render();notice('Εισήχθησαν οι ώρες και οι ετικέτες του '+year+'. Πάτησε «Αποθήκευση».')};buttons();return}
  list.innerHTML=`<table class="hours-table subapp-data-table subapp-editable-table" aria-multiselectable="true"><thead><tr><th scope="col">#</th><th scope="col">Ώρα / χρονικό διάστημα</th><th scope="col">Χαρακτηρισμός</th><th scope="col">Ετικέτα FET</th></tr></thead><tbody>${draft.hours.map((h,i)=>`<tr data-id="${esc(h.id)}" tabindex="-1"><td>${i+1}</td><td><input readonly value="${esc(h.name)}" maxlength="1000" placeholder="π.χ. 08:15–09:00" aria-label="Όνομα ώρας ${i+1}"></td><td><select aria-label="Χαρακτηρισμός ώρας ${i+1}"><option value="">— Επίλεξε —</option>${M.categories.map(([key,label])=>`<option value="${key}" ${h.category===key?'selected':''}>${label}</option>`).join('')}</select></td><td><span class="hour-fet-tag">${esc(h.fetTag||'')}</span></td></tr>`).join('')}</tbody></table>`;
  list.querySelectorAll('tr[data-id]').forEach(row=>{const id=row.dataset.id,h=draft.hours.find(x=>x.id===id);row.onclick=event=>{const modified=event.ctrlKey||event.metaKey||event.shiftKey,inField=!!event.target.closest('input,select');if(modified||!(inField&&selected.has(id)))({selected,anchor}=Selection.click(order(),selected,anchor,id,event));if(modified||!inField)list.focus({preventScroll:true});paintSelection()};const nameInput=row.querySelector('input');let originalName=h.name;
  const editName=()=>{originalName=h.name;nameInput.readOnly=false;nameInput.focus();nameInput.select()};
  row.ondblclick=event=>{if(!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&event.target.closest('td')===nameInput.parentElement)editName()};
  nameInput.onclick=event=>{if(!nameInput.readOnly)event.stopPropagation()};
  nameInput.oninput=event=>{h.name=event.target.value;mark()};
  nameInput.onblur=()=>{nameInput.readOnly=true};
  nameInput.onkeydown=event=>{if(nameInput.readOnly)return;if(event.key==='Enter'){event.preventDefault();nameInput.blur();list.focus()}else if(event.key==='Escape'){event.preventDefault();event.stopPropagation();h.name=originalName;nameInput.value=originalName;nameInput.blur();list.focus()}};
  row.querySelector('select').onchange=event=>{
   h.category=event.target.value;M.updateTags(draft);
   list.querySelectorAll('tr[data-id]').forEach(item=>{const hour=draft.hours.find(x=>x.id===item.dataset.id);item.querySelector('.hour-fet-tag').textContent=hour?.fetTag||''});
   mark();paintSelection()}});paintSelection();
 }
 function move(direction){const rows=draft.hours;if(!selected.size)return;if(direction<0){if(selected.has(rows[0]?.id))return;for(let i=1;i<rows.length;i++)if(selected.has(rows[i].id)&&!selected.has(rows[i-1].id))[rows[i-1],rows[i]]=[rows[i],rows[i-1]]}else{if(selected.has(rows.at(-1)?.id))return;for(let i=rows.length-2;i>=0;i--)if(selected.has(rows[i].id)&&!selected.has(rows[i+1].id))[rows[i+1],rows[i]]=[rows[i],rows[i+1]]}M.updateTags(draft);mark();renderRows();$('hoursList').focus();$('hoursList').querySelector('tr.selected')?.scrollIntoView({block:'nearest'})}
 $('save').onclick=async()=>{try{
  M.updateTags(draft);M.validate(draft);setBusy(true);
  const saved=structuredClone(draft);
  saved.hours.forEach(h=>{h.name=h.name.trim();h.fetTag=(h.fetTag||'').trim()});
  for(const k in saved.tags)saved.tags[k]=saved.tags[k].trim();
  for(const k in saved.dayTags)saved.dayTags[k]=saved.dayTags[k].trim();
  const c=await schoolHost.request('school-hours:save',{revision:context.revision,year:context.school.year,teachingHours:saved});
  context=c;
  // Keep the existing rows and input handlers alive; only update normalized, saved values.
  const confirmed=M.normalize(c.teachingHours),byId=new Map(confirmed.hours.map(h=>[h.id,h]));
  for(const h of draft.hours){const current=byId.get(h.id);if(current)Object.assign(h,current)}
  Object.assign(draft.tags,confirmed.tags);Object.assign(draft.dayTags,confirmed.dayTags);
  $('hoursList').querySelectorAll('tr[data-id]').forEach(row=>{
   const h=draft.hours.find(item=>item.id===row.dataset.id);if(!h)return;
   const name=row.querySelector('input'),tag=row.querySelector('.hour-fet-tag');
   if(name)name.value=h.name;if(tag)tag.textContent=h.fetTag||'';
  });
  
  
  mark(false);
  notice('Οι ώρες και οι ετικέτες αποθηκεύτηκαν στο κοινό αρχείο .data.');
  const focus=findLastField();if(focus&&!focus.disabled)focus.focus({preventScroll:true});
 }catch(e){notice(e.message,true)}finally{setBusy(false)}};
 $('undo').onclick=async()=>{
  if(dirty&&!await schoolConfirm('Να απορριφθούν οι αλλαγές των ωρών και των ετικετών που δεν αποθηκεύτηκαν;', {title:'Μη αποθηκευμένες αλλαγές',accept:'Απόρριψη αλλαγών'}))return;
  const list=$('hoursList'),scrollTop=list.scrollTop,scrollLeft=list.scrollLeft;
  const tags=$('root').querySelector('.tags-content'),tagsScroll=tags?.scrollTop||0;
  const pageScroll=root.scrollTop,previousIds=order(),previousAnchor=anchor;
  const previousSelection=new Set(selected),saved=M.normalize(context.teachingHours);
  const savedIds=new Set(saved.hours.map(h=>h.id));
  const keptRows=new Map(draft.hours.map(h=>[h.id,h]));
  draft.hours=saved.hours.map(h=>{const old=keptRows.get(h.id);if(old){Object.keys(old).forEach(key=>delete old[key]);Object.assign(old,h);return old}return h});
  Object.assign(draft.tags,saved.tags);Object.assign(draft.dayTags,saved.dayTags);
  selected=new Set([...previousSelection].filter(id=>savedIds.has(id)));
  const lostActive=!!previousAnchor&&!savedIds.has(previousAnchor);
  if(!selected.size&&saved.hours.length){
   const oldIndex=previousIds.indexOf(previousAnchor);
   const fallback=saved.hours[Math.min(Math.max(oldIndex,0),saved.hours.length-1)];
   selected.add(fallback.id);
  }
  anchor=savedIds.has(previousAnchor)?previousAnchor:(saved.hours.find(h=>selected.has(h.id))?.id||null);
  mark(false);renderRows();
  
  
  list.scrollTop=scrollTop;list.scrollLeft=scrollLeft;
  if(tags)tags.scrollTop=tagsScroll;root.scrollTop=pageScroll;
  const focus=findLastField();
  if(focus&&!focus.disabled)focus.focus({preventScroll:true});
  else if(lostActive&&anchor)list.querySelector(`tr[data-id="${anchor}"]`)?.focus({preventScroll:true});
  if(lostActive&&anchor)list.querySelector(`tr[data-id="${anchor}"]`)?.scrollIntoView({block:'nearest'});
  notice('Οι μη αποθηκευμένες αλλαγές απορρίφθηκαν.');
 };
 // FET file choice: the last file of this school year or another one from the disk (shared dialog: schoolChoiceDialog).
 function fileDialog(mode){
  let exportFieldset=null;
  if(mode==='export'){exportFieldset=document.createElement('fieldset');exportFieldset.className='subapp-import-mode';exportFieldset.innerHTML='<legend>Τι θέλεις να εξαγάγεις;</legend><label><input type="checkbox" name="export-hours" checked> Ώρες / Ημέρες</label><label><input type="checkbox" name="export-tags" checked> Ετικέτες</label><label><input type="checkbox" name="export-constraints"> Χρονικοί περιορισμοί ετικετών</label>'}
  const choose=async existing=>{
   const checked=name=>exportFieldset?exportFieldset.querySelector(`[name=${name}]`).checked:name!=='export-constraints';
   const exportOptions={hours:checked('export-hours'),tags:checked('export-tags'),constraints:checked('export-constraints')};
   if(mode==='export'&&!Object.values(exportOptions).some(Boolean))throw Error('Επίλεξε τουλάχιστον ένα στοιχείο για εξαγωγή.');
   if(!existing)lastFile=await fet('choose');
   return {...lastFile,exportOptions};
  };
  return schoolChoiceDialog({
   title:mode==='import'?'Εισαγωγή ωρών από FET':'Εξαγωγή σε FET',
   content:[mode==='import'?'Θα διαβαστούν οι ώρες και οι κατηγορίες τους με βάση τις σταθερές ετικέτες FET. Ο πίνακας θα αντικατασταθεί μετά την επιβεβαίωση.':'Επίλεξε τι θα εξαχθεί και ποιο αρχείο FET θα ενημερωθεί. Η επιλογή «Ώρες / Ημέρες» ορίζει τις ημέρες D1–D5, με πλήρη ονόματα Δευτέρα–Παρασκευή. Οι περιορισμοί αφορούν ημέρες, κατηγορίες και μεμονωμένες ώρες, με βάρος 100%.',exportFieldset],
   choices:[{label:lastFile?'Τελευταίο αρχείο: '+lastFile.name:'Δεν υπάρχει τελευταίο αρχείο FET',disabled:!lastFile,run:()=>choose(true)},{label:'Επιλογή άλλου αρχείου FET από τον δίσκο…',run:()=>choose(false)}]
  });
 }
 async function transferFet(mode){if(busy)return;if(mode==='export'&&dirty){notice('Πάτησε πρώτα «Αποθήκευση» για να αποθηκευτούν οι αλλαγές.',true);return}
  try{if(mode==='export')M.validate(draft);else M.validate({hours:[],tags:draft.tags});await restorePromise;const chosen=await fileDialog(mode);if(!chosen)return;setBusy(true);const permission=await fet('permission',{mode:mode==='import'?'read':'readwrite'});if(permission!=='granted')throw Error('Δεν δόθηκε άδεια πρόσβασης στο FET.');const file=await fet('read');
   if(mode==='import'){const plan=M.importFet(file.text,draft.tags,draft.hours);if(!await schoolConfirm('Θα εισαχθούν '+plan.hours.length+' ώρες από το «'+file.name+'» και θα αντικατασταθεί ο τρέχων πίνακας.'+(plan.unknown?'\n\n'+plan.unknown+' ώρες χρειάζονται επιλογή χαρακτηρισμού.':'')+'\n\nΝα συνεχίσω;', {title:'Εισαγωγή ωρών',accept:'Εισαγωγή'}))return;draft.hours=plan.hours;M.updateTags(draft);selected=new Set(draft.hours.length?[draft.hours[0].id]:[]);anchor=draft.hours[0]?.id;mark();renderRows();notice('Εισήχθησαν '+plan.hours.length+' ώρες. '+(plan.unknown?'Χαρακτήρισε τις '+plan.unknown+' ώρες χωρίς κατηγορία. ':'')+'Πάτησε «Αποθήκευση».',!!plan.unknown)}
   else{const plan=M.exportFet(file.text,draft,chosen.exportOptions);if(!await schoolConfirm('Ενημέρωση του «'+file.name+'»\n\n'+(plan.options.hours?'Ημέρες: D1–D5 (Δευτέρα–Παρασκευή).\nΏρες: '+draft.hours.length+' (νέες: '+plan.added+', μετονομασίες: '+plan.renamed+', αφαιρέσεις: '+plan.removed+'). Τα ενεργά διαλείμματα θα ενημερωθούν.\n':'')+(plan.options.tags?'Νέες ετικέτες: '+plan.tagCount+'\n':'')+(plan.options.constraints?'Χρονικοί περιορισμοί ετικετών: '+plan.ruleCount+' (παλαιότεροι αυτόματοι που αντικαθίστανται: '+plan.replacedRules+').\n':'')+'\nΝα συνεχίσω;', {title:'Ενημέρωση FET',accept:'Ενημέρωση'}))return;await fet('write',{text:plan.text});notice('Το αρχείο FET ενημερώθηκε με τις επιλεγμένες εξαγωγές.')}
  }catch(e){notice(e.message,true)}finally{setBusy(false)}
 }
 post({type:'school-hours:ready'});
})();
</script></body></html>
