function printDialog(){printMode='month';const current=dateKey(selectedDate),monthValue=`${String(displayed.getMonth()+1).padStart(2,'0')}/${displayed.getFullYear()}`;modal('Επιλογές εκτύπωσης',`<div class="print-options"><div class="field"><span class="field-title">Περίοδος</span><div class="choice-row"><label><input type="radio" name="period" value="day"> Ημέρα</label><label><input type="radio" name="period" value="week"> Εβδομάδα</label><label><input type="radio" name="period" value="month" checked> Μήνας</label><label><input type="radio" name="period" value="custom"> Προσαρμοσμένο</label></div></div><div id="dayChoice" class="field"><label for="printDay">Ημερομηνία</label><input id="printDay" type="date" value="${current}"></div><div id="weekChoice" class="field hidden"><label for="printWeekDate">Επίλεξε μία ημέρα της εβδομάδας</label><input id="printWeekDate" type="date" value="${current}"><div class="helper">Θα εκτυπωθεί η εβδομάδα Δευτέρα–Παρασκευή που περιλαμβάνει την ημερομηνία.</div><div class="helper" id="weekText"></div></div><div id="monthChoice" class="field hidden"><label for="printMonth">Μήνας (MM/YYYY)</label><input id="printMonth" type="text" inputmode="numeric" placeholder="10/2026" pattern="(0[1-9]|1[0-2])/[0-9]{4}" value="${monthValue}"></div><div id="customChoice" class="field hidden"><label>Εύρος ημερομηνιών</label><div class="print-range"><input id="rangeFrom" type="date" value="${current}" aria-label="Από"><span class="date-range-dash">—</span><input id="rangeTo" type="date" value="${current}" aria-label="Έως"></div></div><div class="field"><span class="field-title">Περιεχόμενο</span><div class="choice-row"><label><input type="checkbox" id="printPersonal"> Προσωπικές σημειώσεις</label><label><input type="checkbox" id="printSchool" checked> Σχολικό Ημερολόγιο</label></div><small>Η αρχική επιλογή εκτυπώνει μόνο τις εγγραφές του σχολικού ημερολογίου.</small></div><div id="printError" class="helper danger"></div></div>`,`<button id="cancelModal">Ακύρωση</button><button id="doPrint" class="primary">Προεπισκόπηση / Εκτύπωση</button>`);
 const update=()=>{printMode=document.querySelector('input[name="period"]:checked').value;['day','week','month','custom'].forEach(x=>$(`${x}Choice`).classList.toggle('hidden',x!==printMode));updateWeekText()};document.querySelectorAll('input[name="period"]').forEach(r=>r.addEventListener('change',update));$('printDay').addEventListener('change',updateWeekText);$('printWeekDate').addEventListener('change',updateWeekText);updateWeekText();$('cancelModal').onclick=()=>overlayRoot.innerHTML='';$('doPrint').onclick=()=>{if(!$('printSchool').checked&&!$('printPersonal').checked){$('printError').textContent='Επίλεξε τουλάχιστον ένα είδος περιεχομένου.';return}try{const range=getPrintRange(),includeSchool=$('printSchool').checked,includePersonal=$('printPersonal').checked;overlayRoot.innerHTML='';preparePrint(range,includeSchool,includePersonal)}catch(e){$('printError').textContent=e.message}};
}
function updateWeekText(){const el=$('weekText');if(!el)return;const v=$('printWeekDate').value||dateKey(selectedDate),d=fromKey(v),monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));const friday=new Date(monday);friday.setDate(monday.getDate()+4);el.textContent=`${formatDate(monday)} – ${formatDate(friday)}`}
function formatDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function getPrintRange(){let start,end;if(printMode==='day'){if(!$('printDay').value)throw Error('Επίλεξε ημερομηνία.');start=end=fromKey($('printDay').value)}else if(printMode==='week'){if(!$('printWeekDate').value)throw Error('Επίλεξε ημερομηνία της εβδομάδας.');start=fromKey($('printWeekDate').value);start.setDate(start.getDate()-((start.getDay()+6)%7));end=new Date(start);end.setDate(end.getDate()+4)}else if(printMode==='month'){const match=$('printMonth').value.trim().match(/^(0[1-9]|1[0-2])\/(\d{4})$/);if(!match)throw Error('Γράψε τον μήνα ως MM/YYYY, π.χ. 10/2026.');const m=Number(match[1]),y=Number(match[2]);start=new Date(y,m-1,1,12);end=new Date(y,m,0,12)}else{if(!$('rangeFrom').value||!$('rangeTo').value)throw Error('Επίλεξε ημερομηνίες έναρξης και λήξης.');start=fromKey($('rangeFrom').value);end=fromKey($('rangeTo').value);if(start>end)throw Error('Η ημερομηνία «Από» πρέπει να προηγείται της ημερομηνίας «Έως».')}return {start,end}}
function paginatePrint(out){const items=[...out.querySelectorAll(':scope > .print-item')];if(!items.length)return;const oldStyle=out.getAttribute('style');Object.assign(out.style,{position:'fixed',left:'-200vw',top:'0',width:'174mm',visibility:'hidden',display:'block'});out.innerHTML='';const pages=[];let page=null,body=null;const newPage=()=>{page=document.createElement('section');page.className='print-page';body=document.createElement('div');body.className='print-page-body';page.append(body);out.append(page);pages.push(page)};newPage();for(const item of items){item.style.marginBottom='14px';body.append(item);if(body.children.length>1&&body.scrollHeight>body.clientHeight){body.removeChild(item);newPage();body.append(item)}}pages.forEach((pg,i)=>{const footer=document.createElement('div');footer.className='print-page-footer';footer.textContent=`${i+1}/${pages.length}`;pg.append(footer)});if(oldStyle===null)out.removeAttribute('style');else out.setAttribute('style',oldStyle)}
function preparePrint(range,school,personal){const out=$('printRoot');out.innerHTML='';out.classList.remove('hidden');for(let d=new Date(range.start);d<=range.end;d.setDate(d.getDate()+1)){const k=dateKey(d),e=getEntry(k),p=personal?e.personal:'',s=school?e.school:'';const hasP=hasHtml(p),hasS=hasHtml(s);if(!hasP&&!hasS)continue;const item=document.createElement('article');item.className='print-item';const dt=document.createElement('div');dt.className='print-date single-content-date';dt.textContent=`${DAYS[(d.getDay()+6)%7]} ${formatDate(d)}`;const makeHeadingRow=(label,labelClass='')=>{const row=document.createElement('div');row.className='print-heading-row single-content-heading';const title=document.createElement('div');title.className='print-heading-label '+labelClass;title.textContent=label;row.append(title,dt);return row};const addPersonal=(panel=null)=>{if(!hasP)return;const heading=document.createElement('div');heading.className='print-label notes-after-school';heading.textContent='Σημειώσεις';const div=document.createElement('div');div.className='print-body';div.innerHTML=sanitizeHtml(p);if(panel){const dividerBefore=document.createElement('div');dividerBefore.className='notes-divider before-notes';const dividerAfter=document.createElement('div');dividerAfter.className='notes-divider';panel.append(dividerBefore,heading,dividerAfter,div);return}const personalPanel=document.createElement('div');personalPanel.className='school-panel print-first single-content-panel';personalPanel.append(makeHeadingRow('Σημειώσεις'));personalPanel.append(div);item.append(personalPanel)};const addSchool=()=>{const schoolBlock=document.createElement('div');schoolBlock.className='school-panel print-first single-content-panel'+(personal?' combined-school-panel':'');schoolBlock.append(makeHeadingRow('Σχολικό Ημερολόγιο','school-heading'));const div=document.createElement('div');div.className='print-body school-entry-body';div.innerHTML=sanitizeHtml(s);schoolBlock.append(div);item.append(schoolBlock);return schoolBlock};if(school&&hasS){const panel=addSchool();if(personal&&hasP)addPersonal(panel)}else if(hasP){addPersonal()}out.append(item)}if(!out.children.length){const empty=document.createElement('p');empty.textContent='Δεν υπάρχουν καταχωρίσεις για τις επιλεγμένες ημερομηνίες και το επιλεγμένο περιεχόμενο.';out.append(empty)}paginatePrint(out);document.body.classList.add('printing');requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>touch()));document.addEventListener('click',e=>{const b=e.target.closest('[data-toggle-password]');if(!b)return;const input=$(b.dataset.togglePassword);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';b.innerHTML=eyeIcon(!show);b.setAttribute('aria-label',show?'Απόκρυψη κωδικού':'Εμφάνιση κωδικού');b.title=show?'Απόκρυψη κωδικού':'Εμφάνιση κωδικού'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('genericOverlay')?.dataset.cancelOnly==='true'){e.preventDefault();overlayRoot.innerHTML=''}touch()});['pointerdown','keydown','touchstart','mousemove'].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));
$('newBtn').onclick=requestNew;$('staffBtn').onclick=openStaffManager;$('initialBtn').onclick=restoreInitial;$('openBtn').onclick=openFilePicker;$('saveBtn').onclick=save;$('printBtn').onclick=printDialog;$('changePasswordBtn').onclick=changePassword;$('lockBtn').onclick=lock;
$('prevMonth').onclick=()=>changeDisplayedMonth(-1);$('nextMonth').onclick=()=>changeDisplayedMonth(1);$('yearBtn').onclick=chooseYear;$('schoolYearBtn').onclick=chooseSchoolYear;$('monthViewBtn').onclick=()=>setView('month');$('yearViewBtn').onclick=()=>setView('year');window.addEventListener('resize',()=>{if(currentView==='year')renderYear()});
 $('zoomLabel').onclick=()=>{if(zoom!==100){zoom=100;data.settings.zoom=zoom;setDirty();document.documentElement.style.setProperty('--scale','1');$('zoomLabel').textContent='100%'}touch()};$('zoomOut').onclick=()=>{zoom=Math.max(70,zoom-10);data.settings.zoom=zoom;setDirty();document.documentElement.style.setProperty('--scale',zoom/100);$('zoomLabel').textContent=zoom+'%';touch()};$('zoomIn').onclick=()=>{zoom=Math.min(150,zoom+10);data.settings.zoom=zoom;setDirty();document.documentElement.style.setProperty('--scale',zoom/100);$('zoomLabel').textContent=zoom+'%';touch()};
function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function requestOpenFile(file){const doOpen=async()=>{overlayRoot.innerHTML='';let source=null;try{source=JSON.parse(await file.text())}catch{}if(source?.app==='SchoolCalendar'&&source.encryption==='none'){try{await loadFile(file,'');overlayRoot.innerHTML=''}catch(err){modal('Αδυναμία ανοίγματος',`<p>${escapeHtml(err.message)}</p>`,`<button id="closeOpenError" class="primary">Εντάξει</button>`);$('closeOpenError').onclick=()=>overlayRoot.innerHTML=''}return}modal('Άνοιγμα ημερολογίου',`<p>Αρχείο: <b>${escapeHtml(file.name)}</b></p>${passwordField('openPass','Κωδικός','current-password')}<div id="modalError" class="helper danger"></div>`,`<button id="cancelModal">Ακύρωση</button><button id="openCal" class="primary">Άνοιγμα</button>`);$('cancelModal').onclick=()=>overlayRoot.innerHTML='';$('openCal').onclick=async()=>{try{await loadFile(file,$('openPass').value);overlayRoot.innerHTML=''}catch(err){$('modalError').textContent=err.message;$('openPass').value='';$('openPass').focus()}};$('openPass').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('openCal').click()})};if(changed){modal('Μη αποθηκευμένες αλλαγές',`<p>Αν ανοίξεις άλλο αρχείο, οι αλλαγές που δεν έχουν αποθηκευτεί θα χαθούν.</p>`,`<button id="stay">Παραμονή</button><button id="discardOpen" class="primary">Συνέχεια</button>`);$('stay').onclick=()=>overlayRoot.innerHTML='';$('discardOpen').onclick=doOpen}else doOpen()}
$('fileInput').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(file)requestOpenFile(file)});
window.addEventListener('beforeprint',()=>document.body.classList.add('printing'));window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');$('printRoot').innerHTML='';$('printRoot').classList.add('hidden');touch()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')touch()});
window.addEventListener('beforeunload',e=>{if(changed){e.preventDefault();e.returnValue=''}});
startup();
})();
