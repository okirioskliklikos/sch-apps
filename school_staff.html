<!doctype html><html lang="el" class="subapp-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Προσωπικό σχολείου</title><link rel="stylesheet" href="_ui.css">
<link rel="stylesheet" href="_subapp.css">
<style>

/* Personnel-specific layout. Shared appearance: _ui.css and _subapp.css. */
/* --staff-* : colours whose meaning exists only in this list (director, newly added rows). */
:root{--app-mark-bg:var(--school-app-staff);--staff-lead-text:#c32222;--staff-added-text:#2467c8}
.staff-manager{display:grid;grid-template-columns:minmax(280px,.65fr) minmax(420px,1.35fr);grid-template-rows:minmax(0,1fr);gap:24px;flex:1;min-height:440px;height:calc(100dvh - 97px);overflow:hidden}
.staff-list-pane{display:flex;flex-direction:column;min-width:0;min-height:0;max-height:100%;overflow:hidden;container-type:inline-size;container-name:staff-list}
.staff-list{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-gutter:stable;overscroll-behavior:contain}
.staff-list-item.lead{color:var(--staff-lead-text);font-weight:700}
.staff-list-item.import-added,.staff-list-item.manual-added{color:var(--staff-added-text);font-style:italic}
.staff-list-item.import-updated,.staff-list-item.manual-updated{font-style:italic}
/* List row: the name, and on the right the class the person is homeroom teacher of. */
.staff-list-item{display:flex;align-items:baseline;gap:10px}
.staff-list-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.staff-list-homeroom{flex:none;font-size:12px;font-weight:650;font-style:normal;color:var(--school-ui-muted);font-variant-numeric:tabular-nums}
.staff-list-item.selected .staff-list-homeroom{color:var(--school-ui-label-text)}
.staff-limit-warning{flex:none;margin-top:8px}
/* Delete dialog: each person with the programs they appear in. */
.staff-removal-list{margin:12px 0 0;padding-left:20px}
.staff-removal-list>li+li{margin-top:8px}
.staff-removal-list ul{margin:2px 0 0;padding-left:18px;font-size:14px;color:var(--school-ui-label-text)}
.staff-removal-note{margin-top:12px!important;font-size:14px;color:var(--school-ui-muted)}
.staff-details{padding-right:2px;container-type:inline-size}
.staff-details .field:first-of-type{margin-top:2px}
.staff-service-dates{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.staff-leaves-field{margin-top:14px}
.staff-leaves{display:grid;gap:6px}
.staff-leave-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 160px 34px;gap:8px;align-items:end}
.staff-leave-date{display:grid;gap:4px;font-size:13px;font-weight:600}
.staff-leave-date input{width:100%;min-width:0}
.staff-leave-approval{display:grid;gap:4px;min-width:0;font-size:13px;font-weight:600}
.staff-leave-status{width:100%}
.staff-leave-remove{width:34px;height:36px;padding:0;font-size:20px;line-height:1}
.staff-leave-add{justify-self:start}
.staff-code-value{min-width:0}
.staff-import-empty{height:auto;min-height:100%}
/* «Υπεύθυνος τμήματος» is unavailable for service types other than Δάσκαλος and Ειδικότητα. */
.staff-fields input:disabled{background:var(--school-ui-disabled-bg);color:var(--school-ui-disabled-text);opacity:1;cursor:default}
@container (min-width:620px){
  .staff-fields>.field,.staff-fields .staff-service-dates>.field{display:grid;grid-template-columns:215px minmax(0,1fr);align-items:center;gap:0 18px;margin:0!important;padding:12px 16px}
  .staff-fields .field>label{padding-right:12px}
  .staff-fields .field>input,.staff-fields .field>select{grid-column:2}
  .staff-fields .staff-service-dates{display:block}
  .staff-fields>.staff-leaves-field{align-items:start;border-bottom:0;row-gap:10px}
  .staff-fields .staff-leaves-field>label{grid-column:1;grid-row:1 / span 3;padding-top:8px}
  .staff-fields .staff-leaves-field>:not(label){grid-column:2}
  .staff-fields .staff-leaves-field .helper{line-height:1.5}
  .staff-fields .staff-leave-date,.staff-fields .staff-leave-approval{font-weight:600;font-size:12px}
  .staff-fields .staff-leave-add{margin:0}
  .staff-code-value{grid-column:2}
  .staff-fields .field:has(>.staff-code-value)>label{grid-column:1;grid-row:1;align-self:center}
  .staff-fields .staff-code-value{display:contents}
  .staff-fields .staff-code-value>input{grid-column:2;grid-row:1}
  .staff-fields .staff-code-value>.staff-code-error{grid-column:2;grid-row:2}
}
@media(min-width:651px){
  .staff-manager{height:auto;min-height:0}
  .staff-list-pane{height:100%}
  .staff-details{min-height:0}
}
@media(max-width:650px){
  .staff-manager{grid-template-columns:1fr;grid-template-rows:auto auto;gap:12px;height:auto;min-height:0;overflow:visible;--subapp-stacked:1}
  .staff-list-pane{height:calc(100dvh - var(--subapp-header-height,110px) - 32px);min-height:220px;max-height:none}
  .staff-service-dates{grid-template-columns:1fr;gap:0}
  .staff-details{overflow:visible}
}
/* CSV mapping: side-by-side source and target, stacked on narrow viewports. */
.staff-csv-mapping-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:center}
.staff-csv-mapping-row>span{overflow-wrap:anywhere;min-width:0}
.staff-csv-mapping-row>select{width:100%;min-width:0}
@media(max-width:600px){.staff-csv-mapping-row{grid-template-columns:minmax(0,1fr);gap:5px}.staff-csv-mapping-header{display:none}}
.staff-list-header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(66px,1fr);align-items:center;gap:12px;margin-bottom:9px;flex:none}
.staff-list-header .staff-list-top,.staff-list-header .staff-list-heading{display:contents}
.staff-list-header .staff-title-group{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.staff-list-header #staffListTitle{margin:0;line-height:1.25}
.staff-list-header .staff-view-buttons{grid-column:2;grid-row:1;justify-self:center}
.staff-list-header .subapp-transfer-actions{grid-column:3;grid-row:1;justify-self:end}
@container staff-list (max-width:520px){.staff-list-header{grid-template-columns:minmax(0,1fr) auto;gap:8px}.staff-list-header .subapp-transfer-actions{grid-column:2}.staff-list-header .staff-view-buttons{grid-column:1 / -1;grid-row:2;justify-self:center}}
</style></head><body><header class="page-head"><div class="toolbar-brand"><h1><button class="brand-menu" type="button" aria-label="Προσωπικό — άνοιγμα κεντρικού μενού" title="Άνοιγμα κεντρικού μενού"><span class="app-mark" aria-hidden="true"><span>ΠΡ</span></span><span class="brand-text"><span>Προσωπικό</span><span class="small version">v0.80</span></span></button></h1></div><button id="applyStaff" class="save-main" type="button" disabled>Αποθήκευση</button><button id="cancelStaff" type="button" disabled>Αναίρεση Όλων</button><div class="header-right"><span id="staffSchoolYear" class="school-year-indicator" hidden><span>Σχολικό έτος:</span> <span id="staffSchoolYearValue"></span></span></div></header><main id="staff-root" class="page-main"><p class="connection subapp-connection">Άνοιξε τη σελίδα «Προσωπικό» μέσα από το Κεντρικό Μενού, αφού ανοίξεις το αρχείο πληροφοριών του σχολείου.</p></main><script src="_ui.js"></script>
<script src="_data.js"></script>
<script>
(()=>{'use strict';

const StaffModel = (()=>{
 // Service type: one per person. The data keep the key; the label may change without touching saved data.
 // «Ιδιότητα» (role) stays apart: it says the post of responsibility (director, deputy), not the kind of work.
 const serviceTypes=[['classroom','Δάσκαλος'],['specialty','Ειδικότητα'],['inclusion','Ειδική Αγωγή – Τμήμα Ένταξης'],['parallel','Ειδική Αγωγή – Παράλληλη Στήριξη'],['zep','ΖΕΠ – Τμήμα Υποδοχής'],['oloimero','Υπεύθυνος Ολοημέρου'],['psychologist','ΕΕΠ – Ψυχολόγος'],['socialWorker','ΕΕΠ – Κοινωνικός Λειτουργός'],['nurse','ΕΕΠ – Σχολικός Νοσηλευτής'],['ebp','Ειδικό Βοηθητικό Προσωπικό (ΕΒΠ)'],['other','Άλλο']];
 const serviceKeys=new Set(serviceTypes.map(([key])=>key));
 // Only these service types may have a homeroom class («Υπεύθυνος τμήματος»).
 const allowsHomeroom=type=>type==='classroom'||type==='specialty';
 const fold=value=>SchoolText.withoutTones(String(value??'')).toLocaleUpperCase('el').trim();
 // Class names in their canonical spelling («ΣΤ1» → «Στ1»), from the shared SchoolTimetable.classSpelling.
 const spellClass=value=>{const text=String(value??'').trim();return SchoolTimetable.classSpelling(text)||text};
 // The other person (not `except`) who is homeroom teacher of the class, or null.
 function homeroomHolder(rows,className,except){
  const key=fold(className);if(!key)return null;
  return rows.find(other=>other!==except&&allowsHomeroom(other.serviceType)&&fold(other.homeroomClass)===key)||null;
 }
 // Suggested values from the short name, which is the teacher's Name in FET (e.g. «[Α1] - Δασκάλα», «[ΠΕ06] - ΑΓΓ - Θωμάς»).
 function suggestFields(shortName){
  const name=String(shortName??'').trim(),text=fold(name);
  const tag=(/^\[([^\]]+)\]/.exec(name)?.[1]||'').trim(),tagKey=fold(tag).replace(/\s+/g,'');
  const pe=/^ΠΕ(\d+(?:\.\d+)?)$/.exec(tagKey);
  const out={serviceType:'',branch:pe?'ΠΕ'+pe[1]:'',homeroomClass:'',director:tagKey==='ΔΘ'||tagKey.startsWith('ΔΙΕΥΘ')};
  if(text.includes('ΥΠΕΥΘΥΝ')&&text.includes('ΟΛΟΗΜΕΡ'))out.serviceType='oloimero';
  else if(/(^|[^Α-Ω])ΖΕΠ([^Α-Ω]|$)/.test(text)||text.includes('ΥΠΟΔΟΧ'))out.serviceType='zep';
  else if(pe){
   const number=pe[1];
   if(number==='70')out.serviceType='classroom';
   else if(number.startsWith('70.')){if(text.includes('ΕΝΤΑΞ'))out.serviceType='inclusion';else if(text.includes('ΠΑΡΑΛΛΗΛ'))out.serviceType='parallel'}
   else if(number==='23')out.serviceType='psychologist';
   else if(number==='30')out.serviceType='socialWorker';
   else out.serviceType='specialty';
  }
  else if(!out.director&&SchoolTimetable.classSpelling(tag)){out.serviceType='classroom';out.homeroomClass=SchoolTimetable.classSpelling(tag)}
  return out;
 }
 // Fills only empty fields, so a value set by hand is never replaced. The homeroom class is not set when
 // another person of rows already has it: that case comes back in `blocked` ({person, className, holder}).
 // Returns {changed, blocked}.
 function fillEmpty(person,rows=[]){
  const suggested=suggestFields(person.shortName);let changed=false,blocked=null;
  if(!person.serviceType&&suggested.serviceType){person.serviceType=suggested.serviceType;changed=true}
  // A classroom teacher («Δάσκαλος») without a branch in the name is ΠΕ70.
  const branch=suggested.branch||(person.serviceType==='classroom'?'ΠΕ70':'');
  if(!String(person.branch??'').trim()&&branch){person.branch=branch;changed=true}
  if(!String(person.homeroomClass??'').trim()&&suggested.homeroomClass&&allowsHomeroom(person.serviceType)){
   const holder=homeroomHolder(rows,suggested.homeroomClass,person);
   if(holder)blocked={person,className:suggested.homeroomClass,holder};
   else{person.homeroomClass=suggested.homeroomClass;changed=true}
  }
  if(suggested.director&&(person.role||'teacher')==='teacher'){person.role='director';changed=true}
  return {changed,blocked};
 }
 const canFill=(person,rows)=>fillEmpty(structuredClone(person),rows).changed;
 // Another person who is homeroom teacher of the same class (a warning, not an error), or -1.
 function homeroomConflict(rows,index){
  const person=rows[index],key=fold(person?.homeroomClass);
  if(!key||!allowsHomeroom(person.serviceType))return -1;
  return rows.findIndex((other,i)=>i!==index&&allowsHomeroom(other.serviceType)&&fold(other.homeroomClass)===key);
 }
 // Dates: 'YYYY-MM-DD' in the data, dd/mm/yyyy for the user (shared SchoolDate).
 const validDateKey=SchoolDate.valid;
 const yearStart=year=>SchoolDate.schoolYear(year)?.from||`${String(year).slice(0,4)}-09-01`;
 function codeConflict(rows,index,code=rows[index]?.code){const key=String(code??'').trim();return key?rows.findIndex((person,i)=>i!==index&&String(person.code??'').trim()===key):-1}
 function shortNameConflict(rows,index,name=rows[index]?.shortName){const key=String(name??'').trim();return key?rows.findIndex((person,i)=>i!==index&&String(person.shortName??'').trim()===key):-1}
 function validateRows(rows){
  if(!Array.isArray(rows)||rows.length>2000)throw Error('Η λίστα προσωπικού δεν είναι έγκυρη.');
  const codes=new Set(),shortNames=new Set();
  for(const person of rows){
   if(!person||typeof person!=='object'||Array.isArray(person))throw Error('Μη έγκυρη εγγραφή προσωπικού.');
   if(['code','shortName','name'].some(key=>typeof person[key]!=='string')||person.code.length>1000||person.shortName.length>4000||person.name.length>4000)throw Error('Τα στοιχεία προσωπικού δεν είναι έγκυρα.');
   if(!person.code.trim())throw Error('Ο κωδικός εκπαιδευτικού είναι υποχρεωτικός.');
   if(!person.shortName.trim())throw Error('Το σύντομο όνομα εκπαιδευτικού είναι υποχρεωτικό.');
   const code=String(person.code??'').trim();if(code&&codes.has(code))throw Error('Ο κωδικός «'+code+'» χρησιμοποιείται ήδη από άλλον εκπαιδευτικό.');if(code)codes.add(code);
    const shortName=person.shortName.trim();if(shortNames.has(shortName))throw Error('Το σύντομο όνομα «'+shortName+'» χρησιμοποιείται ήδη από άλλον εκπαιδευτικό.');shortNames.add(shortName);
   if(person.serviceType!==undefined&&person.serviceType!==''&&!serviceKeys.has(person.serviceType))throw Error('Μη έγκυρο είδος υπηρεσίας.');
   for(const [key,label] of [['branch','Κλάδος'],['homeroomClass','Υπεύθυνος τμήματος']]){const value=person[key];if(value!==undefined&&(typeof value!=='string'||value.trim().length>20))throw Error(label+': έως 20 χαρακτήρες.')}
   if(String(person.homeroomClass??'').trim()&&!allowsHomeroom(person.serviceType))throw Error('Ο υπεύθυνος τμήματος ορίζεται μόνο για δασκάλους και ειδικότητες.');
   const holder=homeroomHolder(rows,person.homeroomClass,person);
   if(allowsHomeroom(person.serviceType)&&holder)throw Error('Το τμήμα «'+String(person.homeroomClass).trim()+'» έχει δύο υπευθύνους. Κάθε τμήμα έχει το πολύ έναν υπεύθυνο.');
   for(const [key,label] of [['requiredHours','Υποχρεωτικό ωράριο'],['schoolHours','Ωράριο στο σχολείο']]){const value=person[key]===undefined?0:person[key];if(!Number.isInteger(value)||value<0||value>30)throw Error(label+': συμπλήρωσε ακέραιο αριθμό από 0 έως 30.');}
   if(!validDateKey(person.startDate))throw Error('Συμπλήρωσε έγκυρη ημερομηνία ανάληψης υπηρεσίας.');
   if(person.endDate&&(!validDateKey(person.endDate)||person.endDate<person.startDate))throw Error('Η ημερομηνία αποχώρησης πρέπει να είναι έγκυρη και να μην προηγείται της ανάληψης υπηρεσίας.');
   if(!Array.isArray(person.leaves)||person.leaves.some(x=>!validDateKey(x.from)||!validDateKey(x.to)||x.from>x.to||typeof x.approved!=='boolean'))throw Error('Συμπλήρωσε έγκυρες ημερομηνίες «Από» και «Έως» και κατάσταση έγκρισης για κάθε άδεια ή αφαίρεσε το κενό διάστημα.');
  }
 }
 // Preserve future data fields while excluding temporary presentation markers.
 function persistedFields(person){const {manualAdded,manualUpdated,importAdded,importUpdated,...fields}=person;return fields}
 function normalizeRows(rows,year){return Array.isArray(rows)?rows.filter(x=>x&&typeof x==='object').map(x=>({...persistedFields(x),id:typeof x.id==='string'&&x.id?x.id:crypto.randomUUID(),code:String(x.code??''),shortName:String(x.shortName??''),name:String(x.name??''),role:['director','deputy'].includes(x.role)?x.role:'teacher',serviceType:serviceKeys.has(x.serviceType)?x.serviceType:'',branch:String(x.branch??'').trim(),homeroomClass:allowsHomeroom(x.serviceType)?spellClass(x.homeroomClass):'',requiredHours:Number.isInteger(x.requiredHours)&&x.requiredHours>=0&&x.requiredHours<=30?x.requiredHours:0,schoolHours:Number.isInteger(x.schoolHours)&&x.schoolHours>=0&&x.schoolHours<=30?x.schoolHours:0,startDate:validDateKey(x.startDate)?x.startDate:yearStart(year),endDate:validDateKey(x.endDate)?x.endDate:'',leaves:Array.isArray(x.leaves)?x.leaves.map(l=>({...l,from:String(l.from||''),to:String(l.to||'')})):[],fetImported:!!x.fetImported})):[]}
 // A date the user typed that is not valid stays in the draft as 'invalid:<text>', so the field keeps it
 // and validateRows reports it, instead of the date being dropped.
 function displayDate(value){return SchoolDate.format(value)||String(value||'').replace(/^invalid:/,'')}
 function parseDate(value){const text=String(value||'').trim();return text?SchoolDate.parse(text)||`invalid:${text}`:''}
 function importYear(rows,year){return normalizeRows(structuredClone(rows),year).map(person=>({...person,startDate:yearStart(year),endDate:'',leaves:[],manualAdded:true}))}
 return {validDateKey,yearStart,validateRows,normalizeRows,codeConflict,shortNameConflict,displayDate,parseDate,importYear,serviceTypes,allowsHomeroom,fillEmpty,canFill,homeroomConflict,homeroomHolder,spellClass};
})();

 const $=id=>document.getElementById(id),root=$('staff-root');
 // Messages, requests and their time limits: schoolHost in _ui.js.
 const post=schoolHost.post,escapeHtml=schoolEscape,Selection=schoolListSelection;
 let fetHandle=null,fetKey="";
 let staffListView='full';
 let editingStaff=false;
 let context=null,data={},schoolYear='',dirty=false,saving=false;
 function staffDefaultDate(){return StaffModel.yearStart(schoolYear)}
 // Limit of the number of staff of a year (from the context of the Index): a warning from warnRatio on,
 // and no additions at the limit. The Index refuses a save above it.
 const staffLimit=()=>Number.isInteger(context?.limits?.staff)?context.limits.staff:100;
 const staffWarnAt=()=>Math.ceil(staffLimit()*(Number(context?.limits?.warnRatio)||0.9));
 const personLabel=person=>person.name.trim()||person.shortName.trim()||person.code.trim()||'χωρίς όνομα';
 const validDateKey=StaffModel.validDateKey;
 function normalizeStaff(rows){return StaffModel.normalizeRows(rows,schoolYear)}
 function getYearStaff(){return normalizeStaff(context.staff||[])}
 function modal(title,body,actions){root.innerHTML=body}
 // «Αποθήκευση» and «Αναίρεση Όλων» are active only while there are unsaved changes, and never while saving.
 function refreshSaveButtons(){for(const id of ['applyStaff','cancelStaff'])if($(id))$(id).disabled=saving||!dirty}
 function setDirtyState(value){dirty=value;$('applyStaff').classList.toggle('dirty',value);post({type:'school-staff:dirty',dirty:value});refreshSaveButtons()}
 function markDraftDirty(){setDirtyState(true)}
 function setBusy(value){saving=value;for(const id of ['exportFet','importFet'])if($(id))$(id).disabled=value;root.classList.toggle('busy',value);root.setAttribute('aria-busy',String(value));refreshSaveButtons()}
 // Resolves with the new context of the Index.
 // staffRemovals: [{id, mode:'unmatch'|'remove'}] for removed people who appear in programs.
 function requestSave(staff,removedCodes,staffRemovals){return schoolHost.request('school-staff:save',{revision:context.revision,year:schoolYear,staff,removedCodes,staffRemovals},{timeoutMessage:'Δεν επιβεβαιώθηκε η αποθήκευση. Οι αλλαγές σου παραμένουν στη σελίδα.'})}
 schoolHost.on('school-staff:context',message=>{
  if(dirty||saving)return;
  context=message.context;schoolYear=context.school.year;data={ssdMeetings:context.ssdMeetings||{},pedagogicMeetings:context.pedagogicMeetings||{}};openStaffManager();
 });

function openStaffManager(){
 $('staffSchoolYearValue').textContent=schoolYear;$('staffSchoolYear').hidden=!schoolYear;

   choices:[{label:'Συνέχεια',accept:true,run:()=>{if(!files.length)throw Error('Πρόσθεσε τουλάχιστον ένα αρχείο CSV.');return true}}],
   actions:[{label:'Ακύρωση'}]});
 }
 async function exportCsv(){
  if(!await csvFilesDialog())return;
  const loaded=await csvCall('read');
  if(!loaded.length)throw Error('Δεν επιλέχθηκαν CSV.');
  const names=new Set();
  for(const file of loaded)for(const name of SchoolCsv.staffCsvRead(file.text).names)names.add(name);
  const mapping=await csvMappingDialog([...names].sort((a,b)=>a.localeCompare(b,'el',{numeric:true})),getYearStaff(),loaded);
  if(mapping===null)return;
  const updates=loaded.map(file=>({name:file.name,...SchoolCsv.staffCsvUpdate(file.text,mapping)}));
  const total=updates.reduce((n,f)=>n+f.replacements,0);
  if(!total){$('staffSummary').textContent='Δεν χρειάζεται αλλαγή στα επιλεγμένα CSV.';return}
  if(!(await schoolConfirm(`Θα ενημερωθούν ${total} αναφορές εκπαιδευτικών σε ${loaded.length} αρχεία CSV.\n\nΤα ονόματα χωρίς αντιστοίχιση διατηρούνται.\n\nΝα συνεχίσω;`,{title:'Ενημέρωση αρχείων CSV',accept:'Ενημέρωση'})))return;
  const result=await csvCall('write',{files:updates.map(f=>({name:f.name,text:f.text})),originals:loaded.map(f=>f.text)});
  $('staffSummary').textContent=`Ενημερώθηκαν ${result.written} αρχεία CSV (${total} αντικαταστάσεις ονομάτων).`;
 }
 function fetFileDialog(mode){
  let modeFieldset=null;
  if(mode==='import'){modeFieldset=document.createElement('fieldset');modeFieldset.className='subapp-import-mode';modeFieldset.innerHTML='<legend>Τι θέλεις να εισαγάγεις;</legend><label><input type="radio" name="fet-import-mode" value="both" checked> Ενημερώσεις και προσθήκες</label><label><input type="radio" name="fet-import-mode" value="updates"> Μόνο ενημερώσεις εκπαιδευτικών</label><label><input type="radio" name="fet-import-mode" value="additions"> Μόνο προσθήκες εκπαιδευτικών</label>'}
  const choose=async existing=>{const h=existing?fetHandle:fetProxy(await fetCall('choose'));if(!h)throw Error('Δεν επιλέχθηκε αρχείο.');fetHandle=h;return {handle:h,importMode:modeFieldset?.querySelector('input:checked')?.value||'both'}};
  return schoolChoiceDialog({
   title:mode==='import'?'Εισαγωγή εκπαιδευτικών από FET':'Εξαγωγή εκπαιδευτικών σε FET',
   content:[mode==='import'?'Επίλεξε το FET από το οποίο θα διαβαστούν οι εκπαιδευτικοί. Μετά την εισαγωγή πάτησε «Αποθήκευση» στο Προσωπικό.':'Επίλεξε το FET που θα ενημερωθεί με τους αποθηκευμένους εκπαιδευτικούς του τρέχοντος σχολικού έτους.',modeFieldset],
   choices:[{label:fetHandle?'Τελευταίο αρχείο FET: '+fetHandle.name:'Δεν υπάρχει τελευταίο αρχείο FET',disabled:!fetHandle,run:()=>choose(true)},{label:'Επιλογή άλλου αρχείου FET από τον δίσκο…',run:()=>choose(false)},...(mode==='export'?[{label:csvNames.length?'Τελευταία αρχεία CSV ('+csvNames.length+')':'Δεν υπάρχουν τελευταία αρχεία CSV',disabled:!csvNames.length,run:()=>({csv:'last'})},{label:'Επιλογή αρχείων CSV από τον δίσκο…',run:async()=>{await csvCall('choose');return {csv:'last'}}}]:[])]
  });
 }
 let csvNames=[];
 function setupFet(importRows){
 const key=JSON.stringify([context.school.name,schoolYear]);if(fetKey!==key){fetKey=key;fetHandle=null}
 // Both operations reuse the same most recently selected file, persisted by the index.
 const restore=fetHandle?Promise.resolve(fetHandle):fetStore('get').then(h=>{if(fetKey===key)fetHandle=h;return h}).catch(()=>null);
 $('importFet').onclick=async()=>{if(saving)return;await restore;const selection=await fetFileDialog('import');if(!selection)return;setBusy(true);try{await importRows(selection.handle,selection.importMode)}catch(e){$('staffSummary').textContent=e.message}finally{setBusy(false)}};
 $('exportFet').onclick=async()=>{
 if(saving)return;
 if(dirty){$('staffSummary').textContent='Πάτησε πρώτα «Αποθήκευση» για να αποθηκευτούν οι αλλαγές του προσωπικού.';return}
 await restore;csvNames=await csvCall('restore').catch(()=>[]);const selection=await fetFileDialog('export');if(!selection)return;if(selection.csv){setBusy(true);try{await exportCsv()}catch(e){$('staffSummary').textContent=e.message}finally{setBusy(false)}return}const h=selection.handle;
 setBusy(true);
 try{
 let permission=await h.queryPermission({mode:'readwrite'});if(permission!=='granted')permission=await h.requestPermission({mode:'readwrite'});if(permission!=='granted')throw Error('Δεν δόθηκε άδεια ενημέρωσης του αρχείου FET.');
 const rows=getYearStaff(),names=rows.map(p=>p.shortName.trim());if(names.some(n=>!n)||new Set(names).size!==names.length)throw Error('Κάθε εκπαιδευτικός χρειάζεται μοναδικό, μη κενό σύντομο όνομα για το FET.');
 const file=await h.getFile(),doc=parseFet(await file.text()),list=SchoolFet.child(doc.documentElement,'Teachers_List'),teachers=SchoolFet.children(list,'Teacher');
 const value=SchoolFet.text;
 const set=(n,tag,text)=>{let c=SchoolFet.child(n,tag);if(!c){c=doc.createElement(tag);n.append(c)}c.textContent=text};
 const plans=rows.map(p=>{
 const code=p.code.trim();
 let matches=code?teachers.filter(n=>value(n,'Code').trim()===code):[];
 if(!matches.length)matches=teachers.filter(n=>value(n,'Name')===p.shortName.trim()&&(!code||!value(n,'Code').trim()));
 if(matches.length>1)throw Error('Υπάρχουν πολλαπλές εγγραφές στο FET για τον εκπαιδευτικό: '+(code||p.shortName));
 return {p,node:matches[0]};
 });
 const used=plans.map(x=>x.node).filter(Boolean);if(new Set(used).size!==used.length)throw Error('Πολλές εγγραφές αντιστοιχούν στον ίδιο εκπαιδευτικό του FET.');
 const rename=new Map();for(const {p,node} of plans)if(node&&value(node,'Name')!==p.shortName.trim())rename.set(value(node,'Name'),p.shortName.trim());
 const finalNames=teachers.map(n=>rename.get(value(n,'Name'))||value(n,'Name')).concat(plans.filter(x=>!x.node).map(x=>x.p.shortName.trim()));if(new Set(finalNames).size!==finalNames.length)throw Error('Η ενημέρωση θα δημιουργούσε διπλά ονόματα στο FET.');
 for(const n of [...doc.getElementsByTagName('*')])if(!n.children.length&&['Teacher','Teacher_Name'].includes(n.tagName)&&rename.has(n.textContent))n.textContent=rename.get(n.textContent);
 for(const {p,node} of plans){const n=node||doc.createElement('Teacher');set(n,'Name',p.shortName.trim());set(n,'Long_Name',p.name);set(n,'Code',p.code);set(n,'Target_Number_of_Hours',String(p.schoolHours));if(!node){n.append(doc.createElement('Qualified_Subjects'));set(n,'Comments','');list.append(n)}}
 const updateCount=plans.filter(item=>item.node).length,addCount=plans.length-updateCount;
 if(!(await schoolConfirm(`Ενημέρωση του «${h.name}»\n\nΘα ενημερωθούν: ${updateCount} εκπαιδευτικοί που υπάρχουν ήδη στο FET.\nΘα προστεθούν: ${addCount} εκπαιδευτικοί που δεν υπάρχουν στο FET.\n\nΟι υπόλοιποι εκπαιδευτικοί του FET διατηρούνται.\nΝα συνεχίσω;`, {title:'Ενημέρωση FET',accept:'Ενημέρωση'})))return;
 const latest=await h.getFile();if(latest.lastModified!==file.lastModified||latest.size!==file.size)throw Error('Το FET άλλαξε στο μεταξύ. Δοκίμασε ξανά.');
 const writer=await h.createWritable();try{await writer.write(new XMLSerializer().serializeToString(doc));await writer.close()}catch(e){await writer.abort().catch(()=>{});throw e}
 $('staffSummary').textContent='Το συνεργαζόμενο αρχείο FET ενημερώθηκε.';
 }catch(e){$('staffSummary').textContent=e.message}finally{setBusy(false)}
 };
 }

 post({type:'school-staff:ready'});
})();
