<style>
/* DT-specific geometry. Shared appearance: _ui.css / _subapp.css. */
:root{--app-mark-bg:var(--school-app-docs)}

#filesPane{display:flex;flex-direction:column;gap:0;min-height:0}

.period-field{display:grid;gap:4px;margin:0 0 10px}
.period-field label{font-size:13px;color:var(--school-ui-muted)}
.period-field select{width:100%;min-width:0}

.target-item{flex:none;display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:7px;padding-top:4px;padding-bottom:4px;font-size:13px;cursor:pointer}

.files-list{flex:1;min-height:160px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.files-list.drag-over{border-color:var(--school-ui-primary-border);background:var(--school-ui-primary-bg)}
/* Empty list: a compact drop box in the middle of the list (margin:auto centres it both ways).
   While files are dragged over, the whole list lights up (.drag-over), so the drop target stays large. */
.files-list .subapp-file-drop{flex:none;width:min(280px,calc(100% - 24px));min-height:0;margin:auto;padding:18px 16px;gap:8px;border-radius:14px}
.files-list .subapp-file-drop-icon{font-size:26px}

.file-item.selected .file-kind{color:var(--school-ui-primary-text)}
.fields-pane{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}
/* The heading (shared .subapp-pane-heading) stays put while the fields scroll under it; the bottom rule separates the two. */
.pane-heading{align-items:flex-start;padding-bottom:10px;margin-bottom:0;border-bottom:1px solid var(--school-ui-border)}
/* Production is the app's main action: shared green .success button, at the far right of the header.
   Both header buttons show the shared change dot (.subapp-change-dot) for the next step.
   The header wraps on narrow screens by the shared rule of _subapp.css. */
#findFields,#produce{flex:none}

/* Room for the 2px focus outline (offset 2px) inside the scrolling area, and a gap under the heading rule. */
.fields-content{flex:1;min-height:0;overflow:auto;padding:10px 8px 6px 6px;margin:0 -8px 0 -6px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.field-grid .ui-field{margin:8px 0;align-content:start}
.field-label{display:flex;align-items:center;gap:6px}
.field-name{flex:1;min-width:0;overflow-wrap:anywhere}
.field-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;margin-left:auto;flex:none;max-width:60%}
.field-badge{font-size:11px;font-weight:600;padding:2px 7px;white-space:nowrap;border-radius:5px;background:var(--school-ui-label-bg);color:var(--school-ui-label-text)}
.field-badge.conflict{background:transparent;color:var(--school-ui-error);padding:0}

.ui-field textarea{width:100%;min-width:0;min-height:84px;resize:vertical;border:1px solid var(--school-ui-input-border);border-radius:6px;padding:9px;font:inherit;background:var(--school-ui-surface)}
.ui-fields .ui-field textarea[aria-invalid="true"]{border-color:var(--school-ui-error-border)}
/* Summary of the fields «@» (never shown one by one in the form), above the manual fields. */
.data-summary{margin:0 0 10px;font-size:14px;line-height:1.45}
.data-summary p{margin:0}

.data-summary-head{font-weight:700}

/* Stacked (800px or narrower): the whole area under the header scrolls, not the fields on their own

@media(max-width:800px){#root{overflow:visible}.files-list{min-height:240px;max-height:45dvh}.target-list{min-height:200px;max-height:45dvh}.fields-pane .fields-content{overflow:visible}}
@media(max-width:620px){.field-grid{grid-template-columns:1fr}}

<script>
// Pure template logic: placeholder discovery, CSV values and DOCX/XLSX filling. No DOM of the page.
// Fields that start with «@» come from the shared file (SchoolDocumentFields in _data.js): they are kept apart from
// the manual fields, take their type from the catalogue and never go to the values CSV.
window.TemplaterModel=(()=>{
 const DATA_MARK=window.SchoolDocumentFields?.MARK||'@';
 const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const DOCX_PARTS=/^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/;
 const SHEET_PARTS=/^xl\/worksheets\/sheet\d+\.xml$/;
 const TYPES=['Decimal','Integer','Date','Text','Textarea'];

 // CSV of field values: «Πεδίο,Τιμή» per row, with or without a heading row (tokenizer: SchoolCsv in _data.js).
 function parseCsv(text){
  const rows=SchoolCsv.parse(text,{delimiter:','});
  if(!rows.length)return new Map();
  const norm=v=>String(v??'').trim().toLocaleLowerCase('el'),head=rows[0].map(norm);
  const fieldHeaders=['πεδίο','field','όνομα πεδίου','name'],valueHeaders=['τιμή','value','τιμές'];
  let fi=head.findIndex(v=>fieldHeaders.includes(v)),vi=head.findIndex(v=>valueHeaders.includes(v)),start=fi>=0&&vi>=0?1:0;
  if(start===0){fi=0;vi=1}
  const out=new Map();
  for(let i=start;i<rows.length;i++){const name=String(rows[i][fi]??'').trim();if(!name||rows[i][vi]===undefined)continue;out.set(name,String(rows[i][vi]))}
  return out;
 }
 async function loadCsvValues(csvFiles){const out=new Map();for(const f of csvFiles){for(const [k,v] of parseCsv(await f.text()))out.set(k,v)}return out}
 function buildValuesCsv(fields,values){
  const rows=[['Πεδίο','Τιμή'],...Array.from(fields.keys()).map(name=>[name,values.get(name)??''])];
  return new Blob(['﻿',rows.map(r=>r.map(SchoolCsv.quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 }
 function parseToken(raw){
  let [name,...rest]=raw.split(':');name=name.trim();
  const type=rest.join(':').trim()||'Text';
  const known=TYPES.find(t=>t.toLowerCase()===type.toLowerCase());
  return known?{name,type:known}:{name,type:'Text',warning:type};
 }
 // found: {fields (manual), data (fields «@»)}; tokens: every field of one template as written (with «:Type»).
 function collect(text,src,found,tokens){
  const re=/\{\{\s*([^{}]+?)\s*\}\}/g;let m;
  while((m=re.exec(text))){
   if(m[1].startsWith('#')||m[1].startsWith('/'))continue;
   const p=parseToken(m[1]);if(!p.name)continue;
   tokens.add(m[1]);
   if(p.name.startsWith(DATA_MARK)){
    const item=found.data.get(p.name);
    if(item)item.sources.add(src);else found.data.set(p.name,{name:p.name,sources:new Set([src])});
    continue;
   }
   const fields=found.fields,prev=fields.get(p.name);
   if(prev&&prev.type!==p.type&&p.type!=='Text')prev.conflict=true;
   else if(!prev)fields.set(p.name,{...p,sources:new Set([src])});
   if(prev)prev.sources.add(src);
  }
 }
 function xmlText(elm){return Array.from(elm.getElementsByTagName('t')).map(t=>t.textContent).join('')}
 async function sharedStrings(zip){
  if(!zip.file('xl/sharedStrings.xml'))return [];
  const d=new DOMParser().parseFromString(await zip.file('xl/sharedStrings.xml').async('string'),'application/xml');
  return Array.from(d.getElementsByTagName('si')).map(xmlText);
 }
 async function scanDocx(zip,src,found,tokens){
  for(const p of Object.keys(zip.files).filter(p=>DOCX_PARTS.test(p))){
   const doc=new DOMParser().parseFromString(await zip.file(p).async('string'),'application/xml');
   for(const para of doc.getElementsByTagNameNS(W_NS,'p'))collect(Array.from(para.getElementsByTagNameNS(W_NS,'t')).map(n=>n.textContent).join(''),src,found,tokens);
  }
 }
 function cellText(c,shared){
  const type=c.getAttribute('t');
  if(type==='s'){const v=c.getElementsByTagName('v')[0];return v?(shared[Number(v.textContent)]||''):''}
  if(type==='inlineStr'){const is=c.getElementsByTagName('is')[0];return is?xmlText(is):''}
  if(type==='str'){const v=c.getElementsByTagName('v')[0];return v?v.textContent:''}
  return '';
 }
 async function scanXlsx(zip,src,found,tokens){
  const shared=await sharedStrings(zip);
  for(const p of Object.keys(zip.files).filter(p=>SHEET_PARTS.test(p))){
   const d=new DOMParser().parseFromString(await zip.file(p).async('string'),'application/xml');
   for(const c of d.getElementsByTagName('c')){const value=cellText(c,shared);if(value)collect(value,src,found,tokens)}
  }
 }
 // → {fields: Map of the manual fields, data: Map of the fields «@», tokens: Map(template file → [fields as written])}.
 async function scanTemplates(templates){
  const found={fields:new Map(),data:new Map(),tokens:new Map()};
  for(const f of templates){
   const tokens=new Set();
   try{const zip=await JSZip.loadAsync(f);if(/\.docx$/i.test(f.name))await scanDocx(zip,f.name,found,tokens);else await scanXlsx(zip,f.name,found,tokens)}
   catch(error){error.fileName=f.name;throw error}
   found.tokens.set(f,[...tokens]);
  }
  return found;
 }
 // Placeholders may be split across several runs of one paragraph; the value goes to the run where it starts.
 function replaceTextRuns(xml,map){
  const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))return xml;
  for(const para of doc.getElementsByTagNameNS(W_NS,'p')){
   const nodes=Array.from(para.getElementsByTagNameNS(W_NS,'t'));if(!nodes.length)continue;
   const texts=nodes.map(n=>n.textContent),spans=[];let full='';
   for(let i=0;i<texts.length;i++){const start=full.length;full+=texts[i];spans.push({start,end:full.length})}
   const matches=[],re=/\{\{\s*([^{}]+?)\s*\}\}/g;let m;
   while((m=re.exec(full))){const p=parseToken(m[1]);if(map.has(p.name))matches.push({start:m.index,end:re.lastIndex,value:map.get(p.name)})}
   if(!matches.length)continue;
   const out=nodes.map(()=>''),appendRange=(from,to)=>{for(let i=0;i<spans.length;i++){const a=Math.max(from,spans[i].start),b=Math.min(to,spans[i].end);if(a<b)out[i]+=texts[i].slice(a-spans[i].start,b-spans[i].start)}};
   let cursor=0;
   for(const match of matches){
    appendRange(cursor,match.start);
    let target=spans.findIndex(x=>match.start>=x.start&&match.start<x.end);if(target<0)target=Math.max(0,spans.length-1);
    out[target]+=match.value;cursor=match.end;
   }
   appendRange(cursor,full.length);
   for(let i=0;i<nodes.length;i++)nodes[i].textContent=out[i];
  }
  return new XMLSerializer().serializeToString(doc);
 }
 // Refreshes cached results of simple SUM(...) and IF(A<>"",B,"") formulas, so previews show values before Excel recalculates.
 function refreshSimpleFormulaCaches(doc,shared){
  const ns=doc.documentElement.namespaceURI,cells=new Map(Array.from(doc.getElementsByTagName('c')).map(c=>[c.getAttribute('r'),c]));
  const colNum=col=>{let n=0;for(const ch of col)n=n*26+ch.charCodeAt(0)-64;return n};
  const colName=num=>{let s='';for(let n=num;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
  const valueOf=c=>{
   if(!c)return null;
   const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];
   if(t==='s')return v?(shared[Number(v.textContent)]||''):'';
   if(t==='inlineStr'){const is=c.getElementsByTagName('is')[0];return is?xmlText(is):''}
   if(!v)return null;
   const raw=v.textContent||'';if(t==='str')return raw;if(raw==='')return '';
   const n=Number(raw);return Number.isFinite(n)?n:raw;
  };
  const write=(c,val)=>{
   const t=typeof val==='number'?'n':'str',oldType=c.getAttribute('t'),v0=c.getElementsByTagName('v')[0],oldValue=v0?v0.textContent:'';
   let v=v0;
   if(!v){v=doc.createElementNS(ns,'v');const f=c.getElementsByTagName('f')[0];if(f&&f.nextSibling)c.insertBefore(v,f.nextSibling);else c.appendChild(v)}
   const next=typeof val==='number'?String(val):String(val??'');
   v.textContent=next;c.setAttribute('t',t);return oldType!==t||oldValue!==next;
  };
  // Shared formulas store the expression only in their master cell; followers need shifted references for cache refresh.
  const masters=new Map();
  const formulas=Array.from(cells.values()).filter(c=>c.getElementsByTagName('f').length);
  for(const c of formulas){
   const f=c.getElementsByTagName('f')[0],si=f.getAttribute('si');
   if(f.getAttribute('t')==='shared'&&si!==null&&(f.textContent||'').trim())masters.set(si,{address:c.getAttribute('r'),formula:f.textContent.trim()});
  }
  const formulaFor=c=>{
   const f=c.getElementsByTagName('f')[0];if(!f)return '';
   const own=(f.textContent||'').trim();if(own||f.getAttribute('t')!=='shared')return own;
   const master=masters.get(f.getAttribute('si'));if(!master)return '';
   const source=master.address.match(/^([A-Z]+)(\d+)$/),dest=c.getAttribute('r').match(/^([A-Z]+)(\d+)$/);
   if(!source||!dest)return '';
   const dc=colNum(dest[1])-colNum(source[1]),dr=Number(dest[2])-Number(source[2]);
   return master.formula.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/gi,(all,absCol,col,absRow,row)=>{
    const nextCol=absCol?colNum(col.toUpperCase()):colNum(col.toUpperCase())+dc;
    const nextRow=absRow?Number(row):Number(row)+dr;
    return nextCol>0&&nextRow>0?absCol+colName(nextCol)+absRow+nextRow:all;
   });
  };
  for(let pass=0;pass<Math.min(formulas.length+1,30);pass++){
   let changed=false;
   for(const c of formulas){
    const formula=formulaFor(c);
    const im=formula.match(/^IF\(\s*(\$?[A-Z]{1,3}\$?\d+)\s*<>\s*""\s*,\s*(\$?[A-Z]{1,3}\$?\d+)\s*,\s*""\s*\)$/i);
    if(im){const a=valueOf(cells.get(im[1].replace(/\$/g,'')));const val=a!==null&&a!==''?valueOf(cells.get(im[2].replace(/\$/g,''))):'';changed=write(c,val??'')||changed;continue}
    const sm=formula.match(/^SUM\s*\(([^()]*)\)$/i);if(!sm)continue;
    let total=0,ok=true;
    for(const part of sm[1].split(',')){
     const m=part.trim().match(/^\$?([A-Z]{1,3})\$?(\d+)(?::\$?([A-Z]{1,3})\$?(\d+))?$/i);if(!m){ok=false;break}
     const c1=colNum(m[1].toUpperCase()),r1=Number(m[2]),c2=m[3]?colNum(m[3].toUpperCase()):c1,r2=m[4]?Number(m[4]):r1;
     for(let row=Math.min(r1,r2);row<=Math.max(r1,r2);row++)for(let col=Math.min(c1,c2);col<=Math.max(c1,c2);col++){const val=valueOf(cells.get(colName(col)+row));if(typeof val==='number'&&Number.isFinite(val))total+=val}
    }
    if(ok)changed=write(c,total)||changed;
   }
   if(!changed)break;
  }
 }
 function replaceXlsx(xml,shared,map,types){
  const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))return xml;
  for(const c of Array.from(doc.getElementsByTagName('c'))){
   const text=cellText(c,shared);if(!text)continue;
   const full=text.match(/^\s*\{\{\s*([^{}]+?)\s*\}\}\s*$/);
   let changed=false,fieldType='Text',numericWhole=false;
   const replaced=text.replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(all,raw)=>{
    const p=parseToken(raw);if(!map.has(p.name))return all;
    changed=true;fieldType=types.get(p.name)||p.type;numericWhole=!!full&&(fieldType==='Decimal'||fieldType==='Integer');
    return String(map.get(p.name));
   });
   if(!changed)continue;
   while(c.firstChild)c.removeChild(c.firstChild);
   // A blank whole-cell field must be a genuinely empty cell, not an empty inline string.
   if(full&&replaced.trim()===''){
    c.removeAttribute('t');
   }else if(numericWhole){
    c.removeAttribute('t');const v=doc.createElementNS(c.namespaceURI,'v');v.textContent=replaced.trim().replace(',','.');c.appendChild(v);
   }else{
    c.setAttribute('t','inlineStr');
    const is=doc.createElementNS(c.namespaceURI,'is'),t=doc.createElementNS(c.namespaceURI,'t');
    if(/^\s|\s$/.test(replaced))t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
    t.textContent=replaced;is.appendChild(t);c.appendChild(is);
   }
  }
  refreshSimpleFormulaCaches(doc,shared);
  return new XMLSerializer().serializeToString(doc);
 }
 async function requestWorkbookRecalculation(zip){
  const file=zip.file('xl/workbook.xml');if(!file)return;
  const doc=new DOMParser().parseFromString(await file.async('string'),'application/xml');if(doc.querySelector('parsererror'))return;
  const ns=doc.documentElement.namespaceURI;let calc=doc.getElementsByTagNameNS(ns,'calcPr')[0];
  if(!calc){calc=doc.createElementNS(ns,'calcPr');const ext=doc.getElementsByTagNameNS(ns,'extLst')[0];if(ext)doc.documentElement.insertBefore(calc,ext);else doc.documentElement.appendChild(calc)}

  renderFiles();$('filesList').querySelector(`[data-index="${files.indexOf(anchor)}"]`)?.focus();
 });
 // Drag and drop is not a file picker: dropped files arrive directly from the operating system.
 const pane=$('filesPane');let dragDepth=0;
 const hasFiles=event=>[...(event.dataTransfer?.types||[])].includes('Files');
 const setDrag=on=>{$('filesList').classList.toggle('drag-over',on);$('fileDrop')?.classList.toggle('drag-over',on)};
 pane.addEventListener('dragenter',event=>{if(!hasFiles(event))return;event.preventDefault();dragDepth++;setDrag(true)});
 pane.addEventListener('dragover',event=>{if(!hasFiles(event))return;event.preventDefault();event.dataTransfer.dropEffect=busy?'none':'copy'});
 pane.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)setDrag(false)});
 pane.addEventListener('drop',event=>{if(!hasFiles(event))return;event.preventDefault();dragDepth=0;setDrag(false);if(!busy)addFiles([...event.dataTransfer.files])});
 for(const type of ['dragover','drop'])document.addEventListener(type,event=>{if(hasFiles(event))event.preventDefault()});

 // ---- Fields ----
 function renderFieldsPlaceholder(message){
  const out=$('fieldsContent');out.replaceChildren();
  const empty=document.createElement('div');empty.className='subapp-empty';empty.textContent=message;out.append(empty);
  $('fieldsCount').textContent='—';
  $('fieldsSubtitle').textContent='Πρόσθεσε αρχεία και πάτησε «Ανεύρεση πεδίων».';
  updateButtons();
 }
 const TYPE_LABELS={Text:'Κείμενο',Textarea:'Κείμενο πολλών γραμμών',Integer:'Ακέραιος αριθμός',Decimal:'Δεκαδικός αριθμός',Date:'Ημερομηνία'};
 function badge(text,extra=''){const s=document.createElement('span');s.className='field-badge'+(extra?' '+extra:'');s.textContent=text;return s}
 function renderFields(){
  const out=$('fieldsContent');out.replaceChildren();
  $('fieldsCount').textContent=fieldsLabel(fields.size);
  if(!hasFields()){renderFieldsPlaceholder('Δεν βρέθηκαν πεδία στα επιλεγμένα αρχεία.');$('fieldsCount').textContent='0 πεδία';return}
  $('fieldsSubtitle').textContent=fields.size?'Συμπλήρωσε ή έλεγξε τις τιμές.':'Τα πρότυπα έχουν μόνο πεδία από το κοινό αρχείο.';
  if(dataFields.size){const box=document.createElement('div');box.id='dataSummary';box.className='data-summary subapp-info-panel';box.setAttribute('role','status');out.append(box)}
  if(fields.size){
   const set=document.createElement('fieldset');set.className='ui-fields field-grid';set.setAttribute('aria-label','Τιμές πεδίων');
   let i=0;
   for(const [name,f] of fields){
    const id='field-'+(i++),wrap=document.createElement('div');wrap.className='ui-field';
    const label=document.createElement('label');label.htmlFor=id;label.className='field-label';
    const text=document.createElement('span');text.className='field-name';text.textContent=name;const tags=document.createElement('span');tags.className='field-tags';label.append(text,tags);
    if(f.conflict)tags.append(badge('διαφορετικός τύπος σε άλλο πρότυπο','conflict'));
    const typeBadge=badge(TYPE_LABELS[f.type]||'Κείμενο');if(f.warning){typeBadge.textContent='Κείμενο (άγνωστος τύπος «'+f.warning+'»)';typeBadge.classList.add('warning')}tags.append(typeBadge);
    const input=document.createElement(f.type==='Textarea'?'textarea':'input');input.id=id;input.dataset.type=f.type;
    if(f.type!=='Textarea'){input.type='text';if(f.type==='Decimal')input.inputMode='decimal';if(f.type==='Integer')input.inputMode='numeric'}
    // Dates: always dd/mm/yyyy for the user (not the browser's date field, which follows the computer's locale).
    if(f.type==='Date'){input.inputMode='numeric';input.placeholder='dd/mm/yyyy';input.maxLength=10;input.autocomplete='off'}
    input.value=values.get(name)??'';
    input.oninput=()=>{values.set(name,input.value);input.removeAttribute('aria-invalid');mark(true)};
    if(f.type==='Date')input.onchange=()=>{const v=M.dateText(input.value);if(v!==input.value){input.value=v;values.set(name,v)}};
    wrap.append(label,input);
    // A manual field written like a field of the catalogue (Εκπ., Τμ., Ώρα., Μάθημα.) gets the hint «Μήπως εννοείς…».
    const hint=F?F.recognize(name,docCtx).message:'';
    if(hint){const warn=document.createElement('div');warn.className='ui-validation-warning';warn.textContent=hint;wrap.append(warn)}
    set.append(wrap);
   }
   out.append(set);
  }else out.append(para('Δεν υπάρχουν πεδία για χειροκίνητη συμπλήρωση.','ui-helper manual-empty'));
  const note=document.createElement('p');note.className='syntax-note ui-helper';
  note.innerHTML=files.some(isTemplate)?'Μορφή πεδίων: <code>{{Σχολικό Έτος}}</code> · <code>{{Τιμή:Decimal}}</code> · <code>{{Μέρες:Integer}}</code> · <code>{{Ημερομηνία:Date}}</code> · <code>{{Σημειώσεις:Textarea}}</code>. Τα πεδία από το κοινό αρχείο αρχίζουν με «@», π.χ. <code>{{@Σχολείο}}</code>, και συμπληρώνονται μόνα τους. Μαζί με τα έγγραφα εξάγεται CSV με τα υπόλοιπα πεδία και τις τιμές τους, που μπορείς να ξαναπροσθέσεις την επόμενη φορά.':'Οι τιμές προέρχονται από το CSV. Μπορείς να τις τροποποιήσεις και να αποθηκεύσεις νέο CSV με «Παραγωγή Εγγράφων».';
  out.append(note);
  renderSummary();
  updateButtons();
 }
 function validate(){
  let first=null;
  for(const input of $('fieldsContent').querySelectorAll('[data-type]')){
   const bad=M.invalidValue(input.dataset.type,input.value);
   if(bad){input.setAttribute('aria-invalid','true');first=first||input}else input.removeAttribute('aria-invalid');
  }
  if(first){first.focus();first.scrollIntoView({block:'nearest'})}
  return !first;
 }
 const libraryMissing=()=>{if(window.JSZip)return false;notice('Δεν φορτώθηκε η βιβλιοθήκη ανάγνωσης αρχείων. Βεβαιώσου ότι το _lib_jszip.min.js βρίσκεται στον ίδιο φάκελο με την εφαρμογή.',true);return true};
 $('findFields').onclick=async()=>{
  if(busy)return;
  const templates=files.filter(isTemplate),csvFiles=files.filter(isCsv);
  if(!templates.length&&!csvFiles.length){notice('Πρόσθεσε τουλάχιστον ένα πρότυπο DOCX, XLSX ή αρχείο CSV.',true);return}
  if(templates.length&&libraryMissing())return;
  setBusy(true);notice('Σάρωση αρχείων…');
  try{
   const found=templates.length?await M.scanTemplates(templates):{fields:new Map(),data:new Map(),tokens:new Map()},csvMap=await M.loadCsvValues(csvFiles);
   // Only CSV: its rows are the fields (all Text). Rows «@…» are fields of the shared file and are not filled by hand.
   if(!templates.length)for(const name of csvMap.keys())if(!name.startsWith(MARK))found.fields.set(name,{name,type:'Text',sources:new Set(csvFiles.map(f=>f.name))});
   fields=found.fields;dataFields=found.data;templateTokens=found.tokens;csvMatched.clear();let changed=false;
   for(const [name,f] of fields)if(csvMap.has(name)){
    const value=f.type==='Date'?M.dateText(csvMap.get(name)):csvMap.get(name);
    if(values.get(name)!==value)changed=true;values.set(name,value);csvMatched.add(name);
   }
   scanned=true;renderSchool();renderFields();if(changed)mark(true);
   if(!hasFields())notice(templates.length?'Δεν εντοπίστηκαν πεδία. Έλεγξε ότι είναι γραμμένα ως {{Όνομα}}.':'Δεν εντοπίστηκαν πεδία στο CSV. Έλεγξε τη μορφή των στηλών «Πεδίο» και «Τιμή».',true);
   else{
    let text=fields.size===1?'Βρέθηκε 1 πεδίο':`Βρέθηκαν ${fields.size} πεδία`;
    text+=dataFields.size?` προς συμπλήρωση και ${dataFields.size===1?'1 πεδίο':dataFields.size+' πεδία'} από το κοινό αρχείο.`:'.';
    if(csvFiles.length&&templates.length&&fields.size){const absent=fields.size-csvMatched.size;text+=` Από το CSV προσυμπληρώθηκαν ${csvMatched.size} από ${fields.size}`+(absent?`· ${absent} χωρίς αντιστοιχία.`:'.')}
    if(dataFields.size&&!input)text+=' Για τα πεδία «@» άνοιξε το κοινό αρχείο από το Κεντρικό Μενού.';
    notice(text);
   }
  }catch(error){
   console.error(error);clearScan('Η σάρωση απέτυχε.');
   notice((error.fileName?`Δεν μπόρεσα να διαβάσω το «${error.fileName}». `:'Δεν μπόρεσα να διαβάσω κάποιο αρχείο. ')+'Έλεγξε ότι είναι έγκυρο DOCX, XLSX ή CSV.',true);
  }finally{setBusy(false)}
 };

 // ---- CSV-only production ----
 async function exportValuesCsv(){
  if(busy||!scanned||!fields.size||!hosted)return;
  if(!validate()){notice('Διόρθωσε πρώτα τις τιμές που σημειώνονται.',true);return}
  setBusy(true);
  try{
   const csv=await M.buildValuesCsv(fields,values).text();
   const saved=await schoolHost.request('school-documents:file',{
    action:'exportValues',suggestedName:'Documents_Templater_Τιμές.csv',text:csv
   });
   notice(`Το CSV τιμών αποθηκεύτηκε στο «${saved?.name||'Documents_Templater_Τιμές.csv'}».`);
  }catch(error){
   if(!/ακυρώθηκε/.test(error.message||''))notice('Το CSV δεν αποθηκεύτηκε. '+(error.message||''),true);
  }finally{setBusy(false)}
 }

 // ---- Production ----
 // Each staff template once per chosen teacher, each class template once per chosen class (in the order of the lists),
 // a common template or one without fields «@» once. A field «@» that is not exactly of the catalogue stays as written.
 function saveBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
 $('produce').onclick=async()=>{
  if(busy||!scanned||!hasFields())return;
  if(!files.some(isTemplate)){await exportValuesCsv();return}
  if(libraryMissing())return;
  if(!validate()){notice('Διόρθωσε πρώτα τις τιμές που σημειώνονται (αριθμοί ή ημερομηνίες dd/mm/yyyy).',true);return}
  for(const [name,f] of fields)if(f.conflict){notice(`Το πεδίο «${name}» έχει διαφορετικό τύπο σε διαφορετικά πρότυπα. Διόρθωσέ το στα πρότυπα και πάτησε ξανά «Ανεύρεση πεδίων».`,true);return}
  const status=dataStatus();
  if(status.missing.length){notice('Η παραγωγή δεν έγινε. '+status.missing.join(' '),true);return}
  const templates=files.filter(isTemplate),manual=new Map(),manualTypes=new Map();
  for(const [name,f] of fields){const value=values.get(name)??'';manual.set(name,f.type==='Date'?M.dateText(value):value);manualTypes.set(name,f.type)}
  const staffIds=staffList().map(p=>p.id).filter(id=>picked.staff.has(id)),classIds=classList().map(r=>r.id).filter(id=>picked.class.has(id));
  const jobs=[];
  for(const file of templates){
   const kind=status.kinds.get(file).kind;
   const targets=kind==='staff'?staffIds.map(id=>({type:'staff',id})):kind==='class'?classIds.map(id=>({type:'class',id})):[null];
   const names=[...new Set(dataTokens(file).map(tokenName))].filter(name=>recognize(name).known);
   for(const target of targets)jobs.push({file,target,names});
  }
  setBusy(true);notice('Συμπλήρωση των εγγράφων…');
  try{
   const generated=[];
   for(const job of jobs){
    const map=new Map(manual),typeMap=new Map(manualTypes);
    if(job.names.length&&F){for(const [name,value] of F.values(job.names,job.target,docCtx)){map.set(name,value);typeMap.set(name,recognize(name).type)}}
    if(jobs.length>1)notice(`Συμπλήρωση των εγγράφων… (${generated.length+1} από ${jobs.length})`);
    generated.push({name:F?F.fileName(job.file.name,job.target,docCtx):job.file.name,blob:await M.generateOne(job.file,map,typeMap)});
   }
   const names=F?F.uniqueNames(generated.map(g=>g.name)):generated.map(g=>g.name);
   generated.forEach((g,i)=>{g.name=names[i]});
   // The values CSV keeps only the fields filled by hand; without such fields there is no CSV.
   const csvBlob=fields.size?M.buildValuesCsv(fields,values):null,csvName='Documents_Templater_Τιμές.csv';
   if(generated.length===1){saveBlob(generated[0].blob,generated[0].name);if(csvBlob)setTimeout(()=>saveBlob(csvBlob,csvName),350)}
   else{const zip=new JSZip();for(const g of generated)zip.file(g.name,g.blob);if(csvBlob)zip.file(csvName,csvBlob);saveBlob(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),'Documents_Templater_συμπληρωμένο.zip')}
   mark(false);
   const csvText=csvBlob?' και το CSV τιμών':'';
   const unfilled=status.notes.filter(note=>!note.filled).length;
   notice((generated.length===1
    ?`Δημιουργήθηκε το συμπληρωμένο «${generated[0].name}»${csvText}. Θα ${csvBlob?'τα':'το'} βρεις στις Λήψεις του browser.`
    :`Δημιουργήθηκαν ${generated.length} συμπληρωμένα έγγραφα${csvText}, μαζί σε ένα ZIP. Θα το βρεις στις Λήψεις του browser.`)
    +(unfilled?(unfilled===1?' Ένα πεδίο «@» έμεινε όπως είναι γραμμένο':` ${unfilled} πεδία «@» έμειναν όπως είναι γραμμένα`)+' στο πρότυπο (δες τα «Πεδία που θέλουν έλεγχο»).':''));
  }catch(error){console.error(error);notice('Παρουσιάστηκε σφάλμα κατά τη δημιουργία των αρχείων.',true)}
  finally{setBusy(false)}
 };
 $('reset').onclick=async()=>{
  if(busy)return;
  if(dirty&&!await schoolConfirm('Να αφαιρεθούν όλα τα αρχεία και οι τιμές που συμπλήρωσες και δεν έχουν εξαχθεί;',{title:'Μη αποθηκευμένες αλλαγές',accept:'Απόρριψη αλλαγών'}))return;
  files=[];selected=new Set();anchor=null;values=new Map();
  clearScan('Τα πεδία που θα βρεθούν θα εμφανιστούν εδώ.');renderFiles();mark(false);
  notice('Η λίστα αρχείων και οι τιμές καθάρισαν.');
 };

 renderFiles();
 renderSchool();
 renderFieldsPlaceholder('Τα πεδία που θα βρεθούν θα εμφανιστούν εδώ.');
 notice('Η επεξεργασία γίνεται τοπικά στον browser. Τα αρχεία δεν αποστέλλονται πουθενά.');
 post({type:'school-documents:ready'});
})();
