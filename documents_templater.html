<style>

#filesPane{display:flex;flex-direction:column;gap:0;min-height:0}

.period-field{display:grid;gap:4px;margin:0 0 10px}

.target-list{flex:1;min-height:140px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column}

/* Narrow: each row becomes a card (field and type, then explanation and example), with no sideways scrolling. */

<script>
// Pure template logic: placeholder discovery, CSV values and DOCX/XLSX filling. No DOM of the page.
// Fields that start with «@» come from the shared file (SchoolDocumentFields in _data.js): they are kept apart from
// the manual fields, take their type from the catalogue and never go to the values CSV.
window.TemplaterModel=(()=>{
 const DATA_MARK=window.SchoolDocumentFields?.MARK||'@';
 const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const DOCX_PARTS=/^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/;
 const SHEET_PARTS=/^xl\/worksheets\/sheet\d+\.xml$/;
 const TYPES=['Decimal','Integer','Date','Text','Textarea'];

 // CSV of field values: «Πεδίο,Τιμή» per row, with or without a heading row (tokenizer: SchoolCsv in _data.js).
 function parseCsv(text){
  const rows=SchoolCsv.parse(text,{delimiter:','});
  if(!rows.length)return new Map();
  const norm=v=>String(v??'').trim().toLocaleLowerCase('el'),head=rows[0].map(norm);
  const fieldHeaders=['πεδίο','field','όνομα πεδίου','name'],valueHeaders=['τιμή','value','τιμές'];
  let fi=head.findIndex(v=>fieldHeaders.includes(v)),vi=head.findIndex(v=>valueHeaders.includes(v)),start=fi>=0&&vi>=0?1:0;
  if(start===0){fi=0;vi=1}
  const out=new Map();
  for(let i=start;i<rows.length;i++){const name=String(rows[i][fi]??'').trim();if(!name||rows[i][vi]===undefined)continue;out.set(name,String(rows[i][vi]))}
  return out;
 }
 async function loadCsvValues(csvFiles){const out=new Map();for(const f of csvFiles){for(const [k,v] of parseCsv(await f.text()))out.set(k,v)}return out}
 function buildValuesCsv(fields,values){
  const rows=[['Πεδίο','Τιμή'],...Array.from(fields.keys()).map(name=>[name,values.get(name)??''])];
  return new Blob(['﻿',rows.map(r=>r.map(SchoolCsv.quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 }
 function parseToken(raw){
  let [name,...rest]=raw.split(':');name=name.trim();
  const type=rest.join(':').trim()||'Text';
  const known=TYPES.find(t=>t.toLowerCase()===type.toLowerCase());
  return known?{name,type:known}:{name,type:'Text',warning:type};
 }
 // found: {fields (manual), data (fields «@»)}; tokens: every field of one template as written (with «:Type»).
 function collect(text,src,found,tokens){
  const re=/\{\{\s*([^{}]+?)\s*\}\}/g;let m;
  while((m=re.exec(text))){
   if(m[1].startsWith('#')||m[1].startsWith('/'))continue;
   const p=parseToken(m[1]);if(!p.name)continue;
   tokens.add(m[1]);
   if(p.name.startsWith(DATA_MARK)){
    const item=found.data.get(p.name);
    if(item)item.sources.add(src);else found.data.set(p.name,{name:p.name,sources:new Set([src])});
    continue;
   }
   const fields=found.fields,prev=fields.get(p.name);
   if(prev&&prev.type!==p.type&&p.type!=='Text')prev.conflict=true;
   else if(!prev)fields.set(p.name,{...p,sources:new Set([src])});
   if(prev)prev.sources.add(src);
  }
 }
 function xmlText(elm){return Array.from(elm.getElementsByTagName('t')).map(t=>t.textContent).join('')}
 async function sharedStrings(zip){
  if(!zip.file('xl/sharedStrings.xml'))return [];
  const d=new DOMParser().parseFromString(await zip.file('xl/sharedStrings.xml').async('string'),'application/xml');
  return Array.from(d.getElementsByTagName('si')).map(xmlText);
 }
 async function scanDocx(zip,src,found,tokens){
  for(const p of Object.keys(zip.files).filter(p=>DOCX_PARTS.test(p))){
   const doc=new DOMParser().parseFromString(await zip.file(p).async('string'),'application/xml');
   for(const para of doc.getElementsByTagNameNS(W_NS,'p'))collect(Array.from(para.getElementsByTagNameNS(W_NS,'t')).map(n=>n.textContent).join(''),src,found,tokens);
  }
 }
 function cellText(c,shared){
  const type=c.getAttribute('t');
  if(type==='s'){const v=c.getElementsByTagName('v')[0];return v?(shared[Number(v.textContent)]||''):''}
  if(type==='inlineStr'){const is=c.getElementsByTagName('is')[0];return is?xmlText(is):''}
  if(type==='str'){const v=c.getElementsByTagName('v')[0];return v?v.textContent:''}
  return '';
 }
 // Cell addresses: «AC11» ↔ {row:11, col:29}. Excel's grid is A1–XFD1048576.
 const MAX_ROW=1048576,MAX_COL=16384;
 function colNumber(letters){let n=0;for(const ch of letters)n=n*26+ch.charCodeAt(0)-64;return n}
 function colLetters(num){let s='';for(let n=num;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
 function parseRef(ref){const m=/^([A-Z]{1,3})(\d+)$/.exec(String(ref||''));return m?{row:Number(m[2]),col:colNumber(m[1])}:null}
 const cellRef=(row,col)=>colLetters(col)+row;
 const insideSheet=(row,col)=>row>=1&&row<=MAX_ROW&&col>=1&&col<=MAX_COL;
 // The worksheets in the order of the workbook's tabs (not the order of the parts in the zip) → [{name, path}].
 async function workbookSheets(zip){
  const parts=Object.keys(zip.files).filter(p=>SHEET_PARTS.test(p)).sort((a,b)=>Number(/(\d+)\.xml$/.exec(a)[1])-Number(/(\d+)\.xml$/.exec(b)[1]));
  const book=zip.file('xl/workbook.xml'),rels=zip.file('xl/_rels/workbook.xml.rels');
  if(!book||!rels)return parts.map(path=>({name:path,path}));

 // Keyboard: the arrows move between the rows without changing the ticks (a ticked list is not lost by a key press),
 // Space ticks or unticks the row, Ctrl/Cmd+A ticks all of them.
 $('targetList').addEventListener('keydown',event=>{
  if(busy)return;
  const tab=activeTab,order=targetOrder(tab);if(!order.length)return;
  if(Selection.isSelectAll(event)){event.preventDefault();picked[tab]=new Set(order);afterChoice(pickAnchor[tab]||order[0]);return}
  const current=document.activeElement?.closest?.('.target-item')?.dataset.key||pickAnchor[tab]||order[0];
  if(event.key===' '){event.preventDefault();choose(current,{ctrlKey:true});return}
  if(event.key!=='ArrowUp'&&event.key!=='ArrowDown'&&event.key!=='Home'&&event.key!=='End')return;
  event.preventDefault();
  let index=order.indexOf(current);
  index=event.key==='Home'?0:event.key==='End'?order.length-1:Math.max(0,Math.min(order.length-1,index+(event.key==='ArrowDown'?1:-1)));
  pickAnchor[tab]=order[index];renderTargets();
  $('targetList').querySelector(`[data-key="${CSS.escape(order[index])}"]`)?.focus();
 });

 // ---- Πεδία «@»: κατάσταση για τη φόρμα και την παραγωγή ----
 const dataTokens=file=>(templateTokens.get(file)||[]).filter(raw=>raw.trim().startsWith(MARK));
 const tokenName=raw=>String(raw).split(':')[0].trim();
 const recognize=token=>F?F.recognize(token,docCtx):{data:true,known:false,scope:'',type:'Text',needsPeriod:false,message:''};
 // ---- Πρότυπα XLSX με άγκυρες ----
 // {{@Τμ.Άγκυρα}} / {{@Εκπ.Άγκυρα}} mark positions: all the chosen classes or teachers go into one workbook, one per
 // position. The first anchor of a sheet with its own fields of that kind is the first block: those fields are copied
 // to every other position at the same distance from its anchor (text only; the target keeps its format). A sheet with
 // anchors only continues the previous group of the same kind. Groups of the same kind must have the same number of
 // positions. More chosen than positions: another workbook, with all the sheets.
 const ANCHOR_SCOPES=['class','staff'];
 const SCOPE_OF={staff:'εκπαιδευτικού',class:'τμήματος'},SCOPE_MANY={staff:'εκπαιδευτικών',class:'τμημάτων'};
 const anchorField=scope=>'{{'+MARK+(scope==='staff'?'Εκπ':'Τμ')+'.Άγκυρα}}';
 const isXlsx=file=>ext(file)==='xlsx';
 // The kind of a field «@»: staff, class or common, also for a field the catalogue does not know (by its prefix).
 function tokenScope(raw){
  if(!String(raw).trim().startsWith(MARK))return 'common';
  const item=recognize(raw);if(item.scope==='staff'||item.scope==='class')return item.scope;if(item.scope)return 'common';
  const key=fieldKey(tokenName(raw).slice(MARK.length));
  return key.startsWith('ΕΚΠ.')?'staff':key.startsWith('ΤΜ.')?'class':'common';
 }
 const refsText=refs=>refs.length>6?refs.slice(0,6).join(', ')+` και ${refs.length-6} ακόμη`:refs.join(', ');
 // → {groups:[{scope, sheets, source, capacity, names, positions:[{path, anchor, cells:[{ref, text}]}]}], errors, notes, capacity, positions, sheets}
 function anchorPlan(file){
  const plan={groups:[],errors:[],notes:[],capacity:{},positions:{staff:0,class:0},sheets:{staff:0,class:0}};
  const last={staff:null,class:null};
  for(const sheet of templateSheets.get(file)||[]){
   const anchors={staff:[],class:[]},fieldCells={staff:[],class:[]},fieldNames={staff:new Set(),class:new Set()};
   for(const cell of sheet.cells){
    const kinds=new Set();
    for(const raw of cell.tokens){
     if(!raw.trim().startsWith(MARK))continue;
     const item=recognize(raw);
     if(item.anchor){if(!anchors[item.scope].includes(cell))anchors[item.scope].push(cell);continue}
     const scope=tokenScope(raw);if(scope!=='common'){kinds.add(scope);fieldNames[scope].add(tokenName(raw))}
    }
    for(const scope of kinds)fieldCells[scope].push(cell);
   }
   const has=scope=>anchors[scope].length>0,where=`Η καρτέλα ${quoted(sheet.name)}`;
   if(has('staff')&&has('class')){plan.errors.push(`${where} έχει άγκυρες εκπαιδευτικού και τμήματος· κάθε καρτέλα έχει άγκυρες ενός μόνο είδους.`);continue}
   let bad=false;
   for(const scope of ANCHOR_SCOPES)if(fieldCells[scope].length&&!has(scope)){
    const names=[...fieldNames[scope]].map(name=>'{{'+name+'}}');
    plan.errors.push(`${where} έχει πεδία ${SCOPE_OF[scope]} (${names.slice(0,3).join(', ')}${names.length>3?' …':''}) χωρίς ${anchorField(scope)}.`);bad=true;
   }
   const scope=ANCHOR_SCOPES.find(has);
   if(bad||!scope)continue;
   let group=null;
   if(fieldCells[scope].length){
    const origin=anchors[scope][0];
    group={scope,sheets:[],capacity:0,positions:[],names:[...new Set(fieldCells[scope].flatMap(cell=>cell.tokens.filter(raw=>raw.trim().startsWith(MARK)).map(tokenName)))],
     source:{name:sheet.name,cells:fieldCells[scope].map(cell=>({ref:cell.ref,dr:cell.row-origin.row,dc:cell.col-origin.col,text:cell.text}))}};
    plan.groups.push(group);last[scope]=group;
   }else if(last[scope])group=last[scope];
   else{plan.notes.push(`${where} έχει μόνο άγκυρες ${SCOPE_OF[scope]}, χωρίς προηγούμενη καρτέλα με πεδία ${SCOPE_OF[scope]}· οι θέσεις της μένουν κενές.`);continue}
   group.sheets.push({name:sheet.name,path:sheet.path,anchors:anchors[scope],filled:sheet.filled});group.capacity+=anchors[scope].length;
   plan.positions[scope]+=anchors[scope].length;plan.sheets[scope]++;
  }
  for(const group of plan.groups){
   let index=0;
   for(const sheet of group.sheets)for(const anchor of sheet.anchors){
    const cells=[],busy=[],outside=[];
    for(const src of group.source.cells){
     const row=anchor.row+src.dr,col=anchor.col+src.dc;
     if(!M.insideSheet(row,col)){outside.push(src.ref);continue}
     const ref=M.cellRef(row,col);
     // The first position is the first block itself; elsewhere a cell that is not empty is not changed.
     if(index>0&&sheet.filled.has(ref)){busy.push(ref);continue}
     cells.push({ref,text:src.text});
    }
    const at=`Καρτέλα ${quoted(sheet.name)}, θέση ${index+1} (${anchor.ref})`;
    if(busy.length)plan.notes.push(`${at}: ${busy.length===1?'το κελί '+busy[0]+' δεν είναι άδειο και δεν αλλάζει':'τα κελιά '+refsText(busy)+' δεν είναι άδεια και δεν αλλάζουν'}.`);
    if(outside.length)plan.notes.push(`${at}: ${outside.length===1?'το πεδίο του κελιού '+outside[0]+' θα έβγαινε':'τα πεδία των κελιών '+refsText(outside)+' θα έβγαιναν'} έξω από το φύλλο και παραλείπ${outside.length===1?'εται':'ονται'}.`);
    group.positions.push({path:sheet.path,anchor:anchor.ref,cells});index++;
   }
  }
  for(const scope of ANCHOR_SCOPES){
   const groups=plan.groups.filter(group=>group.scope===scope);if(!groups.length)continue;
   plan.capacity[scope]=groups[0].capacity;
   if(groups.some(group=>group.capacity!==groups[0].capacity))
    plan.errors.push(`Οι καρτέλες ${SCOPE_MANY[scope]} δεν έχουν το ίδιο πλήθος θέσεων: ${groups.map(group=>group.sheets.map(sheet=>quoted(sheet.name)).join(' + ')+' '+group.capacity).join(', ')}. Μια καρτέλα με δικά της πεδία ξεκινά νέα ομάδα· κάθε ομάδα του ίδιου είδους χρειάζεται τις ίδιες θέσεις.`);
  }
  return plan;
 }
 // Workbooks of a template with anchors: as many as the kind that needs the most.
 const anchorBooks=plan=>Math.max(1,...Object.entries(plan.capacity).map(([scope,cap])=>cap?Math.ceil(picked[scope].size/cap):1));
 // The cells of the positions for one workbook → Map(sheet part → [{ref, text, map}]). ids: the chosen, in list order.
 function anchorWrites(plan,book,ids,base,types){
  const out=new Map();
  for(const group of plan.groups){
   const names=group.names.filter(name=>recognize(name).known);
   for(const name of names)types.set(name,recognize(name).type);
   group.positions.forEach((position,index)=>{
    const id=ids[group.scope][book*group.capacity+index];
    const own=id&&F?F.values(names,{type:group.scope,id},docCtx):new Map(names.map(name=>[name,'']));
    const map=new Map([...base,...own]);
    if(!out.has(position.path))out.set(position.path,[]);
    for(const cell of position.cells)out.get(position.path).push({ref:cell.ref,text:cell.text,map});
   });
  }
  return out;
 }
 const bookName=(name,book,books)=>{if(books<2)return name;const match=/^(.*?)(\.[^.]+)?$/.exec(name);return match[1]+' - '+(book+1)+(match[2]||'')};

 // → {total, filled, notes, anchorNotes, kinds (template → templateKind), plans (anchored XLSX → anchorPlan), staffT,
 //    classT, jobs, missing, infos, positions}
 function dataStatus(){
  const templates=files.filter(isTemplate),names=new Map(),notes=new Map(),kinds=new Map(),plans=new Map(),anchorNotes=[];
  for(const file of templates){
   const tokens=dataTokens(file),all=templateTokens.get(file)||[];
   // An anchor in a DOCX is not used: the kind of the template comes from its other fields.
   const docxAnchors=!isXlsx(file)?tokens.filter(raw=>recognize(raw).anchor):[];
   kinds.set(file,F?F.templateKind(docxAnchors.length?all.filter(raw=>!docxAnchors.includes(raw)):all,docCtx):{kind:tokens.length?'common':'none',staff:[],class:[]});
   if(isXlsx(file)&&kinds.get(file).kind==='anchored')plans.set(file,anchorPlan(file));
   for(const raw of tokens){
    const name=tokenName(raw);if(!names.has(name))names.set(name,recognize(name));
    const item=recognize(raw);
    const message=docxAnchors.includes(raw)?'Οι άγκυρες χρησιμοποιούνται μόνο σε πρότυπα XLSX· εδώ γράφει κενό.':item.message;
    if(message){const key=raw+'\n'+message,note=notes.get(key)||{raw,message,filled:item.known,files:new Set()};note.files.add(file.name);notes.set(key,note)}
   }
   for(const line of plans.get(file)?.notes||[])anchorNotes.push({text:line,file:file.name});
  }
  const items=[...names.values()],filled=items.filter(item=>item.known).length;
  const needs=scope=>templates.filter(file=>kinds.get(file).kind===scope||(plans.get(file)?.capacity[scope]!==undefined));
  const staffT=needs('staff'),classT=needs('class');
  const mixed=templates.filter(file=>kinds.get(file).kind==='mixed');
  const needsPeriod=items.some(item=>item.known&&item.needsPeriod);
  const missing=[],infos=[],positions=[];
  if(names.size){
   if(!F)missing.push('Δεν φορτώθηκαν τα πεδία από το κοινό αρχείο. Βεβαιώσου ότι το _data.js είναι η τελευταία έκδοση.');
   else if(!input)missing.push('Τα πεδία «@» συμπληρώνονται από το κοινό αρχείο: άνοιξέ το από την αρχική σελίδα του Κεντρικού Μενού.');
   else{
    for(const file of mixed){const kind=kinds.get(file);missing.push(`Το πρότυπο ${quoted(file.name)} έχει μαζί πεδία εκπαιδευτικού (${list(kind.staff.slice(0,3))}${kind.staff.length>3?' …':''}) και τμήματος (${list(kind.class.slice(0,3))}${kind.class.length>3?' …':''}). Χώρισέ το σε δύο πρότυπα, ή βάλε άγκυρες σε πρότυπο XLSX.`)}
    for(const [file,plan] of plans)for(const error of plan.errors)missing.push(`Πρότυπο ${quoted(file.name)}: ${error}`);
    if(needsPeriod&&!docCtx?.period)missing.push(periods().length?'Διάλεξε περίοδο.':'Το σχολικό έτος δεν έχει περιόδους· τα πρότυπα έχουν πεδία της περιόδου ή του Ωρολογίου.');
    if(staffT.length&&!picked.staff.size)missing.push(`Διάλεξε εκπαιδευτικούς για ${staffT.length===1?'το πρότυπο':'τα πρότυπα'} ${list(staffT.map(file=>file.name))}.`);
    if(classT.length&&!picked.class.size)missing.push(`Διάλεξε τμήματα για ${classT.length===1?'το πρότυπο':'τα πρότυπα'} ${list(classT.map(file=>file.name))}.`);
    if(needsPeriod&&docCtx?.period&&!docCtx.program)infos.push(`Η περίοδος ${quoted(docCtx.period.name||'')} δεν έχει Ωρολόγιο· τα πεδία του προγράμματος θα μείνουν κενά.`);
    if(docCtx?.slotError&&[...names.keys()].some(name=>/\.(Πρ|Ώρες)\.|^@Ώρα\./.test(name)))infos.push('Ώρες Διδασκαλίας: '+docCtx.slotError);
   }
  }
  // Positions of the templates with anchors, and how many workbooks they give.
  for(const [file,plan] of plans){
   const parts=ANCHOR_SCOPES.filter(scope=>plan.positions[scope]).map(scope=>`${plan.positions[scope]} ${plan.positions[scope]===1?'θέση':'θέσεις'} ${SCOPE_MANY[scope]} (${plan.sheets[scope]===1?'1 καρτέλα':plan.sheets[scope]+' καρτέλες'})`);
   if(!parts.length)continue;
   const books=anchorBooks(plan);
   positions.push(`${quoted(file.name)}: ${parts.join(', ')}· ${books===1?'θα παραχθεί 1 βιβλίο':'θα παραχθούν '+books+' βιβλία'}.`);
  }
  const jobs=templates.reduce((sum,file)=>sum+(plans.has(file)?anchorBooks(plans.get(file)):kinds.get(file).kind==='staff'?picked.staff.size:kinds.get(file).kind==='class'?picked.class.size:1),0);
  return {total:names.size,filled,notes:[...notes.values()],anchorNotes,kinds,plans,staffT,classT,jobs,missing,infos,positions};
 }
 function bulletList(lines){const ul=document.createElement('ul');for(const line of lines){const li=document.createElement('li');if(line instanceof Node)li.append(line);else li.textContent=line;ul.append(li)}return ul}
 function para(text,className=''){const p=document.createElement('p');if(className)p.className=className;p.textContent=text;return p}
 // The fields «@» are never shown in the form: only this summary, above the manual fields.
 function renderSummary(){
  const box=$('dataSummary');if(!box)return;
  box.replaceChildren();
  const status=dataStatus();
  const head=document.createElement('p');head.className='data-summary-head';
  head.textContent=`Πεδία από το κοινό αρχείο: ${status.total}`+(input&&F?` · θα συμπληρωθούν ${status.filled===status.total?'όλα':status.filled===1?'το 1':'τα '+status.filled}.`:'.');
  box.append(head);
  // Templates with anchors: positions found per kind and workbooks to produce.
  for(const line of status.positions)box.append(para(line));
  if(status.missing.length){box.append(para('Για την παραγωγή λείπει:','data-summary-label data-summary-missing'),bulletList(status.missing))}
  else{box.append(para(status.jobs===1?'Θα παραχθεί 1 έγγραφο.':`Θα παραχθούν ${status.jobs} έγγραφα.`))}
  if(status.infos.length)box.append(bulletList(status.infos));
  if(status.notes.length||status.anchorNotes.length){
   const several=files.filter(isTemplate).length>1;
   box.append(para('Πεδία που θέλουν έλεγχο:','data-summary-label'));
   box.append(bulletList([...status.notes.map(note=>{
    const span=document.createElement('span'),code=document.createElement('code');code.textContent='{{'+note.raw+'}}';
    span.append(code,' — '+note.message+(note.filled?'':' Δεν συμπληρώνεται.')+(several?' ('+[...note.files].join(', ')+')':''));
    return span;
   }),...status.anchorNotes.map(note=>note.text+(several?' ('+note.file+')':''))]));
  }
 }

 // ---- Files ----
 function renderFiles(){
  const list=$('filesList');list.replaceChildren();
  $('filesTitle').textContent=`Αρχεία (${files.length})`;
  if(!files.length){
   list.removeAttribute('role');list.removeAttribute('aria-multiselectable');
   const drop=document.createElement('div');drop.id='fileDrop';drop.className='subapp-file-drop visible';
   const icon=document.createElement('span');icon.className='subapp-file-drop-icon';icon.setAttribute('aria-hidden','true');icon.textContent='⇩';
   const title=document.createElement('span');title.className='subapp-file-drop-title';title.textContent='Σύρε εδώ τα αρχεία σου';
   const text=document.createElement('span');text.className='subapp-file-drop-text';text.textContent=hosted?'ή πάτησε «+ Προσθήκη» για επιλογή από τον δίσκο.':'Η σελίδα άνοιξε χωρίς το Κεντρικό Μενού: πρόσθεσε αρχεία με μεταφορά και απόθεση.';
   const kinds=document.createElement('span');kinds.className='subapp-file-drop-files';kinds.textContent='.docx · .xlsx · .csv';
   drop.append(icon,title,text,kinds);list.append(drop);updateButtons();return;
  }
  list.setAttribute('role','listbox');list.setAttribute('aria-multiselectable','true');
  files.forEach((file,index)=>{
   const b=document.createElement('div');b.className='subapp-list-item subapp-list-item-removable file-item'+(selected.has(file)?' selected':'');
   b.setAttribute('role','option');b.setAttribute('aria-selected',String(selected.has(file)));b.dataset.index=String(index);b.title=file.name;
   b.tabIndex=file===anchor||(!anchor&&index===0)?0:-1;
   const name=document.createElement('span');name.className='file-name';// Show the row number unless the file name already starts with the same number (e.g. «2. Πρακτικό» in row 2).
   const number=index+1;name.textContent=new RegExp('^\\s*0*'+number+'\\s*[.)]').test(file.name)?file.name:`${number}. ${file.name}`;
   const kind=document.createElement('span');kind.className='file-kind';kind.textContent=ext(file)==='docx'?'Word':ext(file)==='xlsx'?'Excel':'CSV τιμών';
   const remove=document.createElement('button');remove.type='button';remove.className='subapp-list-item-remove';remove.tabIndex=-1;remove.textContent='×';
   remove.title='Αφαίρεση από τη λίστα';remove.setAttribute('aria-label','Αφαίρεση του «'+file.name+'» από τη λίστα');
   remove.onclick=event=>{event.stopPropagation();removeFiles(new Set([file]))};
   b.append(name,kind,remove);
   b.onclick=event=>{
    ({selected,anchor}=Selection.click(files,selected,anchor,file,event));
    renderFiles();$('filesList').querySelector(`[data-index="${index}"]`)?.focus();
   };
   list.append(b);
  });
  updateButtons();
 }
 function clearScan(message){scanned=false;fields=new Map();dataFields=new Map();templateTokens=new Map();templateSheets=new Map();csvMatched.clear();renderSchool();renderFieldsPlaceholder(message)}
 function addFiles(list){
  let added=0;const rejected=[];
  for(const f of list){
   if(!ALL_EXT.includes(ext(f))){rejected.push(f.name);continue}
   if(files.some(x=>x.name===f.name&&x.size===f.size))continue;
   files.push(f);added++;
  }
  if(added){clearScan('Πάτησε «Ανεύρεση πεδίων» για να διαβαστούν τα πεδία των προτύπων και οι τιμές του CSV.');renderFiles();mark(true)}
  const t=files.filter(isTemplate).length,c=files.filter(isCsv).length;
  if(rejected.length)notice('Δεν προστέθηκαν, επειδή δεν είναι DOCX, XLSX ή CSV: '+rejected.join(', ')+'.',true);
  else if(added)notice(`Έτοιμα για σάρωση: ${t} ${t===1?'πρότυπο':'πρότυπα'} και ${c} CSV. Πάτησε «Ανεύρεση πεδίων».`);
  else if(list.length)notice('Τα αρχεία υπάρχουν ήδη στη λίστα.');
 }
 function removeFiles(removing){
  if(busy||!removing.size)return;
  const count=removing.size;
  files=files.filter(f=>!removing.has(f));
  for(const f of removing)selected.delete(f);
  if(anchor&&removing.has(anchor))anchor=null;
  clearScan(files.length?'Η λίστα αρχείων άλλαξε. Πάτησε ξανά «Ανεύρεση πεδίων».':'Πρόσθεσε αρχεία και πάτησε «Ανεύρεση πεδίων».');
  renderFiles();mark(files.length>0||values.size>0);
  notice(count===1?'Αφαιρέθηκε 1 αρχείο από τη λίστα.':`Αφαιρέθηκαν ${count} αρχεία από τη λίστα.`);
 }
 const removeSelected=()=>removeFiles(new Set(selected));
 $('addFiles').onclick=async()=>{

    .map(f=>new File([f.buffer],f.name,{type:String(f.type||''),lastModified:Number(f.lastModified)||Date.now()}));
   addFiles(picked);
  }catch(error){notice(error.message,!/ακυρώθηκε/.test(error.message))}
  finally{setBusy(false)}
 };

 const setDrag=on=>{$('filesList').classList.toggle('drag-over',on);$('fileDrop')?.classList.toggle('drag-over',on)};

 // Each staff template once per chosen teacher, each class template once per chosen class (in the order of the lists),
 // a common template or one without fields «@» once. A field «@» that is not exactly of the catalogue stays as written.
 function saveBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
 $('produce').onclick=async()=>{
  if(busy||!scanned||!hasFields())return;
  if(!files.some(isTemplate)){await exportValuesCsv();return}
  if(libraryMissing())return;
  if(!validate()){notice('Διόρθωσε πρώτα τις τιμές που σημειώνονται (αριθμοί ή ημερομηνίες dd/mm/yyyy).',true);return}
  for(const [name,f] of fields)if(f.conflict){notice(`Το πεδίο «${name}» έχει διαφορετικό τύπο σε διαφορετικά πρότυπα. Διόρθωσέ το στα πρότυπα και πάτησε ξανά «Ανεύρεση πεδίων».`,true);return}
  const status=dataStatus();
  if(status.missing.length){notice('Η παραγωγή δεν έγινε. '+status.missing.join(' '),true);return}
  const templates=files.filter(isTemplate),manual=new Map(),manualTypes=new Map();
  for(const [name,f] of fields){const value=values.get(name)??'';manual.set(name,f.type==='Date'?M.dateText(value):value);manualTypes.set(name,f.type)}
  const staffIds=staffList().map(p=>p.id).filter(id=>picked.staff.has(id)),classIds=classList().map(r=>r.id).filter(id=>picked.class.has(id));
  const jobs=[];
  for(const file of templates){
   const kind=status.kinds.get(file).kind,plan=status.plans.get(file);
   const names=[...new Set(dataTokens(file).map(tokenName))].filter(name=>recognize(name).known);
   // A template with anchors: one workbook for all the chosen (more when they do not fit in its positions).
   if(plan){const books=anchorBooks(plan);for(let book=0;book<books;book++)jobs.push({file,target:null,names,anchored:{plan,book,books}});continue}
   const targets=kind==='staff'?staffIds.map(id=>({type:'staff',id})):kind==='class'?classIds.map(id=>({type:'class',id})):[null];
   for(const target of targets)jobs.push({file,target,names});
  }
  setBusy(true);notice('Συμπλήρωση των εγγράφων…');
  try{
   const generated=[];
   for(const job of jobs){
    const map=new Map(manual),typeMap=new Map(manualTypes);
    if(job.names.length&&F){for(const [name,value] of F.values(job.names,job.target,docCtx)){map.set(name,value);typeMap.set(name,recognize(name).type)}}
    if(jobs.length>1)notice(`Συμπλήρωση των εγγράφων… (${generated.length+1} από ${jobs.length})`);
    const writes=job.anchored?anchorWrites(job.anchored.plan,job.anchored.book,{staff:staffIds,class:classIds},map,typeMap):null;
    const name=job.anchored?bookName(job.file.name,job.anchored.book,job.anchored.books):F?F.fileName(job.file.name,job.target,docCtx):job.file.name;
    generated.push({name,blob:await M.generateOne(job.file,map,typeMap,writes)});
   }
   const names=F?F.uniqueNames(generated.map(g=>g.name)):generated.map(g=>g.name);
   generated.forEach((g,i)=>{g.name=names[i]});
   // The values CSV keeps only the fields filled by hand; without such fields there is no CSV.
   const csvBlob=fields.size?M.buildValuesCsv(fields,values):null,csvName='Documents_Templater_Τιμές.csv';
   if(generated.length===1){saveBlob(generated[0].blob,generated[0].name);if(csvBlob)setTimeout(()=>saveBlob(csvBlob,csvName),350)}
   else{const zip=new JSZip();for(const g of generated)zip.file(g.name,g.blob);if(csvBlob)zip.file(csvName,csvBlob);saveBlob(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),'Documents_Templater_συμπληρωμένο.zip')}
   mark(false);
   const csvText=csvBlob?' και το CSV τιμών':'';
   const unfilled=status.notes.filter(note=>!note.filled).length;
   notice((generated.length===1
    ?`Δημιουργήθηκε το συμπληρωμένο «${generated[0].name}»${csvText}. Θα ${csvBlob?'τα':'το'} βρεις στις Λήψεις του browser.`
    :`Δημιουργήθηκαν ${generated.length} συμπληρωμένα έγγραφα${csvText}, μαζί σε ένα ZIP. Θα το βρεις στις Λήψεις του browser.`)
    +(unfilled?(unfilled===1?' Ένα πεδίο «@» έμεινε όπως είναι γραμμένο':` ${unfilled} πεδία «@» έμειναν όπως είναι γραμμένα`)+' στο πρότυπο (δες τα «Πεδία που θέλουν έλεγχο»).':''));

 // Clipboard: the Clipboard API (the iframe of the Central Menu allows clipboard-write), else a copy event.
 async function copyData(text,html){
  try{
   if(html&&navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);return true}
   if(!html&&navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}
  }catch{}
  let done=false;
  const onCopy=event=>{event.preventDefault();event.clipboardData.setData('text/plain',text);if(html)event.clipboardData.setData('text/html',html);done=true};
  document.addEventListener('copy',onCopy);
  try{document.execCommand('copy')}catch{}
  document.removeEventListener('copy',onCopy);
  return done;
 }
 // The ready table of the grid: HTML (for Word) and tab-separated text (for Excel).
 function readyHtml(table){
  const cell='border:1px solid #000;padding:2pt 4pt;vertical-align:top';
  const th=text=>`<th style="${cell}">${schoolEscape(text)}</th>`,td=(text,extra='')=>`<td style="${cell}"${extra}>${schoolEscape(text)}</td>`;
  const rows=table.rows.map(row=>row.type==='break'?`<tr>${td(row.time)}${td(row.text,` colspan="${table.days.length}" align="center"`)}</tr>`:`<tr>${td(row.time)}${row.cells.map(text=>td(text)).join('')}</tr>`);
  return `<meta charset="utf-8"><table style="border-collapse:collapse"><tr>${th('Ώρα')}${table.days.map(th).join('')}</tr>${rows.join('')}</table>`;
 }

 // The field the search names, e.g. «Πρ.Τε.3» → «@Εκπ.Πρ.Τε.3» and «@Τμ.Πρ.Τε.3» (SchoolDocumentFields.recognize,
 // also without the shared file). → {canonical:[…], hint, key}
 function searchedField(query){
  const text=String(query).replace(/[{}]/g,'').trim().split(':')[0].trim().replace(/^@/,'').replace(/\s*\.\s*/g,'.');
  const out={canonical:[],hint:'',key:text.includes('.')?fieldKey(text):''};
  if(!F||!text.includes('.'))return out;
  const head=fieldKey(text.split('.')[0]);
  const candidates=['ΕΚΠ','ΤΜ','ΩΡΑ','ΜΑΘΗΜΑ'].includes(head)?[MARK+text]:[MARK+'Εκπ.'+text,MARK+'Τμ.'+text];
  const messages=[];
  for(const candidate of candidates){const item=F.recognize(candidate,docCtx);if(item.canonical)out.canonical.push(item.canonical);else if(item.message)messages.push(item.message)}
  // Only a specific reason (hour, day or subject code that does not exist), not «the field is not in the catalogue».
  if(!out.canonical.length)out.hint=messages.find(message=>!/δεν υπάρχει στον κατάλογο/.test(message))||'';
  return out;
 }
 const templateRegex=name=>new RegExp('^'+fieldKey(name).split(/<[^>]+>/).map(regexText).join('[^.]+')+'$');
 // The names of a row that the search names: canonical fields, or names that contain the search at dot boundaries.
 function rowSpecific(field,search){
  if(!search.key)return [];
  const names=field.pattern?field.names:[field.name];
  if(field.pattern&&!names.length){const re=templateRegex(field.name);return search.canonical.filter(name=>re.test(fieldKey(name)))}
  const canonical=new Set(search.canonical.map(fieldKey));
  const exact=names.filter(name=>canonical.has(fieldKey(name)));
  if(exact.length)return exact;
  const re=new RegExp('(^|[.@])'+regexText(search.key)+'($|\\.)');
  const found=names.filter(name=>re.test(fieldKey(name)));
  return found.length<=3?found:[];
 }
 // Common prefix of the first and last field up to a dot: what is left names the field of a pattern row («Δε.2»).
 function patternSuffix(field,name){
  const a=field.first||'',b=field.last||'';let i=0;while(i<a.length&&a[i]===b[i])i++;
  const prefix=a.slice(0,a.lastIndexOf('.',i-1)+1);
  return name.startsWith(prefix)?name.slice(prefix.length):name;
 }

  if(!F){
   root.append(el('p','dt-fields-note','Δεν φορτώθηκε ο κατάλογος των πεδίων. Βεβαιώσου ότι το _data.js είναι η τελευταία έκδοση.'));
   schoolChoiceDialog({title:'Πεδία',content:root,className:'dt-fields-dialog',actions:[{label:'Κλείσιμο',cancel:true}]}).finally(()=>{catalogShown=false});
   return;
  }
  const catalog=F.catalog(docCtx);
  const search=el('input','dt-fields-search');search.type='search';search.placeholder='Αναζήτηση (π.χ. «ώρες», «πλήρες όνομα», «Πρ.Τε.3»)';
  search.setAttribute('aria-label','Αναζήτηση πεδίων');search.autocomplete='off';search.spellcheck=false;
  root.append(search);
  // «Παράδειγμα για»: starts from the first chosen teacher and class (in the order of the lists), else the last choice here.
  const staffItems=staffList(),classItems=classList();
  const firstPicked=(items,set)=>items.find(item=>set.has(item.id))?.id||'';
  catalogView.staff=firstPicked(staffItems,picked.staff)||(staffItems.some(item=>item.id===catalogView.staff)?catalogView.staff:'');
  catalogView.class=firstPicked(classItems,picked.class)||(classItems.some(item=>item.id===catalogView.class)?catalogView.class:'');
  if(input){
   const row=el('div','dt-example');row.append(el('span','','Παράδειγμα για:'));
   const makeSelect=(scope,items,label,text)=>{
    const select=el('select');select.setAttribute('aria-label',label);
    select.append(new Option(scope==='staff'?'— εκπαιδευτικός: σταθερό παράδειγμα —':'— τμήμα: σταθερό παράδειγμα —',''));
    for(const item of items)select.append(new Option(text(item),item.id));
    select.value=catalogView[scope];
    select.onchange=()=>{catalogView[scope]=select.value;render(true)};
    return select;
   };
   row.append(makeSelect('staff',staffItems,'Εκπαιδευτικός για τα παραδείγματα',item=>item.name||item.shortName||''),
    makeSelect('class',classItems,'Τμήμα για τα παραδείγματα',item=>item.name||''));
   row.append(el('span','dt-example-period','Περίοδος: '+(docCtx?.period?periodLabel(docCtx.period):periods().length?'καμία':'δεν υπάρχουν περίοδοι')));
   root.append(row);
   if(docCtx?.slotError)root.append(el('p','dt-fields-note','Ώρες Διδασκαλίας: '+docCtx.slotError));
  }else root.append(el('p','dt-fields-note','Σταθερά παραδείγματα· για πραγματικές τιμές άνοιξε το κοινό αρχείο από την αρχική σελίδα του Κεντρικού Μενού.'));
  root.append(status);
  const body=el('div','dt-fields-body');root.append(body);

  const colgroup=()=>{const group=el('colgroup');for(const name of ['field','type','help','example']){const col=el('col','dt-c-'+name);group.append(col)}return group};
  const headRow=()=>{const tr=el('tr');for(const text of ['Πεδίο','Τύπος','Επεξήγηση','Παράδειγμα'])tr.append(el('th','',text));return tr};

  // One row of a group → {tr, hay (text for the search), specific (names the search found)}.
  function rowElement(cells){
   const tr=el('tr');
   for(const [name,content] of [['field',cells.field],['type',cells.type],['help',cells.help],['example',cells.example]]){
    const td=el('td','dt-col-'+name);if(content instanceof Node)td.append(content);else if(Array.isArray(content))td.append(...content);else if(content)td.textContent=content;tr.append(td);
   }
   return tr;
  }
  const exampleLine=(content,className='')=>{const line=el('div','dt-example-line'+(className?' '+className:''));if(Array.isArray(content))line.append(...content);else line.textContent=content;return line};
  const valueLine=(value,where)=>{
   const parts=[value!==''?el('span','',value):el('span','dt-example-empty','(κενό)')];
   if(where)parts.push(' ',el('span','dt-where','('+where+')'));
   return exampleLine(parts);
  };
  const staticLine=example=>example?exampleLine('π.χ. '+example,'dt-example-static'):exampleLine('—','dt-example-static');

  // The editor of the ready table of subjects: one row of the group table, over its four columns.
  function subjectEditor(kind,title){
   const tr=el('tr','dt-subjects-row'),td=el('td');td.colSpan=4;tr.append(td);
   const box=el('div','dt-subjects');td.append(box);
   const head=el('div','dt-subjects-head');head.append(el('strong','',title),el('span','dt-type',TYPE_SHORT.Table));box.append(head);
   const subjects=catalog.subjects||[];
   if(!input||!docCtx?.program||!subjects.length){
    box.append(el('p','dt-subjects-help',!input?'Ο πίνακας φτιάχνεται από τα μαθήματα του Ωρολογίου: χρειάζεται ανοιχτό κοινό αρχείο.':!docCtx?.period?'Χρειάζεται περίοδο με Ωρολόγιο: διάλεξέ την στα «Στοιχεία σχολείου».':!docCtx.program?`Η περίοδος ${quoted(docCtx.period.name||'')} δεν έχει Ωρολόγιο· διάλεξε περίοδο με Ωρολόγιο.`:'Το Ωρολόγιο της περιόδου δεν έχει μαθήματα με κωδικό στο FET.'));
    return tr;
   }
   box.append(el('p','dt-subjects-help','Για έντυπα με μία γραμμή ανά μάθημα. Τσέκαρε τα μαθήματα του εντύπου και βάλ\' τα στη σειρά του με σύρσιμο από τη λαβή (ή Alt+↑/↓)· η «Κενή γραμμή» είναι για σειρές του εντύπου χωρίς μάθημα στο FET. «Ημέρες»: μία γραμμή ανά μάθημα, με στήλες Δε–Πα (επικόλληση στο κελί της Δευτέρας του πρώτου μαθήματος)'+(kind==='class'?'· «Διδάσκοντες»: μία στήλη με όσους διδάσκουν κάθε μάθημα. Οι δύο αντιγραφές είναι χωριστές, ώστε μια στήλη ανάμεσά τους (π.χ. με τύπο) να μη σβήνεται.':'.')));
   const byCode=new Map(subjects.map(item=>['c:'+item.code,item])),keys=subjectKeys(subjects);
   const listBox=el('ol','dt-subjects-list');listBox.setAttribute('aria-label','Μαθήματα του πίνακα');
   const move=(key,delta)=>{
    const order=subjectView.order,visible=subjectKeys(subjects),at=visible.indexOf(key),to=at+delta;
    if(at<0||to<0||to>=visible.length)return;
    const a=order.indexOf(key),b=order.indexOf(visible[to]);order.splice(a,1);order.splice(b,0,key);
    rerender(kind+'|'+key+'|handle');
   };
   for(const key of keys){
    const item=byCode.get(key),blank=key.startsWith('b:'),on=blank||subjectView.on.has(key.slice(2));
    const li=el('li','dt-subject'+(on?'':' off'));li.dataset.key=key;
    const handle=el('button','dt-subject-handle');handle.type='button';handle.textContent='⋮⋮';handle.dataset.focus=kind+'|'+key+'|handle';
    handle.title='Σύρε για αλλαγή σειράς (ή Alt+↑/↓)';handle.setAttribute('aria-label','Μετακίνηση: '+(blank?'Κενή γραμμή':item.name)+' (Alt+↑/↓)');
    handle.addEventListener('keydown',event=>{if(event.altKey&&(event.key==='ArrowUp'||event.key==='ArrowDown')){event.preventDefault();move(key,event.key==='ArrowUp'?-1:1)}});
    handle.addEventListener('pointerdown',event=>startSubjectDrag(event,li,listBox,kind,key));
    li.append(handle);
    if(blank){
     li.append(el('span','dt-subject-name dt-subject-blank','Κενή γραμμή'));
     const remove=el('button','dt-subject-remove');remove.type='button';remove.textContent='×';remove.title='Αφαίρεση της κενής γραμμής';remove.setAttribute('aria-label','Αφαίρεση της κενής γραμμής');
     remove.onclick=()=>{subjectView.order.splice(subjectView.order.indexOf(key),1);rerender(kind+'|add')};
     li.append(remove);
    }else{
     const label=el('label','dt-subject-label'),check=el('input');check.type='checkbox';check.checked=on;check.dataset.focus=kind+'|'+key+'|check';
     check.onchange=()=>{if(check.checked)subjectView.on.add(item.code);else subjectView.on.delete(item.code);rerender(kind+'|'+key+'|check')};
     label.append(check,el('span','dt-subject-name',item.name),el('span','dt-subject-code',item.code));
     li.append(label);
    }
    listBox.append(li);
   }
   box.append(listBox);
   const rows=keys.filter(key=>key.startsWith('b:')||subjectView.on.has(key.slice(2))).map(key=>key.startsWith('b:')?null:key.slice(2));
   const table=F.subjectTable(kind,rows,docCtx);
   const actions=el('div','dt-subjects-actions');
   const add=el('button','ui-compact-button');add.type='button';add.textContent='+ Κενή γραμμή';add.dataset.focus=kind+'|add';
   add.onclick=()=>{subjectView.order.push('b:'+(++subjectView.blanks));rerender(kind+'|add')};
   actions.append(add);
   const lessons=rows.filter(Boolean).length;
   if(!lessons)actions.append(el('span','dt-subjects-empty','Τσέκαρε τουλάχιστον ένα μάθημα.'));
   else{
    const count=rows.length===1?'1 γραμμή':rows.length+' γραμμές';
    actions.append(fieldChip({text:subjectText(table.days),html:subjectHtml(table.days),label:`«Ημέρες» (${count})`,display:`Ημέρες (${count})`,className:'ready',status}));
    if(table.teachers)actions.append(fieldChip({text:subjectText(table.teachers.map(text=>[text])),html:subjectHtml(table.teachers.map(text=>[text])),label:`«Διδάσκοντες» (${count})`,display:`Διδάσκοντες (${count})`,className:'ready',status}));
   }
   box.append(actions);
   return tr;
  }
  // Drag by the handle (pointer events): the row follows the pointer vertically; on release the order is kept.
  function startSubjectDrag(event,li,listBox,kind,key){
   if(event.button!==0||!event.isPrimary)return;
   event.preventDefault();
   // Listened on the document: moving the row in the list would drop a pointer capture of its handle.
   const pointer=event.pointerId;
   li.classList.add('dragging');
   const onMove=moveEvent=>{
    if(moveEvent.pointerId!==pointer)return;
    // The list runs in columns, row by row: the row goes before or after the nearest other row.
    let near=null,best=Infinity;
    for(const node of listBox.children){
     if(node===li)continue;
     const r=node.getBoundingClientRect(),dx=Math.max(r.left-moveEvent.clientX,0,moveEvent.clientX-r.right),dy=Math.max(r.top-moveEvent.clientY,0,moveEvent.clientY-r.bottom),d=dx*dx+dy*dy*4;
     if(d<best){best=d;near=node}
    }
    if(!near)return;
    const r=near.getBoundingClientRect(),before=moveEvent.clientY<r.top||(moveEvent.clientY<=r.bottom&&moveEvent.clientX<r.left+r.width/2);
    listBox.insertBefore(li,before?near:near.nextSibling);
   };
   const finish=cancel=>{
    document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onCancel);document.removeEventListener('keydown',onKey,true);
    li.classList.remove('dragging');
    if(cancel){rerender(kind+'|'+key+'|handle');return}
    // The new order of the visible rows; the lessons that are hidden (not in this Ωρολόγιο) go after them.
    const visible=[...listBox.children].map(node=>node.dataset.key),hidden=subjectView.order.filter(k=>!visible.includes(k));
    subjectView.order=[...visible,...hidden];
    rerender(kind+'|'+key+'|handle');
   };
   const onUp=upEvent=>{if(upEvent.pointerId===pointer)finish(false)},onCancel=cancelEvent=>{if(cancelEvent.pointerId===pointer)finish(true)};
   const onKey=keyEvent=>{if(keyEvent.key==='Escape'){keyEvent.preventDefault();keyEvent.stopPropagation();finish(true)}};
   document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onCancel);document.addEventListener('keydown',onKey,true);
  }
  // A change of the ready table of subjects: draw again, keeping the scroll and the focus.
  function rerender(focus){
   render(true);
   body.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus({preventScroll:true});
  }

  function groupModel(group,query){
   const scope=group.key.startsWith('staff')?'staff':group.key.startsWith('class')?'class':'common';
   const targetId=scope==='common'?'':catalogView[scope];
   const target=targetId?{type:scope,id:targetId}:null;
   const needsProgram=PROGRAM_GROUPS.has(group.key);
   const canReal=!!input&&(scope==='common'||!!target)&&(!needsProgram||!!docCtx?.program);
   const terms=query.terms,searching=!!terms.length;
   const matches=hay=>terms.every(term=>hay.includes(term));
   const rows=[];
   // The ready table of the grid, first in «Πρόγραμμα εκπαιδευτικού» / «Πρόγραμμα τμήματος».
   if(READY_GROUPS[group.key]){
    const kind=READY_GROUPS[group.key],table=F.readyTable(kind,docCtx),title='Έτοιμος πίνακας '+(kind==='staff'?'εκπαιδευτικού':'τμήματος');
    const hay=plainUpper([title,'πίνακας πλέγμα πρόγραμμα',group.label].join(' '));
    if(!searching||matches(hay)){
     const slotsN=table.rows.filter(row=>row.type==='slot').length,breaks=table.rows.length-slotsN;
     const help=table.rows.length
      ?`Γραμμές οι ώρες (${slotsN}) και στήλες οι ημέρες, με τα πεδία {{@Ώρα.…}} στην πρώτη στήλη`+(breaks?` και ${breaks===1?'1 διάλειμμα':breaks+' διαλείμματα'} με την ώρα τους.`:'.')+' Σύρε τον στο Word ή στο Excel, ή αντίγραψέ τον.'
      :'Ο πίνακας φτιάχνεται από τις Ώρες Διδασκαλίας: χρειάζεται ανοιχτό κοινό αρχείο.';
     const field=table.rows.length?fieldChip({text:readyText(table),html:readyHtml(table),label:title,display:title,className:'ready',status}):el('span','dt-field-template',title);
     rows.push(rowElement({field,type:TYPE_SHORT.Table,help,example:''}));
    }
   }
   // The ready table of subjects, first in «Ώρες εκπαιδευτικού» / «Ώρες τμήματος».
   if(SUBJECT_GROUPS[group.key]){
    const kind=SUBJECT_GROUPS[group.key],title='Έτοιμος πίνακας μαθημάτων '+(kind==='staff'?'εκπαιδευτικού':'τμήματος');
    const hay=plainUpper([title,'πίνακας μαθημάτων ημέρες διδάσκοντες ποιες ώρες',group.label].join(' '));
    if(!searching||matches(hay))rows.push(subjectEditor(kind,title));
   }
   const items=[];
   for(const field of group.fields){
    const names=field.pattern?field.names:[field.name];
    const specific=rowSpecific(field,query.search);
    const hay=plainUpper([field.name,...names,field.help,group.label,TYPE_SHORT[field.type]||''].join(' '));
    if(searching&&!matches(hay)&&!specific.length)continue;
    items.push({field,names,specific});
   }
   // Lessons of the Ωρολόγιο of the period, each with its fields.
   const subjects=group.key==='subjects'?(catalog.subjects||[]).map(item=>({item,names:[MARK+'Μάθημα.'+item.code,MARK+'Μάθημα.'+item.code+'.Πλήρες']}))
    .filter(entry=>!searching||matches(plainUpper([entry.item.code,entry.item.name,entry.item.longName,group.label,'μάθημα'].join(' ')))||entry.names.some(name=>query.search.canonical.some(c=>fieldKey(c)===fieldKey(name)))):[];
   // Real values: one SchoolDocumentFields.values for the group.
   let values=new Map();
   if(canReal){
    const all=[...items.flatMap(entry=>[...entry.names,...entry.specific]),...subjects.flatMap(entry=>entry.names)];
    if(all.length)values=F.values(all,target,docCtx);
   }
   const total=group.fields.length+(READY_GROUPS[group.key]?1:0)+(SUBJECT_GROUPS[group.key]?1:0)+(group.key==='subjects'?(catalog.subjects||[]).length:0);
   for(const {field,names,specific} of items){
    const chips=[];
    if(field.pattern&&!names.length)chips.push(el('span','dt-field-template',braces(field.name)));
    else if(field.pattern){
     chips.push(fieldChip({text:braces(field.first),label:braces(field.first),status}));
     if(field.last&&field.last!==field.first){chips.push(el('div','dt-field-gap','…'),fieldChip({text:braces(field.last),label:braces(field.last),status}))}
    }else chips.push(fieldChip({text:braces(field.name),label:braces(field.name),status,className:specific.length?'found':''}));
    // The field the search names: marked when it is the first or last field, else added under them.
    if(field.pattern)for(const name of specific){
     const chip=chips.find(item=>item.classList.contains('dt-field')&&item.querySelector('code').textContent===braces(name));
     if(chip)chip.classList.add('found');else chips.push(fieldChip({text:braces(name),label:braces(name),status,className:'found'}));
    }
    // A common field of the period needs a period; the Ωρολόγιο fields need the Ωρολόγιο (canReal).
    const real=canReal&&!(scope==='common'&&!field.pattern&&!docCtx?.period&&F.recognize(field.name,docCtx).needsPeriod)&&(!field.pattern||names.length>0);
    const example=[];
    if(real){
     // Pattern row: the first value that says something (not empty, and for numbers not «0»).
     if(field.pattern){const has=name=>(values.get(name)??'')!=='',first=names.find(name=>has(name)&&values.get(name)!=='0')||names.find(has);example.push(first?valueLine(values.get(first),patternSuffix(field,first)):valueLine('',''))}
     else example.push(valueLine(values.get(field.name)??'',''));
     if(field.pattern)for(const name of specific)example.push(valueLine(values.get(name)??'',patternSuffix(field,name)));
    }else example.push(staticLine(field.example));
    rows.push(rowElement({field:chips,type:el('span','dt-type',TYPE_SHORT[field.type]||field.type),help:field.help,example}));
   }
   for(const {item,names} of subjects){
    const chips=names.map(name=>fieldChip({text:braces(name),label:braces(name),status,className:query.search.canonical.some(c=>fieldKey(c)===fieldKey(name))?'found':''}));
    const example=[valueLine(values.get(names[0])??item.name,''),valueLine(values.get(names[1])??(item.longName||item.name),'Πλήρες')];
    rows.push(rowElement({field:chips,type:el('span','dt-type',TYPE_SHORT.Text),help:`Μάθημα του Ωρολογίου με κωδικό «${item.code}» στο FET: το όνομα και το πλήρες όνομα.`,example}));
   }
   if(group.key==='subjects'&&!searching&&!(catalog.subjects||[]).length){
    const tr=el('tr','dt-note-row'),td=el('td','',input?'Διάλεξε στα «Στοιχεία σχολείου» περίοδο με Ωρολόγιο, για να φανούν εδώ τα μαθήματα και οι κωδικοί τους.':'Με ανοιχτό κοινό αρχείο και περίοδο με Ωρολόγιο φαίνονται εδώ τα μαθήματα και οι κωδικοί τους.');
    td.colSpan=4;tr.append(td);rows.push(tr);
   }
   return {rows,total,shown:rows.filter(tr=>!tr.classList.contains('dt-note-row')).length};
  }

  function render(keepScroll=false){
   const top=body.scrollTop,raw=search.value.trim();
   const terms=plainUpper(raw.replace(/[{}@]/g,' ')).split(/\s+/).map(term=>term.split(':')[0]).filter(Boolean);
   const query={terms,search:raw?searchedField(raw):{canonical:[],hint:'',key:''}};
   const searching=!!terms.length;
   body.replaceChildren();
   const head=el('table','dt-table dt-table-head');head.setAttribute('aria-hidden','true');head.append(colgroup(),el('thead'));head.tHead.append(headRow());
   body.append(head);
   let shownAll=0;
   for(const group of catalog.groups){
    const model=groupModel(group,query);
    if(searching&&!model.shown)continue;
    shownAll+=model.shown;
    const details=el('details','dt-group');details.dataset.key=group.key;
    details.open=searching||catalogView.open.has(group.key);
    const summary=el('summary');summary.append(el('span','dt-group-title',group.label),el('span','dt-group-count',searching?`${model.shown} από ${model.total}`:String(model.total)));
    details.append(summary);
    // The open groups are remembered only outside a search (a search opens the groups with results).
    details.addEventListener('toggle',()=>{if(search.value.trim())return;if(details.open)catalogView.open.add(group.key);else catalogView.open.delete(group.key)});
    const table=el('table','dt-table'),thead=el('thead','dt-sr'),tbody=el('tbody');
    thead.append(headRow());tbody.append(...model.rows);table.append(colgroup(),thead,tbody);
    table.setAttribute('aria-label',group.label);
    details.append(table);body.append(details);
   }
   if(searching&&!shownAll)body.append(el('div','dt-empty',`Δεν βρέθηκαν πεδία για «${raw}».`));
   // Status line: the reason a searched field does not exist, else how many rows the search found.
   if(query.search.hint){status.className='dt-fields-status ui-validation-warning';status.textContent=query.search.hint}
   else if(searching){status.className='dt-fields-status';status.textContent=shownAll===1?'Βρέθηκε 1 γραμμή.':`Βρέθηκαν ${shownAll} γραμμές.`}
   else if(!keepScroll||status.classList.contains('ui-validation-warning')){status.className='dt-fields-status';status.textContent=''}
   body.scrollTop=keepScroll?top:0;
  }
  search.addEventListener('input',()=>render(false));
  // Esc in a non-empty search clears it first; the next Esc closes the window.
  search.addEventListener('keydown',event=>{if(event.key==='Escape'&&search.value){event.preventDefault();event.stopPropagation();search.value='';render(false)}});
  render(false);
  schoolChoiceDialog({title:'Πεδία',content:root,className:'dt-fields-dialog',actions:[{label:'Κλείσιμο',cancel:true}],ready:()=>search.focus()})
   .finally(()=>{catalogShown=false});
 }
 $('openCatalog').onclick=openCatalog;

 renderFiles();
 renderSchool();
 renderFieldsPlaceholder('Τα πεδία που θα βρεθούν θα εμφανιστούν εδώ.');
 notice('Η επεξεργασία γίνεται τοπικά στον browser. Τα αρχεία δεν αποστέλλονται πουθενά.');
 post({type:'school-documents:ready'});
})();
</script></body></html>
