        read: () => fileRequest('read', kind, importer.id, file.key), choose: () => fileRequest('choose', kind, importer.id, file.key)
      })),
      // classes: the τμήματα of the year and those of earlier imports of the page that are not saved yet, so
      // that a τμήμα missing from «Τμήματα» is created once; classLimit: the limit of the host.
      analyze: loaded => importer.analyze(loaded, {staff: context.staff, classes: yearClasses(), classLimit: limits().classes, teachingHours: context.teachingHours, replacing}),
      build: (analysis, options) => {
        created = analysis.newClasses || [];
        return importer.build(analysis, {unmatched: options.unmatched, kind, periodId: period.id, name: ''});
      }
    });
    if (!program || !periodById(period.id)) return;
    const known = new Set(yearClasses().map(item => item.id));
    const added = clone(created).filter(item => !known.has(item.id));
    const createdText = created.length ? ' Με την αποθήκευση θα δημιουργηθούν στα «Τμήματα» τα τμήματα: ' + created.map(item => item.name).join(', ') + '.' : '';
    // The Ωρολόγιο FET: with the σχέδιο Ολοημέρου of the period and, when it replaces stored programs, the backup.
    if (kind === 'school') {
      const done = await placeFetImport(period, program, added);
      if (!done) return;
      newClasses.push(...added);
      mark(); renderBar(); renderBoard();
      notice('Εισήχθη το ' + quoted(label) + ' της περιόδου ' + quoted(periodName(period)) + ' (' + activitiesText(program.activities.length) + '). ' + done.design + createdText + ' Πάτησε «Αποθήκευση».');
      return;
    }
    const current = programOf(period.id, kind);
    if (current && !await replaceExisting(current, period)) return;
    draft.programs.push(program);
    newClasses.push(...added);
    mark(); renderBar(); renderBoard();
    notice('Εισήχθη το πρόγραμμα ' + quoted(label) + ' της περιόδου ' + quoted(periodName(period)) + ' (' + activitiesText(program.activities.length) + ').' + createdText + ' Πάτησε «Αποθήκευση».');

  }
  // ---- Import from FET: the σχέδιο Ολοημέρου of the period and the replacement ----
  // Every period with an Ωρολόγιο has a σχέδιο Ολοημέρου. After a new import from FET the σχέδια (the one of the period
  // and the σχέδια of the other periods) are compared with the new Ωρολόγιο in the zones of
  // the Ολοήμερο (SchoolTimetable.oloimeroDesignMatches). The user chooses one; preselected is one exactly the same,
  // otherwise «Αυτόματη δημιουργία» (SchoolTimetable.oloimeroDesignFromSchool). The σχέδιο of another period
  // goes to the period as a new copy (the original stays). Then, when stored programs are replaced (the Ωρολόγιο, or the
  // σχέδιο of the period when another one is chosen), a backup of the period to an external file is offered; the old
  // programs are replaced fully.
  // → {design: text for the notice, backup: text for the notice}, or null when the user cancelled.
  const DESIGN_TITLE = 'Σχέδιο Ολοημέρου της περιόδου';
  const DAY_NAMES = ['Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή'];
  function designDiffLines(match, classes) {
    const staffName = id => (context.staff || []).find(person => person.id === id)?.shortName || '';
    const line = (item, where) => {
      const activity = item.activity, people = [...(activity.staff || []).map(staffName), ...(activity.unmatched || [])].filter(Boolean);
      const students = T.studentsText(activity, {classes});
      return (DAY_NAMES[item.time.day - 1] || '') + ' ' + item.time.start + '–' + item.time.end + ' · ' + (activity.subject || '—') + (students ? ' (' + students + ')' : '') + (people.length ? ' · ' + people.join(', ') : '') + ' — ' + where;
    };
    return [...match.fetOnly.map(item => line(item, 'μόνο στο Ωρολόγιο')), ...match.designOnly.map(item => line(item, 'μόνο στο σχέδιο'))]
      .sort((a, b) => DAY_NAMES.findIndex(day => a.startsWith(day)) - DAY_NAMES.findIndex(day => b.startsWith(day)) || a.localeCompare(b, 'el'));
  }
  const differencesText = match => match.same ? 'ίδιο με το Ωρολόγιο' : 'διαφέρει σε ' + (match.differences === 1 ? '1 ώρα' : match.differences + ' ώρες') +
    ' (' + [match.fetOnly.length ? match.fetOnly.length + ' μόνο στο Ωρολόγιο' : '', match.designOnly.length ? match.designOnly.length + ' μόνο στο σχέδιο' : ''].filter(Boolean).join(', ') + ')';
  async function chooseDesign(period, school, classes) {
    const own = programOf(period.id, 'oloimero');
    const others = draft.programs.filter(program => program.kind === 'oloimero' && program.periodId && program.periodId !== period.id);
    const candidates = [...(own ? [own] : []), ...others];
    const where = program => program === own ? 'Το σχέδιο της περιόδου' : 'Σχέδιο της περιόδου ' + quoted(periodName(periodById(program.periodId)));
    const matches = T.oloimeroDesignMatches(school, candidates, {classes, teachingHours: context.teachingHours});
    if (!matches.length) return {mode: 'auto'};
    const box = document.createElement('fieldset');
    box.className = 'sp-restore-target sp-design-choice';
    box.innerHTML = '<legend>Σχέδιο Ολοημέρου</legend>';
    const option = (value, title, detail, lines) => {
      const row = document.createElement('div'), label = document.createElement('label'), radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'sp-design'; radio.value = value;
      const text = document.createElement('span');
      text.innerHTML = '<b>' + esc(title) + '</b>' + (detail ? '<br><span class="sp-design-detail">' + esc(detail) + '</span>' : '');
      label.append(radio, text);
      row.append(label);
      if (lines?.length) {
        const details = document.createElement('details');
        details.className = 'sp-design-diff';
        details.innerHTML = '<summary>Διαφορές</summary><ul>' + lines.slice(0, 40).map(item => '<li>' + esc(item) + '</li>').join('') + (lines.length > 40 ? '<li>… και ' + (lines.length - 40) + ' ακόμη</li>' : '') + '</ul>';
        row.append(details);
      }
      box.append(row);
      return radio;
    };
    const auto = option('auto', 'Αυτόματη δημιουργία από το Ωρολόγιο', 'Νέο σχέδιο με τις ώρες Ολοημέρου του Ωρολογίου, που μπορείς να τακτοποιήσεις στον Ολοήμερο Designer.');
    const radios = matches.map((match, index) => option(String(index), where(match.program) + (match.program.name ? ' ' + quoted(match.program.name) : ''), differencesText(match), designDiffLines(match, classes)));
    const sameIndex = matches.findIndex(match => match.same);
    (sameIndex >= 0 ? radios[sameIndex] : auto).checked = true;
    const content = ['Κάθε περίοδος με Ωρολόγιο έχει σχέδιο Ολοημέρου. Τα σχέδια συγκρίνονται με το νέο Ωρολόγιο στις ώρες Ολοημέρου, ώρα προς ώρα. ' +
      (sameIndex >= 0 ? 'Επιλέχθηκε το σχέδιο που είναι ίδιο με το Ωρολόγιο.' : 'Κανένα σχέδιο δεν είναι ίδιο με το Ωρολόγιο, γι’ αυτό επιλέχθηκε η αυτόματη δημιουργία.'),
      'Το σχέδιο άλλης περιόδου μπαίνει στην περίοδο ως νέο αντίγραφο· το αρχικό μένει όπως είναι.', box];
    const value = await schoolChoiceDialog({
      title: DESIGN_TITLE, content,
      actions: [{label: 'Ακύρωση'}, {label: 'Συνέχεια', accept: true, run: () => {
        const checked = box.querySelector('input:checked');
        if (!checked) throw Error('Διάλεξε σχέδιο Ολοημέρου.');
        return checked.value;
      }}]
    });
    if (!value) return null;
    if (value === 'auto') return {mode: 'auto'};
    const match = matches[Number(value)];
    const named = match.program.name ? ' ' + quoted(match.program.name) : '';
    const from = 'του σχεδίου' + named + ' της περιόδου ' + quoted(periodName(periodById(match.program.periodId)));
    return {mode: match.program === own ? 'keep' : 'copy', program: match.program, from, same: match.same};
  }
  // The available hours of the Ολοήμερο for the new σχέδιο: the hours of the period (automatic suggestion or written by
  // the user), with the new Ωρολόγιο in place of the old one.
  function designAvailableHours(period, school, classes) {
    try {
      const programs = [...draft.programs.filter(program => program.periodId === period.id && program.kind !== 'school' && program.kind !== 'oloimero'), school];
      const composition = T.composePeriod({periodId: period.id, programs, staff: context.staff || [], classes, teachingHours: context.teachingHours});
      const hours = T.oloimeroAvailableHours({period, staff: context.staff || [], composition});
      return id => hours.get(id)?.hours ?? 0;
    } catch { return () => 0; }
  }
  async function placeFetImport(period, school, added) {
    const classes = [...yearClasses(), ...added];
    const choice = await chooseDesign(period, school, classes);
    if (!choice || !periodById(period.id)) return null;
    const now = new Date().toISOString();
    let design = null;
    if (choice.mode === 'auto') {
      try {
        design = T.oloimeroDesignFromSchool(school, {staff: context.staff || [], classes, teachingHours: context.teachingHours, periodId: period.id, now,
          name: 'Από FET – ' + periodName(period) + ' – ' + D.format(D.today()), availableHours: designAvailableHours(period, school, classes)});
      } catch (error) { await schoolMessage(error.message, {title: DESIGN_TITLE}); return null; }
    } else if (choice.mode === 'copy') {

      // The copy keeps the history of the σχέδιο, with a «copy» entry (as «Αντιγραφή περιόδου…»).

    draft.programs.push(school);

      : choice.mode === 'keep' ? 'Το σχέδιο Ολοημέρου της περιόδου μένει' + (choice.same ? ' (ίδιο με το Ωρολόγιο).' : '.')
      : 'Σχέδιο Ολοημέρου: αντίγραφο ' + choice.from + (choice.same ? ' (ίδιο με το Ωρολόγιο).' : '.');

  async function deleteProgram(period, kind) {

    if (!await confirmWithBackup(period, [program], {title: 'Διαγραφή προγράμματος', message: what + ' της περιόδου ' + quoted(periodName(period)) + ';' + (isStored(program) ? ' Η διαγραφή γίνεται οριστική με την «Αποθήκευση».' : '')})) return;

  // ---- History of a program (program.history, see SchoolTimetable.addHistory) ----
  // Date and time in local time, dd/mm/yyyy HH:MM; entries built from older data (derived) only show the day,
  // since their time is not exact.
  function historyWhen(entry) {
    const date = new Date(entry.at);
    if (Number.isNaN(date.getTime())) return '';
    const day = D.format(localDay(entry.at));
    return entry.derived ? day : day + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
  }
  const countText = (count, one, many) => count === 1 ? '1 ' + one : count + ' ' + many;
  // kind: the kind of the program. The Ατομικά Προγράμματα write in 'edit' and 'copy' the names of the teachers
  // (staff:[name…]); the Ολοήμερο in 'edit' the teachers whose cells changed, or nothing for other changes of the σχέδιο.
  function historyText(entry, kind) {
    const replacementsText = list => (list || []).map(item => (item.fromName || '?') + ' → ' + (item.toName || '?')).join(', ');
    const people = (Array.isArray(entry.staff) ? entry.staff : []).filter(Boolean).join(', ');
    switch (entry.type) {
      case 'import': {
        const importer = T.importer(kind, entry.importer);
        const files = (entry.files || []).filter(Boolean);
        return (importer?.label || 'Εισαγωγή από αρχεία') + (files.length ? ': ' + files.join(', ') : '') + (Number.isInteger(entry.activities) ? ' (' + activitiesText(entry.activities) + ')' : '') + '.';
      }
      case 'copy': {
        const list = replacementsText(entry.replacements);
        if (!entry.fromPeriod) return 'Αντικαταστάσεις εκπαιδευτικών' + (list ? ': ' + list : '') + '.';
        return 'Αντιγραφή από την περίοδο ' + quoted(entry.fromPeriod) + (people ? ' των εκπαιδευτικών: ' + people : '') + (list ? ', με αντικαταστάσεις: ' + list : '') + '.';
      }
      case 'oloimero': {
        let text = 'Εισαγωγή Ολοημέρου' + (entry.design ? ' από ' + quoted(entry.design) : '');
        if ([entry.kept, entry.removed, entry.added].every(Number.isInteger)) {
          text += entry.removed || entry.added
            ? ': ' + countText(entry.kept, 'ίδια', 'ίδιες') + ', ' + countText(entry.removed, 'αφαιρέθηκε', 'αφαιρέθηκαν') + ', ' + countText(entry.added, 'μπήκε', 'μπήκαν')
            : ': χωρίς αλλαγές στις δραστηριότητες (' + countText(entry.kept, 'ίδια', 'ίδιες') + ')';
        }
        return text + (entry.assigned ? '· το προσχέδιο ανατέθηκε στην περίοδο' : '') + '.';
      }
      case 'create': return entry.from === 'school' ? 'Αυτόματη δημιουργία από το Ωρολόγιο FET.' : 'Δημιουργία.';
      case 'setInitial': return 'Ορισμός ως Αρχική: η τρέχουσα κατάσταση έγινε η αρχική.';
      case 'restore': return 'Επαναφορά στην αρχική κατάσταση.';
      case 'backupRestore': return 'Επαναφορά από αντίγραφο ασφαλείας' + (entry.file ? ' ' + quoted(entry.file) : '') + (entry.fromPeriod ? ', της περιόδου ' + quoted(entry.fromPeriod) : '') + (dateTimeText(entry.backupAt) ? ' (αντίγραφο της ' + dateTimeText(entry.backupAt) + ')' : '') + '.';
      case 'edit':
        if (kind === 'individual') return 'Αλλαγές στα ατομικά προγράμματα' + (people ? ': ' + people : '') + '.';
        if (kind === 'oloimero') return people ? 'Αλλαγές στο σχέδιο Ολοημέρου: ' + people + '.' : 'Αλλαγές στο σχέδιο Ολοημέρου (μορφοποίηση, μαθήματα ή Συνενώσεις).';
        return Number.isInteger(entry.activities) ? 'Αλλαγές στο ωρολόγιο (' + activitiesText(entry.activities) + ').' : 'Αλλαγές στο ωρολόγιο.';
      default:
        return 'Άλλη αλλαγή (' + entry.type + ').';
    }
  }
  async function showHistory(period, kind) {
    const program = programOf(period.id, kind);
    if (!program || busy) return;
    const entries = T.history(program);
    const content = [];
    if (!entries.length) content.push(Object.assign(document.createElement('p'), {className: 'pg-history-empty', textContent: 'Το Ιστορικό είναι κενό.'}));

        text.textContent = historyText(entry, kind).replace(/\.\.$/, '.');

  // ---- Copy a period with replacements ----

    addButton.onclick = () => addRow().querySelector('select').focus();

    const grid = make('div', {class: 'sp-form-grid'}), fromField = labelled('Από', from), toField = labelled('Έως', to);

        if (seen.has(item.from)) throw Error('Ο/Η ' + quoted(shortName(item.from)) + ' εμφανίζεται σε δύο αντικαταστάσεις.');

  function applyCopy({sourceId, name, from, to, status, replacements}) {
    const source = periodById(sourceId);

    const now = new Date().toISOString(), period = {id: uid(), name, from, to, status};
    const person = id => (context.staff || []).find(item => item.id === id);
    const personName = id => person(id)?.name || person(id)?.shortName || '?';
    const copies = kindKeys.map(kind => programOf(sourceId, kind)).filter(Boolean).map(program => {
      const copy = T.replaceStaff(program, replacements, {staff: context.staff, now}).program;
      Object.assign(copy, {id: uid(), periodId: period.id, createdAt: now, updatedAt: now});
      // The copy keeps the history of the source and gets a «copy» entry, with the replacements that changed it.
      if (hasHistory(copy.kind)) {
        const used = new Set(programStaff(program));
        T.addHistory(copy, {at: now, type: 'copy', fromPeriod: periodName(source), replacements: replacements.filter(item => used.has(item.from)).map(item => ({fromName: personName(item.from), toName: personName(item.to)}))});
      }

    draft.periods.push(period);

  // ---- Save ----
  function saveOps() {
    const before = new Map(saved.programs.map(program => [program.id, program]));
    const after = new Map(draft.programs.map(program => [program.id, program]));
    const ops = [];
    for (const program of draft.programs) {
      const old = before.get(program.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(program)) ops.push({op: 'put', program: clone(program), ...(initialIds.has(program.id) ? {setInitial: true} : {})});
    }
    for (const program of saved.programs) if (!after.has(program.id)) ops.push({op: 'delete', id: program.id});
    return ops;
  }
  // After «Αποθήκευση»: the file must hold exactly what the page asked for. The host writes the time of a «Ορισμός ως
  // Αρχική» (initialSetAt) itself.
  function verifySaved(result, periods, added) {
    const comparable = program => { if (!program || !initialIds.has(program.id)) return program; const {initialSetAt, ...rest} = program; return rest; };
    const same = (a, b) => JSON.stringify(comparable(a)) === JSON.stringify(comparable(b));
    const expected = draft.programs.filter(program => program.periodId != null);
    const got = new Map((result.programs || []).filter(program => program.periodId != null).map(program => [program.id, program]));
    const classIds = new Set((result.classes || []).map(item => item?.id));
    const ok = JSON.stringify(result.periods) === JSON.stringify(periods) && got.size === expected.length && expected.every(program => same(got.get(program.id), program)) &&
      added.every(item => classIds.has(item.id));
    if (!ok) throw Error('Η αποθήκευση ολοκληρώθηκε, αλλά τα δεδομένα του αρχείου δεν είναι ίδια με αυτά της σελίδας. Έλεγξε τις περιόδους και τα προγράμματα που φαίνονται τώρα. Βεβαιώσου ότι το index.html είναι η τελευταία έκδοση.');
  }
  async function save() {
    if (busy || !dirty) return;
    const invalid = draft.periods.find(period => !period.name.trim() || (!isDraftPeriod(period) && !D.valid(period.from)));
    if (invalid) {
      notice('Η περίοδος ' + quoted(periodName(invalid)) + ' χρειάζεται ' + (!invalid.name.trim() ? 'όνομα' : 'ημερομηνία έναρξης') + '. Διόρθωσέ τη στη «Διαχείριση περιόδων…».', true);
      return;
    }
    const periodIds = new Set(draft.periods.map(period => period.id));
    if (draft.programs.some(program => program.periodId != null && !periodIds.has(program.periodId))) { notice('Βρέθηκε πρόγραμμα σε περίοδο που δεν υπάρχει. Πάτησε «Αναίρεση Όλων».', true); return; }
    for (const period of draft.periods) period.name = period.name.trim();
    const periods = clone(draft.periods), ops = saveOps(), added = clone(usedNewClasses());
    setBusy(true);
    let result = null;
    try {
      // The new τμήματα of the imports go only together with programs (the host refuses them otherwise).
      const request = {revision: context.revision, year: context.year, ops, periods};
      if (added.length) request.newClasses = added;
      // The subjects and Συνενώσεις of the restores, only together with programs (the host accepts only additions).
      if (catalogDraft && ops.length) request.individualCatalog = catalogDraft;
      result = await schoolHost.request('school-timetables:save', request);
      verifySaved(result, periods, added);
      receive(result);
      sharePeriod();
      notice('Οι περίοδοι και τα προγράμματα αποθηκεύτηκαν στο κοινό αρχείο .data.' + (added.length ? ' Δημιουργήθηκαν στα «Τμήματα» τα τμήματα: ' + added.map(item => item.name).join(', ') + '.' : ''));
    } catch (error) {
      if (result) receive(result);
      notice(error.message, true);
    } finally { setBusy(false); }
  }
  $('save').onclick = save;
  $('undo').onclick = async () => {
    // Takes back every change since the last save; it does not read anything again.
    if (busy || !context || !dirty) return;
    if (!await schoolConfirm('Να απορριφθούν οι αλλαγές στις περιόδους και στα προγράμματα που δεν αποθηκεύτηκαν;', {title: 'Μη αποθηκευμένες αλλαγές', accept: 'Απόρριψη αλλαγών'})) return;
    receive(context);
    notice('Οι μη αποθηκευμένες αλλαγές απορρίφθηκαν.');
  };
  post({type: 'school-timetables:ready'});
})();
</script>
