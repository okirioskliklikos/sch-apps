<!doctype html>
<html lang="el" class="subapp-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Σχολικά Προγράμματα v0.48</title>
<link rel="stylesheet" href="_ui.css">
<link rel="stylesheet" href="_subapp.css">
<style>
/* «Σχολικά Προγράμματα»: the central page of the programs. The period on top, the three sources of the period
   (Ολοήμερο Designer, Ωρολόγιο FET, Ατομικά Προγράμματα) and, under them, the Πλήρες Σχολικό Πρόγραμμα. The periods
   are managed in the dialog «Διαχείριση περιόδων». Shared appearance: _ui.css / _subapp.css. --sp-* : colours whose
   meaning exists only here. */
:root{
  --sp-board-bg:#f5f6f8;
  --sp-morning-border:#8eb4e7;--sp-morning-text:#154c91;
  --sp-arrow:#3b6db0;
  --sp-full-bg:#f7faff;--sp-full-border:#8eb4e7;
  --sp-modified:#9a4d00;--sp-unchanged:#98a2b3;
  --sp-note-bg:#fff7ed;--sp-note-border:#fed7aa;--sp-note-text:#9a3412;
  --sp-new-text:#1d6b46;
  --sp-row-selected:#e8f1ff;
  --sp-group-official-border:#cfe5d7;--sp-group-draft-border:#ddd3f4
}
/* «⋯» of the header: an icon button with an invisible character, so it keeps the shared baseline of the header. */
header .sp-more{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--school-ui-control-height);padding-left:0;padding-right:0}
header .sp-more::before{content:"\200b";width:0;overflow:hidden}
header .sp-more>svg{display:block;flex:none;width:var(--school-ui-icon-size-18);height:var(--school-ui-icon-size-18)}

.sp-main{overflow:auto!important;background:var(--sp-board-bg)}
.sp-wrap{box-sizing:border-box;width:100%;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#root>.subapp-connection{margin:20px}

/* Period bar */
.sp-period-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 16px;
  background:var(--school-ui-primary-bg);border:1px solid #d8e2ee;border-radius:10px
}
.sp-period-bar label{font-size:18px;font-weight:650}
.sp-period-note{font-size:14px;color:var(--school-ui-muted)}
.sp-period-bar #managePeriods{margin-left:auto}
.sp-period-warnings:empty{display:none}
.sp-period-warnings .ui-validation-warning{margin:2px 0}
.sp-wrap>.subapp-notice{margin:0}

/* Sources and Πλήρες */
.sp-sources{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);gap:20px;align-items:stretch}
.sp-sources>.sp-card{margin:22px 0 14px}
.sp-morning{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:22px 14px 14px;border:2px dashed var(--sp-morning-border);border-radius:14px;align-items:stretch}
.sp-morning-label{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:0 10px;background:var(--sp-board-bg);font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--sp-morning-text)}
.sp-card{
  position:relative;box-sizing:border-box;min-width:0;display:flex;flex-direction:column;gap:10px;padding:16px;
  background:var(--school-ui-surface);border:1px solid var(--school-ui-border);border-radius:12px;box-shadow:0 1px 2px #1018280d
}
.sp-card-head{display:flex;align-items:flex-start;gap:12px}
.sp-mark{flex:none;width:44px;height:44px;border-radius:10px;--app-mark-icon-size:26px}
.sp-card-title{flex:1;min-width:0}
.sp-card-title h2{margin:0;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.sp-card-title p{margin:2px 0 0;font-size:14px;color:var(--school-ui-muted)}
.sp-card-head .ui-icon-button>svg{width:var(--school-ui-icon-size-18);height:var(--school-ui-icon-size-18)}
.sp-facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:14px;line-height:1.45}
.sp-facts dt{color:var(--school-ui-muted)}
.sp-facts dd{margin:0;overflow-wrap:anywhere}
.sp-state{margin:0;font-size:13px;line-height:1.45;color:var(--school-ui-muted)}
.sp-facts dd.modified{color:var(--sp-modified)}
.sp-facts dd.unchanged{color:var(--sp-unchanged)}
.sp-note{margin:0;padding:6px 9px;border:1px solid var(--sp-note-border);border-radius:8px;background:var(--sp-note-bg);color:var(--sp-note-text);font-size:13px;line-height:1.45}
.sp-new{margin:0;font-size:13px;color:var(--sp-new-text)}
.sp-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;padding:12px;
  border:1px dashed var(--school-ui-control-border);border-radius:10px;text-align:center;color:var(--school-ui-muted);font-size:14px;line-height:1.45
}
/* Compact use of the shared file-drop component in empty source cards. Its colours, border and icon come from _subapp.css. */
.sp-card .sp-file-drop{display:flex;width:100%;min-height:110px;margin:0;padding:12px 10px;gap:5px;box-sizing:border-box}
.sp-file-drop .subapp-file-drop-title{font-size:15px;line-height:1.4}
.sp-file-drop .subapp-file-drop-text{font-size:13px;line-height:1.4}
.sp-file-drop .subapp-file-drop-icon{--subapp-file-drop-icon-size:var(--school-ui-icon-size-18)}
.sp-file-drop .sp-drop-state{font-size:13px;color:var(--school-ui-muted);line-height:1.4}
.sp-empty p{margin:0}
.sp-card-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-top:auto}
.sp-card-actions .ui-link-button{font-weight:650}
/* Each outer connector is a single CSS shape: two concentric circular elbows and a 2px-wide continuous band. */
.sp-arrows{position:relative;height:112px;margin:0;pointer-events:none;color:var(--sp-arrow)}
.sp-arrow{position:absolute;top:0;height:100%;transform-origin:center center}
.sp-arrow.reverse{transform:scaleX(-1)}
.sp-arrow-path{position:absolute;inset:var(--sp-from-y,0px) 0 0;background:currentColor;clip-path:shape(
  from 0px 0px,
  line to 0px calc(29px - var(--sp-from-y,0px)),
  curve to 33px calc(62px - var(--sp-from-y,0px)) with 0px calc(47.225px - var(--sp-from-y,0px)) / 14.775px calc(62px - var(--sp-from-y,0px)),
  line to calc(100% - 33px) calc(62px - var(--sp-from-y,0px)),
  curve to calc(100% - 2px) calc(93px - var(--sp-from-y,0px)) with calc(100% - 15.879px) calc(62px - var(--sp-from-y,0px)) / calc(100% - 2px) calc(75.879px - var(--sp-from-y,0px)),
  line to calc(100% - 2px) 100%,
  line to 100% 100%,
  line to 100% calc(93px - var(--sp-from-y,0px)),
  curve to calc(100% - 33px) calc(60px - var(--sp-from-y,0px)) with 100% calc(74.775px - var(--sp-from-y,0px)) / calc(100% - 14.775px) calc(60px - var(--sp-from-y,0px)),
  line to 33px calc(60px - var(--sp-from-y,0px)),
  curve to 2px calc(29px - var(--sp-from-y,0px)) with 15.879px calc(60px - var(--sp-from-y,0px)) / 2px calc(46.121px - var(--sp-from-y,0px)),
  line to 2px 0px,
  close
)}
.sp-arrow-head{position:absolute;right:-5px;bottom:3px;width:11px;height:11px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sp-arrow.straight{top:var(--sp-from-y,0px);height:calc(100% - var(--sp-from-y,0px));border-left:2px solid currentColor;width:0!important}
.sp-arrow.straight .sp-arrow-head{left:-7px;right:auto}
.sp-full{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding:18px 22px;
  background:var(--sp-full-bg);border:1.5px solid var(--sp-full-border);border-radius:14px
}
.sp-full .sp-mark{width:52px;height:52px;border-radius:12px;--app-mark-icon-size:30px}
.sp-full-text{flex:1;min-width:220px}
.sp-full-text h2{margin:0;font-size:24px;line-height:1.3}
.sp-full-text p{margin:2px 0 0;font-size:15px;color:#405367}
.sp-limits{margin-top:18px}
.sp-limits[hidden]{display:none}
.sp-limits p{margin:0}
.sp-board-empty{min-height:260px}

/* Warnings of the composition, under the Πλήρες Σχολικό Πρόγραμμα: the shared schoolProblems of _ui.js. */
#problems{margin-top:12px}
.sp-dialog-warning{margin:6px 0 0!important}
.sp-restore-target{display:grid;gap:8px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--school-ui-border);border-radius:8px}
.sp-restore-target legend{padding:0 6px;font-weight:650}
.sp-restore-target label{display:flex;align-items:baseline;gap:8px;margin:0;font-weight:400;cursor:pointer}
.sp-restore-target label.disabled{color:var(--school-ui-muted);cursor:default}
/* Σχέδιο Ολοημέρου of a new import from FET: every option with its differences from the Ωρολόγιο. */
.sp-design-choice{max-height:min(52vh,460px);overflow:auto}
.sp-design-choice label{align-items:flex-start}
.sp-design-choice input{margin-top:3px}
.sp-design-detail{color:var(--school-ui-muted)}
.sp-design-diff{margin:2px 0 4px 26px}
.sp-design-diff summary{cursor:pointer;color:var(--school-ui-muted)}
.sp-design-diff ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.sp-drop-hint{color:var(--school-ui-muted);font-size:14px}

/* History of a program (dialog) */
.pg-history{list-style:none;margin:0;padding:0;max-height:min(60vh,520px);overflow:auto;border-top:1px solid var(--school-ui-border)}
.pg-history li{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 12px;padding:7px 2px;border-bottom:1px solid var(--school-ui-border);font-size:14px;line-height:1.45}
.pg-history time{color:var(--school-ui-muted);white-space:nowrap}
.pg-history-derived{display:block;font-size:12px;color:var(--school-ui-muted)}
.pg-history-empty{margin:0;color:var(--school-ui-muted)}

/* «Διαχείριση περιόδων» (inside schoolChoiceDialog) */
.school-confirm.sp-periods-dialog{width:min(1000px,calc(100vw - 32px))}
.sp-periods{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;margin-top:12px}
/* Two framed groups, like the groups of the shared period list: «Περίοδοι» (official) and «Προσχέδια περιόδων».
   The area has a fixed height, the last group stretches to its bottom, and the whole area scrolls. */
.sp-period-table{display:flex;flex-direction:column;gap:12px;overflow:auto;height:min(52vh,460px);border-radius:10px;outline-offset:2px}
.sp-period-group{flex:none;display:flex;flex-direction:column;border:1px solid var(--sp-group-official-border);border-radius:10px;overflow:hidden;background:#fff}
.sp-period-group.draft{border-color:var(--sp-group-draft-border)}
.sp-period-group:last-child{flex:1 0 auto}
.sp-period-group-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:18px;font-weight:700;line-height:1.3;
  background:var(--school-ui-period-official-soft-bg);color:var(--school-ui-period-official-soft-text)
}
.sp-period-group.draft .sp-period-group-head{background:var(--school-ui-period-draft-bg);color:var(--school-ui-period-draft-text)}
.sp-period-group-head svg{flex:none;width:var(--school-ui-icon-size-20);height:var(--school-ui-icon-size-20)}
.sp-period-row{
  display:grid;grid-template-columns:2.5em minmax(0,1fr) 7.5em 10.5em 8.5em;align-items:baseline;gap:8px;padding:9px 12px;
  border-top:1px solid var(--school-ui-border);font-size:15px;line-height:1.4;cursor:pointer
}
.sp-period-row.head{background:#f0f3f7;color:#405367;font-weight:650;cursor:default}
.sp-period-row:not(.head):hover{background:#f6f8fb}
.sp-period-row.selected,.sp-period-row.selected:hover{background:var(--sp-row-selected);font-weight:650}
.sp-period-row .num{color:var(--school-ui-muted)}
.sp-period-row .ui-period-status{font-weight:400}
.sp-period-row .muted{color:var(--school-ui-muted);font-weight:400}
.sp-period-row .end-note{font-size:12px;font-weight:400;color:var(--school-ui-muted)}
.sp-period-row .unsaved{display:block;font-size:12px;font-weight:400;color:var(--sp-new-text)}
.sp-periods-empty{margin:0;padding:10px 12px;border-top:1px solid var(--school-ui-border);font-size:14px;color:var(--school-ui-muted)}
.sp-period-actions{display:flex;flex-direction:column;gap:8px}
.sp-period-actions button{justify-content:flex-start;text-align:left;white-space:normal}
.sp-period-actions .ui-helper{margin:4px 0 0;line-height:1.45}
.sp-periods-footer{grid-column:1 / -1;display:grid;gap:4px}
.sp-periods-footer .ui-validation-warning{margin:0}
.sp-periods-summary{margin:0!important;font-size:14px;color:#405367}

/* Period form and copy dialog (inside schoolChoiceDialog) */
.sp-form-grid{display:grid;grid-template-columns:minmax(0,1fr) 140px 140px;gap:0 10px}
.sp-status-choice{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--school-ui-border);border-radius:8px}
.sp-status-choice legend{padding:0 6px;font-weight:650}
.sp-status-choice label{display:flex;align-items:center;gap:8px;margin:0;font-weight:400;cursor:pointer}
.sp-form-help{margin:6px 0 0!important;font-size:13px;color:var(--school-ui-muted)}
.sp-form-warnings .ui-validation-warning{margin:6px 0 0;font-size:13px}
.copy-section{margin:18px 0 0;font-size:16px}
.copy-rows{display:grid;gap:8px;margin-top:10px}
.copy-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center}
.copy-row select{width:100%;min-width:0;font-weight:400}
.copy-arrow{color:var(--school-ui-muted)}
.copy-arrow>svg{display:block;width:var(--school-ui-icon-size);height:var(--school-ui-icon-size)}
.copy-add{margin-top:10px}
.copy-summary{margin-top:16px!important;padding:10px 12px;border-radius:10px;background:var(--school-ui-label-bg);font-size:14px;line-height:1.5}

@media(max-width:900px){
  .sp-sources{grid-template-columns:minmax(0,1fr)}
  .sp-sources>.sp-card{margin:0}
  .sp-arrows{height:80px}
  .sp-arrow:not(.straight){display:none}
  .sp-periods{grid-template-columns:minmax(0,1fr)}
  .sp-period-actions{flex-direction:row;flex-wrap:wrap}
}
@media(max-width:620px){
  .sp-morning{grid-template-columns:minmax(0,1fr)}
  .sp-period-bar #managePeriods{margin-left:0}
  .sp-period-row{grid-template-columns:2em minmax(0,1fr) 7.5em}
  .sp-period-row>:nth-child(3),.sp-period-row>:nth-child(4){display:none}
  .sp-form-grid{grid-template-columns:1fr 1fr}
  .sp-form-grid>:first-child{grid-column:1 / -1}
  .copy-row{grid-template-columns:minmax(0,1fr) auto}
  .copy-row .copy-arrow{display:none}
  .copy-row select:nth-of-type(2){grid-column:1}
  .copy-row .copy-remove{grid-row:1 / span 2;grid-column:2}
  .pg-history li{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:400px){.sp-form-grid{grid-template-columns:1fr}}
/* A Προσχέδιο περιόδου has no dates: only the name. */
.sp-form-grid.no-dates{grid-template-columns:minmax(0,1fr)}
</style>
</head>
<body>
<header class="page-head">
  <div class="toolbar-brand"><h1><button class="brand-menu" type="button" title="Άνοιγμα κεντρικού μενού" aria-label="Σχολικά Προγράμματα — άνοιγμα κεντρικού μενού"><span class="app-mark" data-app-icon="timetables" aria-hidden="true"></span><span class="brand-text"><span>Σχολικά Προγράμματα</span><span class="small version">v0.48</span></span></button></h1></div>
  <button id="save" class="save-main" type="button" disabled>Αποθήκευση</button>
  <button id="undo" type="button" disabled>Αναίρεση Όλων</button>
  <button id="more" class="sp-more" type="button" title="Περισσότερες ενέργειες" aria-label="Περισσότερες ενέργειες" disabled></button>
  <div class="header-right"><span id="schoolYear" class="school-year-indicator" hidden><span>Σχολικό έτος:</span> <span id="schoolYearValue"></span></span></div>
</header>
<main id="root" class="page-main sp-main"><p class="subapp-connection">Άνοιξε τα «Σχολικά Προγράμματα» από το Κεντρικό Μενού, αφού ανοίξεις το αρχείο πληροφοριών του σχολείου. Απαιτείται η τελευταία έκδοση του index.html.</p></main>
<script src="_ui.js"></script>
<script src="_data.js"></script>
<script src="_data_timetable.js"></script>
<script src="_data_oloimero.js"></script>
<script src="_data_documents.js"></script>
<script>
(() => {
  'use strict';
  // Messages, requests and their time limits: schoolHost in _ui.js. Dates, kinds, periods, import, replacements and the
  // initial state: SchoolDate and SchoolTimetable of the _data*.js. Everything changes in the page and is saved together
  // with «Αποθήκευση», as one school-timetables:save (periods + put/delete, and the new τμήματα of the imports), all or
  // nothing. The current period is shared with the program applications (school-timetables:period), and they open
  // from here with a target (school-timetables:open). Under the Πλήρες, the warnings of the composition of the period
  // (SchoolTimetable.compositionProblems, shown with schoolProblems of _ui.js). In the menu «⋯», the backup of a period to an external file and its restore
  // (SchoolTimetable.periodBackup …; the file is written and read by the host, school-programs:file). A new import from
  // FET (also by dropping the CSV and the .fet onto its card) always gives the period a σχέδιο Ολοημέρου, and offers a
  // backup of the period before stored programs are replaced (placeFetImport).
  const T = SchoolTimetable, D = SchoolDate, esc = schoolEscape, $ = id => document.getElementById(id);
  const root = $('root'), post = schoolHost.post;
  // Count limits of the host (school-timetables:context): above them a save is refused; from warnRatio on, a warning.
  const limits = () => ({programs: 200, periods: 15, classes: 50, warnRatio: 0.9, ...(context.limits || {})});
  const nearLimit = (count, limit) => count >= Math.ceil(limit * limits().warnRatio);
  // Programs of the year after «Αποθήκευση»: every program of the file, with the period programs as this page holds
  // them.
  const programCount = () => (Number(context.programCount) || saved.programs.length) - saved.programs.length + draft.programs.length;
  const kindKeys = Object.keys(T.kinds);
  const kindLabel = kind => T.kinds[kind]?.label || kind;
  // Kinds with a history.
  const hasHistory = kind => !!T.kinds[kind]?.history;
  const quoted = value => '«' + value + '»';
  const uid = () => crypto.randomUUID();
  const clone = value => structuredClone(value);
  const unique = list => [...new Set(list)];
  const byShortName = (a, b) => String(a.shortName || a.name || '').localeCompare(String(b.shortName || b.name || ''), 'el');
  // The cards of the sources: title, line under it, icon letters and colour, and whether «Άνοιγμα» opens the owner
  // application. The Ωρολόγιο FET has no application of its own: it is edited in the Πλήρες Σχολικό Πρόγραμμα.
  const CARDS = Object.freeze({
    oloimero: {title: 'Ολοήμερο Designer', line: 'Ζώνες Ολοημέρου', icon: 'oloimero', open: true},
    school: {title: 'Ωρολόγιο FET', line: 'Πρωινό, από το FET', icon: 'fet', open: false},
    individual: {title: 'Ατομικά Προγράμματα', line: 'Ώρες εκτός FET', icon: 'individual', open: true}
  });
  const cardTitle = kind => CARDS[kind]?.title || kindLabel(kind);

  let context = null;      // the last context of the host
  let saved = null;        // {periods, programs} as stored in the file
  let draft = null;        // {periods, programs} as shown in the page
  let dirty = false, busy = false, selectedId = null, introShown = false;
  // Τμήματα that the imports of the page will create (analysis.newClasses, with final ids), not saved yet.
  // They go to school-timetables:save (newClasses) only while a program that is saved still uses them.
  let newClasses = [];
  // Programs whose current state becomes their initial state with «Αποθήκευση» (setInitial:true in the put).
  let initialIds = new Set();
  // The catalog of the Ατομικά Προγράμματα with the subjects and Συνενώσεις that the restores of the page add (null:
  // none). It is sent with «Αποθήκευση» together with the restored programs; the host accepts only additions.
  let catalogDraft = null;
  // Whether the list of the warnings under the Πλήρες is open: closed when the page opens, then as the user leaves it.
  let problemsOpen = false;
  const currentCatalog = () => catalogDraft || context.individualCatalog || {subjects: [], unions: [], hidden: {grades: [], classes: []}};

  // ---- Dates ----
  const addDays = (iso, days) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
  };
  const localDay = value => {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  };
  const yearRange = () => D.schoolYear(context.year);
  const yearRangeText = () => D.format(yearRange().from) + '–' + D.format(yearRange().to);
  const teachingEnd = () => D.schoolYearTeachingEnd(context.year);
  const isDraftPeriod = period => T.isDraftPeriod(period);
  // «11/09/2026 – 15/11/2026»; an empty «Έως» ends on the last teaching day; a Προσχέδιο περιόδου has no dates.
  function rangeText(period) {
    if (isDraftPeriod(period) || !D.valid(period.from)) return '';
    return D.format(period.from) + ' – ' + D.format(T.periodEnd(period, context.year));
  }
  const periodName = period => period?.name?.trim() || 'Χωρίς όνομα';

  // ---- Data helpers ----
  const periodById = id => draft.periods.find(period => period.id === id) || null;
  const orderedPeriods = () => T.sortPeriods(draft.periods);
  const periodNumber = period => T.periodNumbers(draft.periods).get(period.id) || '';
  const programsOf = periodId => draft.programs.filter(program => program.periodId === periodId);
  const programOf = (periodId, kind) => draft.programs.find(program => program.periodId === periodId && program.kind === kind) || null;
  // A program or a period that is stored in the file.
  const isStored = program => saved.programs.some(item => item.id === program.id && item.periodId != null);
  const isStoredPeriod = period => !!period && saved.periods.some(item => item.id === period.id);
  // The teachers of a program: in its activities and, in the Ατομικά Προγράμματα, in its incomplete cells.
  const programStaff = program => unique([...(program.activities || []).flatMap(activity => activity.staff || []), ...(program.source?.type === 'individual' && Array.isArray(program.source.pending) ? program.source.pending.map(item => item.staffId).filter(Boolean) : [])]);
  const programText = program => kindLabel(program.kind) + (program.name ? ' ' + quoted(program.name) : '');
  function stats(program) {
    const activities = program.activities || [];
    return {
      activities: activities.length,
      staff: programStaff(program).length,
      unmatched: unique(activities.flatMap(activity => activity.unmatched || [])).length,
      classes: unique(activities.flatMap(activity => activity.classes || [])).length
    };
  }
  const activitiesText = count => count === 1 ? '1 δραστηριότητα' : count + ' δραστηριότητες';
  // Τμήματα of the year (from «Τμήματα»), together with those the imports of the page will create.
  const yearClasses = () => [...(context.classes || []), ...newClasses];
  // The new τμήματα still used by a program of the page: only these are sent with «Αποθήκευση».
  function usedNewClasses() {
    const used = new Set(draft.programs.flatMap(program => (program.activities || []).flatMap(activity => [...(activity.classes || []), ...(activity.subsets || [])])));
    return newClasses.filter(item => used.has(item.id));
  }

  // ---- State ----
  function mark(value = true) { dirty = value; post({type: 'school-programs:dirty', dirty}); buttons(); }
  function setBusy(value) { busy = value; buttons(); }
  function notice(textValue, error = false) {
    const element = $('notice');
    if (!element) return;
    element.textContent = textValue;
    element.classList.toggle('error', error);
  }
  function buttons() {
    $('save').classList.toggle('dirty', dirty);
    $('save').setAttribute('aria-label', dirty ? 'Αποθήκευση — υπάρχουν μη αποθηκευμένες αλλαγές' : 'Αποθήκευση');
    // «Αποθήκευση» and «Αναίρεση Όλων» are active only while there are unsaved changes.
    $('save').disabled = $('undo').disabled = busy || !context || !dirty;
    $('more').disabled = busy || !context;
    root.classList.toggle('busy', busy);
    root.setAttribute('aria-busy', String(busy));
    if ($('managePeriods')) $('managePeriods').disabled = busy;
    if ($('period')) $('period').disabled = busy || !draft?.periods.length;
  }
  // The period that opens first: the target of the host, the shared current period, the official period of today,
  // the last official one, or the first of the list.
  function initialPeriod(value) {
    const exists = id => !!id && draft.periods.some(period => period.id === id);
    if (exists(value.target?.periodId)) return value.target.periodId;
    if (exists(value.currentPeriod)) return value.currentPeriod;
    const today = T.periodAt(draft.periods, D.today());
    if (today) return today.id;
    const list = orderedPeriods();
    return (list.filter(period => !isDraftPeriod(period)).at(-1) || list[0])?.id || null;
  }
  function receive(value) {
    const first = !context;
    context = value;
    saved = clone({periods: value.periods || [], programs: (value.programs || []).filter(program => program.periodId != null)});
    draft = clone(saved);
    newClasses = [];
    initialIds = new Set();
    catalogDraft = null;
    if (first || value.target?.periodId || !periodById(selectedId)) selectedId = initialPeriod(value);
    mark(false);
    render();
  }
  schoolHost.on('school-timetables:context', message => { if (!dirty && !busy) receive(message.context); });
  // The period chosen here becomes the current period of the program applications (only a stored period).
  function sharePeriod() {
    const period = periodById(selectedId);
    if (isStoredPeriod(period) && context.currentPeriod !== period.id) { post({type: 'school-timetables:period', periodId: period.id}); context.currentPeriod = period.id; }
  }

  // ---- Rendering ----
  function render() {
    $('schoolYearValue').textContent = context.year;
    $('schoolYear').hidden = !context.year;
    if (!$('more').firstElementChild) $('more').innerHTML = schoolIcon('more-horizontal');
    root.innerHTML = `<div class="sp-wrap">
        <div class="sp-period-bar">
          <label for="period">Περίοδος</label>
          <select id="period"></select>
          <span id="periodNote" class="sp-period-note"></span>
          <button id="managePeriods" type="button">Διαχείριση περιόδων…</button>
        </div>
        <div id="periodWarnings" class="sp-period-warnings"></div>
        <p id="notice" class="subapp-notice" role="status"></p>
        <div id="board"></div>
      </div>`;
    $('period').addEventListener('change', () => { selectPeriod($('period').value); });
    $('managePeriods').onclick = managePeriods;
    renderBar(); renderBoard();
    if (!introShown) introShown = true;
    buttons();
  }
  function selectPeriod(id) {
    if (!periodById(id)) return;
    selectedId = id;
    renderBar(); renderBoard();
    sharePeriod();
  }
  // The period list of the shared schoolPeriodSelect (_ui.js): Περίοδοι and Προσχέδια περιόδων, «(κενή)» for a period
  // without programs; with fit, the closed list has the whole name and the width of the period it shows.
  function renderBar() {
    const select = $('period'), period = periodById(selectedId);
    schoolPeriodSelect(select, draft.periods, {year: context.year, selected: period?.id || '', fit: true, note: item => programsOf(item.id).length ? '' : '(κενή)'});
    // Next to the list: the dates of an Επίσημη (an empty «Έως» is the end of the school year), or that a Προσχέδιο
    // περιόδου is not in force on any date yet.
    const note = $('periodNote');
    note.textContent = !period ? '' : isDraftPeriod(period) ? 'Δεν ισχύει ακόμη σε καμία ημερομηνία.'
      : D.valid(period.from) ? D.format(period.from) + ' – ' + D.format(T.periodEnd(period, context.year)) : '';
    note.hidden = !note.textContent;
    renderWarnings();
    buttons();
  }
  // Warnings for the period shown, and the limit of the periods.
  function renderWarnings() {
    const period = periodById(selectedId);
    const warnings = T.periodWarnings(draft.periods).filter(warning => period && warning.periodIds.includes(period.id)).map(warning => warning.message);
    const count = draft.periods.length, limit = limits().periods;
    if (count >= limit) warnings.push('Το σχολικό έτος έχει ' + count + ' περιόδους, το όριο. Για νέα περίοδο, αφαίρεσε μια που δεν χρειάζεται.');
    else if (nearLimit(count, limit)) warnings.push('Το σχολικό έτος έχει ' + count + ' από τις ' + limit + ' περιόδους που επιτρέπονται.');
    $('periodWarnings').replaceChildren(...warnings.map(message => Object.assign(document.createElement('p'), {className: 'ui-validation-warning', textContent: message})));
  }
  function renderBoard() {
    const board = $('board'), period = periodById(selectedId);
    if (!board) return;
    if (!period) {
      board.innerHTML = `<div class="subapp-empty subapp-empty-stack sp-board-empty"><p>Δεν υπάρχουν περίοδοι για το σχολικό έτος ${esc(context.year)}.</p><button id="firstPeriod" type="button" class="primary">Διαχείριση περιόδων…</button></div>`;
      $('firstPeriod').onclick = managePeriods;
      return;
    }
    const morning = kindKeys.filter(kind => kind !== 'oloimero' && T.kinds[kind].zone !== 'oloimero');
    board.innerHTML = `<div class="sp-sources">
        ${kindKeys.includes('oloimero') ? cardHtml(period, 'oloimero') : ''}
        <div class="sp-morning" role="group" aria-labelledby="morningLabel"><span id="morningLabel" class="sp-morning-label">ΠΡΩΙΝΟ</span>${morning.map(kind => cardHtml(period, kind)).join('')}</div>
      </div>
      <div class="sp-arrows" aria-hidden="true"></div>
      <section class="sp-full" aria-labelledby="fullTitle">
        <span class="app-mark is-sub sp-mark" data-app-icon="full" aria-hidden="true"></span>
        <div class="sp-full-text"><h2 id="fullTitle">Πλήρες Σχολικό Πρόγραμμα</h2><p>Η σύνθεση των τριών πηγών της περιόδου: προβολή, επεξεργασία ωρών και εκτύπωση.</p></div>
        <button id="openFull" type="button" class="success">${schoolIconText('chevron-right', 'Άνοιγμα προγράμματος', {end: true})}</button>
      </section>
      <section id="problems" aria-label="Συγκρούσεις και προειδοποιήσεις της περιόδου" hidden></section>
      <div id="limits" class="sp-limits" hidden></div>`;
    board.querySelectorAll('[data-menu]').forEach(button => { button.innerHTML = schoolIcon('more-vertical'); button.onclick = () => cardMenu(button, button.dataset.menu); });
    board.querySelectorAll('[data-open]').forEach(button => { button.onclick = () => openApp(button.dataset.open); });
    board.querySelectorAll('[data-import]').forEach(button => { button.onclick = () => importProgram(period, button.dataset.import); });
    board.querySelectorAll('[data-drop]').forEach(watchDrop);
    $('openFull').onclick = () => openApp('school');
    renderProblems();
    renderLimits();
    drawArrows();
  }
  // ---- Warnings of the composition (under the Πλήρες) ----
  // The conflicts and the warnings of the composition of the period, as the programs are in the page (unsaved changes
  // included), from SchoolTimetable.composePeriod and compositionProblems, with the shared schoolProblems (_ui.js):
  // one line, closed at first; opened, a list in groups, each problem with a link to the application that shows it
  // (period, and teacher or τμήμα).
  const APP_LINKS = Object.freeze({school: 'Πλήρες Πρόγραμμα', oloimero: 'Ολοήμερο Designer', individual: 'Ατομικά Προγράμματα'});
  function renderProblems() {
    const box = $('problems'), period = periodById(selectedId);
    if (!box) return;
    if (!period || !programsOf(period.id).length) { box.hidden = true; box.replaceChildren(); return; }
    box.hidden = false;
    let problems = [], failure = '';
    try {
      const composition = T.composePeriod({periodId: period.id, programs: draft.programs, staff: context.staff || [], classes: yearClasses(), teachingHours: context.teachingHours});
      problems = T.compositionProblems(composition, {staff: context.staff || [], classes: yearClasses()});
    } catch (error) { failure = 'Ο έλεγχος των προγραμμάτων της περιόδου δεν γίνεται: ' + error.message; }
    schoolProblems.render(box, {
      problems, failure, open: problemsOpen, onToggle: open => { problemsOpen = open; },
      help: 'Από τη σύνθεση της περιόδου, όπως είναι τα προγράμματα στη σελίδα (μαζί με τις αλλαγές που δεν έχουν αποθηκευτεί).',
      link: item => item.target?.app && APP_LINKS[item.target.app] ? {
        label: APP_LINKS[item.target.app], title: targetText(period, item.target),
        run: () => openApp(item.target.app, {staffId: item.target.staffId, classId: item.target.classId, day: item.day, start: item.start})
      } : null
    });
  }
  // «Άνοιγμα: Ατομικά Προγράμματα — περίοδος «Α», εκπαιδευτικός «…»».
  function targetText(period, target) {
    const person = target.staffId ? (context.staff || []).find(item => item.id === target.staffId) : null;
    const record = target.classId ? yearClasses().find(item => item.id === target.classId) : null;
    return 'Άνοιγμα: ' + APP_LINKS[target.app] + ' — περίοδος ' + quoted(periodName(period)) +
      (person ? ', εκπαιδευτικός ' + quoted(person.shortName || person.name || '?') : '') + (record ? ', τμήμα ' + quoted(record.name) : '');
  }
  // Seamless CSS-shape connectors. The source/target positions follow the cards after every resize.
  // At <=900px, the vertically stacked layout uses one straight downward connector.
  function drawArrows() {
    const area = document.querySelector('.sp-arrows');
    const sources = document.querySelector('.sp-sources');
    if (!area || !sources) return;
    const cards = [...sources.querySelectorAll('.sp-card')];
    const box = area.getBoundingClientRect();
    if (!box.width || cards.length !== 3) return;
    const centres = cards.map(card => {
      const rect = card.getBoundingClientRect();
      return {x: rect.left + rect.width / 2 - box.left, y: rect.bottom - box.top};
    });
    const stacked = getComputedStyle(sources).gridTemplateColumns.split(' ').length === 1 || box.width < 650;
    const arrow = (from, to, startY = 0) => {
      const reverse = from > to;
      const el = document.createElement('div');
      el.className = 'sp-arrow' + (reverse ? ' reverse' : '');
      el.style.left = Math.min(from, to) + 'px';
      el.style.width = Math.abs(to - from) + 'px';
      el.style.setProperty('--sp-from-y', Math.min(0, startY) + 'px');
      el.innerHTML = '<span class="sp-arrow-path"></span><span class="sp-arrow-head"></span>';
      return el;
    };
    const middle = box.width / 2;
    if (stacked) {
      const el = document.createElement('div');
      el.className = 'sp-arrow straight';
      el.style.left = middle + 'px';
      el.style.setProperty('--sp-from-y', centres[centres.length - 1].y + 'px');
      el.innerHTML = '<span class="sp-arrow-head"></span>';
      area.replaceChildren(el);
      return;
    }
    const spread = Math.min(60, box.width / 12);
    const left = arrow(centres[0].x, middle - spread, centres[0].y);
    const center = document.createElement('div');
    center.className = 'sp-arrow straight';
    center.style.left = centres[1].x + 'px';
    center.style.setProperty('--sp-from-y', centres[1].y + 'px');
    center.innerHTML = '<span class="sp-arrow-head"></span>';
    const right = arrow(centres[2].x, middle + spread, centres[2].y);
    area.replaceChildren(left, center, right);
  }
  new ResizeObserver(drawArrows).observe(root);

  function cardHtml(period, kind) {
    const info = T.kinds[kind], card = CARDS[kind] || {title: kindLabel(kind), line: '', icon: '', open: !!info.owner};
    const program = programOf(period.id, kind), importable = T.importers(kind).length > 0;
    const menu = cardMenuItems(period, kind).some(item => !item.separator);
    const head = `<div class="sp-card-head">
        <span class="app-mark is-sub sp-mark" data-app-icon="${esc(card.icon)}" aria-hidden="true"></span>
        <div class="sp-card-title"><h2 id="card-${esc(kind)}">${esc(card.title)}</h2>${card.line ? `<p>${esc(card.line)}</p>` : ''}</div>
        ${menu ? `<button type="button" class="ui-icon-button" data-menu="${esc(kind)}" title="Ενέργειες" aria-label="Ενέργειες: ${esc(card.title)}"></button>` : ''}
      </div>`;
    const dropKind = kind === 'school' || kind === 'oloimero' ? ` data-drop="${kind}"` : '';
    const open = card.open && info.owner ? `<button type="button" class="ui-link-button" data-open="${esc(kind)}">${schoolIconText('chevron-right', 'Άνοιγμα', {end: true})}</button>` : '';
    const action = kind === 'school' && importable ? `<button type="button" class="ui-link-button" data-import="school">${schoolIconText('chevron-right', 'Εισαγωγή', {end: true})}</button>` : open;
    if (!program) {
      const help = kind === 'individual' ? 'Ορίζεται στην εφαρμογή ' + quoted(info.ownerTitle) + '.' : importable ? '' : info.ownerTitle ? 'Ανατίθεται σε περίοδο από την εφαρμογή ' + quoted(info.ownerTitle) + '.' : '';
      const dropArea = (kind === 'school' || kind === 'oloimero') && schoolHost.hosted
        ? `<div class="subapp-file-drop visible sp-file-drop" aria-label="Περιοχή απόθεσης αρχείων: ${esc(card.title)}">
            <span class="subapp-file-drop-icon" aria-hidden="true">${schoolIcon('file-import')}</span>
            <div class="subapp-file-drop-title">${kind === 'school' ? 'Σύρε εδώ τα αρχεία CSV και FET' : 'Σύρε εδώ το αρχείο CSV του Ολοημέρου'}</div>
            <p class="sp-drop-state">Δεν υπάρχει πρόγραμμα στην περίοδο.</p>
          </div>` : '';
      return `<article class="sp-card" aria-labelledby="card-${esc(kind)}"${dropKind}>${head}
        ${dropArea || `<div class="sp-empty"><p>Δεν υπάρχει πρόγραμμα στην περίοδο.</p>${help ? `<p>${esc(help)}</p>` : ''}${importable ? `<button type="button" class="primary" data-import="${esc(kind)}">Εισαγωγή…</button>` : ''}</div>`}
        ${action ? `<div class="sp-card-actions">${action}</div>` : ''}</article>`;
    }
    // The same five facts on every card; «Τελ. αλλαγή» only when the program differs from its initial state.
    const s = stats(program), source = program.source || {}, modified = T.isModified(program), initial = initialDate(program);
    const facts = [
      ['Δραστηριότητες', String(s.activities)],
      ['Εκπαιδευτικοί', s.staff + (s.unmatched ? ' · ' + s.unmatched + ' χωρίς αντιστοίχιση' : '')],
      ['Τμήματα', String(s.classes)],
      ['Αρχική', initial ? D.format(initial) : '—'],
      modified ? ['Τελ. αλλαγή', program.updatedAt ? D.format(localDay(program.updatedAt)) : '—', 'modified'] : ['Τελ. αλλαγή', '- χωρίς αλλαγές -', 'unchanged']
    ];
    const pendingCells = source.type === 'individual' && Array.isArray(source.pending) ? source.pending.length : 0;
    const replacements = source.modifiedAfterImport?.replacements || [];
    const note = replacements.length ? 'Αντικαταστάσεις εκπαιδευτικών: ' + replacements.map(item => (item.fromName || '?') + ' → ' + (item.toName || '?')).join(', ') : '';
    const pendingInitial = initialIds.has(program.id) ? 'Η τρέχουσα κατάσταση θα γίνει η αρχική με την «Αποθήκευση».' : '';
    return `<article class="sp-card" aria-labelledby="card-${esc(kind)}"${dropKind}>${head}
      <dl class="sp-facts">${facts.map(([label, value, className]) => `<dt>${esc(label)}</dt><dd${className ? ` class="${className}"` : ''}>${esc(value)}</dd>`).join('')}</dl>
      ${pendingInitial ? `<p class="sp-state">${esc(pendingInitial)}</p>` : ''}
      ${pendingCells ? `<p class="sp-note">${pendingCells === 1 ? '1 ελλιπές κελί' : pendingCells + ' ελλιπή κελιά'}</p>` : ''}
      ${note ? `<p class="sp-note">${esc(note)}</p>` : ''}
      ${isStored(program) ? '' : '<p class="sp-new">Νέο· αποθηκεύεται με την «Αποθήκευση».</p>'}
      ${action ? `<div class="sp-card-actions">${action}</div>` : ''}
    </article>`;
  }
  // The day (YYYY-MM-DD) of the initial state of a program: its «Ορισμός ως Αρχική», or else the import (Ωρολόγιο) or
  // the creation of the program.
  function initialDate(program) {
    const at = program.initialSetAt || (program.kind === 'school' && program.source?.importedAt) || program.createdAt;
    return at ? localDay(at) : '';
  }
  // The limit of programs of the year: a warning near it, an error above it (the save is refused).
  function renderLimits() {
    const box = $('limits');
    if (!box) return;
    const total = programCount(), limit = limits().programs;
    box.innerHTML = total > limit ? '<p class="ui-validation-error">Το σχολικό έτος θα είχε ' + total + ' προγράμματα, πάνω από το όριο των ' + limit + '. Η αποθήκευση δεν θα γίνει· διάγραψε περιόδους ή προγράμματα που δεν χρειάζονται.</p>'
      : nearLimit(total, limit) ? '<p class="ui-validation-warning">Το σχολικό έτος έχει ' + total + ' από τα ' + limit + ' προγράμματα που επιτρέπονται.</p>' : '';
    box.hidden = !box.innerHTML;
  }

  // ---- Opening the program applications (school-timetables:open) ----
  // The index asks about unsaved changes of this page before it opens another application.
  // extra: {staffId, classId, day, start} of the target (from the warnings under the Πλήρες: the cell of the problem).
  function openApp(kind, extra = {}) {
    const period = periodById(selectedId);
    if (!period || busy) return;
    if (!isStoredPeriod(period)) { notice('Η περίοδος ' + quoted(periodName(period)) + ' δεν έχει αποθηκευτεί ακόμη. Πάτησε πρώτα «Αποθήκευση».', true); return; }
    const target = {periodId: period.id};
    if (extra.staffId) target.staffId = extra.staffId;
    if (extra.classId) target.classId = extra.classId;
    if (extra.day && extra.start) { target.day = extra.day; target.start = extra.start; }
    post({type: 'school-timetables:open', app: kind, target});
  }

  // ---- Menus ----
  function cardMenuItems(period, kind) {
    const program = programOf(period.id, kind), items = [];
    const importable = T.importers(kind).length > 0, modified = !!program && T.isModified(program);
    if (program && hasHistory(kind)) items.push({label: 'Ιστορικό…', value: 'history'});
    if (program) {
      items.push({label: 'Ορισμός ως Αρχική…', value: 'setInitial', disabled: !modified, title: modified ? '' : 'Το πρόγραμμα είναι ίδιο με την αρχική του κατάσταση.'});
      items.push({label: 'Επαναφορά στην αρχική…', value: 'restore', disabled: !modified, title: modified ? '' : 'Το πρόγραμμα είναι ίδιο με την αρχική του κατάσταση.'});
    }
    items.push({separator: true});
    if (importable) items.push({label: program ? 'Αντικατάσταση από αρχεία…' : 'Εισαγωγή από αρχεία…', value: 'import'});
    items.push({separator: true});
    // The σχέδιο Ολοημέρου is required in a period with an Ωρολόγιο: it is replaced, not deleted.
    if (program && !(kind === 'oloimero' && programOf(period.id, 'school'))) items.push({label: 'Διαγραφή…', value: 'delete', danger: true});
    return items;
  }
  async function cardMenu(button, kind) {
    const period = periodById(selectedId);
    if (!period || busy) return;
    const choice = await schoolMenu.open(button, cardMenuItems(period, kind), {label: 'Ενέργειες: ' + cardTitle(kind)});
    if (!choice || periodById(selectedId) !== period) return;
    if (choice === 'history') showHistory(period, kind);
    else if (choice === 'setInitial') setInitialOf(period, [kind]);
    else if (choice === 'restore') restoreOf(period, kind);
    else if (choice === 'import') importProgram(period, kind);
    else if (choice === 'delete') deleteProgram(period, kind);
  }
  $('more').onclick = async () => {
    if (busy || !context) return;
    const period = periodById(selectedId);
    const modified = period ? programsOf(period.id).filter(T.isModified) : [];
    const stored = isStoredPeriod(period);
    const choice = await schoolMenu.open($('more'), [
      {label: 'Ορισμός όλων ως Αρχική…', value: 'setInitialAll', disabled: !modified.length, title: modified.length ? '' : 'Κανένα πρόγραμμα της περιόδου δεν διαφέρει από την αρχική του κατάσταση.'},
      {separator: true},
      {label: 'Αντίγραφο ασφαλείας περιόδου…', value: 'backup', disabled: !stored, title: stored ? '' : period ? 'Η περίοδος δεν έχει αποθηκευτεί ακόμη. Πάτησε πρώτα «Αποθήκευση».' : 'Δεν υπάρχει περίοδος.'},
      {label: 'Επαναφορά από αντίγραφο…', value: 'restore'}
    ], {label: 'Περισσότερες ενέργειες'});
    if (choice === 'setInitialAll' && period) setInitialOf(period, modified.map(program => program.kind));
    else if (choice === 'backup' && period) backupPeriod(period);
    else if (choice === 'restore') restoreBackup();
  };

  // ---- Initial state («Ορισμός ως Αρχική», «Επαναφορά») ----
  // The page sends the program of SchoolTimetable.setInitial with setInitial:true; the host keeps the initial state.
  async function setInitialOf(period, kinds) {
    const programs = kinds.map(kind => programOf(period.id, kind)).filter(program => program && T.isModified(program));
    if (!programs.length) return;
    const names = programs.map(program => cardTitle(program.kind)).join(', ');
    const fet = programs.some(program => program.kind === 'school' && !program.initialSetAt);
    const message = (programs.length === 1 ? 'Η τρέχουσα κατάσταση του προγράμματος ' + quoted(names) : 'Η τρέχουσα κατάσταση των προγραμμάτων ' + names) +
      ' της περιόδου ' + quoted(periodName(period)) + ' θα γίνει η αρχική ' + (programs.length === 1 ? 'του' : 'τους') + '.' + (fet ? ' Μετά δεν θα υπάρχει πια επαναφορά στο καθαρό FET της εισαγωγής.' : '') + ' Γίνεται οριστικό με την «Αποθήκευση».';
    if (!await confirmWithBackup(period, programs, {title: 'Ορισμός ως Αρχική', message})) return;
    for (const program of programs) {
      const result = T.setInitial(program);
      draft.programs[draft.programs.indexOf(program)] = result;
      initialIds.add(result.id);
    }
    mark(); renderBoard();
    notice('Η τρέχουσα κατάσταση ' + (programs.length === 1 ? 'του ' + quoted(names) : 'των ' + names) + ' θα γίνει η αρχική με την «Αποθήκευση».');
  }
  async function restoreOf(period, kind) {
    const program = programOf(period.id, kind);
    if (!program || !T.isModified(program)) return;
    const day = initialDate(program), what = 'στην αρχική του κατάσταση' + (day ? ' (' + D.format(day) + ')' : '');
    const extra = kind === 'oloimero' ? ' Επανέρχονται οι δραστηριότητες και οι θέσεις τους· τα χρώματα και η εμφάνιση μένουν όπως είναι.' : '';
    if (!await confirmWithBackup(period, [program], {title: 'Επαναφορά', message: 'Το πρόγραμμα ' + quoted(cardTitle(kind)) + ' της περιόδου ' + quoted(periodName(period)) + ' θα επιστρέψει ' + what + '. Οι αλλαγές από τότε θα χαθούν.' + extra + ' Γίνεται οριστικό με την «Αποθήκευση».'})) return;
    const result = T.restoreInitial(program, {catalog: context.individualCatalog, classes: yearClasses()});
    draft.programs[draft.programs.indexOf(program)] = result;
    initialIds.delete(result.id);
    mark(); renderBoard();
    notice('Το πρόγραμμα ' + quoted(cardTitle(kind)) + ' επανήλθε ' + what + '. Πάτησε «Αποθήκευση».');
  }
  // ---- «Διαχείριση περιόδων» ----
  // The list of periods with their number, dates and status, and the actions on the selected one. Every change goes
  // into the page and is saved with «Αποθήκευση». When the dialog closes, the page shows the period selected in it.
  function managePeriods() {
    if (busy) return;
    let chosen = selectedId;
    const make = (tag, className, textValue) => { const node = document.createElement(tag); if (className) node.className = className; if (textValue != null) node.textContent = textValue; return node; };
    const table = make('div', 'sp-period-table'), actions = make('div', 'sp-period-actions'), footer = make('div', 'sp-periods-footer');
    table.setAttribute('role', 'listbox'); table.setAttribute('aria-label', 'Περίοδοι'); table.tabIndex = 0;
    const add = make('button', 'primary', 'Νέα περίοδος…'), copy = make('button', '', 'Αντιγραφή περιόδου…'), edit = make('button', '', 'Επεξεργασία…');
    const official = make('button', '', 'Ορισμός ως Επίσημης…'), remove = make('button', 'danger', 'Διαγραφή…');
    for (const button of [add, copy, edit, official, remove]) button.type = 'button';
    actions.append(add, copy, edit, official, remove, make('p', 'ui-helper', 'Η σειρά είναι αυτόματη: οι Επίσημες κατά ημερομηνία έναρξης, μετά τα Προσχέδια περιόδων αλφαβητικά. Σε επικάλυψη ισχύει η περίοδος που ξεκινά αργότερα.'));
    const layout = make('div', 'sp-periods');
    layout.append(table, actions, footer);
    function draw() {
      const list = orderedPeriods();
      if (!periodById(chosen)) chosen = list[0]?.id || null;
      // Two groups, always shown (an empty one with a faint line); the column headings once, in the first group.
      const groups = [];
      for (const [isDraft, label, icon, empty] of [[false, 'Περίοδοι', 'calendar-check', 'Δεν υπάρχουν Επίσημες περίοδοι.'], [true, 'Προσχέδια περιόδων', 'calendar-dashed', 'Δεν υπάρχουν Προσχέδια περιόδων.']]) {
        const group = make('div', 'sp-period-group ' + (isDraft ? 'draft' : 'official'));
        group.setAttribute('role', 'group'); group.setAttribute('aria-label', label);
        const head = make('div', 'sp-period-group-head');
        head.setAttribute('aria-hidden', 'true');
        head.innerHTML = schoolIcon(icon);
        head.append(make('span', '', label));
        group.append(head);
        if (!isDraft) {
          const columns = make('div', 'sp-period-row head');
          columns.setAttribute('aria-hidden', 'true');
          columns.append(make('span', '', '#'), make('span', '', 'Τίτλος περιόδου'), make('span', '', 'Από'), make('span', '', 'Έως'), make('span', '', 'Κατάσταση'));
          group.append(columns);
        }
        const items = list.filter(period => isDraftPeriod(period) === isDraft);
        if (!items.length) group.append(make('p', 'sp-periods-empty', empty + (!list.length && !isDraft ? ' Πάτησε «Νέα περίοδος…».' : '')));
        groups.push({group, items});
      }
      for (const {group, items} of groups) for (const period of items) {
        const row = make('div', 'sp-period-row' + (period.id === chosen ? ' selected' : ''));
        row.id = 'sp-row-' + period.id; row.setAttribute('role', 'option'); row.setAttribute('aria-selected', String(period.id === chosen));
        const title = make('span', '', periodName(period));
        if (!isStoredPeriod(period)) title.append(make('span', 'unsaved', 'νέα· με την «Αποθήκευση»'));
        const dated = !isDraftPeriod(period) && D.valid(period.from);
        const from = make('span', dated ? '' : 'muted', dated ? D.format(period.from) : '—');
        const to = make('span', dated ? '' : 'muted');
        if (!dated) to.textContent = '—';
        else if (period.to) to.textContent = D.format(period.to);
        else { to.textContent = D.format(teachingEnd()) + ' '; to.append(make('span', 'end-note', '(τέλος έτους)')); to.title = 'Χωρίς ημερομηνία λήξης: μέχρι το τέλος του σχολικού έτους'; }
        const status = make('span', ''), badge = make('span', 'ui-period-status ' + (isDraftPeriod(period) ? 'draft' : 'official'), isDraftPeriod(period) ? 'Προσχέδιο' : 'Επίσημη');
        status.append(badge);
        row.append(make('span', 'num', String(periodNumber(period))), title, from, to, status);
        row.onclick = () => { chosen = period.id; draw(); table.focus({preventScroll: true}); };
        row.ondblclick = () => { chosen = period.id; editPeriod(); };
        group.append(row);
      }
      table.replaceChildren(...groups.map(item => item.group));
      if (chosen) { table.setAttribute('aria-activedescendant', 'sp-row-' + chosen); $('sp-row-' + chosen)?.scrollIntoView({block: 'nearest'}); }
      else table.removeAttribute('aria-activedescendant');
      const period = periodById(chosen), full = draft.periods.length >= limits().periods;
      add.disabled = copy.disabled = full;
      add.title = copy.title = full ? 'Ένα σχολικό έτος έχει έως ' + limits().periods + ' περιόδους.' : '';
      copy.disabled ||= !draft.periods.length;
      edit.disabled = remove.disabled = !period;
      official.disabled = !period || !isDraftPeriod(period);
      official.title = period && !isDraftPeriod(period) ? 'Η περίοδος είναι ήδη Επίσημη.' : '';
      const counts = {official: list.filter(item => !isDraftPeriod(item)).length, draft: list.filter(isDraftPeriod).length};
      footer.replaceChildren(...T.periodWarnings(draft.periods).map(warning => make('p', 'ui-validation-warning', warning.message)),
        make('p', 'sp-periods-summary', 'Σύνολο: ' + list.length + ' (Επίσημες: ' + counts.official + ', Προσχέδια: ' + counts.draft + ') · Μέγιστο ανά έτος: ' + limits().periods));
    }
    table.addEventListener('keydown', event => {
      const list = orderedPeriods(), index = list.findIndex(period => period.id === chosen);
      let next = null;
      if (event.key === 'ArrowDown') next = Math.min(list.length - 1, index + 1);
      else if (event.key === 'ArrowUp') next = Math.max(0, index - 1);
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = list.length - 1;
      else if (event.key === 'Enter' && chosen) { event.preventDefault(); editPeriod(); return; }
      if (next == null || !list.length) return;
      event.preventDefault(); chosen = list[Math.max(0, next)].id; draw();
    });
    const changed = id => { if (id) chosen = id; draw(); renderBar(); renderBoard(); };
    async function editPeriod() { const period = periodById(chosen); if (period && await periodForm({period, mode: 'edit'})) changed(period.id); }
    add.onclick = async () => { const id = await periodForm({mode: 'new'}); if (id) changed(id); };
    edit.onclick = editPeriod;
    official.onclick = async () => { const period = periodById(chosen); if (period && await periodForm({period, mode: 'official'})) changed(period.id); };
    copy.onclick = async () => { const id = await copyPeriod(chosen); if (id) changed(id); };
    remove.onclick = async () => { const period = periodById(chosen); if (period && await removePeriod(period)) changed(null); };
    draw();
    schoolChoiceDialog({
      title: 'Διαχείριση περιόδων', className: 'sp-periods-dialog',
      content: ['Περίοδοι του σχολικού έτους ' + context.year + '. Οι αλλαγές αποθηκεύονται με την «Αποθήκευση» της σελίδας.', layout],
      actions: [{label: 'Κλείσιμο', accept: true, value: true}],
      ready: () => table.focus({preventScroll: true})
    }).then(() => {
      if (chosen && periodById(chosen) && chosen !== selectedId) selectPeriod(chosen);
      else { renderBar(); renderBoard(); }
    });
  }

  // A period: new (mode 'new', Επίσημη or Προσχέδιο), changed (mode 'edit'), or made official (mode 'official').
  // An official period needs a start date; a Προσχέδιο περιόδου has no dates (the fields are hidden), and gets them
  // with «Ορισμός ως Επίσημης». The warnings of the list (overlaps, same start, empty «Έως» before the last one) are
  // shown as the dates are written. → the id of the period, or null.
  async function periodForm({period = null, mode}) {
    const make = (tag, attributes = {}, textValue) => { const node = document.createElement(tag); for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value); if (textValue != null) node.textContent = textValue; return node; };
    const labelled = (labelText, control) => { const label = make('label', {class: 'school-choice-field'}, labelText); label.append(control); return label; };
    const name = make('input', {type: 'text', maxlength: '200'}), from = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'}), to = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'});
    const grid = make('div', {class: 'sp-form-grid'}), fromField = labelled('Από', from), toField = labelled('Έως', to);
    grid.append(labelled('Όνομα', name), fromField, toField);
    const help = make('p', {class: 'sp-form-help'}), warnings = make('div', {class: 'sp-form-warnings'});
    const content = [];
    let status = null;
    if (mode === 'new') {
      status = make('fieldset', {class: 'sp-status-choice'});
      status.append(make('legend', {}, 'Η περίοδος είναι'));
      for (const [value, labelText] of [['official', 'Επίσημη'], ['draft', 'Προσχέδιο περιόδου']]) {
        const label = make('label'), radio = make('input', {type: 'radio', name: 'sp-status', value});
        label.append(radio, document.createTextNode(labelText)); status.append(label);
      }
      status.querySelector('[value="official"]').checked = true;
    }
    const isDraft = () => mode === 'edit' ? isDraftPeriod(period) : mode === 'new' && status.querySelector('[value="draft"]').checked;
    if (mode === 'new') {
      // Suggested: after the last official period, within the school year.
      const range = yearRange(), last = orderedPeriods().filter(item => !isDraftPeriod(item)).at(-1), today = D.today();
      let start = !last ? range.from : last.to ? addDays(last.to, 1) : (today > addDays(last.from, 1) ? today : addDays(last.from, 1));
      if (start < range.from) start = range.from;
      if (start > range.to) start = range.to;
      const names = new Set(draft.periods.map(item => item.name.trim()));
      let suggestion = 'Νέα περίοδος', number = 2;
      while (names.has(suggestion)) suggestion = 'Νέα περίοδος ' + number++;
      name.value = suggestion; from.value = D.format(start);
    } else {
      // A Προσχέδιο περιόδου has no dates: «Ορισμός ως Επίσημης» starts with empty fields.
      name.value = period.name;
      if (!isDraftPeriod(period)) { from.value = D.valid(period.from) ? D.format(period.from) : ''; to.value = D.valid(period.to) ? D.format(period.to) : ''; }
    }
    if (mode === 'official') content.push('Το Προσχέδιο περιόδου ' + quoted(periodName(period)) + ' θα γίνει Επίσημη περίοδος και θα ισχύει στις ημερομηνίες που ορίζεις εδώ. Αν επικαλύπτεται με άλλη Επίσημη, ισχύει η περίοδος που ξεκινά αργότερα· οι ημερομηνίες δεν αλλάζουν αυτόματα.');
    if (status) content.push(status);
    content.push(grid, help, warnings);
    const read = () => {
      const fromText = from.value.trim(), toText = to.value.trim();
      return {fromText, toText, fromIso: fromText ? D.parse(fromText) : '', toIso: toText ? D.parse(toText) : ''};
    };
    const update = () => {
      const draftStatus = isDraft() && mode !== 'official';
      fromField.hidden = toField.hidden = draftStatus;
      grid.classList.toggle('no-dates', draftStatus);
      help.textContent = draftStatus ? 'Ένα Προσχέδιο περιόδου δεν έχει ημερομηνίες· τις αποκτά με τον «Ορισμό ως Επίσημης».' : 'Ημερομηνίες μέσα στο σχολικό έτος (' + yearRangeText() + '). Κενό «Έως»: μέχρι το τέλος του σχολικού έτους (' + D.format(teachingEnd()) + ').';
      const {fromIso, toIso, toText} = read();
      const messages = [];
      if (!draftStatus && fromIso && (toIso || !toText)) {
        const preview = {...(period ? clone(period) : {id: 'sp-preview'}), name: name.value.trim() || 'Νέα περίοδος', from: fromIso, to: toIso || '', status: 'official'};
        const list = [...draft.periods.filter(item => item.id !== preview.id), preview];
        for (const warning of T.periodWarnings(list)) if (warning.type !== 'order' && warning.periodIds.includes(preview.id)) messages.push(warning.message);
      }
      warnings.replaceChildren(...messages.map(message => make('p', {class: 'ui-validation-warning'}, message)));
    };
    const run = () => {
      const draftStatus = isDraft() && mode !== 'official', newName = name.value.trim(), {fromText, toText, fromIso, toIso} = read();
      if (!newName) { name.focus(); throw Error('Συμπλήρωσε όνομα για την περίοδο.'); }
      if (draftStatus) return {name: newName, from: '', to: '', status: 'draft'};
      if (!fromText) { from.focus(); throw Error('Μια Επίσημη περίοδος χρειάζεται ημερομηνία έναρξης (ηη/μμ/εεεε).'); }
      if (fromText && (!fromIso || !D.inSchoolYear(fromIso, context.year))) { from.focus(); throw Error('Η ημερομηνία «Από» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος (' + yearRangeText() + ').'); }
      if (toText && (!toIso || !D.inSchoolYear(toIso, context.year))) { to.focus(); throw Error('Η ημερομηνία «Έως» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος, ή κενή.'); }
      if (toText && !fromText) { from.focus(); throw Error('Συμπλήρωσε και την ημερομηνία «Από», ή άφησε κενό και το «Έως».'); }
      if (fromIso && toIso && toIso < fromIso) { to.focus(); throw Error('Η λήξη είναι πριν από την έναρξη.'); }
      return {name: newName, from: fromIso, to: toIso || '', status: 'official'};
    };
    for (const control of [name, from, to]) control.addEventListener('input', update);
    status?.addEventListener('change', update);
    update();
    const result = await schoolChoiceDialog({
      title: mode === 'new' ? 'Νέα περίοδος' : mode === 'official' ? 'Ορισμός ως Επίσημης' : 'Επεξεργασία περιόδου',
      content,
      actions: [{label: 'Ακύρωση'}, {label: mode === 'new' ? 'Δημιουργία' : mode === 'official' ? 'Ορισμός ως Επίσημης' : 'Ενημέρωση', accept: true, run}],
      ready: () => { (mode === 'official' && !from.value ? from : name).focus(); if (mode === 'new') name.select(); }
    });
    if (!result) return null;
    if (mode === 'new') {
      const created = {id: uid(), name: result.name, from: result.from, to: result.to, status: result.status};
      draft.periods.push(created);
      mark();
      notice('Προστέθηκε ' + (result.status === 'draft' ? 'το Προσχέδιο περιόδου ' : 'η περίοδος ') + quoted(result.name) + '. Πάτησε «Αποθήκευση».');
      return created.id;
    }
    if (!periodById(period.id)) return null;
    Object.assign(period, {name: result.name, from: result.from, to: result.to});
    if (mode === 'official') period.status = 'official';
    mark();
    notice(mode === 'official' ? 'Η περίοδος ' + quoted(result.name) + ' θα γίνει Επίσημη με την «Αποθήκευση».' : 'Η περίοδος ' + quoted(result.name) + ' άλλαξε. Πάτησε «Αποθήκευση».');
    return period.id;
  }

  // ---- Backup of a period (SchoolTimetable.periodBackup) ----
  // The backup holds the period as it is stored in the file: changes of the page that are not saved are not in it.
  const BACKUP_TITLE = 'Αντίγραφο ασφαλείας περιόδου';
  const savedPeriod = id => saved.periods.find(period => period.id === id) || null;
  const savedProgramsOf = id => saved.programs.filter(program => program.periodId === id);
  // Whether the page has changes in the period that are not saved (its data or its programs).
  function periodChanged(id) {
    const programs = list => list.filter(program => program.periodId === id).map(program => JSON.stringify(program)).sort();
    return JSON.stringify(savedPeriod(id)) !== JSON.stringify(periodById(id)) || JSON.stringify(programs(saved.programs)) !== JSON.stringify(programs(draft.programs));
  }
  const programsListText = programs => programs.length
    ? kindKeys.map(kind => programs.find(program => program.kind === kind)).filter(Boolean).map(program => cardTitle(program.kind) + ' (' + activitiesText((program.activities || []).length) + ')').join(', ')
    : 'χωρίς προγράμματα';
  const warningLine = textValue => Object.assign(document.createElement('p'), {className: 'ui-validation-warning sp-dialog-warning', textContent: textValue});
  const helperLine = textValue => Object.assign(document.createElement('p'), {className: 'ui-helper', textContent: textValue});
  // What a backup of the period holds, for the dialogs: the period and its programs as stored, the note for unsaved
  // changes, and that the file is not encrypted.
  function backupContent(period) {
    const stored = savedPeriod(period.id);
    const content = ['Το αντίγραφο έχει την περίοδο ' + quoted(periodName(stored)) + (rangeText(stored) ? ' (' + rangeText(stored) + ')' : '') + ' με τις διαθέσιμες ώρες Ολοημέρου, και τα προγράμματά της με την αρχική τους κατάσταση και το Ιστορικό: ' + programsListText(savedProgramsOf(period.id)) + '.'];
    if (periodChanged(period.id)) content.push(warningLine('Η περίοδος έχει αλλαγές που δεν έχουν αποθηκευτεί. Το αντίγραφο θα έχει την αποθηκευμένη μορφή της, χωρίς αυτές. Αν θέλεις να περιέχει και τις αλλαγές, πάτησε πρώτα «Αποθήκευση».'));
    content.push(helperLine('Το αρχείο δεν είναι κρυπτογραφημένο, ακόμη κι αν το κοινό αρχείο έχει κωδικό: έχει ονόματα εκπαιδευτικών, όχι μαθητές. Η επαναφορά του γίνεται μόνο στο ίδιο σχολικό έτος (' + context.year + '), από το «Επαναφορά από αντίγραφο…» του μενού «⋯».'));
    return content;
  }
  // Writes the backup of a stored period to a file the user chooses. → the name of the file.
  async function writeBackup(periodId) {
    const {backup, fileName} = T.periodBackup({school: context.school, period: savedPeriod(periodId), programs: saved.programs, staff: context.staff || [], classes: context.classes || [], catalog: context.individualCatalog});
    const result = await schoolHost.request('school-programs:file', {action: 'backupSave', suggestedName: fileName, text: JSON.stringify(backup)});
    return result?.name || fileName;
  }
  // Before an action that changes or removes stored programs of a period (replacement, deletion, «Επαναφορά»,
  // «Ορισμός ως Αρχική»): the confirmation with the offer of a backup of the whole period as stored
  // (schoolBackupConfirm of _ui.js). programs: the programs the action changes; when none of them is stored, nothing
  // of the file is lost and the confirmation has no backup. → true to go on.
  function confirmWithBackup(period, programs, {title, message}) {
    const offer = isStoredPeriod(period) && programs.some(isStored);
    const stored = offer ? savedPeriod(period.id) : null;
    const note = offer ? 'Το αντίγραφο έχει όλη την περίοδο ' + quoted(periodName(stored)) + ' όπως είναι αποθηκευμένη: ' + programsListText(savedProgramsOf(period.id)) + ', μαζί με τις διαθέσιμες ώρες Ολοημέρου' +
      (periodChanged(period.id) ? ', χωρίς τις αλλαγές που δεν έχουν αποθηκευτεί' : '') + '. Δεν είναι κρυπτογραφημένο· η επαναφορά του γίνεται από το «Επαναφορά από αντίγραφο…» του μενού «⋯».' : '';
    return schoolBackupConfirm({title, message, note, backup: offer ? async () => ({name: await writeBackup(period.id)}) : null});
  }
  async function backupPeriod(period) {
    if (busy || !period) return;
    if (!isStoredPeriod(period)) { notice('Η περίοδος ' + quoted(periodName(period)) + ' δεν έχει αποθηκευτεί ακόμη. Πάτησε πρώτα «Αποθήκευση».', true); return; }
    const name = await schoolChoiceDialog({
      title: BACKUP_TITLE, content: backupContent(period),
      actions: [{label: 'Ακύρωση'}, {label: 'Αποθήκευση αντιγράφου…', accept: true, run: () => writeBackup(period.id)}]
    });
    if (name) notice('Το αντίγραφο ασφαλείας της περιόδου ' + quoted(periodName(savedPeriod(period.id) || period)) + ' αποθηκεύτηκε στο αρχείο ' + quoted(name) + '.');
  }

  // ---- Restore from a backup (SchoolTimetable.readPeriodBackup, analyzePeriodRestore, buildPeriodRestore) ----
  // Only in the same school year. It does not start when a teacher or a τμήμα of the backup is no longer in the year.
  // Subjects and Συνενώσεις missing from the catalog of the Ατομικά Προγράμματα are added, after a question. The
  // restore goes into a new Προσχέδιο περιόδου, or into the period shown, whose programs and available hours of the
  // Ολοήμερο it replaces (name, dates and status stay). Everything is saved with «Αποθήκευση».
  const RESTORE_TITLE = 'Επαναφορά από αντίγραφο';
  const dateTimeText = iso => { const date = new Date(iso); return Number.isNaN(date.getTime()) ? '' : D.format(localDay(iso)) + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0'); };
  async function restoreBackup() {
    if (busy || !context) return;
    let file;
    try { file = await schoolHost.request('school-programs:file', {action: 'backupOpen'}); }
    catch (error) { if (error?.message !== 'Η επιλογή αρχείου ακυρώθηκε.') notice(error.message, true); return; }
    if (!file) return;
    const stop = async lines => { await schoolChoiceDialog({title: RESTORE_TITLE, content: lines, actions: [{label: 'Κλείσιμο', accept: true, value: true}]}); };
    let backup;
    try { backup = T.readPeriodBackup(file.text); }
    catch (error) { await stop([quoted(file.name) + ': ' + error.message]); return; }
    const analysis = T.analyzePeriodRestore(backup, {year: context.year, school: context.school?.name, staff: context.staff || [], classes: yearClasses(), catalog: currentCatalog()});
    if (!analysis.ok) { await stop(['Η επαναφορά από το αρχείο ' + quoted(file.name) + ' δεν μπορεί να ξεκινήσει:', ...analysis.errors]); return; }
    const source = backup.period, current = periodById(selectedId), full = draft.periods.length >= limits().periods;
    const newName = (String(source.name || '').trim() || 'Περίοδος') + ' (επαναφορά ' + D.format(D.today()) + ')';
    const content = [
      'Αρχείο ' + quoted(file.name) + (dateTimeText(backup.createdAt) ? ', αντίγραφο της ' + dateTimeText(backup.createdAt) : '') + '.',
      'Περίοδος ' + quoted(String(source.name || '').trim() || '—') + (rangeText(source) ? ' (' + rangeText(source) + ')' : '') + ' · ' + (isDraftPeriod(source) ? 'Προσχέδιο περιόδου' : 'Επίσημη') + '. Προγράμματα: ' + (analysis.programs.length ? analysis.programs.map(item => cardTitle(item.kind) + ' (' + activitiesText(item.activities) + ')').join(', ') : 'κανένα') + '.'
    ];
    content.push(...analysis.warnings.map(warningLine));
    const addSubjects = analysis.addSubjects.map(item => quoted(item.name)), addUnions = analysis.addUnions.map(item => quoted(item.name));
    const adds = addSubjects.length || addUnions.length;
    const addsText = [addSubjects.length ? (addSubjects.length === 1 ? 'το μάθημα ' : 'τα μαθήματα ') + addSubjects.join(', ') : '', addUnions.length ? (addUnions.length === 1 ? 'η Συνένωση ' : 'οι Συνενώσεις ') + addUnions.join(', ') : ''].filter(Boolean).join(' και ');
    if (adds) content.push('Από τον κατάλογο των Ατομικών Προγραμμάτων ' + (addSubjects.length + addUnions.length === 1 ? 'λείπει ' : 'λείπουν ') + addsText + '. Με τη συνέχεια ' + (addSubjects.length + addUnions.length === 1 ? 'προστίθεται' : 'προστίθενται') + ' στον κατάλογο.');
    const where = document.createElement('fieldset');
    where.className = 'sp-restore-target';
    where.innerHTML = '<legend>Πού να γίνει η επαναφορά</legend>';
    const option = (value, textValue, disabled, title) => {
      const label = document.createElement('label'), radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'sp-restore-target'; radio.value = value; radio.disabled = disabled;
      label.append(radio, document.createTextNode(textValue));
      if (disabled) { label.classList.add('disabled'); label.title = title; }
      where.append(label);
      return radio;
    };
    const asNew = option('new', 'Ως νέο Προσχέδιο περιόδου ' + quoted(newName) + ', χωρίς ημερομηνίες.', full, 'Ένα σχολικό έτος έχει έως ' + limits().periods + ' περιόδους.');
    const inCurrent = current ? option('current', 'Στην περίοδο ' + quoted(periodName(current)) + ': αντικαθίστανται όλα τα προγράμματά της και οι διαθέσιμες ώρες Ολοημέρου· το όνομα, οι ημερομηνίες και η κατάστασή της μένουν.', false, '') : null;
    (full ? inCurrent : asNew)?.click();
    content.push(where);
    const mode = await schoolChoiceDialog({
      title: RESTORE_TITLE, content,
      actions: [{label: 'Ακύρωση'}, {label: adds ? 'Προσθήκη στον κατάλογο και συνέχεια' : 'Επαναφορά', accept: true, run: () => {
        const checked = where.querySelector('input:checked');
        if (!checked) throw Error('Διάλεξε πού να γίνει η επαναφορά.');
        return checked.value;
      }}]
    });
    if (!mode) return;
    let period;
    if (mode === 'current') {
      period = periodById(current.id);
      if (!period || !await clearForRestore(period)) return;
    } else {
      if (draft.periods.length >= limits().periods) { notice('Ένα σχολικό έτος έχει έως ' + limits().periods + ' περιόδους.', true); return; }
      // A Προσχέδιο περιόδου has no dates: they come with «Ορισμός ως Επίσημης».
      period = {id: uid(), name: newName, from: '', to: '', status: 'draft'};
      draft.periods.push(period);
    }
    let result;
    try { result = T.buildPeriodRestore(analysis, {periodId: period.id, catalog: currentCatalog(), classes: yearClasses(), fileName: file.name}); }
    catch (error) { notice(error.message, true); if (mode !== 'current') draft.periods.splice(draft.periods.indexOf(period), 1); return; }
    if (Object.keys(result.oloimeroHours).length) period.oloimeroHours = result.oloimeroHours;
    else delete period.oloimeroHours;
    draft.programs.push(...result.programs);
    if (result.added.subjects.length || result.added.unions.length) catalogDraft = result.catalog;
    selectedId = period.id;
    mark(); renderBar(); renderBoard();
    notice('Η περίοδος ' + quoted(String(source.name || '').trim() || '—') + ' του αντιγράφου επανήλθε ' + (mode === 'current' ? 'στην περίοδο ' + quoted(periodName(period)) : 'ως Προσχέδιο περιόδου ' + quoted(period.name)) +
      ' (' + programsListText(result.programs) + ').' + (catalogDraft && adds ? ' Στον κατάλογο των Ατομικών Προγραμμάτων ' + (addSubjects.length + addUnions.length === 1 ? 'προστίθεται ' : 'προστίθενται ') + addsText + '.' : '') + ' Πάτησε «Αποθήκευση».');
  }
  // Before a restore into a period: its programs go, after the confirmation with the offer of a backup. → true to go on.
  async function clearForRestore(period) {
    const programs = programsOf(period.id), stored = programs.filter(isStored);
    if (!programs.length) return true;
    const unsavedNote = stored.length < programs.length ? ' Όσα δεν έχουν αποθηκευτεί ακόμη αφαιρούνται.' : '';
    const listText = (programs.length === 1 ? 'το πρόγραμμα: ' : programs.length + ' προγράμματα: ') + programs.map(programText).join(', ');
    if (!await confirmWithBackup(period, programs, {title: RESTORE_TITLE, message: 'Η περίοδος ' + quoted(periodName(period)) + ' έχει ' + listText + '. Με την επαναφορά αντικαθίστανται όλα.' + unsavedNote + (stored.length ? ' Η διαγραφή γίνεται οριστική με την «Αποθήκευση».' : '')})) return false;
    draft.programs = draft.programs.filter(program => program.periodId !== period.id);
    return true;
  }

  // ---- Removing a period ----
  // Its programs are deleted with it. A stored period with stored programs offers first a
  // backup to an external file, from which the period can come back («Επαναφορά από αντίγραφο…»).
  // → true when the period was removed from the page.
  async function removePeriod(period) {
    const programs = programsOf(period.id), stored = programs.filter(isStored);
    const name = periodName(period);
    const unsavedNote = stored.length && stored.length < programs.length ? ' Όσα δεν έχουν αποθηκευτεί ακόμη αφαιρούνται.' : '';
    const listText = (programs.length === 1 ? 'το πρόγραμμα: ' : programs.length + ' προγράμματα: ') + programs.map(programText).join(', ');
    const message = !programs.length ? 'Να διαγραφεί η περίοδος ' + quoted(name) + ';'
      : 'Η περίοδος ' + quoted(name) + ' θα διαγραφεί μαζί με ' + (programs.length === 1 ? 'το πρόγραμμά της' : 'τα προγράμματά της') + ' (' + listText + ').' + unsavedNote + (isStoredPeriod(period) ? ' Η διαγραφή γίνεται οριστική με την «Αποθήκευση».' : '');
    if (!await confirmWithBackup(period, programs, {title: 'Διαγραφή περιόδου', message})) return false;
    draft.programs = draft.programs.filter(program => program.periodId !== period.id);
    draft.periods.splice(draft.periods.indexOf(period), 1);
    if (selectedId === period.id) selectedId = initialPeriod({});
    mark();
    notice('Η περίοδος ' + quoted(name) + ' αφαιρέθηκε' + (programs.length ? ' μαζί με ' + (programs.length === 1 ? 'το πρόγραμμά της' : 'τα προγράμματά της') : '') + '. Πάτησε «Αποθήκευση».');
    return true;
  }

  // ---- Drop onto the Ωρολόγιο FET or Ολοήμερο Designer card ----
  // Index lays a drop surface over the source card; it stores file handles in that kind's importer,
  // then returns school-programs:dropped-files with the destination kind. The existing import dialog opens.
  const isFileDrag = event => [...(event.dataTransfer?.types || [])].includes('Files');
  function watchDrop(card) {
    if (!schoolHost.hosted) return;
    const start = event => {
      if (!isFileDrag(event) || busy) return;
      event.preventDefault();
      const r = card.getBoundingClientRect();
      post({type: 'school-programs:drag-start', kind: card.dataset.drop, area: {left: r.left, top: r.top, width: r.width, height: r.height}});
    };
    card.addEventListener('dragenter', start);
    card.addEventListener('dragover', start);
  }
  // A file dropped anywhere else is not opened by the browser.
  document.addEventListener('dragover', event => { if (isFileDrag(event)) { event.preventDefault(); event.dataTransfer.dropEffect = 'none'; } });
  document.addEventListener('drop', event => { if (isFileDrag(event)) event.preventDefault(); });
  schoolHost.on('school-programs:dropped-files', message => {
    const period = periodById(selectedId);
    if (busy || !context || !period) return;
    const kind = message.kind === 'oloimero' ? 'oloimero' : 'school';
    const names = ['csv', 'fet'].map(key => message.files?.[key]?.name).filter(Boolean);
    if (names.length) notice('Αφέθηκ' + (names.length === 1 ? 'ε το αρχείο ' : 'αν τα αρχεία ') + names.map(quoted).join(' και ') + '.');
    importProgram(period, kind);
  });
  schoolHost.on('school-programs:dropped-file-error', message => { notice(message.error || 'Η απόθεση του αρχείου δεν έγινε.', true); });

  // ---- Programs ----
  const fileRequest = (action, kind, importer, file) => schoolHost.request('school-programs:file', {action, kind, importer, file});
  // Before a period program is replaced: the old one is deleted with «Αποθήκευση», after the confirmation with the
  // offer of a backup. A program that is not stored yet is simply replaced. → true to go on, false when cancelled.
  async function replaceExisting(old, period) {
    if (isStored(old) && !await confirmWithBackup(period, [old], {title: 'Αντικατάσταση: ' + kindLabel(old.kind),
      message: 'Η περίοδος ' + quoted(periodName(period)) + ' έχει ήδη ' + programText(old) + ' (' + activitiesText(stats(old).activities) + '). Θα αντικατασταθεί, και η διαγραφή του γίνεται οριστική με την «Αποθήκευση».'})) return false;
    draft.programs = draft.programs.filter(program => program !== old);
    return true;
  }
  // Import with an importer of the kind (SchoolTimetable.kinds), with the shared dialog schoolProgramImport.
  async function importProgram(period, kind) {
    if (busy) return;
    const importers = T.importers(kind), label = kindLabel(kind);
    if (!importers.length) return;
    if (!context.staff?.length) { await schoolMessage('Συμπλήρωσε πρώτα το Προσωπικό του σχολικού έτους στο «Προσωπικό».', {title: 'Εισαγωγή: ' + label}); return; }
    if (!context.teachingHours?.hours?.length) { await schoolMessage('Συμπλήρωσε πρώτα τις Ώρες Διδασκαλίας του σχολικού έτους στις «Ώρες Διδασκαλίας».', {title: 'Εισαγωγή: ' + label}); return; }
    const importer = importers.length === 1 ? importers[0] : await schoolChoiceDialog({
      title: 'Εισαγωγή: ' + label, content: 'Από πού να γίνει η εισαγωγή;',
      choices: importers.map(item => ({label: item.label + '…', value: item}))
    });
    if (!importer || !periodById(period.id)) return;
    const replacing = programOf(period.id, kind);
    let created = [];   // analysis.newClasses of the analysis that was built
    const last = {};
    try { for (const file of importer.files) last[file.key] = await fileRequest('last', kind, importer.id, file.key); }
    catch (error) { notice(error.message, true); return; }
    const program = await schoolProgramImport({
      title: label + ': ' + importer.label,
      intro: 'Περίοδος ' + quoted(periodName(period)) + (rangeText(period) ? ' (' + rangeText(period) + ')' : '') + '. ' + importer.intro,
      files: importer.files.map(file => ({
        key: file.key, label: file.label, last: last[file.key]?.name || '',
