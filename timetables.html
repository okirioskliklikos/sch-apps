        <div class="sp-morning" role="group" aria-labelledby="morningLabel"><span id="morningLabel" class="sp-morning-label">ΠΡΩΙΝΟ</span>${morning.map(kind => cardHtml(period, kind)).join('')}</div>
      </div>
      <svg class="sp-arrows" aria-hidden="true" focusable="false"></svg>
      <section class="sp-full" aria-labelledby="fullTitle">
        <span class="app-mark sp-mark" style="--app-mark-bg:var(--school-app-fet)" aria-hidden="true"><span>FT</span></span>
        <div class="sp-full-text"><h2 id="fullTitle">Πλήρες Σχολικό Πρόγραμμα</h2><p>Η σύνθεση των τριών πηγών της περιόδου: προβολή, επεξεργασία ωρών και εκτύπωση. Προς το παρόν ανοίγει στον FET Timetable Editor.</p></div>
        <button id="openFull" type="button" class="primary">Άνοιγμα προγράμματος</button>
      </section>
      <div id="drafts" class="sp-drafts"></div>`;
    board.querySelectorAll('[data-menu]').forEach(button => { button.innerHTML = schoolIcon('more-vertical'); button.onclick = () => cardMenu(button, button.dataset.menu); });
    board.querySelectorAll('[data-open]').forEach(button => { button.onclick = () => openApp(button.dataset.open); });
    board.querySelectorAll('[data-import]').forEach(button => { button.onclick = () => importProgram(period, button.dataset.import); });
    $('openFull').onclick = () => openApp('school');
    renderDrafts();
    drawArrows();
  }
  // Arrows from the three sources to the Πλήρες Σχολικό Πρόγραμμα, drawn from the places of the cards.
  function drawArrows() {
    const svg = document.querySelector('.sp-arrows'), full = document.querySelector('.sp-full');
    if (!svg || !full) return;
    const box = svg.getBoundingClientRect();
    const cards = [...document.querySelectorAll('.sp-sources .sp-card')].map(card => card.getBoundingClientRect());
    const centres = cards.map(rect => rect.left + rect.width / 2 - box.left);
    const height = box.height, middle = box.width / 2;
    if (!box.width) return;
    svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + height);
    const stacked = centres.length < 2 || Math.max(...centres) - Math.min(...centres) < 20;
    const head = x => `M${x - 7} ${height - 9} L${x} ${height - 1} L${x + 7} ${height - 9}`;
    if (stacked) { svg.innerHTML = `<path d="M${middle} 2 V${height - 1}"/><path d="${head(middle)}"/>`; return; }
    const spread = Math.min(46, box.width / 8), bend = height * 0.45;
    const targets = centres.map((x, index) => middle + (index - (centres.length - 1) / 2) * spread);
    svg.innerHTML = centres.map((x, index) => {
      const target = targets[index], r = Math.min(12, Math.abs(target - x) / 2);
      if (Math.abs(target - x) < 1) return `<path d="M${x} 2 V${height - 1}"/><path d="${head(x)}"/>`;
      const dir = target > x ? 1 : -1;
      return `<path d="M${x} 2 V${bend - r} Q${x} ${bend} ${x + dir * r} ${bend} H${target - dir * r} Q${target} ${bend} ${target} ${bend + r} V${height - 1}"/><path d="${head(target)}"/>`;
    }).join('');
  }
  new ResizeObserver(() => drawArrows()).observe(root);

  function cardHtml(period, kind) {
    const info = T.kinds[kind], card = CARDS[kind] || {title: kindLabel(kind), line: '', mark: '', bg: 'default', open: !!info.owner};
    const program = programOf(period.id, kind), importable = T.importers(kind).length > 0;
    const menu = cardMenuItems(period, kind).some(item => !item.separator);
    const head = `<div class="sp-card-head">
        <span class="app-mark sp-mark" style="--app-mark-bg:var(--school-app-${esc(card.bg)})" aria-hidden="true"><span>${esc(card.mark)}</span></span>
        <div class="sp-card-title"><h2 id="card-${esc(kind)}">${esc(card.title)}</h2>${card.line ? `<p>${esc(card.line)}</p>` : ''}</div>
        ${menu ? `<button type="button" class="ui-icon-button" data-menu="${esc(kind)}" title="Ενέργειες" aria-label="Ενέργειες: ${esc(card.title)}"></button>` : ''}
      </div>`;
    const open = card.open && info.owner ? `<button type="button" class="ui-link-button" data-open="${esc(kind)}">${schoolIconText('chevron-right', 'Άνοιγμα', {end: true})}</button>` : '';
    if (!program) {
      const help = kind === 'individual' ? 'Ορίζεται στην εφαρμογή ' + quoted(info.ownerTitle) + '.' : importable ? '' : info.ownerTitle ? 'Ανατίθεται σε περίοδο από την εφαρμογή ' + quoted(info.ownerTitle) + '.' : '';
      return `<article class="sp-card" aria-labelledby="card-${esc(kind)}">${head}
        <div class="sp-empty"><p>Δεν υπάρχει πρόγραμμα στην περίοδο.</p>${help ? `<p>${esc(help)}</p>` : ''}${importable ? `<button type="button" class="primary" data-import="${esc(kind)}">Εισαγωγή…</button>` : ''}</div>
        ${open ? `<div class="sp-card-actions">${open}</div>` : ''}</article>`;
    }
    const s = stats(program), source = program.source || {}, facts = [];
    if (program.name) facts.push(['Όνομα', program.name]);
    facts.push(['Δραστηριότητες', String(s.activities)]);
    facts.push(['Εκπαιδευτικοί', s.staff + (s.unmatched ? ' · ' + s.unmatched + ' χωρίς αντιστοίχιση' : '')]);
    facts.push(['Τμήματα', String(s.classes)]);
    if (source.type === 'individual' && Array.isArray(source.pending) && source.pending.length) facts.push(['Ελλιπή κελιά', String(source.pending.length)]);
    if (source.type === 'fet') {
      const files = [source.csvName, source.fetName].filter(Boolean);
      if (files.length) facts.push(['Αρχεία', files.join('\n')]);
      if (source.importedAt) facts.push(['Εισαγωγή', D.format(localDay(source.importedAt))]);
    }
    if (program.updatedAt) facts.push(['Τελ. αλλαγή', D.format(localDay(program.updatedAt))]);
    const replacements = source.modifiedAfterImport?.replacements || [];
    const note = replacements.length ? 'Αντικαταστάσεις εκπαιδευτικών: ' + replacements.map(item => (item.fromName || '?') + ' → ' + (item.toName || '?')).join(', ') : '';
    const pendingInitial = initialIds.has(program.id) ? 'Η τρέχουσα κατάσταση θα γίνει η αρχική με την «Αποθήκευση».' : '';
    const state = T.isModified(program)
      ? `<p class="sp-state modified">Διαφέρει από την αρχική κατάσταση (${esc(initialText(program))}).</p>`
      : `<p class="sp-state">${esc(pendingInitial || 'Ίδιο με την αρχική κατάσταση (' + initialText(program) + ').')}</p>`;
    return `<article class="sp-card" aria-labelledby="card-${esc(kind)}">${head}
      <dl class="sp-facts">${facts.map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(value).replace(/\n/g, '<br>')}</dd>`).join('')}</dl>
      ${state}
      ${note ? `<p class="sp-note">${esc(note)}</p>` : ''}
      ${isStored(program) ? '' : '<p class="sp-new">Νέο· αποθηκεύεται με την «Αποθήκευση».</p>'}
      ${open ? `<div class="sp-card-actions">${open}</div>` : ''}
    </article>`;
  }
  // What the initial state of a program is: set with «Ορισμός ως Αρχική», or the import / creation of the program.
  function initialText(program) {
    if (program.initialSetAt) return 'αρχική: ορίστηκε ' + D.format(localDay(program.initialSetAt));
    if (program.kind === 'school') return 'αρχική: το FET της εισαγωγής';
    return 'αρχική: όπως δημιουργήθηκε';
  }
  function renderDrafts() {
    const box = $('drafts');
    if (!box) return;
    // Counts of the file, plus the drafts this page will create on «Αποθήκευση».
    const counts = Object.fromEntries(kindKeys.map(kind => [kind, Number(context.draftCounts?.[kind]) || 0]));
    for (const program of draft.programs) if (program.periodId == null && counts[program.kind] != null) counts[program.kind]++;
    const parts = kindKeys.filter(hasDrafts).map(kind => {
      const many = counts[kind] > DRAFT_WARNING_LIMIT, owner = T.kinds[kind].ownerTitle || kindLabel(kind);
      return `<span${many ? ' class="ui-validation-warning" title="Πολλά προσχέδια: καλό είναι να γίνει εκκαθάριση μέσα από την εφαρμογή."' : ''}>${esc(owner)}: ${counts[kind]}</span>`;
    });
    const total = programCount(), limit = limits().programs;
    const over = total > limit ? '<p class="ui-validation-error" style="flex-basis:100%;margin:0">Το σχολικό έτος θα είχε ' + total + ' προγράμματα (μαζί με τα προσχέδια), πάνω από το όριο των ' + limit + '. Η αποθήκευση δεν θα γίνει· διάγραψε προσχέδια που δεν χρειάζονται.</p>'
      : nearLimit(total, limit) ? '<p class="ui-validation-warning" style="flex-basis:100%">Το σχολικό έτος έχει ' + total + ' από τα ' + limit + ' προγράμματα που επιτρέπονται, μαζί με τα προσχέδια.</p>' : '';
    box.innerHTML = `<strong>Προσχέδια προγραμμάτων (χωρίς περίοδο):</strong> ${parts.join(' · ')}
      <p class="ui-helper">Δεν ανήκουν σε περίοδο και δεν τα αλλάζει αυτή η σελίδα. Μεγαλώνουν το αρχείο· καλό είναι να γίνεται εκκαθάριση μέσα από την εφαρμογή τους.</p>${over}`;
  }

  // ---- Opening the program applications (school-timetables:open) ----
  // The index asks about unsaved changes of this page before it opens another application.
  function openApp(kind) {
    const period = periodById(selectedId);
    if (!period || busy) return;
    if (!isStoredPeriod(period)) { notice('Η περίοδος ' + quoted(periodName(period)) + ' δεν έχει αποθηκευτεί ακόμη. Πάτησε πρώτα «Αποθήκευση».', true); return; }
    post({type: 'school-timetables:open', app: kind, target: {periodId: period.id}});
  }

  // ---- Menus ----
  function cardMenuItems(period, kind) {
    const program = programOf(period.id, kind), items = [];
    const importable = T.importers(kind).length > 0, modified = !!program && T.isModified(program);
    if (program && hasHistory(kind)) items.push({label: 'Ιστορικό…', value: 'history'});
    if (program) {
      items.push({label: 'Ορισμός ως Αρχική…', value: 'setInitial', disabled: !modified, title: modified ? '' : 'Το πρόγραμμα είναι ίδιο με την αρχική του κατάσταση.'});
      items.push({label: kind === 'school' && !program.initialSetAt ? 'Επαναφορά στο FET…' : 'Επαναφορά στην αρχική…', value: 'restore', disabled: !modified, title: modified ? '' : 'Το πρόγραμμα είναι ίδιο με την αρχική του κατάσταση.'});
    }
    items.push({separator: true});
    if (importable) items.push({label: program ? 'Αντικατάσταση από αρχεία…' : 'Εισαγωγή από αρχεία…', value: 'import'});
    if (program && hasDrafts(kind)) items.push({label: 'Αντίγραφο ως προσχέδιο…', value: 'copyDraft'});
    items.push({separator: true});
    if (program) items.push({label: 'Διαγραφή…', value: 'delete', danger: true});
    return items;
  }
  async function cardMenu(button, kind) {
    const period = periodById(selectedId);
    if (!period || busy) return;
    const choice = await schoolMenu.open(button, cardMenuItems(period, kind), {label: 'Ενέργειες: ' + cardTitle(kind)});
    if (!choice || periodById(selectedId) !== period) return;
    if (choice === 'history') showHistory(period, kind);
    else if (choice === 'setInitial') setInitialOf(period, [kind]);
    else if (choice === 'restore') restoreOf(period, kind);
    else if (choice === 'import') importProgram(period, kind);
    else if (choice === 'copyDraft') copyAsDraft(period, kind);
    else if (choice === 'delete') deleteProgram(period, kind);
  }
  $('more').onclick = async () => {
    if (busy || !context) return;
    const period = periodById(selectedId);
    const modified = period ? programsOf(period.id).filter(T.isModified) : [];
    const choice = await schoolMenu.open($('more'), [
      {label: 'Ορισμός όλων ως Αρχική…', value: 'setInitialAll', disabled: !modified.length, title: modified.length ? '' : 'Κανένα πρόγραμμα της περιόδου δεν διαφέρει από την αρχική του κατάσταση.'}
    ], {label: 'Περισσότερες ενέργειες'});
    if (choice === 'setInitialAll' && period) setInitialOf(period, modified.map(program => program.kind));
  };

  // ---- Initial state («Ορισμός ως Αρχική», «Επαναφορά») ----
  // The page sends the program of SchoolTimetable.setInitial with setInitial:true; the host keeps the initial state.
  async function setInitialOf(period, kinds) {
    const programs = kinds.map(kind => programOf(period.id, kind)).filter(program => program && T.isModified(program));
    if (!programs.length) return;
    const names = programs.map(program => cardTitle(program.kind)).join(', ');
    const fet = programs.some(program => program.kind === 'school' && !program.initialSetAt);
    const message = (programs.length === 1 ? 'Η τρέχουσα κατάσταση του προγράμματος ' + quoted(names) : 'Η τρέχουσα κατάσταση των προγραμμάτων ' + names) +
      ' της περιόδου ' + quoted(periodName(period)) + ' θα γίνει η αρχική ' + (programs.length === 1 ? 'του' : 'τους') + '.' + (fet ? ' Μετά δεν θα υπάρχει πια επαναφορά στο καθαρό FET της εισαγωγής.' : '') + ' Γίνεται οριστικό με την «Αποθήκευση».';
    if (!await schoolConfirm(message, {title: 'Ορισμός ως Αρχική', accept: 'Ορισμός ως Αρχική'})) return;
    for (const program of programs) {
      const result = T.setInitial(program);
      draft.programs[draft.programs.indexOf(program)] = result;
      initialIds.add(result.id);
    }
    mark(); renderBoard();
    notice('Η τρέχουσα κατάσταση ' + (programs.length === 1 ? 'του ' + quoted(names) : 'των ' + names) + ' θα γίνει η αρχική με την «Αποθήκευση».');
  }
  async function restoreOf(period, kind) {
    const program = programOf(period.id, kind);
    if (!program || !T.isModified(program)) return;
    const what = kind === 'school' && !program.initialSetAt ? 'στο FET της εισαγωγής' : 'στην αρχική του κατάσταση (' + initialText(program) + ')';
    const extra = kind === 'oloimero' ? ' Επανέρχονται οι δραστηριότητες και οι θέσεις τους· τα χρώματα και η εμφάνιση μένουν όπως είναι.' : '';
    if (!await schoolConfirm('Το πρόγραμμα ' + quoted(cardTitle(kind)) + ' της περιόδου ' + quoted(periodName(period)) + ' θα επιστρέψει ' + what + '. Οι αλλαγές από τότε θα χαθούν.' + extra + ' Γίνεται οριστικό με την «Αποθήκευση».', {title: 'Επαναφορά', accept: 'Επαναφορά'})) return;
    const result = T.restoreInitial(program, {catalog: context.individualCatalog, classes: yearClasses()});
    draft.programs[draft.programs.indexOf(program)] = result;
    initialIds.delete(result.id);
    mark(); renderBoard();
    notice('Το πρόγραμμα ' + quoted(cardTitle(kind)) + ' επανήλθε ' + what + '. Πάτησε «Αποθήκευση».');
  }
  // «Αντίγραφο ως προσχέδιο»: a draft of the owner application, the same as the period program, which stays.
  async function copyAsDraft(period, kind) {
    const program = programOf(period.id, kind);
    if (!program || !hasDrafts(kind)) return;
    const field = document.createElement('label'), input = document.createElement('input');
    field.className = 'school-choice-field'; field.textContent = 'Όνομα προσχεδίου';
    input.type = 'text'; input.maxLength = 200; input.value = draftName(program, period, 'αντίγραφο'); field.append(input);
    const name = await schoolChoiceDialog({
      title: 'Αντίγραφο ως προσχέδιο: ' + cardTitle(kind),
      content: ['Το πρόγραμμα της περιόδου ' + quoted(periodName(period)) + ' μένει όπως είναι. Το αντίγραφο γίνεται προσχέδιο της εφαρμογής ' + quoted(T.kinds[kind].ownerTitle) + ', χωρίς περίοδο.', field],
      actions: [{label: 'Ακύρωση'}, {label: 'Δημιουργία', accept: true, run: () => {
        const value = input.value.trim();
        if (!value) { input.focus(); throw Error('Συμπλήρωσε όνομα για το προσχέδιο.'); }
        return value;
      }}],
      ready: () => { input.focus(); input.select(); }
    });
    if (!name || programOf(period.id, kind) !== program) return;
    const now = new Date().toISOString();
    draft.programs.push({...clone(program), id: uid(), periodId: null, name, createdAt: now, updatedAt: now});
    mark(); renderDrafts();
    notice('Θα δημιουργηθεί το προσχέδιο ' + quoted(name) + ' στην εφαρμογή ' + quoted(T.kinds[kind].ownerTitle) + ' με την «Αποθήκευση».');
  }

  // ---- «Διαχείριση περιόδων» ----
  // The list of periods with their number, dates and status, and the actions on the selected one. Every change goes
  // into the page and is saved with «Αποθήκευση». When the dialog closes, the page shows the period selected in it.
  function managePeriods() {
    if (busy) return;
    let chosen = selectedId;
    const make = (tag, className, textValue) => { const node = document.createElement(tag); if (className) node.className = className; if (textValue != null) node.textContent = textValue; return node; };
    const table = make('div', 'sp-period-table'), actions = make('div', 'sp-period-actions'), footer = make('div', 'sp-periods-footer');
    table.setAttribute('role', 'listbox'); table.setAttribute('aria-label', 'Περίοδοι'); table.tabIndex = 0;
    const add = make('button', 'primary', 'Νέα περίοδος…'), copy = make('button', '', 'Αντιγραφή περιόδου…'), edit = make('button', '', 'Επεξεργασία…');
    const official = make('button', '', 'Ορισμός ως Επίσημης…'), remove = make('button', 'danger', 'Διαγραφή…');
    for (const button of [add, copy, edit, official, remove]) button.type = 'button';
    actions.append(add, copy, edit, official, remove, make('p', 'ui-helper', 'Η σειρά είναι αυτόματη: οι Επίσημες κατά ημερομηνία έναρξης, μετά τα Προσχέδια περιόδων αλφαβητικά. Σε επικάλυψη ισχύει η περίοδος που ξεκινά αργότερα.'));
    const layout = make('div', 'sp-periods');
    layout.append(table, actions, footer);
    function draw() {
      const list = orderedPeriods();
      if (!periodById(chosen)) chosen = list[0]?.id || null;
      const rows = [make('div', 'sp-period-row head')];
      rows[0].setAttribute('aria-hidden', 'true');
      rows[0].append(make('span', '', '#'), make('span', '', 'Τίτλος περιόδου'), make('span', '', 'Από'), make('span', '', 'Έως'), make('span', '', 'Κατάσταση'));
      for (const period of list) {
        const row = make('div', 'sp-period-row' + (period.id === chosen ? ' selected' : ''));
        row.id = 'sp-row-' + period.id; row.setAttribute('role', 'option'); row.setAttribute('aria-selected', String(period.id === chosen));
        const title = make('span', '', periodName(period));
        if (!isStoredPeriod(period)) title.append(make('span', 'unsaved', 'νέα· με την «Αποθήκευση»'));
        const from = make('span', D.valid(period.from) ? '' : 'muted', D.valid(period.from) ? D.format(period.from) : '—');
        const to = make('span', period.to || D.valid(period.from) ? '' : 'muted');
        if (period.to) to.textContent = D.format(period.to);
        else if (isDraftPeriod(period) || !D.valid(period.from)) to.textContent = '—';
        else { to.textContent = D.format(teachingEnd()) + ' '; to.append(make('span', 'end-note', '(τέλος έτους)')); to.title = 'Χωρίς ημερομηνία λήξης: μέχρι το τέλος του σχολικού έτους'; }
        const status = make('span', ''), badge = make('span', 'sp-status ' + (isDraftPeriod(period) ? 'draft' : 'official'), isDraftPeriod(period) ? 'Προσχέδιο' : 'Επίσημη');
        status.append(badge);
        row.append(make('span', 'num', String(periodNumber(period))), title, from, to, status);
        row.onclick = () => { chosen = period.id; draw(); table.focus({preventScroll: true}); };
        row.ondblclick = () => { chosen = period.id; editPeriod(); };
        rows.push(row);
      }
      table.replaceChildren(...rows);
      if (!list.length) table.append(make('p', 'sp-periods-empty', 'Δεν υπάρχουν περίοδοι. Πάτησε «Νέα περίοδος…».'));
      if (chosen) { table.setAttribute('aria-activedescendant', 'sp-row-' + chosen); $('sp-row-' + chosen)?.scrollIntoView({block: 'nearest'}); }
      else table.removeAttribute('aria-activedescendant');
      const period = periodById(chosen), full = draft.periods.length >= limits().periods;
      add.disabled = copy.disabled = full;
      add.title = copy.title = full ? 'Ένα σχολικό έτος έχει έως ' + limits().periods + ' περιόδους.' : '';
      copy.disabled ||= !draft.periods.length;
      edit.disabled = remove.disabled = !period;
      official.disabled = !period || !isDraftPeriod(period);
      official.title = period && !isDraftPeriod(period) ? 'Η περίοδος είναι ήδη Επίσημη.' : '';
      const counts = {official: list.filter(item => !isDraftPeriod(item)).length, draft: list.filter(isDraftPeriod).length};
      footer.replaceChildren(...T.periodWarnings(draft.periods).map(warning => make('p', 'ui-validation-warning', warning.message)),
        make('p', 'sp-periods-summary', 'Σύνολο: ' + list.length + ' (Επίσημες: ' + counts.official + ', Προσχέδια: ' + counts.draft + ') · Μέγιστο ανά έτος: ' + limits().periods));
    }
    table.addEventListener('keydown', event => {
      const list = orderedPeriods(), index = list.findIndex(period => period.id === chosen);
      let next = null;
      if (event.key === 'ArrowDown') next = Math.min(list.length - 1, index + 1);
      else if (event.key === 'ArrowUp') next = Math.max(0, index - 1);
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = list.length - 1;
      else if (event.key === 'Enter' && chosen) { event.preventDefault(); editPeriod(); return; }
      if (next == null || !list.length) return;
      event.preventDefault(); chosen = list[Math.max(0, next)].id; draw();
    });
    const changed = id => { if (id) chosen = id; draw(); renderBar(); renderBoard(); };
    async function editPeriod() { const period = periodById(chosen); if (period && await periodForm({period, mode: 'edit'})) changed(period.id); }
    add.onclick = async () => { const id = await periodForm({mode: 'new'}); if (id) changed(id); };
    edit.onclick = editPeriod;
    official.onclick = async () => { const period = periodById(chosen); if (period && await periodForm({period, mode: 'official'})) changed(period.id); };
    copy.onclick = async () => { const id = await copyPeriod(chosen); if (id) changed(id); };
    remove.onclick = async () => { const period = periodById(chosen); if (period && await removePeriod(period)) changed(null); };
    draw();
    schoolChoiceDialog({
      title: 'Διαχείριση περιόδων', className: 'sp-periods-dialog',
      content: ['Περίοδοι του σχολικού έτους ' + context.year + '. Οι αλλαγές αποθηκεύονται με την «Αποθήκευση» της σελίδας.', layout],
      actions: [{label: 'Κλείσιμο', accept: true, value: true}],
      ready: () => table.focus({preventScroll: true})
    }).then(() => {
      if (chosen && periodById(chosen) && chosen !== selectedId) selectPeriod(chosen);
      else { renderBar(); renderBoard(); }
    });
  }

  // A period: new (mode 'new', Επίσημη or Προσχέδιο), changed (mode 'edit'), or made official (mode 'official').
  // An official period needs a start date; a Προσχέδιο περιόδου may have no dates. The warnings of the list (overlaps,
  // same start, empty «Έως» before the last one) are shown as the dates are written. → the id of the period, or null.
  async function periodForm({period = null, mode}) {
    const make = (tag, attributes = {}, textValue) => { const node = document.createElement(tag); for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value); if (textValue != null) node.textContent = textValue; return node; };
    const labelled = (labelText, control) => { const label = make('label', {class: 'school-choice-field'}, labelText); label.append(control); return label; };
    const name = make('input', {type: 'text', maxlength: '200'}), from = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'}), to = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'});
    const grid = make('div', {class: 'sp-form-grid'});
    grid.append(labelled('Όνομα', name), labelled('Από', from), labelled('Έως', to));
    const help = make('p', {class: 'sp-form-help'}), warnings = make('div', {class: 'sp-form-warnings'});
    const content = [];
    let status = null;
    if (mode === 'new') {
      status = make('fieldset', {class: 'sp-status-choice'});
      status.append(make('legend', {}, 'Η περίοδος είναι'));
      for (const [value, labelText] of [['official', 'Επίσημη'], ['draft', 'Προσχέδιο περιόδου']]) {
        const label = make('label'), radio = make('input', {type: 'radio', name: 'sp-status', value});
        label.append(radio, document.createTextNode(labelText)); status.append(label);
      }
      status.querySelector('[value="official"]').checked = true;
    }
    const isDraft = () => mode === 'edit' ? isDraftPeriod(period) : mode === 'new' && status.querySelector('[value="draft"]').checked;
    if (mode === 'new') {
      // Suggested: after the last official period, within the school year.
      const range = yearRange(), last = orderedPeriods().filter(item => !isDraftPeriod(item)).at(-1), today = D.today();
      let start = !last ? range.from : last.to ? addDays(last.to, 1) : (today > addDays(last.from, 1) ? today : addDays(last.from, 1));
      if (start < range.from) start = range.from;
      if (start > range.to) start = range.to;
      const names = new Set(draft.periods.map(item => item.name.trim()));
      let suggestion = 'Νέα περίοδος', number = 2;
      while (names.has(suggestion)) suggestion = 'Νέα περίοδος ' + number++;
      name.value = suggestion; from.value = D.format(start);
    } else {
      name.value = period.name; from.value = D.valid(period.from) ? D.format(period.from) : ''; to.value = D.valid(period.to) ? D.format(period.to) : '';
    }
    if (mode === 'official') content.push('Το Προσχέδιο περιόδου ' + quoted(periodName(period)) + ' θα γίνει Επίσημη περίοδος και θα ισχύει στις ημερομηνίες της. Αν επικαλύπτεται με άλλη Επίσημη, ισχύει η περίοδος που ξεκινά αργότερα· οι ημερομηνίες δεν αλλάζουν αυτόματα.');
    if (status) content.push(status);
    content.push(grid, help, warnings);
    const read = () => {
      const fromText = from.value.trim(), toText = to.value.trim();
      return {fromText, toText, fromIso: fromText ? D.parse(fromText) : '', toIso: toText ? D.parse(toText) : ''};
    };
    const update = () => {
      const draftStatus = isDraft() && mode !== 'official';
      help.textContent = (draftStatus ? 'Στο Προσχέδιο περιόδου οι ημερομηνίες είναι προαιρετικές. ' : '') + 'Ημερομηνίες μέσα στο σχολικό έτος (' + yearRangeText() + '). Κενό «Έως»: μέχρι το τέλος του σχολικού έτους (' + D.format(teachingEnd()) + ').';
      const {fromIso, toIso, toText} = read();
      const messages = [];
      if (!draftStatus && fromIso && (toIso || !toText)) {
        const preview = {...(period ? clone(period) : {id: 'sp-preview'}), name: name.value.trim() || 'Νέα περίοδος', from: fromIso, to: toIso || '', status: 'official'};
        const list = [...draft.periods.filter(item => item.id !== preview.id), preview];
        for (const warning of T.periodWarnings(list)) if (warning.type !== 'order' && warning.periodIds.includes(preview.id)) messages.push(warning.message);
      }
      warnings.replaceChildren(...messages.map(message => make('p', {class: 'ui-validation-warning'}, message)));
    };
    const run = () => {
      const draftStatus = isDraft() && mode !== 'official', newName = name.value.trim(), {fromText, toText, fromIso, toIso} = read();
      if (!newName) { name.focus(); throw Error('Συμπλήρωσε όνομα για την περίοδο.'); }
      if (!fromText && !draftStatus) { from.focus(); throw Error('Μια Επίσημη περίοδος χρειάζεται ημερομηνία έναρξης (ηη/μμ/εεεε).'); }
      if (fromText && (!fromIso || !D.inSchoolYear(fromIso, context.year))) { from.focus(); throw Error('Η ημερομηνία «Από» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος (' + yearRangeText() + ').'); }
      if (toText && (!toIso || !D.inSchoolYear(toIso, context.year))) { to.focus(); throw Error('Η ημερομηνία «Έως» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος, ή κενή.'); }
      if (toText && !fromText) { from.focus(); throw Error('Συμπλήρωσε και την ημερομηνία «Από», ή άφησε κενό και το «Έως».'); }
      if (fromIso && toIso && toIso < fromIso) { to.focus(); throw Error('Η λήξη είναι πριν από την έναρξη.'); }
      return {name: newName, from: fromIso || '', to: toIso || '', status: draftStatus ? 'draft' : 'official'};
    };
    for (const control of [name, from, to]) control.addEventListener('input', update);
    status?.addEventListener('change', update);
    update();
    const result = await schoolChoiceDialog({
      title: mode === 'new' ? 'Νέα περίοδος' : mode === 'official' ? 'Ορισμός ως Επίσημης' : 'Επεξεργασία περιόδου',
      content,
      actions: [{label: 'Ακύρωση'}, {label: mode === 'new' ? 'Δημιουργία' : mode === 'official' ? 'Ορισμός ως Επίσημης' : 'Ενημέρωση', accept: true, run}],
      ready: () => { (mode === 'official' && !from.value ? from : name).focus(); if (mode === 'new') name.select(); }
    });
    if (!result) return null;
    if (mode === 'new') {
      const created = {id: uid(), name: result.name, from: result.from, to: result.to, status: result.status};
      draft.periods.push(created);
      mark();
      notice('Προστέθηκε ' + (result.status === 'draft' ? 'το Προσχέδιο περιόδου ' : 'η περίοδος ') + quoted(result.name) + '. Πάτησε «Αποθήκευση».');
      return created.id;
    }
    if (!periodById(period.id)) return null;
    Object.assign(period, {name: result.name, from: result.from, to: result.to});
    if (mode === 'official') period.status = 'official';
    mark();
    notice(mode === 'official' ? 'Η περίοδος ' + quoted(result.name) + ' θα γίνει Επίσημη με την «Αποθήκευση».' : 'Η περίοδος ' + quoted(result.name) + ' άλλαξε. Πάτησε «Αποθήκευση».');
    return period.id;
  }

  // ---- Removing a period ----
  // → true when the period was removed from the page.
  async function removePeriod(period) {
    const programs = programsOf(period.id), stored = programs.filter(isStored), keepable = programs.filter(canKeep);
    const name = periodName(period);
    // Programs of kinds without drafts (the Ατομικά Προγράμματα) are always deleted with the period.
    const noDrafts = unique(stored.filter(program => !hasDrafts(program.kind)).map(program => kindLabel(program.kind)));
    const noDraftsNote = noDrafts.length ? ' Τα ' + noDrafts.join(', ') + ' δεν κρατιούνται ως προσχέδια: διαγράφονται μαζί με την περίοδο.' : '';
    const unsavedNote = stored.length < programs.length ? ' Όσα δεν έχουν αποθηκευτεί ακόμη αφαιρούνται.' : '';
    const listText = (programs.length === 1 ? 'το πρόγραμμα: ' : programs.length + ' προγράμματα: ') + programs.map(programText).join(', ');
    let mode = 'delete';
    if (!programs.length) {
      if (!await schoolConfirm('Να διαγραφεί η περίοδος ' + quoted(name) + ';', {title: 'Διαγραφή περιόδου', accept: 'Διαγραφή'})) return false;
    } else if (!stored.length) {
      if (!await schoolConfirm('Η περίοδος ' + quoted(name) + ' έχει προγράμματα που δεν έχουν αποθηκευτεί (' + programs.map(programText).join(', ') + '). Θα αφαιρεθούν μαζί της. Να συνεχίσω;', {title: 'Διαγραφή περιόδου', accept: 'Διαγραφή'})) return false;
    } else if (!keepable.length) {
      if (!await schoolConfirm('Η περίοδος ' + quoted(name) + ' έχει ' + listText + '.' + noDraftsNote + unsavedNote + ' Η διαγραφή γίνεται οριστική με την «Αποθήκευση». Να συνεχίσω;', {title: 'Διαγραφή περιόδου', accept: 'Διαγραφή'})) return false;
    } else {
      mode = await schoolChoiceDialog({
        title: 'Διαγραφή περιόδου',
        content: [
          'Η περίοδος ' + quoted(name) + ' έχει ' + listText + '. Τι να γίνει με ' + (programs.length === 1 ? 'αυτό' : 'αυτά') + ';',
          'Κάθε προσχέδιο ανήκει στην εφαρμογή του είδους του (π.χ. το Ολοήμερο στον Ολοήμερο Designer).' + noDraftsNote + unsavedNote
        ],
        choices: [{label: keepable.length > 1 ? 'Κράτησέ τα ως προσχέδια' : programs.length > 1 ? 'Κράτησε το ' + kindLabel(keepable[0].kind) + ' ως προσχέδιο' : 'Κράτησέ το ως προσχέδιο', value: 'draft'}, {label: programs.length === 1 ? 'Διάγραψέ το' : 'Διάγραψέ τα', value: 'delete'}]
      });
      if (!mode) return false;
    }
    const now = new Date().toISOString();
    draft.programs = draft.programs.filter(program => {
      if (program.periodId !== period.id) return true;
      if (mode !== 'draft' || !canKeep(program)) return false;
      program.name = draftName(program, period, 'από διαγραμμένη περίοδο');
      program.periodId = null; program.updatedAt = now;
      return true;
    });
    draft.periods.splice(draft.periods.indexOf(period), 1);
    if (selectedId === period.id) selectedId = initialPeriod({});
    mark();
    notice('Η περίοδος ' + quoted(name) + ' αφαιρέθηκε' + (mode === 'draft' && keepable.length ? (keepable.length === 1 && programs.length > 1 ? ' και το ' + kindLabel(keepable[0].kind) + ' θα κρατηθεί ως προσχέδιο' : ' και ' + (keepable.length === 1 ? 'το πρόγραμμά της θα κρατηθεί ως προσχέδιο' : 'τα προγράμματά της θα κρατηθούν ως προσχέδια')) : '') + '. Πάτησε «Αποθήκευση».');
    return true;
  }

  // ---- Programs ----
  const fileRequest = (action, kind, importer, file) => schoolHost.request('school-programs:file', {action, kind, importer, file});
  // Before a period program is replaced: keep it as a draft or replace it. A program that is not stored yet is
  // simply replaced. → true to go on, false when the user cancelled.
  async function replaceExisting(old, period) {
    if (!isStored(old)) { draft.programs = draft.programs.filter(program => program !== old); return true; }
    // A kind without drafts (the Ατομικά Προγράμματα) is only replaced, after a confirmation.
    if (!hasDrafts(old.kind)) {
      if (!await schoolConfirm('Η περίοδος ' + quoted(periodName(period)) + ' έχει ήδη ' + programText(old) + ' (' + activitiesText(stats(old).activities) + '). Θα αντικατασταθεί· τα ' + kindLabel(old.kind) + ' δεν κρατιούνται ως προσχέδια. Η διαγραφή γίνεται οριστική με την «Αποθήκευση».', {title: 'Αντικατάσταση: ' + kindLabel(old.kind), accept: 'Αντικατάσταση'})) return false;
      draft.programs = draft.programs.filter(program => program !== old);
      return true;
    }
    const choice = await schoolReplaceProgram({
      title: 'Αντικατάσταση: ' + kindLabel(old.kind),
      message: 'Η περίοδος ' + quoted(periodName(period)) + ' έχει ήδη ' + programText(old) + ' (' + activitiesText(stats(old).activities) + '). Τι να γίνει με αυτό; Με «Πλήρης αντικατάσταση» διαγράφεται κατά την Αποθήκευση.',
      suggestedName: draftName(old, period, 'αντικαταστάθηκε')
    });
    if (!choice) return false;
    if (choice.mode === 'draft') { old.periodId = null; old.name = choice.name; old.updatedAt = new Date().toISOString(); }
    else draft.programs = draft.programs.filter(program => program !== old);
    return true;
  }
  // Import with an importer of the kind (SchoolTimetable.kinds), with the shared dialog schoolProgramImport.
  async function importProgram(period, kind) {
    if (busy) return;
    const importers = T.importers(kind), label = kindLabel(kind);
    if (!importers.length) return;
    if (!context.staff?.length) { await schoolMessage('Συμπλήρωσε πρώτα το Προσωπικό του σχολικού έτους στο «Προσωπικό».', {title: 'Εισαγωγή: ' + label}); return; }
    if (!context.teachingHours?.hours?.length) { await schoolMessage('Συμπλήρωσε πρώτα τις Ώρες Διδασκαλίας του σχολικού έτους στις «Ώρες Διδασκαλίας».', {title: 'Εισαγωγή: ' + label}); return; }
    const importer = importers.length === 1 ? importers[0] : await schoolChoiceDialog({
      title: 'Εισαγωγή: ' + label, content: 'Από πού να γίνει η εισαγωγή;',
      choices: importers.map(item => ({label: item.label + '…', value: item}))
    });
    if (!importer || !periodById(period.id)) return;
    const replacing = programOf(period.id, kind);
    let created = [];   // analysis.newClasses of the analysis that was built
    const last = {};
    try { for (const file of importer.files) last[file.key] = await fileRequest('last', kind, importer.id, file.key); }
    catch (error) { notice(error.message, true); return; }
    const program = await schoolProgramImport({
      title: label + ': ' + importer.label,
      intro: 'Περίοδος ' + quoted(periodName(period)) + (rangeText(period) ? ' (' + rangeText(period) + ')' : '') + '. ' + importer.intro,
      files: importer.files.map(file => ({
        key: file.key, label: file.label, last: last[file.key]?.name || '',
        read: () => fileRequest('read', kind, importer.id, file.key), choose: () => fileRequest('choose', kind, importer.id, file.key)
      })),
      // classes: the τμήματα of the year and those of earlier imports of the page that are not saved yet, so
      // that a τμήμα missing from «Τμήματα» is created once; classLimit: the limit of the host.
      analyze: loaded => importer.analyze(loaded, {staff: context.staff, classes: yearClasses(), classLimit: limits().classes, teachingHours: context.teachingHours, replacing}),
      build: (analysis, options) => {
        created = analysis.newClasses || [];
        return importer.build(analysis, {unmatched: options.unmatched, kind, periodId: period.id, name: ''});
      }
    });
    if (!program || !periodById(period.id)) return;
    const current = programOf(period.id, kind);
    if (current && !await replaceExisting(current, period)) return;
    draft.programs.push(program);
    const known = new Set(yearClasses().map(item => item.id));
    newClasses.push(...clone(created).filter(item => !known.has(item.id)));
    mark(); renderBar(); renderBoard();
    const createdText = created.length ? ' Με την αποθήκευση θα δημιουργηθούν στα «Τμήματα» τα τμήματα: ' + created.map(item => item.name).join(', ') + '.' : '';
    notice('Εισήχθη το πρόγραμμα ' + quoted(label) + ' της περιόδου ' + quoted(periodName(period)) + ' (' + activitiesText(program.activities.length) + ').' + createdText + ' Πάτησε «Αποθήκευση».');

  }
  async function deleteProgram(period, kind) {
    const program = programOf(period.id, kind);
    if (!program) return;
    const what = kind === 'individual' ? 'Να διαγραφούν τα Ατομικά Προγράμματα όλων των εκπαιδευτικών' : 'Να διαγραφεί ' + (kind === 'school' ? 'το ' : 'το πρόγραμμα ') + programText(program);
    if (!await schoolConfirm(what + ' της περιόδου ' + quoted(periodName(period)) + ';' + (isStored(program) ? ' Η διαγραφή γίνεται οριστική με την «Αποθήκευση».' : ''), {title: 'Διαγραφή προγράμματος', accept: 'Διαγραφή'})) return;
    draft.programs = draft.programs.filter(item => item !== program);
    mark(); renderBar(); renderBoard();
    notice('Το πρόγραμμα ' + programText(program) + ' αφαιρέθηκε από την περίοδο ' + quoted(periodName(period)) + '. Πάτησε «Αποθήκευση».');
  }

  // ---- History of a program (program.history, see SchoolTimetable.addHistory) ----
  // Date and time in local time, dd/mm/yyyy HH:MM; entries built from older data (derived) only show the day,
  // since their time is not exact.
  function historyWhen(entry) {
    const date = new Date(entry.at);
    if (Number.isNaN(date.getTime())) return '';
    const day = D.format(localDay(entry.at));
    return entry.derived ? day : day + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
  }
  const countText = (count, one, many) => count === 1 ? '1 ' + one : count + ' ' + many;
  // kind: the kind of the program. The Ατομικά Προγράμματα write in 'edit' and 'copy' the names of the teachers
  // (staff:[name…]).
  function historyText(entry, kind) {
    const replacementsText = list => (list || []).map(item => (item.fromName || '?') + ' → ' + (item.toName || '?')).join(', ');
    const people = (Array.isArray(entry.staff) ? entry.staff : []).filter(Boolean).join(', ');
    switch (entry.type) {
      case 'import': {
        const importer = T.importer(kind, entry.importer);
        const files = (entry.files || []).filter(Boolean);
        return (importer?.label || 'Εισαγωγή από αρχεία') + (files.length ? ': ' + files.join(', ') : '') + (Number.isInteger(entry.activities) ? ' (' + activitiesText(entry.activities) + ')' : '') + '.';
      }
      case 'copy': {
        const list = replacementsText(entry.replacements);
        if (!entry.fromPeriod) return 'Αντικαταστάσεις εκπαιδευτικών' + (list ? ': ' + list : '') + '.';
        return 'Αντιγραφή από την περίοδο ' + quoted(entry.fromPeriod) + (people ? ' των εκπαιδευτικών: ' + people : '') + (list ? ', με αντικαταστάσεις: ' + list : '') + '.';
      }
      case 'oloimero': {
        let text = 'Εισαγωγή Ολοημέρου' + (entry.design ? ' από ' + quoted(entry.design) : '');
        if ([entry.kept, entry.removed, entry.added].every(Number.isInteger)) {
          text += entry.removed || entry.added
            ? ': ' + countText(entry.kept, 'ίδια', 'ίδιες') + ', ' + countText(entry.removed, 'αφαιρέθηκε', 'αφαιρέθηκαν') + ', ' + countText(entry.added, 'μπήκε', 'μπήκαν')
            : ': χωρίς αλλαγές στις δραστηριότητες (' + countText(entry.kept, 'ίδια', 'ίδιες') + ')';
        }
        return text + (entry.assigned ? '· το προσχέδιο ανατέθηκε στην περίοδο' : '') + '.';
      }
      case 'setInitial': return 'Ορισμός ως Αρχική: η τρέχουσα κατάσταση έγινε η αρχική.';
      case 'restore': return 'Επαναφορά στην αρχική κατάσταση.';
      case 'edit':
        if (kind === 'individual') return 'Αλλαγές στα ατομικά προγράμματα' + (people ? ': ' + people : '') + '.';
        return Number.isInteger(entry.activities) ? 'Αλλαγές στο ωρολόγιο (' + activitiesText(entry.activities) + ').' : 'Αλλαγές στο ωρολόγιο.';
      default:
        return 'Άλλη αλλαγή (' + entry.type + ').';
    }
  }
  async function showHistory(period, kind) {
    const program = programOf(period.id, kind);
    if (!program || busy) return;
    const entries = T.history(program);
    const content = [];
    if (!entries.length) content.push(Object.assign(document.createElement('p'), {className: 'pg-history-empty', textContent: 'Το Ιστορικό είναι κενό.'}));
    else {
      const list = document.createElement('ol');
      list.className = 'pg-history';
      for (const entry of entries) {
        const item = document.createElement('li'), time = document.createElement('time'), text = document.createElement('span');
        time.dateTime = entry.at; time.textContent = historyWhen(entry);
        // A name that ends with «.» (e.g. «Παπαδάκη Μ.») at the end of the text: one full stop.
        text.textContent = historyText(entry, kind).replace(/\.\.$/, '.');
        if (entry.derived) text.append(Object.assign(document.createElement('span'), {className: 'pg-history-derived', textContent: 'από παλαιότερα στοιχεία'}));
        item.append(time, text);
        list.append(item);
      }
      content.push(list);
    }
    const choice = await schoolChoiceDialog({
      title: 'Ιστορικό: ' + programText(program) + ' — ' + periodName(period), content,
      actions: [{label: 'Καθαρισμός Ιστορικού', value: 'clear', disabled: !entries.length}, {label: 'Κλείσιμο', accept: true, value: null}]
    });
    if (choice !== 'clear' || programOf(period.id, kind) !== program) return;
    if (!await schoolConfirm('Να σβηστούν όλες οι εγγραφές του Ιστορικού του προγράμματος ' + quoted(programText(program)) + ' της περιόδου ' + quoted(periodName(period)) + '; Ο καθαρισμός γίνεται οριστικός με την «Αποθήκευση».', {title: 'Καθαρισμός Ιστορικού', accept: 'Καθαρισμός'})) return;
    const index = draft.programs.indexOf(program);
    if (index >= 0) draft.programs[index] = {...program, history: []};
    mark(); renderBoard();
    notice('Το Ιστορικό του προγράμματος ' + quoted(programText(program)) + ' της περιόδου ' + quoted(periodName(period)) + ' καθαρίστηκε. Πάτησε «Αποθήκευση».');
  }

  // ---- Copy a period with replacements ----
  // The new period is an official period or a Προσχέδιο περιόδου (dates optional). → the id of the new period, or null.
  async function copyPeriod(sourceId) {
    if (busy || !draft.periods.length) return null;
    const staff = [...(context.staff || [])].sort(byShortName);
    const make = (tag, attributes = {}, textValue) => {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
      if (textValue != null) node.textContent = textValue;
      return node;
    };
    const labelled = (labelText, control) => { const label = make('label', {class: 'school-choice-field'}, labelText); label.append(control); return label; };
    const staffSelect = (aria) => {
      const select = make('select', {'aria-label': aria});
      select.append(make('option', {value: ''}, '— Επίλεξε —'), ...staff.map(person => make('option', {value: person.id}, (person.shortName || person.name || person.code) + (person.name && person.shortName ? ' — ' + person.name : ''))));
      return select;
    };
    const source = make('select');
    source.append(...orderedPeriods().map(period => make('option', {value: period.id}, periodNumber(period) + ' · ' + periodName(period) + (isDraftPeriod(period) ? ' (προσχέδιο)' : '') + (rangeText(period) ? ' (' + rangeText(period) + ')' : ''))));
    source.value = periodById(sourceId)?.id || periodById(selectedId)?.id || orderedPeriods()[0].id;
    const name = make('input', {type: 'text', maxlength: '200'});
    const from = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'});
    const to = make('input', {type: 'text', inputmode: 'numeric', maxlength: '10', placeholder: 'ηη/μμ/εεεε'});
    const status = make('fieldset', {class: 'sp-status-choice'});
    status.append(make('legend', {}, 'Η νέα περίοδος είναι'));
    for (const [value, labelText] of [['official', 'Επίσημη'], ['draft', 'Προσχέδιο περιόδου']]) {
      const label = make('label'), radio = make('input', {type: 'radio', name: 'sp-copy-status', value});
      label.append(radio, document.createTextNode(labelText)); status.append(label);
    }
    status.querySelector('[value="official"]').checked = true;
    const isDraft = () => status.querySelector('[value="draft"]').checked;
    const suggest = () => {
      const period = periodById(source.value);
      const names = new Set(draft.periods.map(item => item.name.trim()));
      let suggestion = periodName(period) + ' – αντίγραφο', number = 2;
      while (names.has(suggestion)) suggestion = periodName(period) + ' – αντίγραφο ' + number++;
      name.value = suggestion;
      const start = period.to && period.to < yearRange().to ? addDays(period.to, 1) : D.inSchoolYear(D.today(), context.year) ? D.today() : period.from;
      from.value = D.valid(start) ? D.format(start) : '';
      to.value = '';
    };
    suggest();
    const rows = make('div', {class: 'copy-rows'});
    const addRow = () => {
      const row = make('div', {class: 'copy-row'}), a = staffSelect('Εκπαιδευτικός που αντικαθίσταται'), b = staffSelect('Εκπαιδευτικός που μπαίνει στη θέση του');
      const remove = make('button', {type: 'button', class: 'copy-remove ui-icon-button', title: 'Αφαίρεση αντικατάστασης', 'aria-label': 'Αφαίρεση αντικατάστασης'});
      remove.innerHTML = schoolIcon('close');
      remove.onclick = () => { row.remove(); update(); };
      const arrow = make('span', {class: 'copy-arrow', 'aria-hidden': 'true'}); arrow.innerHTML = schoolIcon('arrow-right');
      row.append(a, arrow, b, remove);
      rows.append(row); update();
      return row;
    };
    const addButton = make('button', {type: 'button', class: 'copy-add'}); addButton.innerHTML = schoolIconText('plus', 'Αντικατάσταση');
    addButton.onclick = () => addRow().querySelector('select').focus();
    const summary = make('p', {class: 'copy-summary'}), warnings = make('div', {class: 'sp-form-warnings'});
    const grid = make('div', {class: 'sp-form-grid'});
    grid.append(labelled('Όνομα', name), labelled('Από', from), labelled('Έως', to));
    const help = make('p', {class: 'sp-form-help'});
    const form = make('div');
    form.append(labelled('Περίοδος-πηγή', source), make('h3', {class: 'copy-section'}, 'Νέα περίοδος'), status, grid, help,
      make('h3', {class: 'copy-section'}, 'Αντικαταστάσεις εκπαιδευτικών'),
      make('p', {class: 'sp-form-help'}, 'Και οι δύο από το Προσωπικό. Χωρίς αντικαταστάσεις γίνεται απλή αντιγραφή.'),
      rows, addButton, summary, warnings);
    const replacements = () => [...rows.querySelectorAll('.copy-row')].map(row => { const [a, b] = row.querySelectorAll('select'); return {from: a.value, to: b.value}; });
    const shortName = id => { const person = staff.find(item => item.id === id); return person ? person.shortName || person.name : '?'; };
    function update() {
      help.textContent = (isDraft() ? 'Στο Προσχέδιο περιόδου οι ημερομηνίες είναι προαιρετικές. ' : '') + 'Κενό «Έως»: μέχρι το τέλος του σχολικού έτους.';
      const period = periodById(source.value), programs = programsOf(period.id), list = replacements().filter(item => item.from && item.to && item.from !== item.to);
      if (!programs.length) summary.textContent = 'Η περίοδος-πηγή δεν έχει προγράμματα· θα δημιουργηθεί κενή περίοδος.';
      else {
        const parts = kindKeys.map(kind => programs.find(program => program.kind === kind)).filter(Boolean).map(program => {
          const changed = list.length ? T.replaceStaff(program, list).changed : 0;
          return kindLabel(program.kind) + ' (' + activitiesText(program.activities.length) + (changed ? ', ' + changed + ' αλλάζουν' : '') + ')';
        });
        const fetChanged = list.length && programs.some(program => program.source?.type === 'fet' && T.replaceStaff(program, list).changed);
        summary.textContent = 'Θα αντιγραφούν: ' + parts.join(', ') + '.' + (fetChanged ? ' Όσα προγράμματα από FET αλλάζουν θα σημειωθούν «τροποποιήθηκε μετά την εισαγωγή».' : '');
      }
      const messages = [];
      const used = new Set(programs.flatMap(programStaff));
      for (const item of list) if (!used.has(item.from)) messages.push('Ο/Η ' + quoted(shortName(item.from)) + ' δεν εμφανίζεται στα προγράμματα της περιόδου-πηγής.');
      const fromIso = D.parse(from.value), toIso = to.value.trim() ? D.parse(to.value) : '';
      if (!isDraft() && fromIso && (toIso || !to.value.trim())) {
        const preview = {id: 'copy-preview', name: name.value.trim() || 'Νέα περίοδος', from: fromIso, to: toIso};
        for (const warning of T.periodWarnings([...draft.periods, preview])) if (warning.type !== 'order' && warning.periodIds.includes(preview.id)) messages.push(warning.message);
      }
      warnings.replaceChildren(...messages.map(message => make('p', {class: 'ui-validation-warning'}, message)));
    }
    source.addEventListener('change', () => { suggest(); update(); });
    form.addEventListener('input', update);
    form.addEventListener('change', update);
    update();
    const run = () => {
      const period = periodById(source.value), draftStatus = isDraft();
      const newName = name.value.trim();
      if (!newName) { name.focus(); throw Error('Συμπλήρωσε όνομα για τη νέα περίοδο.'); }
      const fromText = from.value.trim(), toText = to.value.trim();
      const fromIso = fromText ? D.parse(fromText) : '';
      if (!fromText && !draftStatus) { from.focus(); throw Error('Μια Επίσημη περίοδος χρειάζεται ημερομηνία έναρξης (ηη/μμ/εεεε).'); }
      if (fromText && (!fromIso || !D.inSchoolYear(fromIso, context.year))) { from.focus(); throw Error('Η ημερομηνία «Από» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος (' + yearRangeText() + ').'); }
      let toIso = '';
      if (toText) {
        if (!fromText) { from.focus(); throw Error('Συμπλήρωσε και την ημερομηνία «Από», ή άφησε κενό και το «Έως».'); }
        toIso = D.parse(toText);
        if (!toIso || !D.inSchoolYear(toIso, context.year)) { to.focus(); throw Error('Η ημερομηνία «Έως» πρέπει να είναι ηη/μμ/εεεε, μέσα στο σχολικό έτος, ή κενή.'); }
        if (toIso < fromIso) { to.focus(); throw Error('Η λήξη είναι πριν από την έναρξη.'); }
      }
      const list = replacements(), seen = new Set();
      for (const item of list) {
        if (!item.from || !item.to) throw Error('Συμπλήρωσε και τους δύο εκπαιδευτικούς σε κάθε αντικατάσταση, ή αφαίρεσε τη γραμμή.');
        if (item.from === item.to) throw Error('Ο/Η ' + quoted(shortName(item.from)) + ' δεν μπορεί να αντικαταστήσει τον εαυτό του/της.');
        if (seen.has(item.from)) throw Error('Ο/Η ' + quoted(shortName(item.from)) + ' εμφανίζεται σε δύο αντικαταστάσεις.');
        seen.add(item.from);
      }
      return {sourceId: period.id, name: newName, from: fromIso || '', to: toIso, status: draftStatus ? 'draft' : 'official', replacements: list};
    };
    const result = await schoolChoiceDialog({
      title: 'Αντιγραφή περιόδου', content: form,
      actions: [{label: 'Ακύρωση'}, {label: 'Αντιγραφή', accept: true, run}]
    });
    return result ? applyCopy(result) : null;
  }
  function applyCopy({sourceId, name, from, to, status, replacements}) {
    const source = periodById(sourceId);
    if (!source) return null;
    const now = new Date().toISOString(), period = {id: uid(), name, from, to, status};
    const person = id => (context.staff || []).find(item => item.id === id);
    const personName = id => person(id)?.name || person(id)?.shortName || '?';
    const copies = kindKeys.map(kind => programOf(sourceId, kind)).filter(Boolean).map(program => {
      const copy = T.replaceStaff(program, replacements, {staff: context.staff, now}).program;
      Object.assign(copy, {id: uid(), periodId: period.id, createdAt: now, updatedAt: now});
      // The copy keeps the history of the source and gets a «copy» entry, with the replacements that changed it.
      if (hasHistory(copy.kind)) {
        const used = new Set(programStaff(program));
        T.addHistory(copy, {at: now, type: 'copy', fromPeriod: periodName(source), replacements: replacements.filter(item => used.has(item.from)).map(item => ({fromName: personName(item.from), toName: personName(item.to)}))});
      }
      return copy;
    });
    draft.periods.push(period);
    draft.programs.push(...copies);
    mark();
    notice('Δημιουργήθηκε ' + (status === 'draft' ? 'το Προσχέδιο περιόδου ' : 'η περίοδος ') + quoted(name) + (copies.length ? ' με ' + copies.length + (copies.length === 1 ? ' πρόγραμμα' : ' προγράμματα') + ' από την ' + quoted(periodName(source)) : '') + '. Πάτησε «Αποθήκευση».');
    return period.id;
  }

  // ---- Save ----
  function saveOps() {
    const before = new Map(saved.programs.map(program => [program.id, program]));
    const after = new Map(draft.programs.map(program => [program.id, program]));
    const ops = [];
    for (const program of draft.programs) {
      const old = before.get(program.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(program)) ops.push({op: 'put', program: clone(program), ...(initialIds.has(program.id) ? {setInitial: true} : {})});
    }
    for (const program of saved.programs) if (!after.has(program.id)) ops.push({op: 'delete', id: program.id});
    return ops;
  }
  // After «Αποθήκευση»: the file must hold exactly what the page asked for. The host writes the time of a «Ορισμός ως
  // Αρχική» (initialSetAt) itself.
  function verifySaved(result, periods, expectedDraftCounts, added) {
    const comparable = program => { if (!program || !initialIds.has(program.id)) return program; const {initialSetAt, ...rest} = program; return rest; };
    const same = (a, b) => JSON.stringify(comparable(a)) === JSON.stringify(comparable(b));
    const expected = draft.programs.filter(program => program.periodId != null);
    const got = new Map((result.programs || []).filter(program => program.periodId != null).map(program => [program.id, program]));
    const classIds = new Set((result.classes || []).map(item => item?.id));
    const ok = JSON.stringify(result.periods) === JSON.stringify(periods) && got.size === expected.length && expected.every(program => same(got.get(program.id), program)) &&
      added.every(item => classIds.has(item.id)) &&
      kindKeys.every(kind => (Number(result.draftCounts?.[kind]) || 0) === expectedDraftCounts[kind]);
    if (!ok) throw Error('Η αποθήκευση ολοκληρώθηκε, αλλά τα δεδομένα του αρχείου δεν είναι ίδια με αυτά της σελίδας. Έλεγξε τις περιόδους και τα προγράμματα που φαίνονται τώρα. Βεβαιώσου ότι το index.html είναι η τελευταία έκδοση.');
  }
  async function save() {
    if (busy || !dirty) return;
    const invalid = draft.periods.find(period => !period.name.trim() || (!isDraftPeriod(period) && !D.valid(period.from)));
    if (invalid) {
      notice('Η περίοδος ' + quoted(periodName(invalid)) + ' χρειάζεται ' + (!invalid.name.trim() ? 'όνομα' : 'ημερομηνία έναρξης') + '. Διόρθωσέ τη στη «Διαχείριση περιόδων…».', true);
      return;
    }
    const periodIds = new Set(draft.periods.map(period => period.id));
    if (draft.programs.some(program => program.periodId != null && !periodIds.has(program.periodId))) { notice('Βρέθηκε πρόγραμμα σε περίοδο που δεν υπάρχει. Πάτησε «Αναίρεση Όλων».', true); return; }
    for (const period of draft.periods) period.name = period.name.trim();
    const periods = clone(draft.periods), ops = saveOps(), added = clone(usedNewClasses());
    const expectedDraftCounts = Object.fromEntries(kindKeys.map(kind => [kind, (Number(context.draftCounts?.[kind]) || 0) + draft.programs.filter(program => program.kind === kind && program.periodId == null).length]));
    setBusy(true);
    let result = null;
    try {
      // The new τμήματα of the imports go only together with programs (the host refuses them otherwise).
      const request = {revision: context.revision, year: context.year, ops, periods};
      if (added.length) request.newClasses = added;
      result = await schoolHost.request('school-timetables:save', request);
      verifySaved(result, periods, expectedDraftCounts, added);
      receive(result);
      sharePeriod();
      notice('Οι περίοδοι και τα προγράμματα αποθηκεύτηκαν στο κοινό αρχείο .data.' + (added.length ? ' Δημιουργήθηκαν στα «Τμήματα» τα τμήματα: ' + added.map(item => item.name).join(', ') + '.' : ''));
    } catch (error) {
      if (result) receive(result);
      notice(error.message, true);
    } finally { setBusy(false); }
  }
  $('save').onclick = save;
  $('undo').onclick = async () => {
    // Takes back every change since the last save; it does not read anything again.
    if (busy || !context || !dirty) return;
    if (!await schoolConfirm('Να απορριφθούν οι αλλαγές στις περιόδους και στα προγράμματα που δεν αποθηκεύτηκαν;', {title: 'Μη αποθηκευμένες αλλαγές', accept: 'Απόρριψη αλλαγών'})) return;
    receive(context);
    notice('Οι μη αποθηκευμένες αλλαγές απορρίφθηκαν.');
  };
  post({type: 'school-timetables:ready'});
})();
</script>
